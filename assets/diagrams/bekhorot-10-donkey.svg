<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>The unredeemed firstborn donkey</title>
  <rect width="640" height="450" rx="18" fill="#f3f6fb"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1f2d3d">The unredeemed firstborn donkey</text>
  <text x="32" y="68" font-size="13" fill="#5b6b7d">May one derive benefit from it? Bekhorot 10b</text>

  <rect x="20" y="84" width="600" height="38" rx="10" fill="#dde6f2"/>
  <text x="34" y="108" font-size="13" font-weight="700" fill="#1f2d3d">Stage</text>
  <text x="320" y="108" font-size="13" font-weight="700" fill="#1f2d3d" text-anchor="middle">Rabbi Yehuda</text>
  <text x="510" y="108" font-size="13" font-weight="700" fill="#1f2d3d" text-anchor="middle">Rabbi Shimon</text>

  <rect x="20" y="130" width="600" height="56" rx="10" fill="#fff" stroke="#d5deea"/>
  <text x="34" y="153" font-size="14" fill="#1f2d3d">Alive: benefit from its value</text>
  <text x="34" y="171" font-size="12" fill="#5b6b7d">selling it, renting it out</text>
  <rect x="270" y="146" width="100" height="24" rx="12" fill="#f7dcd6"/><text x="320" y="163" font-size="13" font-weight="700" fill="#b03a2e" text-anchor="middle">forbidden</text>
  <rect x="460" y="146" width="100" height="24" rx="12" fill="#dcefe0"/><text x="510" y="163" font-size="13" font-weight="700" fill="#2e7d32" text-anchor="middle">permitted</text>

  <rect x="20" y="194" width="600" height="56" rx="10" fill="#fff" stroke="#d5deea"/>
  <text x="34" y="217" font-size="14" fill="#1f2d3d">Alive: benefit from its body</text>
  <text x="34" y="235" font-size="12" fill="#5b6b7d">shearing it, working it</text>
  <rect x="270" y="210" width="100" height="24" rx="12" fill="#f7dcd6"/><text x="320" y="227" font-size="13" font-weight="700" fill="#b03a2e" text-anchor="middle">forbidden</text>
  <rect x="460" y="210" width="100" height="24" rx="12" fill="#dcefe0"/><text x="510" y="227" font-size="13" font-weight="700" fill="#2e7d32" text-anchor="middle">permitted</text>

  <rect x="20" y="258" width="600" height="124" rx="10" fill="#fff" stroke="#d5deea"/>
  <text x="34" y="283" font-size="14" fill="#1f2d3d">After its neck is broken</text>
  <rect x="270" y="270" width="100" height="24" rx="12" fill="#f7dcd6"/><text x="320" y="287" font-size="13" font-weight="700" fill="#b03a2e" text-anchor="middle">forbidden</text>
  <rect x="396" y="270" width="100" height="24" rx="12" fill="#f7dcd6"/><text x="446" y="287" font-size="13" font-weight="700" fill="#b03a2e" text-anchor="middle">forbidden</text>
  <text x="506" y="287" font-size="12" fill="#1f2d3d">“he concedes”</text>
  <text x="396" y="311" font-size="11.5" fill="#5b6b7d">Rabba · Rav Naḥman · Reish Lakish</text>
  <line x1="396" y1="322" x2="606" y2="322" stroke="#e3e9f2"/>
  <rect x="396" y="330" width="100" height="24" rx="12" fill="#dcefe0"/><text x="446" y="347" font-size="13" font-weight="700" fill="#2e7d32" text-anchor="middle">permitted</text>
  <text x="506" y="347" font-size="12" fill="#1f2d3d">“still disputed”</text>
  <text x="396" y="371" font-size="11.5" fill="#5b6b7d">Rabbi Yoḥanan (some say Rabbi Elazar)</text>

  <rect x="20" y="390" width="600" height="40" rx="10" fill="#fff" stroke="#d5deea"/>
  <text x="34" y="415" font-size="14" fill="#1f2d3d">Redeemed with a lamb <tspan font-size="11.5" fill="#5b6b7d">(Rashi)</tspan></text>
  <rect x="270" y="398" width="100" height="24" rx="12" fill="#dcefe0"/><text x="320" y="415" font-size="13" font-weight="700" fill="#2e7d32" text-anchor="middle">permitted</text>
  <rect x="460" y="398" width="100" height="24" rx="12" fill="#dcefe0"/><text x="510" y="415" font-size="13" font-weight="700" fill="#2e7d32" text-anchor="middle">permitted</text>
</svg>
