<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title>Attend, and appoint a steward?</title>
<rect width="640" height="560" rx="18" fill="#f3f6fb"/>
<text x="32" y="44" font-size="22" font-weight="700" fill="#1f2d3d">Attend, and appoint a steward?</text>
<text x="32" y="70" font-size="14" fill="#56657a">Collecting a father’s debt from the property of minor orphans</text>
<text x="34" y="110" font-size="13" font-weight="700" text-anchor="start" fill="#1f2d3d">The case</text>
<text x="289" y="110" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2d3d">Rava</text>
<text x="421" y="102" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2d3d">Sages of</text>
<text x="421" y="119" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2d3d">Neharde’a</text>
<text x="553" y="102" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2d3d">Rav Ashi</text>
<text x="553" y="119" font-size="12"  text-anchor="middle" fill="#7a879a">(his conclusion)</text>
<rect x="20" y="134" width="200" height="62" rx="10" fill="#fff" stroke="#dbe3ee"/>
<text x="32" y="170" font-size="13" font-weight="700" fill="#1f2d3d">He did not say “Give”</text>
<rect x="226" y="134" width="126" height="62" rx="10" fill="#fbeee6" stroke="#efcdb9"/>
<text x="289" y="170" font-size="12.5" font-weight="700" text-anchor="middle" fill="#9a4a2f">Does not attend</text>
<rect x="358" y="134" width="126" height="62" rx="10" fill="#eef1f6" stroke="#dbe3ee"/>
<text x="421" y="170" font-size="12" font-style="italic" text-anchor="middle" fill="#7a879a">not stated</text>
<rect x="490" y="134" width="126" height="62" rx="10" fill="#fbeee6" stroke="#efcdb9"/>
<text x="553" y="170" font-size="12.5" font-weight="700" text-anchor="middle" fill="#9a4a2f">Does not attend</text>
<rect x="20" y="204" width="200" height="62" rx="10" fill="#fff" stroke="#dbe3ee"/>
<text x="32" y="231" font-size="13" font-weight="700" fill="#1f2d3d">He said “Give this field”</text>
<text x="32" y="249" font-size="12" fill="#56657a">or “this hundred”</text>
<rect x="226" y="204" width="126" height="62" rx="10" fill="#e6f4ea" stroke="#b9dfc4"/>
<text x="289" y="231" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2f7a45">Attends,</text>
<text x="289" y="249" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2f7a45">no steward</text>
<rect x="358" y="204" width="126" height="62" rx="10" fill="#e3effb" stroke="#b9d3ef"/>
<text x="421" y="231" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2f5d9a">Attends,</text>
<text x="421" y="249" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2f5d9a">steward</text>
<rect x="490" y="204" width="126" height="62" rx="10" fill="#e3effb" stroke="#b9d3ef"/>
<text x="553" y="231" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2f5d9a">Attends,</text>
<text x="553" y="249" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2f5d9a">steward</text>
<rect x="20" y="274" width="200" height="62" rx="10" fill="#fff" stroke="#dbe3ee"/>
<text x="32" y="301" font-size="13" font-weight="700" fill="#1f2d3d">He said “Give a field”</text>
<text x="32" y="319" font-size="12" fill="#56657a">or “a hundred”, unspecified</text>
<rect x="226" y="274" width="126" height="62" rx="10" fill="#e3effb" stroke="#b9d3ef"/>
<text x="289" y="301" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2f5d9a">Attends,</text>
<text x="289" y="319" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2f5d9a">steward</text>
<rect x="358" y="274" width="126" height="62" rx="10" fill="#e3effb" stroke="#b9d3ef"/>
<text x="421" y="301" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2f5d9a">Attends,</text>
<text x="421" y="319" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2f5d9a">steward</text>
<rect x="490" y="274" width="126" height="62" rx="10" fill="#e3effb" stroke="#b9d3ef"/>
<text x="553" y="301" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2f5d9a">Attends,</text>
<text x="553" y="319" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2f5d9a">steward</text>
<rect x="20" y="344" width="200" height="62" rx="10" fill="#fff" stroke="#dbe3ee"/>
<text x="32" y="371" font-size="13" font-weight="700" fill="#1f2d3d">A field in their hands that</text>
<text x="32" y="389" font-size="12" fill="#56657a">witnesses say is not his</text>
<rect x="226" y="344" width="126" height="62" rx="10" fill="#eef1f6" stroke="#dbe3ee"/>
<text x="289" y="380" font-size="12" font-style="italic" text-anchor="middle" fill="#7a879a">not stated</text>
<rect x="358" y="344" width="126" height="62" rx="10" fill="#e6f4ea" stroke="#b9dfc4"/>
<text x="421" y="371" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2f7a45">Returned,</text>
<text x="421" y="389" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2f7a45">no steward</text>
<rect x="490" y="344" width="126" height="62" rx="10" fill="#e6f4ea" stroke="#b9dfc4"/>
<text x="553" y="371" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2f7a45">Returned,</text>
<text x="553" y="389" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2f7a45">no steward</text>
<rect x="20" y="422" width="600" height="118" rx="12" fill="#fff" stroke="#dbe3ee"/>
<text x="36" y="448" font-size="13.5" font-weight="700" fill="#1f2d3d">Neharde’a: “In all of them, one attends and appoints a steward,”</text>
<text x="36" y="469" font-size="13" fill="#56657a">even for “this field” and “this hundred” (Rashi).</text>
<text x="36" y="490" font-size="13.5" font-weight="700" fill="#1f2d3d">Their exception: “we do not presume that witnesses are liars.”</text>
<text x="36" y="511" font-size="13" fill="#56657a">Rav Ashi: we do not attend, as Rava says; and if we attend,</text>
<text x="36" y="532" font-size="13" fill="#56657a">we appoint a steward, as Neharde’a says.</text>
</svg>
