<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>Whose is the head?</title>
  <rect width="640" height="410" rx="18" fill="#f3f6fb"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1f2d3d">Whose is the head?</text>
  <text x="32" y="68" font-size="13" fill="#5b6b7d">The baraita Abaye cites on 4b: “The head of this … is consecrated / is sold to you”</text>

  <rect x="20" y="84" width="600" height="38" rx="10" fill="#dde6f2"/>
  <text x="34" y="108" font-size="13" font-weight="700" fill="#1f2d3d">The head of…</text>
  <text x="300" y="108" font-size="13" font-weight="700" fill="#1f2d3d" text-anchor="middle">“…is consecrated property”</text>
  <text x="515" y="108" font-size="13" font-weight="700" fill="#1f2d3d" text-anchor="middle">“…is sold to you”</text>

  <rect x="20" y="130" width="600" height="62" rx="10" fill="#fff" stroke="#d5deea"/>
  <text x="34" y="166" font-size="15" font-weight="700" fill="#1f2d3d">this slave</text>
  <text x="300" y="156" font-size="13" fill="#1f2d3d" text-anchor="middle">He and the Temple are partners</text>
  <text x="300" y="174" font-size="13" fill="#1f2d3d" text-anchor="middle">in the whole slave</text>
  <text x="515" y="156" font-size="13" fill="#1f2d3d" text-anchor="middle">They appraise the slave</text>
  <text x="515" y="174" font-size="13" fill="#1f2d3d" text-anchor="middle">and split the value</text>

  <rect x="20" y="200" width="600" height="62" rx="10" fill="#fff" stroke="#d5deea"/>
  <text x="34" y="236" font-size="15" font-weight="700" fill="#1f2d3d">this donkey</text>
  <text x="300" y="226" font-size="13" fill="#1f2d3d" text-anchor="middle">He and the Temple are partners</text>
  <text x="300" y="244" font-size="13" fill="#1f2d3d" text-anchor="middle">in the donkey</text>
  <text x="515" y="226" font-size="13" fill="#1f2d3d" text-anchor="middle">They appraise the donkey</text>
  <text x="515" y="244" font-size="13" fill="#1f2d3d" text-anchor="middle">and split the value</text>

  <rect x="20" y="270" width="600" height="62" rx="10" fill="#eef6ee" stroke="#c9dfc9"/>
  <text x="34" y="306" font-size="15" font-weight="700" fill="#1f2d3d">this cow</text>
  <text x="300" y="296" font-size="13" fill="#1f2d3d" text-anchor="middle">The Temple owns</text>
  <text x="300" y="314" font-size="13" fill="#1f2d3d" text-anchor="middle">only the head</text>
  <text x="515" y="296" font-size="13" fill="#1f2d3d" text-anchor="middle">He has sold</text>
  <text x="515" y="314" font-size="13" fill="#1f2d3d" text-anchor="middle">only the head</text>

  <rect x="20" y="342" width="600" height="48" rx="10" fill="#fff6e0" stroke="#ecd9a8"/>
  <text x="34" y="371" font-size="13" fill="#5a4a2a"><tspan font-weight="700">Rav Pappa:</tspan> because an ox’s head is sold on its own in the butcher shop.</text>
</svg>
