<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 724" width="640" height="724" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="724" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Only when the Jubilee is observed</text>
  <text x="320" y="70" text-anchor="middle" font-size="14" fill="#4b5563">The baraita on 29a, and the verse each opinion cites</text>
  <text x="98" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#4b5563">Who says it</text>
  <text x="270" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#4b5563">Applies only then</text>
  <text x="500" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#4b5563">Source</text>
  <rect x="24" y="112" width="148" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="98" y="165" text-anchor="middle" font-size="13.5" font-weight="700" fill="#374151">The baraita</text>
  <rect x="180" y="112" width="180" height="96" rx="10" fill="#e3edfb" stroke="#8fb0e0"/>
  <text x="270" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#1c3f78">A Hebrew slave</text>
  <rect x="368" y="112" width="248" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="492" y="147" text-anchor="middle" font-size="13" fill="#1f2937">“He shall serve with you</text>
  <text x="492" y="164" text-anchor="middle" font-size="13" fill="#1f2937">until the year of Jubilee”</text>
  <text x="492" y="182" text-anchor="middle" font-size="11" fill="#6b7280">Leviticus 25:40</text>
  <rect x="24" y="216" width="148" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="98" y="269" text-anchor="middle" font-size="13.5" font-weight="700" fill="#374151">The baraita</text>
  <rect x="180" y="216" width="180" height="96" rx="10" fill="#e3edfb" stroke="#8fb0e0"/>
  <text x="270" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#1c3f78">A dedicated, i.e.,</text>
  <text x="270" y="269" text-anchor="middle" font-size="14" font-weight="700" fill="#1c3f78">ancestral, field</text>
  <text x="270" y="288" text-anchor="middle" font-size="11" font-style="italic" fill="#4b5563">Rashi’s text: “ancestral field”</text>
  <rect x="368" y="216" width="248" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="492" y="251" text-anchor="middle" font-size="13" fill="#1f2937">“And in the Jubilee</text>
  <text x="492" y="268" text-anchor="middle" font-size="13" fill="#1f2937">it shall go out”</text>
  <text x="492" y="286" text-anchor="middle" font-size="11" fill="#6b7280">Leviticus 25:28</text>
  <rect x="24" y="320" width="148" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="98" y="373" text-anchor="middle" font-size="13.5" font-weight="700" fill="#374151">The baraita</text>
  <rect x="180" y="320" width="180" height="96" rx="10" fill="#e3edfb" stroke="#8fb0e0"/>
  <text x="270" y="364.5" text-anchor="middle" font-size="14" font-weight="700" fill="#1c3f78">Houses of</text>
  <text x="270" y="381.5" text-anchor="middle" font-size="14" font-weight="700" fill="#1c3f78">walled cities</text>
  <rect x="368" y="320" width="248" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="492" y="355" text-anchor="middle" font-size="13" fill="#1f2937">“It shall not go out</text>
  <text x="492" y="372" text-anchor="middle" font-size="13" fill="#1f2937">in the Jubilee”</text>
  <text x="492" y="390" text-anchor="middle" font-size="11" fill="#6b7280">Leviticus 25:30</text>
  <rect x="24" y="424" width="148" height="96" rx="10" fill="#efe8f7" stroke="#b9a3d6"/>
  <text x="98" y="468.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4a148c">Rabbi Shimon</text>
  <text x="98" y="485.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4a148c">ben Yoḥai</text>
  <rect x="180" y="424" width="180" height="96" rx="10" fill="#e3edfb" stroke="#8fb0e0"/>
  <text x="270" y="477" text-anchor="middle" font-size="14" font-weight="700" fill="#1c3f78">A dedicated field</text>
  <rect x="368" y="424" width="248" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="492" y="459" text-anchor="middle" font-size="13" fill="#1f2937">“When it goes out in the</text>
  <text x="492" y="476" text-anchor="middle" font-size="13" fill="#1f2937">Jubilee… as a field dedicated”</text>
  <text x="492" y="494" text-anchor="middle" font-size="11" fill="#6b7280">Leviticus 27:21</text>
  <rect x="24" y="528" width="148" height="96" rx="10" fill="#efe8f7" stroke="#b9a3d6"/>
  <text x="98" y="572.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4a148c">Rabbi Shimon</text>
  <text x="98" y="589.5" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4a148c">ben Elazar</text>
  <rect x="180" y="528" width="180" height="96" rx="10" fill="#e3edfb" stroke="#8fb0e0"/>
  <text x="270" y="581" text-anchor="middle" font-size="14" font-weight="700" fill="#1c3f78">A <tspan font-style="italic">ger toshav</tspan></text>
  <rect x="368" y="528" width="248" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="492" y="554.5" text-anchor="middle" font-size="13" fill="#1f2937">Rav Beivai: “well” and “well”:</text>
  <text x="492" y="571.5" text-anchor="middle" font-size="13" fill="#1f2937">“he fares well with you” and</text>
  <text x="492" y="588.5" text-anchor="middle" font-size="13" fill="#1f2937">“where it is well for him”</text>
  <text x="492" y="606.5" text-anchor="middle" font-size="11" fill="#6b7280">Deuteronomy 15:16; 23:17</text>
  <rect x="24" y="638" width="592" height="70" rx="10" fill="#e8eef8"/>
  <text x="40" y="660" font-size="13" fill="#374151"><tspan font-weight="700">The Gemara’s answer:</tspan> this baraita speaks of land; the Pumbedita</text>
  <text x="40" y="678" font-size="13" fill="#374151">dedication was land outside Eretz Yisrael, which is considered like</text>
  <text x="40" y="696" font-size="13" fill="#374151">movable property in Eretz Yisrael.</text>
</svg>
