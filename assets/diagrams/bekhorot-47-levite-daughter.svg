<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>Whose son pays the five sela?</title>
  <rect width="640" height="520" rx="18" fill="#f3f6fb"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1f2a3a">Whose son pays the five sela?</text>
  <text x="32" y="68" font-size="13.5" fill="#5b6778">A firstborn son, by his mother and his father · Bekhorot 47a</text>

  <!-- header -->
  <text x="40" y="106" font-size="13" font-weight="700" fill="#5b6778">MOTHER · FATHER</text>
  <text x="330" y="106" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2a3a">Rav Pappa</text>
  <text x="516" y="100" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2a3a">Mar, son of Rav Yosef</text>
  <text x="516" y="116" font-size="11.5" text-anchor="middle" fill="#5b6778">in the name of Rava</text>

  <!-- row 1 -->
  <rect x="24" y="128" width="592" height="62" rx="12" fill="#fff" stroke="#dbe2ec"/>
  <text x="40" y="154" font-size="15" font-weight="700" fill="#1f2a3a">Levite’s daughter</text>
  <text x="40" y="175" font-size="12.5" fill="#5b6778">father: an Israelite</text>
  <rect x="244" y="138" width="172" height="24" rx="12" fill="#fbe3e0"/>
  <text x="330" y="155" font-size="13" font-weight="700" text-anchor="middle" fill="#b23b2e">Pays</text>
  <text x="330" y="180" font-size="12" text-anchor="middle" fill="#5b6778">lineage follows the father</text>
  <rect x="430" y="138" width="172" height="24" rx="12" fill="#dff1e3"/>
  <text x="516" y="155" font-size="13" font-weight="700" text-anchor="middle" fill="#2e7d32">Exempt</text>
  <text x="516" y="180" font-size="12" text-anchor="middle" fill="#5b6778">follows the mother’s womb</text>

  <!-- row 2 -->
  <rect x="24" y="198" width="592" height="62" rx="12" fill="#fff" stroke="#dbe2ec"/>
  <text x="40" y="224" font-size="15" font-weight="700" fill="#1f2a3a">Levite’s daughter</text>
  <text x="40" y="245" font-size="12.5" fill="#5b6778">father: a gentile</text>
  <rect x="244" y="208" width="172" height="24" rx="12" fill="#dff1e3"/>
  <text x="330" y="225" font-size="13" font-weight="700" text-anchor="middle" fill="#2e7d32">Exempt</text>
  <text x="330" y="250" font-size="12" text-anchor="middle" fill="#5b6778">he is a “flawed Levite”</text>
  <rect x="430" y="208" width="172" height="24" rx="12" fill="#e8ecf2"/>
  <text x="516" y="225" font-size="13" font-weight="700" text-anchor="middle" fill="#6b7380">Not addressed</text>

  <!-- row 3 -->
  <rect x="24" y="268" width="592" height="62" rx="12" fill="#fff" stroke="#dbe2ec"/>
  <text x="40" y="294" font-size="15" font-weight="700" fill="#1f2a3a">Priest’s daughter</text>
  <text x="40" y="315" font-size="12.5" fill="#5b6778">father: an Israelite</text>
  <rect x="244" y="278" width="172" height="24" rx="12" fill="#fbe3e0"/>
  <text x="330" y="295" font-size="13" font-weight="700" text-anchor="middle" fill="#b23b2e">Pays</text>
  <text x="330" y="320" font-size="12" text-anchor="middle" fill="#5b6778">lineage follows the father</text>
  <rect x="430" y="278" width="172" height="24" rx="12" fill="#dff1e3"/>
  <text x="516" y="295" font-size="13" font-weight="700" text-anchor="middle" fill="#2e7d32">Exempt</text>
  <text x="516" y="320" font-size="12" text-anchor="middle" fill="#5b6778">the mishna’s “kohenet”</text>

  <!-- row 4 -->
  <rect x="24" y="338" width="592" height="62" rx="12" fill="#fff" stroke="#dbe2ec"/>
  <text x="40" y="364" font-size="15" font-weight="700" fill="#1f2a3a">Priest’s daughter</text>
  <text x="40" y="385" font-size="12.5" fill="#5b6778">father: a gentile</text>
  <rect x="244" y="348" width="172" height="24" rx="12" fill="#fbe3e0"/>
  <text x="330" y="365" font-size="13" font-weight="700" text-anchor="middle" fill="#b23b2e">Pays</text>
  <text x="330" y="390" font-size="12" text-anchor="middle" fill="#5b6778">Rabba: she lost her sanctity</text>
  <rect x="430" y="348" width="172" height="24" rx="12" fill="#e8ecf2"/>
  <text x="516" y="365" font-size="13" font-weight="700" text-anchor="middle" fill="#6b7380">Not addressed</text>

  <!-- row 5 -->
  <rect x="24" y="408" width="592" height="62" rx="12" fill="#fff" stroke="#dbe2ec"/>
  <text x="40" y="434" font-size="15" font-weight="700" fill="#1f2a3a">Israelite woman</text>
  <text x="40" y="455" font-size="12.5" fill="#5b6778">father: a priest</text>
  <rect x="244" y="418" width="358" height="24" rx="12" fill="#dff1e3"/>
  <text x="423" y="435" font-size="13" font-weight="700" text-anchor="middle" fill="#2e7d32">Exempt: the son is a priest</text>
  <text x="423" y="460" font-size="12" text-anchor="middle" fill="#5b6778">Rav Pappa reads the mishna’s “kohenet” this way</text>

  <text x="32" y="496" font-size="12" fill="#5b6778">Tosafot: the halakha follows Mar, son of Rav Yosef (Ḥullin 132a).</text>
</svg>
