<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 452" width="640" height="452" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="452" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Nine liquids of a zav</text>
  <text x="320" y="68" text-anchor="middle" font-size="14" fill="#4b5563">Keritot 13a–b: the baraita the Gemara cites against Rava</text>

  <rect x="24" y="88" width="186" height="232" rx="10" fill="#eef6ee" stroke="#a9d3ad"/>
  <text x="117" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Pure of everything</text>
  <text x="117" y="134" text-anchor="middle" font-size="12" fill="#4b5563">impart no impurity</text>
  <rect x="40" y="152" width="154" height="40" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="117" y="177" text-anchor="middle" font-size="14" fill="#1f2937">Sweat</text>
  <rect x="40" y="202" width="154" height="40" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="117" y="227" text-anchor="middle" font-size="14" fill="#1f2937">Ill-smelling pus</text>
  <rect x="40" y="252" width="154" height="40" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="117" y="277" text-anchor="middle" font-size="14" fill="#1f2937">Excrement</text>

  <rect x="227" y="88" width="186" height="232" rx="10" fill="#fff7e6" stroke="#f0cf8f"/>
  <text x="320" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Impurity of liquids</text>
  <text x="320" y="134" text-anchor="middle" font-size="12" fill="#4b5563">with a quarter-log</text>
  <rect x="243" y="152" width="154" height="40" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="320" y="177" text-anchor="middle" font-size="14" fill="#1f2937">Tears of his eye</text>
  <rect x="243" y="202" width="154" height="40" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="320" y="227" text-anchor="middle" font-size="14" fill="#1f2937">Blood of his wound</text>
  <rect x="243" y="252" width="154" height="40" rx="7" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="320" y="277" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">A woman’s milk</text>

  <rect x="430" y="88" width="186" height="232" rx="10" fill="#fbecec" stroke="#e3a9a9"/>
  <text x="523" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Severe impurity</text>
  <text x="523" y="134" text-anchor="middle" font-size="12" fill="#4b5563">in any amount</text>
  <rect x="446" y="152" width="154" height="40" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="523" y="177" text-anchor="middle" font-size="14" fill="#1f2937">Saliva</text>
  <rect x="446" y="202" width="154" height="40" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="523" y="227" text-anchor="middle" font-size="14" fill="#1f2937">Discharge (zov)</text>
  <rect x="446" y="252" width="154" height="40" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="523" y="277" text-anchor="middle" font-size="14" fill="#1f2937">Urine</text>

  <rect x="24" y="336" width="592" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="360" font-size="13.5" font-weight="700" fill="#1f2937">The Gemara’s inference (13b)</text>
  <text x="40" y="382" font-size="12.5" fill="#374151">If the place of the milk were a spring, milk too should impart severe impurity in any</text>
  <text x="40" y="400" font-size="12.5" fill="#374151">amount, like his discharge and his saliva. Rather: the place of a woman’s milk is not a spring.</text>
  <text x="40" y="420" font-size="12" fill="#6b7280">Rabbeinu Gershom: “severe impurity” is by contact and by carrying.</text>
</svg>
