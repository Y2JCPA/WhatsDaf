<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 556" width="640" height="556" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="556" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Counting the trumpet blasts</text>
  <text x="320" y="70" text-anchor="middle" font-size="14" font-weight="400" fill="#4b5563">The same sounds, two tallies: the mishna (the Rabbis) and Rabbi Yehuda</text>
  <rect x="64" y="92" width="112" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="120" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Tekia</text>
  <text x="120" y="133" text-anchor="middle" font-size="11" font-weight="400" fill="#6b7280">plain blast</text>
  <rect x="188" y="92" width="112" height="52" rx="10" fill="#fff4dc" stroke="#e5b94e"/>
  <text x="244" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Terua</text>
  <rect x="312" y="92" width="112" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="368" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Tekia</text>
  <text x="368" y="133" text-anchor="middle" font-size="11" font-weight="400" fill="#6b7280">plain blast</text>
  <rect x="64" y="152" width="112" height="26" rx="8" fill="#e8eefc" stroke="#9fb3e0"/>
  <text x="120" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">1</text>
  <rect x="188" y="152" width="112" height="26" rx="8" fill="#e8eefc" stroke="#9fb3e0"/>
  <text x="244" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">1</text>
  <rect x="312" y="152" width="112" height="26" rx="8" fill="#e8eefc" stroke="#9fb3e0"/>
  <text x="368" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">1</text>
  <text x="440" y="170" text-anchor="start" font-size="14" font-weight="700" fill="#1e3a8a">Rabbis: 3 units</text>
  <rect x="64" y="186" width="360" height="26" rx="8" fill="#fde8d8" stroke="#e0a47a"/>
  <text x="244" y="204" text-anchor="middle" font-size="13" font-weight="700" fill="#8a3b0d">1</text>
  <text x="440" y="204" text-anchor="start" font-size="14" font-weight="700" fill="#8a3b0d">Rabbi Yehuda: 1 unit</text>
  <text x="360" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">The mishna (Rabbis)</text>
  <text x="520" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">Rabbi Yehuda</text>
  <line x1="24" y1="258" x2="616" y2="258" stroke="#cbd5e1"/>
  <rect x="24" y="268" width="216" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="132" y="291" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">No fewer than</text>
  <text x="132" y="309" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">each day</text>
  <rect x="290" y="268" width="140" height="54" rx="10" fill="#e8eefc" stroke="#9fb3e0"/>
  <text x="360" y="303" text-anchor="middle" font-size="22" font-weight="700" fill="#1e3a8a">21</text>
  <rect x="450" y="268" width="140" height="54" rx="10" fill="#fde8d8" stroke="#e0a47a"/>
  <text x="520" y="303" text-anchor="middle" font-size="22" font-weight="700" fill="#8a3b0d">7</text>
  <rect x="24" y="330" width="216" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="132" y="353" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">No more than</text>
  <text x="132" y="371" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">on any day</text>
  <rect x="290" y="330" width="140" height="54" rx="10" fill="#e8eefc" stroke="#9fb3e0"/>
  <text x="360" y="365" text-anchor="middle" font-size="22" font-weight="700" fill="#1e3a8a">48</text>
  <rect x="450" y="330" width="140" height="54" rx="10" fill="#fde8d8" stroke="#e0a47a"/>
  <text x="520" y="365" text-anchor="middle" font-size="22" font-weight="700" fill="#8a3b0d">16</text>
  <text x="24" y="406" text-anchor="start" font-size="13" font-weight="700" fill="#1f2937">21 on an ordinary day:</text>
  <text x="24" y="426" text-anchor="start" font-size="12" font-weight="400" fill="#4b5563">3 at the opening of the gates, 9 for the morning daily offering, 9 for the afternoon one.</text>
  <text x="24" y="452" text-anchor="start" font-size="13" font-weight="700" fill="#1f2937">48 at most, on a Friday of Sukkot: the 21, and</text>
  <text x="24" y="472" text-anchor="start" font-size="12" font-weight="400" fill="#4b5563">12 at the drawing of the water, 9 for the additional offerings, 3 to stop work before</text>
  <text x="24" y="490" text-anchor="start" font-size="12" font-weight="400" fill="#4b5563">Shabbat and 3 to mark its beginning.</text>
  <text x="24" y="516" text-anchor="start" font-size="12" font-weight="400" fill="#4b5563">Rabbi Yehuda: the Torah says “sound [utkatem] a terua”, so tekia, terua, tekia are one unit.</text>
  <text x="24" y="534" text-anchor="start" font-size="12" font-weight="400" fill="#4b5563">The Rabbis: the verses teach a plain blast before each terua and after it.</text>
</svg>
