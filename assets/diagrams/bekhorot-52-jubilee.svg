<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 550" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>What returns in the Jubilee Year</title>
  <rect width="640" height="550" rx="18" fill="#f3f6fb"/>
  <text x="24" y="44" font-size="22" font-weight="700" fill="#1f2a3a">What returns in the Jubilee Year?</text>
  <text x="24" y="68" font-size="13.5" fill="#56627a">A sale of land always returns. The mishna disputes these four cases.</text>
  <rect x="194" y="84" width="136" height="34" rx="9" fill="#dfe7f3"/>
  <text x="262" y="106" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2a3a">Rabbi Meir</text>
  <rect x="336" y="84" width="136" height="34" rx="9" fill="#dfe7f3"/>
  <text x="404" y="106" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2a3a">The Rabbis</text>
  <rect x="478" y="84" width="136" height="34" rx="9" fill="#dfe7f3"/>
  <text x="546" y="106" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2a3a">Rabbi Elazar</text>
  <rect x="16" y="128" width="608" height="70" rx="12" fill="#ffffff" stroke="#dbe2ee"/>
  <text x="30" y="158" font-size="15" font-weight="700" fill="#1f2a3a">The firstborn’s</text>
  <text x="30" y="178" font-size="13" fill="#56627a">extra share</text>
  <rect x="198" y="135" width="128" height="56" rx="9" fill="#e3f2e6"/>
  <text x="262" y="155" font-size="14.5" font-weight="700" text-anchor="middle" fill="#1e7a3a">Stays</text>
  <text x="262" y="171" font-size="11" text-anchor="middle" fill="#3d4757">“by giving him”: a gift,</text>
  <text x="262" y="185" font-size="11" text-anchor="middle" fill="#3d4757">and gifts stay</text>
  <rect x="340" y="135" width="128" height="56" rx="9" fill="#e3f2e6"/>
  <text x="404" y="155" font-size="14.5" font-weight="700" text-anchor="middle" fill="#1e7a3a">Stays</text>
  <text x="404" y="171" font-size="11" text-anchor="middle" fill="#3d4757">an inheritance, like</text>
  <text x="404" y="185" font-size="11" text-anchor="middle" fill="#3d4757">his ordinary share</text>
  <rect x="482" y="135" width="128" height="56" rx="9" fill="#fbe6df"/>
  <text x="546" y="155" font-size="14.5" font-weight="700" text-anchor="middle" fill="#b4441f">Returns</text>
  <text x="546" y="171" font-size="11" text-anchor="middle" fill="#3d4757">“by giving him”:</text>
  <text x="546" y="185" font-size="11" text-anchor="middle" fill="#3d4757">a gift</text>
  <rect x="16" y="206" width="608" height="70" rx="12" fill="#ffffff" stroke="#dbe2ee"/>
  <text x="30" y="236" font-size="15" font-weight="700" fill="#1f2a3a">A husband’s</text>
  <text x="30" y="256" font-size="13" fill="#56627a">inheritance of his wife</text>
  <rect x="198" y="213" width="128" height="56" rx="9" fill="#e3f2e6"/>
  <text x="262" y="233" font-size="14.5" font-weight="700" text-anchor="middle" fill="#1e7a3a">Stays</text>
  <text x="262" y="249" font-size="11" text-anchor="middle" fill="#3d4757">inheritance</text>
  <text x="262" y="263" font-size="11" text-anchor="middle" fill="#3d4757">by Torah law</text>
  <rect x="340" y="213" width="128" height="56" rx="9" fill="#e3f2e6"/>
  <text x="404" y="233" font-size="14.5" font-weight="700" text-anchor="middle" fill="#1e7a3a">Stays</text>
  <text x="404" y="249" font-size="11" text-anchor="middle" fill="#3d4757">inheritance</text>
  <text x="404" y="263" font-size="11" text-anchor="middle" fill="#3d4757">by Torah law</text>
  <rect x="482" y="213" width="128" height="56" rx="9" fill="#fbe6df"/>
  <text x="546" y="233" font-size="14.5" font-weight="700" text-anchor="middle" fill="#b4441f">Returns</text>
  <text x="546" y="249" font-size="11" text-anchor="middle" fill="#3d4757">inheritance</text>
  <text x="546" y="263" font-size="11" text-anchor="middle" fill="#3d4757">by rabbinic law</text>
  <rect x="16" y="284" width="608" height="70" rx="12" fill="#ffffff" stroke="#dbe2ee"/>
  <text x="30" y="314" font-size="15" font-weight="700" fill="#1f2a3a">The yavam’s share</text>
  <text x="30" y="334" font-size="13" fill="#56627a">of his brother’s estate</text>
  <rect x="198" y="291" width="128" height="56" rx="9" fill="#e3f2e6"/>
  <text x="262" y="311" font-size="14.5" font-weight="700" text-anchor="middle" fill="#1e7a3a">Stays</text>
  <text x="262" y="327" font-size="11" text-anchor="middle" fill="#3d4757">he is called</text>
  <text x="262" y="341" font-size="11" text-anchor="middle" fill="#3d4757">“firstborn”</text>
  <rect x="340" y="291" width="128" height="56" rx="9" fill="#e3f2e6"/>
  <text x="404" y="311" font-size="14.5" font-weight="700" text-anchor="middle" fill="#1e7a3a">Stays</text>
  <text x="404" y="327" font-size="11" text-anchor="middle" fill="#3d4757">he is called</text>
  <text x="404" y="341" font-size="11" text-anchor="middle" fill="#3d4757">“firstborn”</text>
  <rect x="482" y="291" width="128" height="56" rx="9" fill="#fbe6df"/>
  <text x="546" y="311" font-size="14.5" font-weight="700" text-anchor="middle" fill="#b4441f">Returns</text>
  <text x="546" y="327" font-size="11" text-anchor="middle" fill="#3d4757">he is called</text>
  <text x="546" y="341" font-size="11" text-anchor="middle" fill="#3d4757">“firstborn”</text>
  <rect x="16" y="362" width="608" height="70" rx="12" fill="#ffffff" stroke="#dbe2ee"/>
  <text x="30" y="392" font-size="15" font-weight="700" fill="#1f2a3a">A gift</text>
  <text x="30" y="412" font-size="13" fill="#56627a">of land</text>
  <rect x="198" y="369" width="128" height="56" rx="9" fill="#e3f2e6"/>
  <text x="262" y="389" font-size="14.5" font-weight="700" text-anchor="middle" fill="#1e7a3a">Stays</text>
  <text x="262" y="405" font-size="11" text-anchor="middle" fill="#3d4757">only a sale</text>
  <text x="262" y="419" font-size="11" text-anchor="middle" fill="#3d4757">returns</text>
  <rect x="340" y="369" width="128" height="56" rx="9" fill="#fbe6df"/>
  <text x="404" y="389" font-size="14.5" font-weight="700" text-anchor="middle" fill="#b4441f">Returns</text>
  <text x="404" y="405" font-size="11" text-anchor="middle" fill="#3d4757">“you shall return”</text>
  <text x="404" y="419" font-size="11" text-anchor="middle" fill="#3d4757">includes a gift</text>
  <rect x="482" y="369" width="128" height="56" rx="9" fill="#fbe6df"/>
  <text x="546" y="389" font-size="14.5" font-weight="700" text-anchor="middle" fill="#b4441f">Returns</text>
  <text x="546" y="405" font-size="11" text-anchor="middle" fill="#3d4757">“you shall return”</text>
  <text x="546" y="419" font-size="11" text-anchor="middle" fill="#3d4757">includes a gift</text>
  <rect x="16" y="450" width="608" height="82" rx="12" fill="#fff8e6" stroke="#eadcb4"/>
  <text x="30" y="476" font-size="13.5" font-weight="700" fill="#5a4a1e">Rabbi Yoḥanan ben Beroka</text>
  <text x="30" y="496" font-size="12.5" fill="#5a4a1e">A husband who inherited his wife’s family graveyard returns it to her family</text>
  <text x="30" y="514" font-size="12.5" fill="#5a4a1e">for payment, less the value of her own grave.</text>
</svg>
