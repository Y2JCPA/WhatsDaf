<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 452" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title>Guarantor or kablan?</title>
<rect width="640" height="452" rx="18" fill="#f3f6fb"/>
<text x="32" y="44" font-size="22" font-weight="700" fill="#1f2d3d">Guarantor or <tspan font-style="italic">kablan</tspan>?</text>
<text x="32" y="70" font-size="14" fill="#56657a">Is he responsible to pay? “As it was stated,” and the <tspan font-style="italic">halakha</tspan> (23b)</text>

<text x="182" y="106" font-size="11" font-weight="700" fill="#7a879a">ORDINARY GUARANTOR</text>
<text x="408" y="106" font-size="11" font-weight="700" fill="#7a879a"><tspan font-style="italic">KABLAN</tspan> (UNCONDITIONAL)</text>

<!-- creditor row -->
<rect x="20" y="118" width="600" height="138" rx="12" fill="#fff" stroke="#dbe3ee"/>
<text x="32" y="146" font-size="14.5" font-weight="700" fill="#1f2d3d">For a</text>
<text x="32" y="164" font-size="14.5" font-weight="700" fill="#1f2d3d">creditor</text>
<line x1="170" y1="130" x2="170" y2="244" stroke="#e1e6ee"/>
<line x1="396" y1="130" x2="396" y2="244" stroke="#e1e6ee"/>

<rect x="182" y="130" width="94" height="22" rx="11" fill="#fdf3e1" stroke="#ecd3a4"/>
<text x="229" y="145.5" font-size="11.5" font-weight="700" text-anchor="middle" fill="#8a5a12">disputed</text>
<text x="182" y="172" font-size="12" fill="#56657a">One Sage: responsible only if</text>
<text x="182" y="188" font-size="12" fill="#56657a">the debtor has property.</text>
<text x="182" y="206" font-size="12" fill="#56657a">Another: responsible even if not.</text>
<text x="182" y="234" font-size="12.5" font-weight="700" fill="#2e7d4f">Halakha: responsible,</text>
<text x="182" y="250" font-size="12" fill="#2e7d4f">even if the debtor has nothing</text>

<rect x="408" y="130" width="120" height="22" rx="11" fill="#e3f3ea" stroke="#b5dcc5"/>
<text x="468" y="145.5" font-size="11.5" font-weight="700" text-anchor="middle" fill="#2e7d4f">everyone agrees</text>
<text x="408" y="176" font-size="15" font-weight="700" fill="#2e7d4f">Responsible</text>
<text x="408" y="234" font-size="12.5" font-weight="700" fill="#2e7d4f">Halakha: responsible</text>

<!-- marriage contract row -->
<rect x="20" y="266" width="600" height="160" rx="12" fill="#fff" stroke="#dbe3ee"/>
<text x="32" y="294" font-size="14.5" font-weight="700" fill="#1f2d3d">For a</text>
<text x="32" y="312" font-size="14.5" font-weight="700" fill="#1f2d3d">marriage</text>
<text x="32" y="330" font-size="14.5" font-weight="700" fill="#1f2d3d">contract</text>
<line x1="170" y1="278" x2="170" y2="414" stroke="#e1e6ee"/>
<line x1="396" y1="278" x2="396" y2="414" stroke="#e1e6ee"/>

<rect x="182" y="278" width="120" height="22" rx="11" fill="#fbe7e4" stroke="#efc0b8"/>
<text x="242" y="293.5" font-size="11.5" font-weight="700" text-anchor="middle" fill="#a3392b">everyone agrees</text>
<text x="182" y="324" font-size="15" font-weight="700" fill="#a3392b">Not responsible</text>
<text x="182" y="352" font-size="12.5" font-weight="700" fill="#a3392b">Halakha: not responsible,</text>
<text x="182" y="368" font-size="12" fill="#a3392b">even if the husband has property</text>
<text x="182" y="394" font-size="11.5" fill="#56657a">“He performs a mitzva,” and she</text>
<text x="182" y="410" font-size="11.5" fill="#56657a">did not lose anything</text>

<rect x="408" y="278" width="94" height="22" rx="11" fill="#fdf3e1" stroke="#ecd3a4"/>
<text x="455" y="293.5" font-size="11.5" font-weight="700" text-anchor="middle" fill="#8a5a12">disputed</text>
<text x="408" y="320" font-size="12" fill="#56657a">One Sage: responsible only if</text>
<text x="408" y="336" font-size="12" fill="#56657a">the husband has property.</text>
<text x="408" y="354" font-size="12" fill="#56657a">Another: responsible even if not.</text>
<text x="408" y="382" font-size="12.5" font-weight="700" fill="#2e7d4f">Halakha: responsible,</text>
<text x="408" y="398" font-size="12" fill="#2e7d4f">even if the husband has nothing</text>
</svg>
