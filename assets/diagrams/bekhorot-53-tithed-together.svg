<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>Tithed together?</title>
  <rect width="640" height="400" rx="18" fill="#f3f6fb"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1f2a3c">Tithed together?</text>
  <text x="32" y="68" font-size="13.5" fill="#5b6b82">May one group of animals count toward the tithe of another?</text>
  <g font-size="12.5" font-weight="700" fill="#5b6b82">
    <text x="44" y="98">ANIMALS</text><text x="250" y="98">TOGETHER?</text><text x="354" y="98">WHY</text>
  </g>
  <!-- row 1 -->
  <rect x="32" y="108" width="576" height="78" rx="12" fill="#ffffff" stroke="#d5deeb"/>
  <text x="44" y="140" font-size="15" font-weight="700" fill="#1f2a3c">Herd and flock</text>
  <text x="44" y="162" font-size="13" fill="#5b6b82">cattle with sheep or goats</text>
  <rect x="250" y="130" width="62" height="28" rx="14" fill="#fbe3e1"/><text x="281" y="149" font-size="14" font-weight="700" text-anchor="middle" fill="#b23b2e">No</text>
  <text x="354" y="140" font-size="13.5" fill="#1f2a3c">Stated in the mishna (53a):</text>
  <text x="354" y="160" font-size="13.5" fill="#1f2a3c">tithed, but each on its own.</text>
  <!-- row 2 -->
  <rect x="32" y="196" width="576" height="78" rx="12" fill="#ffffff" stroke="#d5deeb"/>
  <text x="44" y="228" font-size="15" font-weight="700" fill="#1f2a3c">Sheep and goats</text>
  <text x="44" y="250" font-size="13" fill="#5b6b82">though they are diverse kinds</text>
  <rect x="250" y="218" width="62" height="28" rx="14" fill="#dff1e3"/><text x="281" y="237" font-size="14" font-weight="700" text-anchor="middle" fill="#2e7d32">Yes</text>
  <text x="354" y="228" font-size="13.5" fill="#1f2a3c">“Or the flock” (Lev. 27:32):</text>
  <text x="354" y="248" font-size="13.5" fill="#1f2a3c">all that is called flock is one.</text>
  <!-- row 3 -->
  <rect x="32" y="284" width="576" height="78" rx="12" fill="#ffffff" stroke="#d5deeb"/>
  <text x="44" y="316" font-size="15" font-weight="700" fill="#1f2a3c">New and old</text>
  <text x="44" y="338" font-size="13" fill="#5b6b82">born after / before Elul (Rashi)</text>
  <rect x="250" y="306" width="62" height="28" rx="14" fill="#fbe3e1"/><text x="281" y="325" font-size="14" font-weight="700" text-anchor="middle" fill="#b23b2e">No</text>
  <text x="354" y="316" font-size="13.5" fill="#1f2a3c">“You shall tithe … year by year”</text>
  <text x="354" y="336" font-size="13.5" fill="#1f2a3c">(Deut. 14:22): like grain, by year.</text>
  <text x="32" y="386" font-size="12.5" fill="#5b6b82">Rava: animal tithe is likened to grain tithe “for the year, and not for another matter.”</text>
</svg>
