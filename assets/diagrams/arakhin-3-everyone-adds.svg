<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 876" width="640" height="876" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="876" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">What “everyone” comes to add</text>
  <text x="320" y="68" text-anchor="middle" font-size="14" fill="#4b5563">Arakhin 3a–b: each teaching that opens with “everyone” (הכל)</text>
  <text x="36" y="98" font-size="13" font-weight="700" fill="#374151">“Everyone…”</text>
  <text x="308" y="98" font-size="13" font-weight="700" fill="#374151">comes to add</text>
  <rect x="24" y="108" width="260" height="50" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="296" y="108" width="320" height="50" rx="9" fill="#e8f1fb" stroke="#a9c4e4"/>
  <text x="36" y="129" font-size="13" font-weight="600" fill="#1f2937">Obligated in, and fit for, reading</text>
  <text x="36" y="146" font-size="13" font-weight="600" fill="#1f2937">the Megilla</text>
  <text x="308" y="129" font-size="13" fill="#1e3a5f">Women: they too were part of that miracle</text>
  <text x="308" y="146" font-size="13" fill="#1e3a5f">(Rabbi Yehoshua ben Levi)</text>
  <rect x="24" y="164" width="260" height="33" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="296" y="164" width="320" height="33" rx="9" fill="#e8f1fb" stroke="#a9c4e4"/>
  <text x="36" y="185" font-size="13" font-weight="600" fill="#1f2937">Obligated to form a zimmun</text>
  <text x="308" y="185" font-size="13" fill="#1e3a5f">Women and slaves, each group for themselves</text>
  <rect x="24" y="203" width="260" height="50" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="296" y="203" width="320" height="50" rx="9" fill="#e8f1fb" stroke="#a9c4e4"/>
  <text x="36" y="232.5" font-size="13" font-weight="600" fill="#1f2937">Included in a zimmun</text>
  <text x="308" y="224" font-size="13" fill="#1e3a5f">A minor who knows to Whom one blesses (Rav</text>
  <text x="308" y="241" font-size="13" fill="#1e3a5f">Naḥman)</text>
  <rect x="24" y="259" width="260" height="67" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="296" y="259" width="320" height="67" rx="9" fill="#e8f1fb" stroke="#a9c4e4"/>
  <text x="36" y="297" font-size="13" font-weight="600" fill="#1f2937">Impure through ziva (Zavim 2:1)</text>
  <text x="308" y="280" font-size="13" fill="#1e3a5f">A day-old baby. Rabbi Yehuda: from “any man”;</text>
  <text x="308" y="297" font-size="13" fill="#1e3a5f">Rabbi Yishmael son of Rabbi Yoḥanan ben</text>
  <text x="308" y="314" font-size="13" fill="#1e3a5f">Beroka: from “a male”</text>
  <rect x="24" y="332" width="260" height="50" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="296" y="332" width="320" height="50" rx="9" fill="#e8f1fb" stroke="#a9c4e4"/>
  <text x="36" y="361.5" font-size="13" font-weight="600" fill="#1f2937">Impure through a corpse</text>
  <text x="308" y="353" font-size="13" fill="#1e3a5f">A minor (“the man” only exempts him from</text>
  <text x="308" y="370" font-size="13" fill="#1e3a5f">karet)</text>
  <rect x="24" y="388" width="260" height="50" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="296" y="388" width="320" height="50" rx="9" fill="#e8f1fb" stroke="#a9c4e4"/>
  <text x="36" y="409" font-size="13" font-weight="600" fill="#1f2937">Impure through leprous marks</text>
  <text x="36" y="426" font-size="13" font-weight="600" fill="#1f2937">(Nega’im 3:1)</text>
  <text x="308" y="409" font-size="13" fill="#1e3a5f">A minor (“a person”); “man” teaches rending</text>
  <text x="308" y="426" font-size="13" fill="#1e3a5f">and letting the hair grow</text>
  <rect x="24" y="444" width="260" height="50" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="296" y="444" width="320" height="50" rx="9" fill="#e8f1fb" stroke="#a9c4e4"/>
  <text x="36" y="465" font-size="13" font-weight="600" fill="#1f2937">May inspect, fit to inspect, leprous</text>
  <text x="36" y="482" font-size="13" font-weight="600" fill="#1f2937">marks</text>
  <text x="308" y="465" font-size="13" fill="#1e3a5f">A priest who is not expert but understands</text>
  <text x="308" y="482" font-size="13" fill="#1e3a5f">when it is explained (Ravina)</text>
  <rect x="24" y="500" width="260" height="50" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="296" y="500" width="320" height="50" rx="9" fill="#e8f1fb" stroke="#a9c4e4"/>
  <text x="36" y="521" font-size="13" font-weight="600" fill="#1f2937">Fit to sanctify the heifer’s ashes</text>
  <text x="36" y="538" font-size="13" font-weight="600" fill="#1f2937">(Para 5:4)</text>
  <text x="308" y="529.5" font-size="13" fill="#1e3a5f">Rabbi Yehuda: a minor · the Rabbis: a woman</text>
  <rect x="24" y="556" width="260" height="33" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="296" y="556" width="320" height="33" rx="9" fill="#e8f1fb" stroke="#a9c4e4"/>
  <text x="36" y="577" font-size="13" font-weight="600" fill="#1f2937">Qualified to sprinkle (Para 12:10)</text>
  <text x="308" y="577" font-size="13" fill="#1e3a5f">One who is uncircumcised (Rabbi Elazar)</text>
  <rect x="24" y="595" width="260" height="50" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="296" y="595" width="320" height="50" rx="9" fill="#e8f1fb" stroke="#a9c4e4"/>
  <text x="36" y="616" font-size="13" font-weight="600" fill="#1f2937">Everyone slaughters, taught twice</text>
  <text x="36" y="633" font-size="13" font-weight="600" fill="#1f2937">(Ḥullin)</text>
  <text x="308" y="624.5" font-size="13" fill="#1e3a5f">A Samaritan · a Jew who is an apostate</text>
  <rect x="24" y="651" width="260" height="67" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="296" y="651" width="320" height="67" rx="9" fill="#e8f1fb" stroke="#a9c4e4"/>
  <text x="36" y="680.5" font-size="13" font-weight="600" fill="#1f2937">Can force others to ascend to Eretz</text>
  <text x="36" y="697.5" font-size="13" font-weight="600" fill="#1f2937">Yisrael (Ketubot 110b)</text>
  <text x="308" y="672" font-size="13" fill="#1e3a5f">Slaves; or, for one who teaches slaves</text>
  <text x="308" y="689" font-size="13" fill="#1e3a5f">explicitly, from a pleasant home to a noxious</text>
  <text x="308" y="706" font-size="13" fill="#1e3a5f">one</text>
  <rect x="24" y="724" width="260" height="33" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="296" y="724" width="320" height="33" rx="9" fill="#e8f1fb" stroke="#a9c4e4"/>
  <text x="36" y="745" font-size="13" font-weight="600" fill="#1f2937">But all may not remove them from it</text>
  <text x="308" y="745" font-size="13" fill="#1e3a5f">A slave who fled there from outside the Land</text>
  <rect x="24" y="763" width="260" height="50" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="296" y="763" width="320" height="50" rx="9" fill="#e8f1fb" stroke="#a9c4e4"/>
  <text x="36" y="784" font-size="13" font-weight="600" fill="#1f2937">Can force others to ascend to</text>
  <text x="36" y="801" font-size="13" font-weight="600" fill="#1f2937">Jerusalem</text>
  <text x="308" y="792.5" font-size="13" fill="#1e3a5f">Even from a pleasant home to a noxious one</text>
  <rect x="24" y="819" width="260" height="33" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="296" y="819" width="320" height="33" rx="9" fill="#e8f1fb" stroke="#a9c4e4"/>
  <text x="36" y="840" font-size="13" font-weight="600" fill="#1f2937">And none can remove them from it</text>
  <text x="308" y="840" font-size="13" fill="#1e3a5f">Even from a noxious home to a pleasant one</text>
</svg>
