<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 768" width="640" height="768" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="768" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Differentiated names, differentiated bodies</text>
  <text x="320" y="68" text-anchor="middle" font-size="14" fill="#4b5563">Keritot 15a: the cases the Gemara weighs, and how each is ruled</text>
  <rect x="24" y="86" width="592" height="92" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="107" font-size="13.5" font-weight="700" fill="#1f2937">Slaughtering an animal, its daughter’s daughter, then its daughter</text>
  <rect x="40" y="116" width="272" height="40" rx="7" fill="#fff7e6" stroke="#f0cf8f"/>
  <text x="50" y="133" font-size="12.5" fill="#1f2937"><tspan font-weight="700">Names:</tspan> one</text>
  <text x="50" y="149" font-size="11" fill="#4b5563">all are called “a mother and its offspring” (Rava)</text>
  <rect x="322" y="116" width="278" height="40" rx="7" fill="#eef6ee" stroke="#a9d3ad"/>
  <text x="332" y="133" font-size="12.5" fill="#1f2937"><tspan font-weight="700">Bodies:</tspan> differentiated</text>
  <text x="332" y="149" font-size="11" fill="#4b5563">three animals (Rav Naḥman bar Yitzḥak)</text>
  <text x="40" y="171" font-size="12" fill="#1e3a5f">First tanna: forty lashes · Sumakhos: eighty</text>
  <rect x="24" y="188" width="592" height="92" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="209" font-size="13.5" font-weight="700" fill="#1f2937">One woman who is his mother-in-law, her mother and his father-in-law’s mother</text>
  <rect x="40" y="218" width="272" height="40" rx="7" fill="#eef6ee" stroke="#a9d3ad"/>
  <text x="50" y="235" font-size="12.5" fill="#1f2937"><tspan font-weight="700">Names:</tspan> differentiated</text>
  <text x="50" y="251" font-size="11" fill="#4b5563">three names (Rava)</text>
  <rect x="322" y="218" width="278" height="40" rx="7" fill="#fff7e6" stroke="#f0cf8f"/>
  <text x="332" y="235" font-size="12.5" fill="#1f2937"><tspan font-weight="700">Bodies:</tspan> one</text>
  <text x="332" y="251" font-size="11" fill="#4b5563">only one woman (Rav Naḥman bar Yitzḥak)</text>
  <text x="40" y="273" font-size="12" fill="#1e3a5f">Rabbi Yoḥanan ben Nuri: liable for each · Sumakhos may hold like Rabbi Abbahu: one “lewdness”</text>
  <rect x="24" y="290" width="592" height="92" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="311" font-size="13.5" font-weight="700" fill="#1f2937">His five wives while menstruating, during one lapse of awareness</text>
  <rect x="40" y="320" width="272" height="40" rx="7" fill="#fff7e6" stroke="#f0cf8f"/>
  <text x="50" y="337" font-size="12.5" fill="#1f2937"><tspan font-weight="700">Names:</tspan> one</text>
  <text x="50" y="353" font-size="11" fill="#4b5563">one name, a menstruating woman</text>
  <rect x="322" y="320" width="278" height="40" rx="7" fill="#eef6ee" stroke="#a9d3ad"/>
  <text x="332" y="337" font-size="12.5" fill="#1f2937"><tspan font-weight="700">Bodies:</tspan> differentiated</text>
  <text x="332" y="353" font-size="11" fill="#4b5563">five women</text>
  <text x="40" y="375" font-size="12" fill="#1e3a5f">Heard by Rabban Gamliel and Rabbi Yehoshua: liable for each, as the bodies are differentiated</text>
  <rect x="24" y="392" width="592" height="92" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="413" font-size="13.5" font-weight="700" fill="#1f2937">One woman who is his sister, his father’s sister and his mother’s sister</text>
  <rect x="40" y="422" width="272" height="40" rx="7" fill="#eef6ee" stroke="#a9d3ad"/>
  <text x="50" y="439" font-size="12.5" fill="#1f2937"><tspan font-weight="700">Names:</tspan> differentiated</text>
  <text x="50" y="455" font-size="11" fill="#4b5563">three names</text>
  <rect x="322" y="422" width="278" height="40" rx="7" fill="#fff7e6" stroke="#f0cf8f"/>
  <text x="332" y="439" font-size="12.5" fill="#1f2937"><tspan font-weight="700">Bodies:</tspan> one</text>
  <text x="332" y="455" font-size="11" fill="#4b5563">a single person</text>
  <text x="40" y="477" font-size="12" fill="#1e3a5f">Liable for each: “he has uncovered his sister’s nakedness” (the a fortiori is refuted)</text>
  <rect x="24" y="494" width="592" height="92" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="515" font-size="13.5" font-weight="700" fill="#1f2937">The same forbidden woman, again and again, during one lapse</text>
  <rect x="40" y="524" width="272" height="40" rx="7" fill="#fff7e6" stroke="#f0cf8f"/>
  <text x="50" y="541" font-size="12.5" fill="#1f2937"><tspan font-weight="700">Names:</tspan> one</text>
  <text x="302" y="541" text-anchor="end" font-size="11" font-style="italic" fill="#7a2e2e">implied</text>
  <rect x="322" y="524" width="278" height="40" rx="7" fill="#fff7e6" stroke="#f0cf8f"/>
  <text x="332" y="541" font-size="12.5" fill="#1f2937"><tspan font-weight="700">Bodies:</tspan> one</text>
  <text x="590" y="541" text-anchor="end" font-size="11" font-style="italic" fill="#7a2e2e">implied</text>
  <text x="40" y="579" font-size="12" fill="#1e3a5f">Rabbi Eliezer: liable for each act · the Rabbis: only one</text>
  <rect x="24" y="596" width="592" height="92" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="617" font-size="13.5" font-weight="700" fill="#1f2937">A vine trellised over a fig tree, both cut at the same time</text>
  <rect x="40" y="626" width="272" height="40" rx="7" fill="#eef6ee" stroke="#a9d3ad"/>
  <text x="50" y="643" font-size="12.5" fill="#1f2937"><tspan font-weight="700">Names:</tspan> differentiated</text>
  <text x="50" y="659" font-size="11" fill="#4b5563">primary labor and subcategory</text>
  <rect x="322" y="626" width="278" height="40" rx="7" fill="#eef6ee" stroke="#a9d3ad"/>
  <text x="332" y="643" font-size="12.5" fill="#1f2937"><tspan font-weight="700">Bodies:</tspan> differentiated</text>
  <text x="332" y="659" font-size="11" fill="#4b5563">figs and part of a vine</text>
  <text x="40" y="681" font-size="12" fill="#1e3a5f">Rabbi Eliezer: liable two (Mar, son of the Sages)</text>
  <rect x="24" y="704" width="592" height="50" rx="9" fill="#f1ecf8" stroke="#c7b6e3"/>
  <text x="40" y="724" font-size="12.5" fill="#1f2937"><tspan font-weight="700">Reaping a fig-bulk twice in one lapse:</tspan> Rabba: two (he did two) · Rav Yosef: one</text>
  <text x="40" y="742" font-size="12.5" fill="#1f2937">(they can be combined) · Mar, son of the Sages: exempt only if both were reaped at once</text>
</svg>
