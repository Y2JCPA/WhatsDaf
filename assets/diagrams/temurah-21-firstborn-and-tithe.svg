<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 497" width="640" height="497" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="497" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" font-size="22" font-weight="700" text-anchor="middle" fill="#1f2a44">Firstborn and tithe, and all the rest</text>
  <text x="320" y="70" font-size="14" text-anchor="middle" fill="#4a5672">Their substitutes, and offspring until the end of time, share their status.</text>
  <text x="40" y="112" font-size="12" font-weight="700" fill="#4a5672">THE MISHNA ASKS</text>
  <text x="176" y="112" font-size="12" font-weight="700" fill="#4a5672">ALL OTHER SACRIFICIAL ANIMALS</text>
  <text x="412" y="112" font-size="12" font-weight="700" fill="#7a4a00">FIRSTBORN AND TITHE</text>
  <rect x="24" y="128" width="592" height="77" rx="10" fill="#ffffff" stroke="#c9d3e6"/>
  <text x="40" y="152" font-size="13.5" font-weight="600" fill="#1f2a44">Blemished and</text>
  <text x="40" y="169" font-size="13.5" font-weight="600" fill="#1f2a44">redeemed</text>
  <text x="176" y="152" font-size="13" fill="#1f2a44">Sold and slaughtered in the</text>
  <text x="176" y="169" font-size="13" fill="#1f2a44">butchers’ market, weighed</text>
  <text x="176" y="186" font-size="13" fill="#1f2a44">by the litra</text>
  <rect x="402" y="134" width="206" height="65" rx="9" fill="#fff6e0"/>
  <text x="412" y="152" font-size="13" font-weight="600" fill="#7a4a00">Not sold in the market</text>
  <text x="412" y="169" font-size="13" font-weight="600" fill="#7a4a00">or weighed by the litra</text>
  <rect x="24" y="213" width="592" height="60" rx="10" fill="#ffffff" stroke="#c9d3e6"/>
  <text x="40" y="237" font-size="13.5" font-weight="600" fill="#1f2a44">Redemption</text>
  <text x="176" y="237" font-size="13" fill="#1f2a44">Redeemed, and their</text>
  <text x="176" y="254" font-size="13" fill="#1f2a44">substitutes are redeemed</text>
  <rect x="402" y="219" width="206" height="48" rx="9" fill="#fff6e0"/>
  <text x="412" y="237" font-size="13" font-weight="600" fill="#7a4a00">Not redeemed</text>
  <rect x="24" y="281" width="592" height="94" rx="10" fill="#ffffff" stroke="#c9d3e6"/>
  <text x="40" y="305" font-size="13.5" font-weight="600" fill="#1f2a44">From outside</text>
  <text x="40" y="322" font-size="13.5" font-weight="600" fill="#1f2a44">the Land</text>
  <text x="176" y="305" font-size="13" fill="#1f2a44">Come to the Temple even</text>
  <text x="176" y="322" font-size="13" fill="#1f2a44">from outside the Land</text>
  <rect x="402" y="287" width="206" height="82" rx="9" fill="#fff6e0"/>
  <text x="412" y="305" font-size="13" font-weight="600" fill="#7a4a00">Not brought ab initio.</text>
  <text x="412" y="322" font-size="13" font-weight="600" fill="#7a4a00">If they came unblemished:</text>
  <text x="412" y="339" font-size="13" font-weight="600" fill="#7a4a00">sacrificed. If blemished: eaten</text>
  <text x="412" y="356" font-size="13" font-weight="600" fill="#7a4a00">in their blemish by the owners</text>
  <rect x="24" y="389" width="592" height="86" rx="12" fill="#e8f0fb" stroke="#b9cbe8"/>
  <text x="40" y="413" font-size="13" font-weight="700" fill="#1f3f73">Rabbi Shimon’s reason</text>
  <text x="40" y="433" font-size="13" fill="#1f3f73">Firstborn and tithe have a remedy in their place: they graze until blemished and are</text>
  <text x="40" y="450" font-size="13" fill="#1f3f73">eaten there. All other sacrificial animals remain in their sanctity even when blemished.</text>
</svg>
