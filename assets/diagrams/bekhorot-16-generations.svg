<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 481" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>Generations exempt from the firstborn</title>
  <rect width="640" height="481" rx="18" fill="#f3f6fb"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1f2a3a">Generations exempt from the firstborn</text>
  <text x="32" y="70" font-size="14" fill="#55657a">A flock taken from a gentile as a guaranteed investment (tzon barzel)</text>
  <text x="288" y="106" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2a3a">Offspring</text>
  <text x="415" y="106" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2a3a">Their offspring</text>
  <text x="542" y="106" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2a3a">Next generation</text>
  <text x="32" y="106" font-size="13" fill="#55657a">Case · opinion</text>
  <rect x="22" y="122" width="596" height="62" rx="12" fill="#ffffff" stroke="#dde4ef"/>
  <text x="34" y="148" font-size="15" font-weight="700" fill="#1f2a3a">Not established</text>
  <text x="34" y="168" font-size="12.5" fill="#55657a">Mishna’s first clause · Rav Huna</text>
  <rect x="228" y="131" width="120" height="44" rx="9" fill="#e3f2e6"/>
  <text x="288" y="158.0" font-size="15" font-weight="700" text-anchor="middle" fill="#2e7d32">exempt</text>
  <rect x="355" y="131" width="120" height="44" rx="9" fill="#fdeaea"/>
  <text x="415" y="158.0" font-size="15" font-weight="700" text-anchor="middle" fill="#b23b2e">obligated</text>
  <rect x="482" y="131" width="120" height="44" rx="9" fill="#fdeaea"/>
  <text x="542" y="153.0" font-size="15" font-weight="700" text-anchor="middle" fill="#b23b2e">obligated</text>
  <text x="542" y="169.0" font-size="11" text-anchor="middle" fill="#7a8696">implied</text>
  <rect x="22" y="192" width="596" height="62" rx="12" fill="#ffffff" stroke="#dde4ef"/>
  <text x="34" y="218" font-size="15" font-weight="700" fill="#1f2a3a">Not established</text>
  <text x="34" y="238" font-size="12.5" fill="#55657a">Rav Yehuda</text>
  <rect x="228" y="201" width="120" height="44" rx="9" fill="#e3f2e6"/>
  <text x="288" y="228.0" font-size="15" font-weight="700" text-anchor="middle" fill="#2e7d32">exempt</text>
  <rect x="355" y="201" width="120" height="44" rx="9" fill="#e3f2e6"/>
  <text x="415" y="228.0" font-size="15" font-weight="700" text-anchor="middle" fill="#2e7d32">exempt</text>
  <rect x="482" y="201" width="120" height="44" rx="9" fill="#fdeaea"/>
  <text x="542" y="228.0" font-size="15" font-weight="700" text-anchor="middle" fill="#b23b2e">obligated</text>
  <rect x="22" y="262" width="596" height="62" rx="12" fill="#ffffff" stroke="#dde4ef"/>
  <text x="34" y="288" font-size="15" font-weight="700" fill="#1f2a3a">Established in place</text>
  <text x="34" y="308" font-size="12.5" fill="#55657a">Mishna · Rav Yehuda: likewise</text>
  <rect x="228" y="271" width="120" height="44" rx="9" fill="#e3f2e6"/>
  <text x="288" y="293.0" font-size="15" font-weight="700" text-anchor="middle" fill="#2e7d32">exempt</text>
  <text x="288" y="309.0" font-size="11" text-anchor="middle" fill="#7a8696">implied</text>
  <rect x="355" y="271" width="120" height="44" rx="9" fill="#e3f2e6"/>
  <text x="415" y="298.0" font-size="15" font-weight="700" text-anchor="middle" fill="#2e7d32">exempt</text>
  <rect x="482" y="271" width="120" height="44" rx="9" fill="#fdeaea"/>
  <text x="542" y="298.0" font-size="15" font-weight="700" text-anchor="middle" fill="#b23b2e">obligated</text>
  <rect x="22" y="332" width="596" height="62" rx="12" fill="#ffffff" stroke="#dde4ef"/>
  <text x="34" y="358" font-size="15" font-weight="700" fill="#1f2a3a">Rabban Shimon</text>
  <text x="34" y="378" font-size="15" font-weight="700" fill="#1f2a3a">ben Gamliel</text>
  <rect x="228" y="341" width="374" height="44" rx="9" fill="#e3f2e6"/>
  <text x="415" y="368.0" font-size="15" font-weight="700" text-anchor="middle" fill="#2e7d32">exempt, “even until ten generations”</text>
  <text x="32" y="416" font-size="12.5" fill="#55657a">Rava: if the gentile is not paid, he seizes the animal, and if he does not find it,</text>
  <text x="32" y="435" font-size="12.5" fill="#55657a">he seizes its offspring, so “the hand of a gentile is in the middle.”</text>
  <text x="32" y="454" font-size="12.5" fill="#55657a">Rabban Shimon ben Gamliel: “as they serve as a guarantee for the gentile.”</text>
</svg>
