<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title>Gathering times for animal tithe</title>
<rect width="640" height="490" rx="18" fill="#f3f6fb"/>
<text x="32" y="44" font-size="22" font-weight="700" fill="#1f2a3a">Gathering times for animal tithe</text>
<circle cx="39" cy="70" r="6" fill="#2f6fb0"/><text x="52" y="75" font-size="13" fill="#4a5568">gathering time</text>
<rect x="158" y="61" width="5" height="18" rx="1.5" fill="#c0392b"/><text x="170" y="75" font-size="13" fill="#4a5568">new year for animal tithe</text>
<rect x="336" y="62" width="20" height="16" rx="3" fill="#f6d7a7"/><text x="362" y="75" font-size="13" fill="#4a5568">tithed by themselves</text>
<rect x="168" y="96" width="37.5" height="292" fill="#ffffff"/>
<text x="186.75" y="114" font-size="10.5" text-anchor="middle" fill="#4a5568">Tishrei</text>
<rect x="205.5" y="96" width="37.5" height="292" fill="#e9eef6"/>
<text x="224.25" y="114" font-size="10.5" text-anchor="middle" fill="#4a5568">Ḥesh.</text>
<rect x="243" y="96" width="37.5" height="292" fill="#ffffff"/>
<text x="261.75" y="114" font-size="10.5" text-anchor="middle" fill="#4a5568">Kislev</text>
<rect x="280.5" y="96" width="37.5" height="292" fill="#e9eef6"/>
<text x="299.25" y="114" font-size="10.5" text-anchor="middle" fill="#4a5568">Tevet</text>
<rect x="318" y="96" width="37.5" height="292" fill="#ffffff"/>
<text x="336.75" y="114" font-size="10.5" text-anchor="middle" fill="#4a5568">Shevat</text>
<rect x="355.5" y="96" width="37.5" height="292" fill="#e9eef6"/>
<text x="374.25" y="114" font-size="10.5" text-anchor="middle" fill="#4a5568">Adar</text>
<rect x="393" y="96" width="37.5" height="292" fill="#ffffff"/>
<text x="411.75" y="114" font-size="10.5" text-anchor="middle" fill="#4a5568">Nisan</text>
<rect x="430.5" y="96" width="37.5" height="292" fill="#e9eef6"/>
<text x="449.25" y="114" font-size="10.5" text-anchor="middle" fill="#4a5568">Iyar</text>
<rect x="468" y="96" width="37.5" height="292" fill="#ffffff"/>
<text x="486.75" y="114" font-size="10.5" text-anchor="middle" fill="#4a5568">Sivan</text>
<rect x="505.5" y="96" width="37.5" height="292" fill="#e9eef6"/>
<text x="524.25" y="114" font-size="10.5" text-anchor="middle" fill="#4a5568">Tam.</text>
<rect x="543" y="96" width="37.5" height="292" fill="#ffffff"/>
<text x="561.75" y="114" font-size="10.5" text-anchor="middle" fill="#4a5568">Av</text>
<rect x="580.5" y="96" width="37.5" height="292" fill="#e9eef6"/>
<text x="599.25" y="114" font-size="10.5" text-anchor="middle" fill="#4a5568">Elul</text>
<rect x="168" y="96" width="450" height="292" fill="none" stroke="#cfd8e6"/>
<line x1="185.5" y1="120" x2="185.5" y2="388" stroke="#8a94a6" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="410.5" y1="120" x2="410.5" y2="388" stroke="#8a94a6" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="474.3" y1="120" x2="474.3" y2="388" stroke="#8a94a6" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="185.5" y="404" font-size="11" text-anchor="middle" fill="#6b7280">Sukkot</text>
<text x="406.5" y="404" font-size="11" text-anchor="end" fill="#6b7280">Pesaḥ</text>
<text x="478.3" y="404" font-size="11" text-anchor="start" fill="#6b7280">Shavuot</text>
<text x="32" y="161" font-size="14" font-weight="700" fill="#1f2a3a">Rabbi Akiva</text>
<line x1="24" y1="190" x2="618" y2="190" stroke="#cfd8e6"/>
<text x="32" y="227" font-size="14" font-weight="700" fill="#1f2a3a">Ben Azzai</text>
<line x1="24" y1="256" x2="618" y2="256" stroke="#cfd8e6"/>
<text x="32" y="284" font-size="14" font-weight="700" fill="#1f2a3a">Rabbi Elazar &amp;</text>
<text x="32" y="302" font-size="14" font-weight="700" fill="#1f2a3a">Rabbi Shimon</text>
<line x1="24" y1="322" x2="618" y2="322" stroke="#cfd8e6"/>
<text x="32" y="350" font-size="14" font-weight="700" fill="#1f2a3a">Rabbi Meir</text>
<text x="32" y="368" font-size="12" font-weight="400" fill="#6b7280">new year only</text>
<circle cx="176.5" cy="150" r="6.5" fill="#2f6fb0"/>
<text x="171.5" y="174" font-size="11" text-anchor="start" fill="#1f2a3a" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">just before</text>
<circle cx="401.5" cy="150" r="6.5" fill="#2f6fb0"/>
<text x="401.5" y="174" font-size="11" text-anchor="middle" fill="#1f2a3a" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">just before</text>
<circle cx="465.3" cy="150" r="6.5" fill="#2f6fb0"/>
<text x="470.3" y="174" font-size="11" text-anchor="start" fill="#1f2a3a" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">just before</text>
<rect x="580.5" y="196" width="37.5" height="54" rx="4" fill="#f6d7a7"/>
<circle cx="390.5" cy="216" r="6.5" fill="#2f6fb0"/>
<text x="396.5" y="240" font-size="11" text-anchor="end" fill="#1f2a3a" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">29 Adar</text>
<circle cx="468" cy="216" r="6.5" fill="#2f6fb0"/>
<text x="462" y="240" font-size="11" text-anchor="start" fill="#1f2a3a" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">1 Sivan</text>
<circle cx="578" cy="216" r="6.5" fill="#2f6fb0"/>
<text x="584" y="240" font-size="11" text-anchor="end" fill="#1f2a3a" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">29 Av</text>
<rect x="168" y="268" width="5" height="28" rx="1.5" fill="#c0392b"/>
<text x="176" y="312" font-size="11" text-anchor="start" fill="#c0392b" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">1 Tishrei</text>
<circle cx="393" cy="282" r="6.5" fill="#2f6fb0"/>
<text x="399" y="306" font-size="11" text-anchor="end" fill="#1f2a3a" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">1 Nisan</text>
<circle cx="468" cy="282" r="6.5" fill="#2f6fb0"/>
<text x="462" y="306" font-size="11" text-anchor="start" fill="#1f2a3a" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">1 Sivan</text>
<circle cx="609.5" cy="282" r="6.5" fill="#2f6fb0"/>
<text x="616.5" y="306" font-size="11" text-anchor="end" fill="#1f2a3a" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">29 Elul</text>
<rect x="578" y="334" width="5" height="28" rx="1.5" fill="#c0392b"/>
<text x="580.5" y="378" font-size="11" text-anchor="middle" fill="#c0392b" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">1 Elul</text>
<text x="32" y="432" font-size="12.5" fill="#4a5568">Rabbi Elazar and Rabbi Shimon move their third date from 1 Tishrei to 29 Elul,</text>
<text x="32" y="451" font-size="12.5" fill="#4a5568">because 1 Tishrei is Rosh HaShana and one may not tithe on a Festival.</text>
<text x="32" y="470" font-size="12.5" fill="#4a5568">Ben Azzai tithes the Elul-born by themselves: the year may begin on 1 Elul or on 1 Tishrei.</text>
</svg>
