<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>Why the animal tithe may not be sold</title>
  <rect width="640" height="540" rx="18" fill="#f3f6fb"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1f2d3d">Why the animal tithe may not be sold</text>
  <text x="32" y="68" font-size="14" fill="#5b6b7d">Rav Ḥinnana citing Rav, and Rav Dimi citing Rabbi Yoḥanan, as the Gemara works it out</text>

  <g font-size="13" fill="#33475b">
    <rect x="32" y="88" width="176" height="186" rx="12" fill="#ffffff" stroke="#c9d5e3"/>
    <text x="120" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2d3d">Firstborn</text>
    <text x="46" y="142" font-weight="600" fill="#1f2d3d">“You shall not redeem”</text>
    <text x="46" y="160">pediya · Numbers 18:17</text>
    <text x="46" y="188" font-weight="600" fill="#1f2d3d">“And you shall cause</text>
    <text x="46" y="204" font-weight="600" fill="#1f2d3d">to pass”</text>
    <text x="46" y="222">superfluous · Ex. 13:12</text>
    <rect x="44" y="236" width="152" height="26" rx="13" fill="#dcefe0"/>
    <text x="120" y="254" text-anchor="middle" font-weight="600" fill="#24683a">may be sold</text>

    <rect x="232" y="88" width="176" height="186" rx="12" fill="#ffffff" stroke="#c9d5e3"/>
    <text x="320" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2d3d">Animal tithe</text>
    <text x="246" y="142" font-weight="600" fill="#1f2d3d">“It shall not be</text>
    <text x="246" y="158" font-weight="600" fill="#1f2d3d">redeemed”</text>
    <text x="246" y="176">geula · Leviticus 27:33</text>
    <text x="246" y="204" font-weight="600" fill="#1f2d3d">“Passes under the rod”</text>
    <text x="246" y="222">Leviticus 27:32</text>
    <rect x="244" y="236" width="152" height="26" rx="13" fill="#fde2e1"/>
    <text x="320" y="254" text-anchor="middle" font-weight="600" fill="#a12d22">may not be sold</text>

    <rect x="432" y="88" width="176" height="186" rx="12" fill="#ffffff" stroke="#c9d5e3"/>
    <text x="520" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2d3d">Dedications</text>
    <text x="446" y="142" font-weight="600" fill="#1f2d3d">“May neither be sold</text>
    <text x="446" y="158" font-weight="600" fill="#1f2d3d">nor redeemed”</text>
    <text x="446" y="176">geula · Leviticus 27:28</text>
    <text x="446" y="204" font-weight="600" fill="#1f2d3d">“It is most holy”</text>
    <text x="446" y="222">the word “it” limits</text>
    <rect x="444" y="236" width="152" height="26" rx="13" fill="#fde2e1"/>
    <text x="520" y="254" text-anchor="middle" font-weight="600" fill="#a12d22">may not be sold</text>
  </g>

  <g font-size="13" fill="#33475b">
    <rect x="32" y="298" width="576" height="66" rx="10" fill="#e6eef8"/>
    <rect x="44" y="310" width="172" height="24" rx="12" fill="#ffffff" stroke="#9fb3c8"/>
    <text x="130" y="327" text-anchor="middle" font-weight="700" fill="#1f2d3d">Firstborn → Tithe</text>
    <text x="230" y="327" font-weight="600" fill="#1f2d3d">“passing” ↔ “passing”</text>
    <text x="44" y="352">The tithe, like the firstborn, may not be redeemed, so its own phrase is free.</text>

    <rect x="32" y="374" width="576" height="66" rx="10" fill="#e6eef8"/>
    <rect x="44" y="386" width="172" height="24" rx="12" fill="#ffffff" stroke="#9fb3c8"/>
    <text x="130" y="403" text-anchor="middle" font-weight="700" fill="#1f2d3d">Dedications → Tithe</text>
    <text x="230" y="403" font-weight="600" fill="#1f2d3d">geula ↔ geula</text>
    <text x="44" y="428">As with dedications, selling is stated together with redeeming.</text>

    <rect x="32" y="450" width="576" height="66" rx="10" fill="#fbeaea"/>
    <rect x="44" y="462" width="172" height="24" rx="12" fill="#ffffff" stroke="#d9a3a0"/>
    <text x="130" y="479" text-anchor="middle" font-weight="700" fill="#a12d22">Dedications ✖ Firstborn</text>
    <text x="230" y="479" font-weight="600" fill="#1f2d3d">pediya is not derived from geula</text>
    <text x="44" y="504">And “it” means dedications, not the firstborn, so the firstborn may still be sold.</text>
  </g>
</svg>
