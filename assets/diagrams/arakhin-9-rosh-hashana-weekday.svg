<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 669" width="640" height="669" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="669" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">On which weekday can Rosh HaShana fall?</text>
  <text x="320" y="68" text-anchor="middle" font-size="14" fill="#4b5563">Arakhin 9b: measured from the day the omer is waved</text>
  <rect x="174" y="82" width="146" height="44" rx="9" fill="#1e3a5f"/><text x="247" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Day of waving</text><text x="247" y="117" text-anchor="middle" font-size="11.5" fill="#dbe7f5">weekday of 16 Nisan</text><rect x="322" y="82" width="146" height="44" rx="9" fill="#1e3a5f"/><text x="395" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">The night after</text><text x="395" y="117" text-anchor="middle" font-size="11.5" fill="#dbe7f5">weekday of 17 Nisan</text><rect x="470" y="82" width="146" height="44" rx="9" fill="#1e3a5f"/><text x="543" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Two days after</text><text x="543" y="117" text-anchor="middle" font-size="11.5" fill="#dbe7f5">weekday of 18 Nisan</text><rect x="24" y="134" width="142" height="50" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="34" y="163" font-size="13" font-weight="600" fill="#1f2937">The baraita</text><rect x="174" y="134" width="146" height="50" rx="9" fill="#e7f6ec" stroke="#9fd3b0"/><text x="247" y="166" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">✓</text><rect x="322" y="134" width="146" height="50" rx="9" fill="#e7f6ec" stroke="#9fd3b0"/><text x="395" y="166" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">✓</text><rect x="470" y="134" width="146" height="50" rx="9" fill="#fbecec" stroke="#e8b4b4"/><text x="543" y="158" text-anchor="middle" font-size="18" font-weight="700" fill="#991b1b">✗</text><text x="543" y="174" text-anchor="middle" font-size="12" fill="#991b1b">not listed</text><rect x="24" y="190" width="142" height="98" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="34" y="235" font-size="13" font-weight="600" fill="#1f2937">Ulla, as the Gemara</text><text x="34" y="251" font-size="13" font-weight="600" fill="#1f2937">first argues</text><rect x="174" y="190" width="146" height="98" rx="9" fill="#e7f6ec" stroke="#9fd3b0"/><text x="247" y="214" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">✓</text><text x="247" y="230" text-anchor="middle" font-size="12" fill="#166534">eight deficient</text><text x="247" y="246" text-anchor="middle" font-size="12" fill="#166534">months: an extra</text><text x="247" y="262" text-anchor="middle" font-size="12" fill="#166534">deficient one in</text><text x="247" y="278" text-anchor="middle" font-size="12" fill="#166534">summer</text><rect x="322" y="190" width="146" height="98" rx="9" fill="#e7f6ec" stroke="#9fd3b0"/><text x="395" y="238" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">✓</text><text x="395" y="254" text-anchor="middle" font-size="12" fill="#166534">months alternate</text><rect x="470" y="190" width="146" height="98" rx="9" fill="#fbecec" stroke="#e8b4b4"/><text x="543" y="238" text-anchor="middle" font-size="18" font-weight="700" fill="#991b1b">✗</text><text x="543" y="254" text-anchor="middle" font-size="12" fill="#991b1b">no eight full months</text><rect x="24" y="294" width="142" height="82" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="34" y="339" font-size="13" font-weight="600" fill="#1f2937">Rav Huna</text><rect x="174" y="294" width="146" height="82" rx="9" fill="#e7f6ec" stroke="#9fd3b0"/><text x="247" y="342" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">✓</text><text x="312" y="308" text-anchor="end" font-size="10.5" font-style="italic" fill="#6b7280">implied</text><rect x="322" y="294" width="146" height="82" rx="9" fill="#e7f6ec" stroke="#9fd3b0"/><text x="395" y="342" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">✓</text><text x="460" y="308" text-anchor="end" font-size="10.5" font-style="italic" fill="#6b7280">implied</text><rect x="470" y="294" width="146" height="82" rx="9" fill="#e7f6ec" stroke="#9fd3b0"/><text x="543" y="318" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">✓</text><text x="543" y="334" text-anchor="middle" font-size="12" fill="#166534">eight full months: an</text><text x="543" y="350" text-anchor="middle" font-size="12" fill="#166534">extra full one in</text><text x="543" y="366" text-anchor="middle" font-size="12" fill="#166534">summer</text><rect x="24" y="382" width="142" height="82" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="34" y="419" font-size="13" font-weight="600" fill="#1f2937">Ulla, as Rav Huna</text><text x="34" y="435" font-size="13" font-weight="600" fill="#1f2937">answers</text><rect x="174" y="382" width="146" height="82" rx="9" fill="#e7f6ec" stroke="#9fd3b0"/><text x="247" y="430" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">✓</text><rect x="322" y="382" width="146" height="82" rx="9" fill="#e7f6ec" stroke="#9fd3b0"/><text x="395" y="430" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">✓</text><rect x="470" y="382" width="146" height="82" rx="9" fill="#e7f6ec" stroke="#9fd3b0"/><text x="543" y="406" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">✓</text><text x="543" y="422" text-anchor="middle" font-size="12" fill="#166534">seven full months,</text><text x="543" y="438" text-anchor="middle" font-size="12" fill="#166534">the extra one in</text><text x="543" y="454" text-anchor="middle" font-size="12" fill="#166534">summer</text><rect x="24" y="470" width="142" height="114" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="34" y="523" font-size="13" font-weight="600" fill="#1f2937">Aḥerim (months</text><text x="34" y="539" font-size="13" font-weight="600" fill="#1f2937">always alternate)</text><rect x="174" y="470" width="146" height="114" rx="9" fill="#e7f6ec" stroke="#9fd3b0"/><text x="247" y="494" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">✓</text><text x="247" y="510" text-anchor="middle" font-size="12" fill="#166534">only per Rav</text><text x="247" y="526" text-anchor="middle" font-size="12" fill="#166534">Mesharshiyya: a leap</text><text x="247" y="542" text-anchor="middle" font-size="12" fill="#166534">year with a 30-day</text><text x="247" y="558" text-anchor="middle" font-size="12" fill="#166534">added month, and one</text><text x="247" y="574" text-anchor="middle" font-size="12" fill="#166534">summer month removed</text><rect x="322" y="470" width="146" height="114" rx="9" fill="#e7f6ec" stroke="#9fd3b0"/><text x="395" y="526" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">✓</text><text x="395" y="542" text-anchor="middle" font-size="12" fill="#166534">the regular order</text><rect x="470" y="470" width="146" height="114" rx="9" fill="#fbecec" stroke="#e8b4b4"/><text x="543" y="534" text-anchor="middle" font-size="18" font-weight="700" fill="#991b1b">✗</text><text x="24" y="608" font-size="12" fill="#4b5563">Six months separate the omer from Rosh HaShana. Three full and three deficient bring Rosh</text><text x="24" y="625" font-size="12" fill="#4b5563">HaShana to the weekday of the third day of Passover (the night after); one more deficient</text><text x="24" y="642" font-size="12" fill="#4b5563">month moves it a day earlier, one more full month a day later.</text>
</svg>
