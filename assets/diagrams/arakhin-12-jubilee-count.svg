<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 662" width="640" height="662" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="662" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Was it the year after a Sabbatical Year?</text><text x="320" y="68" text-anchor="middle" font-size="14" fill="#4b5563">Arakhin 12b: counting cycles and Jubilees to each destruction</text><text x="24" y="100" font-size="15" font-weight="700" fill="#1e3a5f">Second Temple · stood 420 years</text><rect x="24" y="110" width="150" height="66" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="34" y="139.5" font-size="12.5" font-weight="700" fill="#1f2937">The Rabbis</text><text x="34" y="155.5" font-size="12.5" fill="#1f2937">Jubilee of 50 years</text><rect x="180" y="110" width="272" height="66" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="192" y="139.5" font-size="12.5" fill="#1f2937">400 = 8 Jubilees; 14 = 2 Sabbatical cycles;</text><text x="192" y="155.5" font-size="12.5" fill="#1f2937">6 years remain: the last was the 6th</text><rect x="458" y="110" width="158" height="66" rx="9" fill="#fbecec" stroke="#e8b4b4"/><text x="537" y="139.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#991b1b">✗ Destroyed in a</text><text x="537" y="155.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#991b1b">Sabbatical Year</text><rect x="24" y="182" width="150" height="66" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="34" y="203.5" font-size="12.5" font-weight="700" fill="#1f2937">Rabbi Yehuda</text><text x="34" y="219.5" font-size="12.5" fill="#1f2937">the 50th year counts</text><text x="34" y="235.5" font-size="12.5" fill="#1f2937">for both cycles</text><rect x="180" y="182" width="272" height="66" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="192" y="211.5" font-size="12.5" fill="#1f2937">Add 8 years, one from each Jubilee:</text><text x="192" y="227.5" font-size="12.5" fill="#1f2937">6 + 8 = 14, two full cycles</text><rect x="458" y="182" width="158" height="66" rx="9" fill="#e7f6ec" stroke="#9fd3b0"/><text x="537" y="211.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#166534">✓ Year after a</text><text x="537" y="227.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#166534">Sabbatical Year</text><text x="24" y="280" font-size="15" font-weight="700" fill="#1e3a5f">First Temple · 17 Jubilees from entering the land until leaving it</text><rect x="24" y="290" width="150" height="66" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="34" y="319.5" font-size="12.5" font-weight="700" fill="#1f2937">Counting from</text><text x="34" y="335.5" font-size="12.5" fill="#1f2937">the entry</text><rect x="180" y="290" width="272" height="66" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="192" y="319.5" font-size="12.5" fill="#1f2937">Destroyed at the beginning of a</text><text x="192" y="335.5" font-size="12.5" fill="#1f2937">Jubilee cycle</text><rect x="458" y="290" width="158" height="66" rx="9" fill="#fbecec" stroke="#e8b4b4"/><text x="537" y="319.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#991b1b">✗ No Jubilee</text><text x="537" y="335.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#991b1b">14 years after</text><rect x="24" y="362" width="150" height="66" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="34" y="383.5" font-size="12.5" font-weight="700" fill="#1f2937">The baraita, minus</text><text x="34" y="399.5" font-size="12.5" fill="#1f2937">7 years conquering,</text><text x="34" y="415.5" font-size="12.5" fill="#1f2937">7 years dividing</text><rect x="180" y="362" width="272" height="66" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="192" y="391.5" font-size="12.5" fill="#1f2937">Destroyed in year 36 of the cycle;</text><text x="192" y="407.5" font-size="12.5" fill="#1f2937">the Jubilee comes 14 years after it</text><rect x="458" y="362" width="158" height="66" rx="9" fill="#e7f6ec" stroke="#9fd3b0"/><text x="537" y="391.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#166534">✓ Year after a</text><text x="537" y="407.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#166534">Sabbatical Year</text><rect x="24" y="434" width="150" height="66" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="34" y="463.5" font-size="12.5" font-weight="700" fill="#1f2937">Rabbi Yehuda</text><text x="34" y="479.5" font-size="12.5" fill="#1f2937">Jubilee of 49 years</text><rect x="180" y="434" width="272" height="66" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="192" y="463.5" font-size="12.5" fill="#1f2937">Add 17 years, one from each</text><text x="192" y="479.5" font-size="12.5" fill="#1f2937">of the 17 Jubilees</text><rect x="458" y="434" width="158" height="66" rx="9" fill="#fbecec" stroke="#e8b4b4"/><text x="537" y="463.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#991b1b">✗ Third year of the</text><text x="537" y="479.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#991b1b">Sabbatical cycle</text><rect x="24" y="506" width="150" height="66" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="34" y="535.5" font-size="12.5" font-weight="700" fill="#1f2937">Rabbi Yehuda,</text><text x="34" y="551.5" font-size="12.5" fill="#1f2937">as the Gemara answers</text><rect x="180" y="506" width="272" height="66" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="192" y="535.5" font-size="12.5" fill="#1f2937">The years from Sennacherib’s exile until</text><text x="192" y="551.5" font-size="12.5" fill="#1f2937">Jeremiah returned them are not counted</text><rect x="458" y="506" width="158" height="66" rx="9" fill="#e7f6ec" stroke="#9fd3b0"/><text x="537" y="535.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#166534">✓ Year after a</text><text x="537" y="551.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#166534">Sabbatical Year</text><text x="24" y="600" font-size="12" fill="#4b5563">Or, if you wish: the baraita follows the Rabbis, and its “likewise” for the Second Temple refers</text><text x="24" y="617" font-size="12" fill="#4b5563">only to the other details, the Ninth of Av and the conclusion of Shabbat.</text><text x="24" y="641" font-size="11.5" font-style="italic" fill="#6b7280">Rashi: 440 years from the entry to the building of the Temple, and 410 that it stood, make 850 = 17 × 50.</text>
</svg>
