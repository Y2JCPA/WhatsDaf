<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="600" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Penalties for a deliberate act</text>
  <text x="320" y="70" text-anchor="middle" font-size="14" fill="#4b5563">Two rulings of each side, set against each other</text>

  <!-- column headers -->
  <rect x="152" y="88" width="228" height="58" rx="10" fill="#dbe7f7"/>
  <text x="266" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a5f">Slitting a firstborn’s ear</text>
  <text x="266" y="133" text-anchor="middle" font-size="13" fill="#1e3a5f">Our mishna (34a)</text>
  <rect x="388" y="88" width="228" height="58" rx="10" fill="#dbe7f7"/>
  <text x="502" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a5f">Excising a <tspan font-style="italic">baheret</tspan></text>
  <text x="502" y="133" text-anchor="middle" font-size="13" fill="#1e3a5f">Nega’im 7:5 (34a–b)</text>

  <!-- Rabbi Eliezer row -->
  <rect x="24" y="154" width="120" height="118" rx="10" fill="#e8e2f4"/>
  <text x="84" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#3b2a63">Rabbi</text>
  <text x="84" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#3b2a63">Eliezer</text>
  <rect x="152" y="154" width="228" height="118" rx="10" fill="#ffffff" stroke="#c9d3e3"/>
  <text x="266" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#9a2a2a">He may never slaughter it</text>
  <text x="266" y="224" text-anchor="middle" font-size="13" fill="#374151">penalized forever</text>
  <rect x="388" y="154" width="228" height="118" rx="10" fill="#ffffff" stroke="#c9d3e3"/>
  <text x="502" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6b3a">Pure from it once</text>
  <text x="502" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6b3a">another mark develops</text>
  <text x="502" y="222" text-anchor="middle" font-size="12.5" fill="#374151">at once, or only once that mark</text>
  <text x="502" y="239" text-anchor="middle" font-size="12.5" fill="#374151">is pure? Rav Pappa’s question,</text>
  <text x="502" y="256" text-anchor="middle" font-size="12.5" fill="#374151">left unresolved (34b)</text>

  <!-- Rabbis row -->
  <rect x="24" y="280" width="120" height="118" rx="10" fill="#e8e2f4"/>
  <text x="84" y="344" text-anchor="middle" font-size="15" font-weight="700" fill="#3b2a63">The Rabbis</text>
  <rect x="152" y="280" width="228" height="118" rx="10" fill="#ffffff" stroke="#c9d3e3"/>
  <text x="266" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6b3a">He may slaughter it once</text>
  <text x="266" y="340" text-anchor="middle" font-size="14" font-weight="700" fill="#1f6b3a">another blemish develops</text>
  <text x="266" y="364" text-anchor="middle" font-size="12.5" fill="#374151">not on account of the one he made</text>
  <rect x="388" y="280" width="228" height="118" rx="10" fill="#ffffff" stroke="#c9d3e3"/>
  <text x="502" y="306" text-anchor="middle" font-size="14" font-weight="700" fill="#9a2a2a">Pure only if the new mark</text>
  <text x="502" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#9a2a2a">spreads over his whole body,</text>
  <text x="502" y="348" text-anchor="middle" font-size="12.5" fill="#374151">or if the <tspan font-style="italic">baheret</tspan> had shrunk</text>
  <text x="502" y="365" text-anchor="middle" font-size="12.5" fill="#374151">below a split bean before</text>
  <text x="502" y="382" text-anchor="middle" font-size="12.5" fill="#374151">he excised it</text>

  <!-- resolutions -->
  <rect x="24" y="414" width="592" height="78" rx="10" fill="#fff6e0" stroke="#e6c97a"/>
  <text x="40" y="440" font-size="14" font-weight="700" fill="#7a5a00">Rabba and Rav Yosef, on Rabbi Eliezer’s two rulings</text>
  <text x="40" y="461" font-size="13" fill="#374151">He penalizes in a man’s property, not in his body: with a firstborn he</text>
  <text x="40" y="479" font-size="13" fill="#374151">might come to blemish it; with his own body, would he come to excise it?</text>

  <rect x="24" y="502" width="592" height="78" rx="10" fill="#fff6e0" stroke="#e6c97a"/>
  <text x="40" y="528" font-size="14" font-weight="700" fill="#7a5a00">Rava, on the Rabbis’ two rulings</text>
  <text x="40" y="549" font-size="13" fill="#374151">They penalized him for what he did: the blemish he made will not permit</text>
  <text x="40" y="567" font-size="13" fill="#374151">the animal, and the excision he made will not render him pure.</text>
</svg>
