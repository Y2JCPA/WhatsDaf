<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 528" width="640" height="528" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="528" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Who brings what, by means</text>
  <text x="320" y="68" text-anchor="middle" font-size="14" fill="#4b5563">Keritot 10b: the two baraitot on the sliding-scale offering</text>
  <text x="38" y="100" font-size="12.5" font-weight="700" fill="#4b5563">Who</text>
  <text x="260" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4b5563">Wealth</text>
  <text x="400" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4b5563">Poverty</text>
  <text x="546" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4b5563">Extreme poverty</text>
  <rect x="24" y="112" width="592" height="120" rx="9" fill="#fff7e6" stroke="#f0cf8f"/>
  <text x="38" y="138" font-size="14" font-weight="600" fill="#1f2937">Woman after</text>
  <text x="38" y="155" font-size="14" font-weight="600" fill="#1f2937">childbirth</text>
  <rect x="196" y="120" width="128" height="76" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="260" y="153.5" text-anchor="middle" font-size="12.5" fill="#1f2937">Lamb (burnt)</text>
  <text x="260" y="170.5" text-anchor="middle" font-size="12.5" fill="#1f2937">Dove or pigeon (sin)</text>
  <rect x="336" y="120" width="128" height="76" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="400" y="153.5" text-anchor="middle" font-size="12.5" fill="#1f2937">Two doves or pigeons</text>
  <text x="400" y="170.5" text-anchor="middle" font-size="12.5" fill="#1f2937">(burnt + sin)</text>
  <rect x="476" y="120" width="140" height="76" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="546" y="154" text-anchor="middle" font-size="14" fill="#9ca3af">—</text>
  <text x="546" y="172" text-anchor="middle" font-size="11.5" fill="#6b7280" font-style="italic">two states only</text>
  <text x="196" y="216" font-size="12.5" font-weight="600" fill="#1e3a5f">One instead of one: a bird in place of the lamb</text>
  <rect x="24" y="242" width="592" height="120" rx="9" fill="#eef6ee" stroke="#a9d3ad"/>
  <text x="38" y="268" font-size="14" font-weight="600" fill="#1f2937">Leper</text>
  <rect x="196" y="250" width="128" height="76" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="260" y="275" text-anchor="middle" font-size="12.5" fill="#1f2937">Lamb (guilt)</text>
  <text x="260" y="292" text-anchor="middle" font-size="12.5" fill="#1f2937">Lamb (burnt)</text>
  <text x="260" y="309" text-anchor="middle" font-size="12.5" fill="#1f2937">Female lamb (sin)</text>
  <rect x="336" y="250" width="128" height="76" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="400" y="275" text-anchor="middle" font-size="12.5" fill="#1f2937">Lamb (guilt)</text>
  <text x="400" y="292" text-anchor="middle" font-size="12.5" fill="#1f2937">Two doves or pigeons</text>
  <text x="400" y="309" text-anchor="middle" font-size="12.5" fill="#1f2937">(sin + burnt)</text>
  <rect x="476" y="250" width="140" height="76" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="546" y="284" text-anchor="middle" font-size="14" fill="#9ca3af">—</text>
  <text x="546" y="302" text-anchor="middle" font-size="11.5" fill="#6b7280" font-style="italic">two states only</text>
  <text x="196" y="346" font-size="12.5" font-weight="600" fill="#1e3a5f">Two instead of two: two birds in place of two lambs</text>
  <rect x="24" y="372" width="592" height="136" rx="9" fill="#f1ecf8" stroke="#c7b6e3"/>
  <text x="38" y="390" font-size="14" font-weight="600" fill="#1f2937">Hearing the voice,</text>
  <text x="38" y="407" font-size="14" font-weight="600" fill="#1f2937">utterance of the lips,</text>
  <text x="38" y="424" font-size="14" font-weight="600" fill="#1f2937">defiling the Temple</text>
  <text x="38" y="441" font-size="14" font-weight="600" fill="#1f2937">or its sacred foods</text>
  <rect x="196" y="380" width="128" height="76" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="260" y="413.5" text-anchor="middle" font-size="12.5" fill="#1f2937">Female lamb or goat</text>
  <text x="260" y="430.5" text-anchor="middle" font-size="12.5" fill="#1f2937">(sin)</text>
  <rect x="336" y="380" width="128" height="76" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="400" y="413.5" text-anchor="middle" font-size="12.5" fill="#1f2937">Two doves or pigeons</text>
  <text x="400" y="430.5" text-anchor="middle" font-size="12.5" fill="#1f2937">(sin + burnt)</text>
  <rect x="476" y="380" width="140" height="76" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="546" y="413.5" text-anchor="middle" font-size="12.5" fill="#1f2937">Meal offering:</text>
  <text x="546" y="430.5" text-anchor="middle" font-size="12.5" fill="#1f2937">a tenth of an ephah</text>
  <text x="196" y="476" font-size="12.5" font-weight="600" fill="#1e3a5f">Two instead of one: two birds in place of the female lamb</text>
  <text x="196" y="495" font-size="12.5" font-weight="600" fill="#1e3a5f">One instead of two: a tenth of an ephah in place of two birds</text>
</svg>
