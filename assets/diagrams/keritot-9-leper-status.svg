<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 452" width="640" height="452" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<rect x="0" y="0" width="640" height="452" rx="18" fill="#f3f6fb"/>
<text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">When is the leper’s poverty or wealth fixed?</text>
<text x="320" y="70" text-anchor="middle" font-size="13.5" font-style="italic" fill="#4b5563">“Whose means do not suffice for that which pertains to his purification” (Leviticus 14:32)</text>
<text x="48" y="104" font-size="12" font-weight="700" fill="#6b7280">WHO SAYS</text>
<text x="236" y="104" font-size="12" font-weight="700" fill="#6b7280">ALL FOLLOWS HIS STATUS WHEN HE BRINGS…</text>
<rect x="32" y="116" width="576" height="94" rx="10" fill="#ffffff" stroke="#e0c48a"/>
<text x="48" y="146" font-size="15" font-weight="700" fill="#1f2937">Rabbi Shimon</text>
<text x="48" y="168" font-size="12" fill="#6b7280">and the mishna, as the</text>
<text x="48" y="184" font-size="12" fill="#6b7280">Gemara completes it</text>
<text x="236" y="146" font-size="16" font-weight="700" fill="#7a5a12">his sin offering</text>
<text x="236" y="170" font-size="12.5" fill="#374151">“his purification”: the matter that atones for him</text>
<text x="236" y="190" font-size="12" fill="#6b7280">Rashi: afflictions come on account of seven things (Arakhin 16a)</text>
<rect x="32" y="220" width="576" height="94" rx="10" fill="#ffffff" stroke="#9fb3d9"/>
<text x="48" y="250" font-size="15" font-weight="700" fill="#1f2937">Rabbi Yehuda</text>
<text x="236" y="250" font-size="16" font-weight="700" fill="#1e3a8a">his guilt offering</text>
<text x="236" y="274" font-size="12.5" fill="#374151">“his purification”: the matter that renders him fit</text>
<text x="236" y="294" font-size="12" fill="#6b7280">to eat sacrificial meat; Rashi: its blood is placed on his thumbs</text>
<rect x="32" y="324" width="576" height="94" rx="10" fill="#ffffff" stroke="#7cbf8a"/>
<text x="48" y="354" font-size="15" font-weight="700" fill="#1f2937">Rabbi Eliezer</text>
<text x="48" y="374" font-size="15" font-weight="700" fill="#1f2937">ben Ya’akov</text>
<text x="236" y="354" font-size="16" font-weight="700" fill="#1d5e2c">the two birds</text>
<text x="236" y="378" font-size="12.5" fill="#374151">“his purification”: the matter that causes him purity</text>
<text x="236" y="398" font-size="12" fill="#6b7280">Rashi: the blood of the bird is sprinkled on him</text>
<text x="320" y="440" text-anchor="middle" font-size="12.5" fill="#4b5563">Rav Yehuda in the name of Rav: all three interpreted the same verse.</text>
</svg>
