<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 658" width="640" height="658" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="658" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Ten trials in the wilderness</text>
  <text x="320" y="70" text-anchor="middle" font-size="14" font-weight="400" fill="#4b5563">Rabbi Yehuda’s baraita, with the verses the Gemara cites (15a–b)</text>
  <rect x="24" y="96" width="128" height="72" rx="10" fill="#e8eefc" stroke="#9fb3e0"/>
  <text x="88" y="127" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">At the sea</text>
  <text x="88" y="148" text-anchor="middle" font-size="13" font-weight="400" fill="#1e3a8a">two</text>
  <rect x="162" y="96" width="222" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="273" y="118" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937">Going down into the sea</text>
  <text x="273" y="138" text-anchor="middle" font-size="12" font-weight="400" fill="#4b5563">“Because there were no graves</text>
  <text x="273" y="156" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">in Egypt” · Exodus 14:11</text>
  <rect x="394" y="96" width="222" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="505" y="118" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937">Coming up out of the sea</text>
  <text x="505" y="138" text-anchor="middle" font-size="12" font-weight="400" fill="#4b5563">“They were rebellious at the sea”</text>
  <text x="505" y="156" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">Psalms 106:7 (Rabba bar Mari)</text>
  <rect x="24" y="178" width="128" height="72" rx="10" fill="#e8eefc" stroke="#9fb3e0"/>
  <text x="88" y="209" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">With water</text>
  <text x="88" y="230" text-anchor="middle" font-size="13" font-weight="400" fill="#1e3a8a">two</text>
  <rect x="162" y="178" width="222" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="273" y="200" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937">At Mara</text>
  <text x="273" y="220" text-anchor="middle" font-size="12" font-weight="400" fill="#4b5563">“And the people murmured</text>
  <text x="273" y="238" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">against Moses” · Exodus 15:24</text>
  <rect x="394" y="178" width="222" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="505" y="200" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937">At Rephidim</text>
  <text x="505" y="220" text-anchor="middle" font-size="12" font-weight="400" fill="#4b5563">“And the people fought</text>
  <text x="505" y="238" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">with Moses” · Exodus 17:2</text>
  <rect x="24" y="260" width="128" height="72" rx="10" fill="#e8eefc" stroke="#9fb3e0"/>
  <text x="88" y="291" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">With the manna</text>
  <text x="88" y="312" text-anchor="middle" font-size="13" font-weight="400" fill="#1e3a8a">two</text>
  <rect x="162" y="260" width="222" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="273" y="282" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937">“Do not go out”</text>
  <text x="273" y="302" text-anchor="middle" font-size="12" font-weight="400" fill="#4b5563">and some went out on</text>
  <text x="273" y="320" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">the seventh day · Exodus 16:25–27</text>
  <rect x="394" y="260" width="222" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="505" y="282" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937">“Let no man leave any of it”</text>
  <text x="505" y="302" text-anchor="middle" font-size="12" font-weight="400" fill="#4b5563">and some left it until morning</text>
  <text x="505" y="320" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">Exodus 16:19–20</text>
  <rect x="24" y="342" width="128" height="72" rx="10" fill="#e8eefc" stroke="#9fb3e0"/>
  <text x="88" y="373" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">With the quail</text>
  <text x="88" y="394" text-anchor="middle" font-size="13" font-weight="400" fill="#1e3a8a">two</text>
  <rect x="162" y="342" width="222" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="273" y="364" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937">The first quail</text>
  <text x="273" y="384" text-anchor="middle" font-size="12" font-weight="400" fill="#4b5563">“When we sat by the meat pots”</text>
  <text x="273" y="402" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">Exodus 16:3</text>
  <rect x="394" y="342" width="222" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="505" y="364" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937">The second quail</text>
  <text x="505" y="384" text-anchor="middle" font-size="12" font-weight="400" fill="#4b5563">“And the mixed multitude</text>
  <text x="505" y="402" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">that was among them” · Numbers 11:4</text>
  <rect x="24" y="424" width="128" height="72" rx="10" fill="#e8eefc" stroke="#9fb3e0"/>
  <text x="88" y="455" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">The calf</text>
  <text x="88" y="476" text-anchor="middle" font-size="13" font-weight="400" fill="#1e3a8a">one</text>
  <rect x="162" y="424" width="454" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="389" y="446" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937">The golden calf</text>
  <text x="389" y="466" text-anchor="middle" font-size="12" font-weight="400" fill="#4b5563">as it is described in the Torah</text>
  <text x="389" y="484" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">Exodus, chapter 32</text>
  <rect x="24" y="506" width="128" height="72" rx="10" fill="#fde8e8" stroke="#e0a3a3"/>
  <text x="88" y="537" text-anchor="middle" font-size="14" font-weight="700" fill="#8b1d1d">Paran</text>
  <text x="88" y="558" text-anchor="middle" font-size="13" font-weight="400" fill="#8b1d1d">one</text>
  <rect x="162" y="506" width="454" height="72" rx="10" fill="#fff5f5" stroke="#e0a3a3"/>
  <text x="389" y="528" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937">The spies, in the wilderness of Paran</text>
  <text x="389" y="548" text-anchor="middle" font-size="12" font-weight="400" fill="#4b5563">as it is described in the Torah (Numbers, chapter 13);</text>
  <text x="389" y="566" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">over this one the sentence was sealed (Reish Lakish)</text>
  <rect x="24" y="588" width="592" height="46" rx="10" fill="#e1f3e5" stroke="#7cbf8a"/>
  <text x="320" y="608" text-anchor="middle" font-size="15" font-weight="700" fill="#1d5e2c">Total: ten</text>
  <text x="320" y="626" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1d5e2c">“Yet they have tried Me these ten times” · Numbers 14:22</text>
</svg>
