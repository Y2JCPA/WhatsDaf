<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 514" width="640" height="514" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="514" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Why the priests had to be named</text>
  <text x="320" y="68" text-anchor="middle" font-size="14" fill="#4b5563">“Everyone is obligated… priests, Levites and Israelites.” Isn’t that obvious?</text>
  <text x="80" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">Mitzva</text>
  <text x="156" y="104" font-size="13" font-weight="700" fill="#374151">Why priests might be exempt</text>
  <text x="398" y="104" font-size="13" font-weight="700" fill="#374151">Why they are obligated</text>
  <rect x="24" y="116" width="112" height="84" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="80" y="163" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Sukka</text>
  <rect x="146" y="116" width="232" height="84" rx="9" fill="#fff3d6" stroke="#e0b450"/>
  <text x="156" y="138" font-size="12.5" fill="#7a5200">“Reside as you dwell”: a man and his</text>
  <text x="156" y="154" font-size="12.5" fill="#7a5200">wife together, and priests are busy</text>
  <text x="156" y="170" font-size="12.5" fill="#7a5200">with the Festival service.</text>
  <rect x="388" y="116" width="228" height="84" rx="9" fill="#e1f3e5" stroke="#7cbf8a"/>
  <text x="398" y="138" font-size="12.5" fill="#1d5e2c">Exempt only during the service,</text>
  <text x="398" y="154" font-size="12.5" fill="#1d5e2c">obligated otherwise, like</text>
  <text x="398" y="170" font-size="12.5" fill="#1d5e2c">travelers: exempt by day, obligated</text>
  <text x="398" y="186" font-size="12.5" fill="#1d5e2c">at night.</text>
  <rect x="24" y="208" width="112" height="68" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="80" y="247" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Ritual fringes</text>
  <rect x="146" y="208" width="232" height="68" rx="9" fill="#fff3d6" stroke="#e0b450"/>
  <text x="156" y="230" font-size="12.5" fill="#7a5200">Only one forbidden to wear diverse</text>
  <text x="156" y="246" font-size="12.5" fill="#7a5200">kinds is obligated, and priests wear</text>
  <text x="156" y="262" font-size="12.5" fill="#7a5200">them (the belt) in the service.</text>
  <rect x="388" y="208" width="228" height="68" rx="9" fill="#e1f3e5" stroke="#7cbf8a"/>
  <text x="398" y="230" font-size="12.5" fill="#1d5e2c">Diverse kinds are permitted to them</text>
  <text x="398" y="246" font-size="12.5" fill="#1d5e2c">only during the service.</text>
  <rect x="24" y="284" width="112" height="68" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="80" y="323" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Phylacteries</text>
  <rect x="146" y="284" width="232" height="68" rx="9" fill="#fff3d6" stroke="#e0b450"/>
  <text x="156" y="306" font-size="12.5" fill="#7a5200">Arm and head are juxtaposed, and</text>
  <text x="156" y="322" font-size="12.5" fill="#7a5200">priests may not wear the arm ones:</text>
  <text x="156" y="338" font-size="12.5" fill="#7a5200">“upon his flesh”.</text>
  <rect x="388" y="284" width="228" height="68" rx="9" fill="#e1f3e5" stroke="#7cbf8a"/>
  <text x="398" y="306" font-size="12.5" fill="#1d5e2c">One does not prevent the other. The</text>
  <text x="398" y="322" font-size="12.5" fill="#1d5e2c">head ones go where the hair shows,</text>
  <text x="398" y="338" font-size="12.5" fill="#1d5e2c">between frontplate and mitre.</text>
  <rect x="24" y="360" width="112" height="132" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="80" y="431" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Shofar</text>
  <rect x="146" y="360" width="232" height="132" rx="9" fill="#fff3d6" stroke="#e0b450"/>
  <text x="156" y="382" font-size="12.5" fill="#7a5200">1. They sound all year. Rejected:</text>
  <text x="156" y="398" font-size="12.5" fill="#7a5200">those are trumpets, not a shofar.</text>
  <text x="156" y="430" font-size="12.5" fill="#7a5200">2. Yom Kippur of the Jubilee is like</text>
  <text x="156" y="446" font-size="12.5" fill="#7a5200">Rosh HaShana, and priests are not</text>
  <text x="156" y="462" font-size="12.5" fill="#7a5200">fully in the Jubilee: they sell at</text>
  <text x="156" y="478" font-size="12.5" fill="#7a5200">any time.</text>
  <rect x="388" y="360" width="228" height="132" rx="9" fill="#eef0f3" stroke="#c3c8d0"/>
  <text x="398" y="382" font-size="12.5" fill="#4b5563" font-style="italic">Continued on 4a.</text>
</svg>
