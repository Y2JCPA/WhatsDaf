<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>Three kinds of garav</title>
  <rect width="640" height="400" rx="18" fill="#fbf6ea"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#3b2f1e">Three kinds of garav</text>
  <rect x="32" y="60" width="14" height="14" rx="3" fill="#c9a46a"/><text x="52" y="72" font-size="14" fill="#6b5b45">dry</text>
  <rect x="96" y="60" width="14" height="14" rx="3" fill="#6fa8dc"/><text x="116" y="72" font-size="14" fill="#6b5b45">moist</text>
  <text x="176" y="72" font-size="14" fill="#6b5b45">· outer ring = outside, centre = inside</text>
  <rect x="22" y="92" width="190" height="288" rx="14" fill="#fff" stroke="#e7dcc4"/>
  <text x="117" y="122" font-size="16" font-weight="700" text-anchor="middle" fill="#3b2f1e">The Torah’s garav</text>
  <text x="117" y="142" font-size="11.5" text-anchor="middle" fill="#8a7a5e">Leviticus 22:22 · “ḥeres”</text>
  <circle cx="117" cy="220" r="58" fill="#c9a46a"/><circle cx="117" cy="220" r="30" fill="#c9a46a" stroke="#fff" stroke-width="3"/>
  <text x="117" y="304" font-size="13" text-anchor="middle" fill="#5a4a32">outside dry · inside dry</text>
  <text x="117" y="334" font-size="16" font-weight="700" text-anchor="middle" fill="#c0392b">Never heals</text>
  <text x="117" y="358" font-size="13" text-anchor="middle" fill="#5a4a32">A full blemish</text>
  <rect x="224" y="92" width="190" height="288" rx="14" fill="#fff" stroke="#e7dcc4"/>
  <text x="319" y="122" font-size="16" font-weight="700" text-anchor="middle" fill="#3b2f1e">The mishna’s garav</text>
  <text x="319" y="142" font-size="11.5" text-anchor="middle" fill="#8a7a5e">Bekhorot 41a</text>
  <circle cx="319" cy="220" r="58" fill="#6fa8dc"/><circle cx="319" cy="220" r="30" fill="#6fa8dc" stroke="#fff" stroke-width="3"/>
  <text x="319" y="304" font-size="13" text-anchor="middle" fill="#5a4a32">outside moist · inside moist</text>
  <text x="319" y="334" font-size="16" font-weight="700" text-anchor="middle" fill="#2e7d32">Heals</text>
  <text x="319" y="358" font-size="13" text-anchor="middle" fill="#5a4a32">Not a full blemish</text>
  <rect x="426" y="92" width="190" height="288" rx="14" fill="#fff" stroke="#e7dcc4"/>
  <text x="521" y="122" font-size="16" font-weight="700" text-anchor="middle" fill="#3b2f1e">Egypt’s garav</text>
  <text x="521" y="142" font-size="11.5" text-anchor="middle" fill="#8a7a5e">Deuteronomy 28:27 · Exodus 9:10</text>
  <circle cx="521" cy="220" r="58" fill="#6fa8dc"/><circle cx="521" cy="220" r="30" fill="#c9a46a" stroke="#fff" stroke-width="3"/>
  <text x="521" y="304" font-size="13" text-anchor="middle" fill="#5a4a32">outside moist · inside dry</text>
  <text x="521" y="334" font-size="16" font-weight="700" text-anchor="middle" fill="#c0392b">Never heals</text>
  <text x="521" y="358" font-size="13" text-anchor="middle" fill="#5a4a32">Would be a full blemish</text>
</svg>
