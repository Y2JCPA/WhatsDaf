<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>Rava: five words for eye blemishes</title>
  <rect width="640" height="470" rx="18" fill="#f3f6fb"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1f2d3d">Rava: five words, five kinds of eye blemish</text>
  <text x="32" y="68" font-size="13.5" fill="#5b6b7d">Leviticus 21:18, 20. Each word covers a case the word before it would leave out.</text>
  <text x="44" y="100" font-size="12" font-weight="700" fill="#5b6b7d" letter-spacing=".5">WORD IN THE VERSE</text>
  <text x="250" y="100" font-size="12" font-weight="700" fill="#5b6b7d" letter-spacing=".5">WHAT IT COVERS</text>

  <rect x="24" y="110" width="592" height="62" rx="12" fill="#fff" stroke="#d7e0ec"/>
  <text x="44" y="138" font-size="17" font-weight="700" fill="#1f2d3d">“Blind”</text>
  <text x="44" y="158" font-size="13" fill="#7a8899">iver · עִוֵּר</text>
  <text x="250" y="138" font-size="15" font-weight="600" fill="#1f2d3d">Eyes not there at all</text>
  <text x="250" y="158" font-size="13" fill="#5b6b7d">The plain meaning of the word</text>

  <rect x="24" y="180" width="592" height="62" rx="12" fill="#fff" stroke="#d7e0ec"/>
  <text x="44" y="208" font-size="17" font-weight="700" fill="#1f2d3d">“Man”</text>
  <text x="44" y="228" font-size="13" fill="#7a8899">ish · אִישׁ</text>
  <text x="250" y="208" font-size="15" font-weight="600" fill="#1f2d3d">Dimness: eyes there, but he cannot see</text>
  <text x="250" y="228" font-size="13" fill="#5b6b7d">Constant pale spots or constant tears</text>

  <rect x="24" y="250" width="592" height="62" rx="12" fill="#fff" stroke="#d7e0ec"/>
  <text x="44" y="278" font-size="17" font-weight="700" fill="#1f2d3d">“Cataract”</text>
  <text x="44" y="298" font-size="13" fill="#7a8899">dak · דַּק</text>
  <text x="250" y="278" font-size="15" font-weight="600" fill="#1f2d3d">Impairment: he sees, but less</text>
  <text x="250" y="298" font-size="13" fill="#5b6b7d">Sight diminished, not lost</text>

  <rect x="24" y="320" width="592" height="62" rx="12" fill="#fff" stroke="#d7e0ec"/>
  <text x="44" y="348" font-size="17" font-weight="700" fill="#1f2d3d">“Tevallul”</text>
  <text x="44" y="368" font-size="13" fill="#7a8899">תְּבַלּוּל</text>
  <text x="250" y="348" font-size="15" font-weight="600" fill="#1f2d3d">Intermingling: the white runs into the black</text>
  <text x="250" y="368" font-size="13" fill="#5b6b7d">Even when his sight is not reduced</text>

  <rect x="24" y="390" width="592" height="62" rx="12" fill="#fff" stroke="#d7e0ec"/>
  <text x="44" y="418" font-size="17" font-weight="700" fill="#1f2d3d">“In his eye”</text>
  <text x="44" y="438" font-size="13" fill="#7a8899">be’eino · בְּעֵינוֹ</text>
  <text x="250" y="418" font-size="15" font-weight="600" fill="#1f2d3d">Deviations from the usual look</text>
  <text x="250" y="438" font-size="13" fill="#5b6b7d">Eyes set high, low, or one of each</text>
</svg>
