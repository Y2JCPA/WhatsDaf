<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 690" width="640" height="690" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="690" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2a3a">How severe is the dust of the Sabbatical Year</text>
  <text x="320" y="70" text-anchor="middle" font-size="14" fill="#55627a">Rabbi Yosei son of Rabbi Ḥanina reads the order of Leviticus 25 (30b)</text>

  <!-- start -->
  <rect x="120" y="88" width="400" height="40" rx="12" fill="#fbe3e3"/>
  <text x="320" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#9b2c2c">He trades in Sabbatical-Year produce</text>

  <!-- step 1 -->
  <line x1="320" y1="128" x2="320" y2="142" stroke="#9aa8bf" stroke-width="2"/>
  <rect x="24" y="142" width="592" height="52" rx="12" fill="#ffffff" stroke="#c9d3e3"/>
  <text x="40" y="164" font-size="14" font-weight="700" fill="#1f2a3a">1. He sells his movable property</text>
  <text x="40" y="184" font-size="12" fill="#55627a">Lev. 25:13–14: the Jubilee, then “if you sell something… from your neighbor’s hand”</text>
  <text x="320" y="214" text-anchor="middle" font-size="12" font-style="italic" fill="#2e5aa8">he does not feel remorse</text>

  <!-- step 2 -->
  <rect x="24" y="224" width="592" height="52" rx="12" fill="#ffffff" stroke="#c9d3e3"/>
  <text x="40" y="246" font-size="14" font-weight="700" fill="#1f2a3a">2. He sells his fields</text>
  <text x="40" y="266" font-size="12" fill="#55627a">Lev. 25:25: “If your brother becomes poor and sells part of his ancestral land”</text>
  <text x="320" y="296" text-anchor="middle" font-size="12" font-style="italic" fill="#2e5aa8">consciousness of his sins does not come to him</text>

  <!-- step 3 -->
  <rect x="24" y="306" width="592" height="52" rx="12" fill="#ffffff" stroke="#c9d3e3"/>
  <text x="40" y="328" font-size="14" font-weight="700" fill="#1f2a3a">3. He sells his house</text>
  <text x="40" y="348" font-size="12" fill="#55627a">Lev. 25:29: “And if a man sells a dwelling house in a walled city”</text>
  <text x="320" y="378" text-anchor="middle" font-size="12" font-style="italic" fill="#2e5aa8">consciousness of his sins does not come to him</text>

  <!-- step 4 -->
  <rect x="24" y="388" width="592" height="70" rx="12" fill="#ffffff" stroke="#c9d3e3"/>
  <text x="40" y="410" font-size="14" font-weight="700" fill="#1f2a3a">4. He borrows with interest</text>
  <text x="40" y="430" font-size="12" fill="#55627a">Lev. 25:35–36: “If your brother becomes poor…”, then “You shall take no interest”</text>
  <text x="40" y="448" font-size="12" fill="#55627a">Before this he has sold his daughter (Ex. 21:7): her redemption decreases, interest increases</text>
  <text x="320" y="478" text-anchor="middle" font-size="12" font-style="italic" fill="#2e5aa8">consciousness of his sins does not come to him</text>

  <!-- step 5 -->
  <rect x="24" y="488" width="592" height="120" rx="12" fill="#ffffff" stroke="#c9d3e3"/>
  <text x="40" y="510" font-size="14" font-weight="700" fill="#1f2a3a">5. He sells himself</text>
  <text x="40" y="530" font-size="12" fill="#55627a">Lev. 25:39 and 25:47: not only to you, but even…</text>
  <rect x="40" y="542" width="104" height="52" rx="8" fill="#eef2f8"/>
  <text x="92" y="565" text-anchor="middle" font-size="12" fill="#1f2a3a">to you,</text>
  <text x="92" y="582" text-anchor="middle" font-size="12" fill="#1f2a3a">a born Jew</text>
  <rect x="152" y="542" width="104" height="52" rx="8" fill="#eef2f8"/>
  <text x="204" y="565" text-anchor="middle" font-size="12" fill="#1f2a3a">to a stranger</text>
  <text x="204" y="582" text-anchor="middle" font-size="12" fill="#1f2a3a">(a convert)</text>
  <rect x="264" y="542" width="104" height="52" rx="8" fill="#eef2f8"/>
  <text x="316" y="565" text-anchor="middle" font-size="12" fill="#1f2a3a">to a</text>
  <text x="316" y="582" text-anchor="middle" font-size="12" font-style="italic" fill="#1f2a3a">ger toshav</text>
  <rect x="376" y="542" width="104" height="52" rx="8" fill="#eef2f8"/>
  <text x="428" y="565" text-anchor="middle" font-size="12" fill="#1f2a3a">to a stranger’s</text>
  <text x="428" y="582" text-anchor="middle" font-size="12" fill="#1f2a3a">family: a gentile</text>
  <rect x="488" y="542" width="112" height="52" rx="8" fill="#fbe3e3"/>
  <text x="544" y="565" text-anchor="middle" font-size="12" fill="#9b2c2c"><tspan font-style="italic">le’eker</tspan>: a servant</text>
  <text x="544" y="582" text-anchor="middle" font-size="12" fill="#9b2c2c">to idol worship</text>

  <!-- Rav Huna -->
  <rect x="24" y="620" width="592" height="54" rx="12" fill="#fff7e6" stroke="#e8c98a"/>
  <text x="40" y="642" font-size="12" fill="#1f2a3a"><tspan font-weight="700">Why the wording changes after the first step:</tspan> Rav Huna: once a person commits</text>
  <text x="40" y="660" font-size="12" fill="#1f2a3a">a transgression and repeats it, it becomes to him as though it were permitted.</text>
</svg>
