<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 544" width="640" height="544" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>What did Rabbi Akiva ask?</title>
  <rect width="640" height="544" rx="18" fill="#f3f6fb"/>
  <text x="24" y="44" font-size="22" font-weight="700" fill="#1f2a3a">What did Rabbi Akiva ask?</text>
  <text x="24" y="68" font-size="13" fill="#5a6678">Keritot 16a–b: many labors on many Shabbatot, read three ways</text>
  <text x="268" y="100" font-size="14" font-weight="700" fill="#1f2a3a" text-anchor="middle">Rabba</text>
  <text x="410" y="100" font-size="14" font-weight="700" fill="#1f2a3a" text-anchor="middle">Abaye</text>
  <text x="552" y="100" font-size="14" font-weight="700" fill="#1f2a3a" text-anchor="middle">Rav Ḥisda</text>
  <rect x="20" y="112" width="172" height="92" rx="12" fill="#fff" stroke="#d5deea"/>
  <text x="32" y="134" font-size="13" font-weight="700" fill="#1f2a3a">Unaware it was</text>
  <text x="32" y="150" font-size="13" font-weight="700" fill="#1f2a3a">Shabbat, knew</text>
  <text x="32" y="166" font-size="13" font-weight="700" fill="#1f2a3a">the labors</text>
  <text x="32" y="184" font-size="11.5" fill="#5a6678">Do the days between</text>
  <text x="32" y="198" font-size="11.5" fill="#5a6678">count as awareness?</text>
  <rect x="200" y="112" width="136" height="92" rx="12" fill="#e8eef8" stroke="#9fb3d1"/>
  <text x="268" y="146" font-size="12.5" font-weight="700" fill="#3b5b8c" text-anchor="middle">Obvious to him</text>
  <text x="268" y="162" font-size="12" fill="#1f2a3a" text-anchor="middle">the days count</text>
  <text x="268" y="178" font-size="12" fill="#1f2a3a" text-anchor="middle">as awareness</text>
  <rect x="342" y="112" width="136" height="92" rx="12" fill="#e6f4ea" stroke="#8cc79b"/>
  <text x="410" y="146" font-size="12.5" font-weight="700" fill="#2e7d32" text-anchor="middle">His dilemma</text>
  <text x="410" y="162" font-size="12" fill="#1f2a3a" text-anchor="middle">Eliezer: they count</text>
  <text x="410" y="178" font-size="12" fill="#1f2a3a" text-anchor="middle">Akiva accepted</text>
  <rect x="484" y="112" width="136" height="92" rx="12" fill="#e6f4ea" stroke="#8cc79b"/>
  <text x="552" y="146" font-size="12.5" font-weight="700" fill="#2e7d32" text-anchor="middle">His dilemma</text>
  <text x="552" y="162" font-size="12" fill="#1f2a3a" text-anchor="middle">Eliezer: they count</text>
  <text x="552" y="178" font-size="12" fill="#1f2a3a" text-anchor="middle">Akiva accepted</text>
  <rect x="20" y="212" width="172" height="92" rx="12" fill="#fff" stroke="#d5deea"/>
  <text x="32" y="234" font-size="13" font-weight="700" fill="#1f2a3a">Knew it was</text>
  <text x="32" y="250" font-size="13" font-weight="700" fill="#1f2a3a">Shabbat, unaware</text>
  <text x="32" y="266" font-size="13" font-weight="700" fill="#1f2a3a">of the labors</text>
  <text x="32" y="284" font-size="11.5" fill="#5a6678">Are Shabbatot like</text>
  <text x="32" y="298" font-size="11.5" fill="#5a6678">separate entities?</text>
  <rect x="200" y="212" width="136" height="92" rx="12" fill="#fdecea" stroke="#e3a19a"/>
  <text x="268" y="246" font-size="12.5" font-weight="700" fill="#b23b2e" text-anchor="middle">His dilemma</text>
  <text x="268" y="262" font-size="12" fill="#1f2a3a" text-anchor="middle">Eliezer: separate</text>
  <text x="268" y="278" font-size="12" fill="#1f2a3a" text-anchor="middle">Akiva did not accept</text>
  <rect x="342" y="212" width="136" height="92" rx="12" fill="#e8eef8" stroke="#9fb3d1"/>
  <text x="410" y="246" font-size="12.5" font-weight="700" fill="#3b5b8c" text-anchor="middle">Obvious to him</text>
  <text x="410" y="262" font-size="12" fill="#1f2a3a" text-anchor="middle">not separate</text>
  <text x="410" y="278" font-size="12" fill="#1f2a3a" text-anchor="middle">entities</text>
  <rect x="484" y="212" width="136" height="92" rx="12" fill="#e8eef8" stroke="#9fb3d1"/>
  <text x="552" y="254" font-size="12.5" font-weight="700" fill="#3b5b8c" text-anchor="middle">Obvious, even to him</text>
  <text x="552" y="270" font-size="12" fill="#1f2a3a" text-anchor="middle">separate entities</text>
  <rect x="20" y="312" width="172" height="92" rx="12" fill="#fff" stroke="#d5deea"/>
  <text x="32" y="334" font-size="13" font-weight="700" fill="#1f2a3a">Subcategories of</text>
  <text x="32" y="350" font-size="13" font-weight="700" fill="#1f2a3a">one primary labor</text>
  <text x="32" y="368" font-size="11.5" fill="#5a6678">Like primary</text>
  <text x="32" y="382" font-size="11.5" fill="#5a6678">categories?</text>
  <rect x="200" y="312" width="136" height="92" rx="12" fill="#fdecea" stroke="#e3a19a"/>
  <text x="268" y="354" font-size="12.5" font-weight="700" fill="#b23b2e" text-anchor="middle">Eliezer: they are</text>
  <text x="268" y="370" font-size="12" fill="#1f2a3a" text-anchor="middle">Akiva did not accept</text>
  <rect x="342" y="312" width="136" height="92" rx="12" fill="#fdecea" stroke="#e3a19a"/>
  <text x="410" y="354" font-size="12.5" font-weight="700" fill="#b23b2e" text-anchor="middle">Eliezer: they are</text>
  <text x="410" y="370" font-size="12" fill="#1f2a3a" text-anchor="middle">Akiva did not accept</text>
  <rect x="484" y="312" width="136" height="92" rx="12" fill="#fdecea" stroke="#e3a19a"/>
  <text x="552" y="354" font-size="12.5" font-weight="700" fill="#b23b2e" text-anchor="middle">Eliezer: they are</text>
  <text x="552" y="370" font-size="12" fill="#1f2a3a" text-anchor="middle">Akiva did not accept</text>
  <rect x="20" y="412" width="172" height="76" rx="12" fill="#fff" stroke="#d5deea"/>
  <text x="32" y="434" font-size="13" font-weight="700" fill="#1f2a3a">Proof</text>
  <rect x="200" y="412" width="136" height="76" rx="12" fill="#ffffff" stroke="#d5deea"/>
  <text x="268" y="446" font-size="12.5" font-weight="700" fill="#1f2a3a" text-anchor="middle">The mishna,</text>
  <text x="268" y="462" font-size="12" fill="#1f2a3a" text-anchor="middle">Shabbat 67b</text>
  <rect x="342" y="412" width="136" height="76" rx="12" fill="#ffffff" stroke="#d5deea"/>
  <text x="410" y="454" font-size="12.5" font-weight="700" fill="#1f2a3a" text-anchor="middle">The same mishna</text>
  <rect x="484" y="412" width="136" height="76" rx="12" fill="#ffffff" stroke="#d5deea"/>
  <text x="552" y="438" font-size="12.5" font-weight="700" fill="#1f2a3a" text-anchor="middle">The same mishna;</text>
  <text x="552" y="454" font-size="12" fill="#1f2a3a" text-anchor="middle">two baraitot on</text>
  <text x="552" y="470" font-size="12" fill="#1f2a3a" text-anchor="middle">writing two letters</text>
  <rect x="24" y="503" width="14" height="14" rx="4" fill="#e8eef8" stroke="#9fb3d1"/>
  <text x="44" y="514" font-size="12" fill="#5a6678">Obvious to Rabbi Akiva</text>
  <rect x="198.8" y="503" width="14" height="14" rx="4" fill="#e6f4ea" stroke="#8cc79b"/>
  <text x="218.8" y="514" font-size="12" fill="#5a6678">Asked; he accepted</text>
  <rect x="348" y="503" width="14" height="14" rx="4" fill="#fdecea" stroke="#e3a19a"/>
  <text x="368" y="514" font-size="12" fill="#5a6678">He did not accept</text>
</svg>
