<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 694" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>Gestation and the trees</title>
  <rect width="640" height="694" rx="18" fill="#f3f6fb"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1f2d3d">Gestation, and the tree that matches it</text>
  <text x="32" y="68" font-size="14" fill="#5b6b7d">The baraita on 8a, in its own order</text>
  <text x="36" y="100" font-size="12.5" font-weight="700" fill="#5b6b7d" letter-spacing="0.5">CREATURE</text>
  <text x="345" y="100" font-size="12.5" font-weight="700" fill="#5b6b7d" letter-spacing="0.5">CARRIES</text>
  <text x="440" y="100" font-size="12.5" font-weight="700" fill="#5b6b7d" letter-spacing="0.5">TREE</text>
  <rect x="24" y="112" width="592" height="34" rx="8" fill="#e8eef6"/><text x="36" y="134" font-size="14" fill="#1f2d3d" font-weight="600">Chicken</text><text x="345" y="134" font-size="14" fill="#1f2d3d">21 days</text><text x="440" y="134" font-size="14" fill="#1f2d3d" font-weight="600">Almond (luz)</text><rect x="24" y="150" width="592" height="34" rx="8" fill="#ffffff"/><text x="36" y="172" font-size="14" fill="#1f2d3d" font-weight="600">Dog</text><text x="345" y="172" font-size="14" fill="#1f2d3d">50 days</text><text x="440" y="172" font-size="14" fill="#1f2d3d" font-weight="600">Fig</text><rect x="24" y="188" width="592" height="34" rx="8" fill="#e8eef6"/><text x="36" y="210" font-size="14" fill="#1f2d3d" font-weight="600">Cat</text><text x="345" y="210" font-size="14" fill="#1f2d3d">52 days</text><text x="440" y="210" font-size="14" fill="#1f2d3d" font-weight="600">Mulberry</text><rect x="24" y="226" width="592" height="34" rx="8" fill="#ffffff"/><text x="36" y="248" font-size="14" fill="#1f2d3d" font-weight="600">Pig</text><text x="345" y="248" font-size="14" fill="#1f2d3d">60 days</text><text x="440" y="248" font-size="14" fill="#1f2d3d" font-weight="600">Apple</text><rect x="24" y="264" width="592" height="34" rx="8" fill="#e8eef6"/><text x="36" y="286" font-size="14" fill="#1f2d3d" font-weight="600">Fox and all creeping animals</text><text x="345" y="286" font-size="14" fill="#1f2d3d">6 months</text><text x="440" y="286" font-size="14" fill="#1f2d3d" font-weight="600">Grain</text><rect x="24" y="302" width="592" height="34" rx="8" fill="#ffffff"/><text x="36" y="324" font-size="14" fill="#1f2d3d" font-weight="600">Small kosher livestock</text><text x="345" y="324" font-size="14" fill="#1f2d3d">5 months</text><text x="440" y="324" font-size="14" fill="#1f2d3d" font-weight="600">Grapevine</text><rect x="24" y="340" width="592" height="34" rx="8" fill="#e8eef6"/><text x="36" y="362" font-size="14" fill="#1f2d3d" font-weight="600">Large non-kosher livestock</text><text x="345" y="362" font-size="14" fill="#1f2d3d">12 months</text><text x="440" y="362" font-size="14" fill="#1f2d3d" font-weight="600">Date palm</text><rect x="24" y="378" width="592" height="34" rx="8" fill="#ffffff"/><text x="36" y="400" font-size="14" fill="#1f2d3d" font-weight="600">Large kosher livestock</text><text x="345" y="400" font-size="14" fill="#1f2d3d">9 months</text><text x="440" y="400" font-size="14" fill="#1f2d3d" font-weight="600">Olive</text><rect x="24" y="416" width="592" height="50" rx="8" fill="#e8eef6"/><text x="36" y="438" font-size="14" fill="#1f2d3d" font-weight="600">Wolf, lion, bear, leopard, bardelas,</text><text x="36" y="456" font-size="14" fill="#1f2d3d" font-weight="600">elephant, monkey, long-tailed ape</text><text x="345" y="438" font-size="14" fill="#1f2d3d">3 years</text><text x="440" y="438" font-size="14" fill="#1f2d3d" font-weight="600">White fig</text><rect x="24" y="470" width="592" height="66" rx="8" fill="#ffffff"/><text x="36" y="492" font-size="14" fill="#1f2d3d" font-weight="600">Viper</text><text x="345" y="492" font-size="14" fill="#1f2d3d">70 years</text><text x="440" y="492" font-size="14" fill="#1f2d3d" font-weight="600">Carob</text><text x="440" y="510" font-size="11.5" fill="#5b6b7d">70 years from planting to fruit;</text><text x="440" y="526" font-size="11.5" fill="#5b6b7d">its gestation: 3 years</text><rect x="24" y="540" width="592" height="50" rx="8" fill="#fdf0dc"/><text x="36" y="562" font-size="14" fill="#1f2d3d" font-weight="600">Snake</text><text x="345" y="562" font-size="14" fill="#1f2d3d">7 years</text><text x="440" y="562" font-size="14" fill="#1f2d3d" font-weight="600">None found</text><text x="440" y="580" font-size="11.5" fill="#5b6b7d">some say: mukhsasim</text><text x="32" y="620" font-size="12.5" fill="#5b6b7d">Rashi and Rabbeinu Gershom count a tree’s time from flowering to ripe fruit;</text><text x="32" y="640" font-size="12.5" fill="#5b6b7d">for grain, Rabbeinu Gershom counts from sowing until the ears form.</text><text x="32" y="660" font-size="12.5" fill="#5b6b7d">Rashi takes luz as a tree with small nuts; the English renders it “almond.”</text>
</svg>
