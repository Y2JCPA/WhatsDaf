<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>Outer gums, inner gums, double teeth</title>
  <rect width="640" height="520" rx="18" fill="#f3f6fb"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1f2d3d">Outer gums, inner gums, double teeth</text>
  <text x="32" y="68" font-size="14" fill="#5b6b7d">The baraita as the Gemara completes it (39a), from the outer gums inward</text>

  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="32" y="88" width="184" height="40" rx="10" fill="#dfe8f3"/><text x="124" y="113" fill="#1f2d3d">Outer gums</text>
    <rect x="228" y="88" width="184" height="40" rx="10" fill="#dfe8f3"/><text x="320" y="113" fill="#1f2d3d">Double teeth</text>
    <rect x="424" y="88" width="184" height="40" rx="10" fill="#dfe8f3"/><text x="516" y="113" fill="#1f2d3d">Further inward</text>
  </g>
  <path d="M30 138 h188" stroke="#7f8fa3" stroke-width="2" fill="none"/>
  <text x="124" y="156" font-size="12.5" text-anchor="middle" fill="#5b6b7d">in the middle of the mouth (Rashi)</text>
  <path d="M228 138 v6 h380 v-6" stroke="#7f8fa3" stroke-width="2" fill="none"/>
  <text x="418" y="162" font-size="12.5" text-anchor="middle" fill="#5b6b7d">“inner gums”: the double teeth count as inward</text>

  <text x="32" y="198" font-size="15" font-weight="700" fill="#1f2d3d">First tanna</text>
  <rect x="32" y="208" width="184" height="64" rx="10" fill="#dcefdc"/>
  <text x="124" y="232" font-size="13" text-anchor="middle" fill="#1e5e2a"><tspan x="124">Damaged or scratched:</tspan><tspan x="124" dy="18" font-weight="700">slaughtered</tspan></text>
  <text x="124" y="266" font-size="11" text-anchor="middle" fill="#5b6b7d">(the mishna)</text>
  <rect x="228" y="208" width="380" height="64" rx="10" fill="#fff" stroke="#c9d6e6"/>
  <text x="418" y="234" font-size="13" text-anchor="middle" fill="#33475b">Damaged or scratched: <tspan font-weight="700" fill="#a12d22">not slaughtered</tspan></text>
  <text x="418" y="258" font-size="13" text-anchor="middle" fill="#33475b">Extracted: <tspan font-weight="700" fill="#1e5e2a">slaughtered</tspan></text>

  <text x="32" y="306" font-size="15" font-weight="700" fill="#1f2d3d">Rabbi Yehoshua ben Kefutzai</text>
  <rect x="32" y="316" width="184" height="64" rx="10" fill="#dcefdc"/>
  <text x="124" y="342" font-size="13" text-anchor="middle" fill="#1e5e2a"><tspan x="124">Only these:</tspan><tspan x="124" dy="18" font-weight="700">slaughtered</tspan></text>
  <rect x="228" y="316" width="380" height="64" rx="10" fill="#fdf0d8"/>
  <text x="418" y="342" font-size="13" text-anchor="middle" fill="#7a4f00">Extracted: <tspan font-weight="700">not slaughtered</tspan>,</text>
  <text x="418" y="362" font-size="13" text-anchor="middle" fill="#7a4f00">but <tspan font-weight="700">disqualified</tspan> as an offering</text>

  <text x="32" y="414" font-size="15" font-weight="700" fill="#1f2d3d">Rabbi Ḥanina ben Antigonus</text>
  <rect x="32" y="424" width="184" height="64" rx="10" fill="#fff" stroke="#d5dde8" stroke-dasharray="4 4"/>
  <text x="124" y="461" font-size="13" text-anchor="middle" fill="#8a99ab">not addressed here</text>
  <rect x="228" y="424" width="184" height="64" rx="10" fill="#e6e9ee"/>
  <text x="320" y="450" font-size="13" text-anchor="middle" fill="#33475b"><tspan x="320" font-weight="700">Disregarded:</tspan><tspan x="320" dy="18">does not even disqualify</tspan></text>
  <rect x="424" y="424" width="184" height="64" rx="10" fill="#e6e9ee"/>
  <text x="516" y="450" font-size="13" text-anchor="middle" fill="#33475b"><tspan x="516" font-weight="700">Not examined</tspan><tspan x="516" dy="18" font-size="11" fill="#5b6b7d">(his words in the mishna)</tspan></text>
</svg>
