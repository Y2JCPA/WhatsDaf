<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 574" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>Four kinds of firstborn</title>
  <rect width="640" height="574" rx="18" fill="#f3f6fb"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1d2738">Four kinds of firstborn</text>
  <text x="32" y="68" font-size="14" fill="#56637a">Double share of inheritance, or five sela’im to the priest?</text>
  <rect x="24" y="100" width="288" height="250" rx="12" fill="#fff" stroke="#d9e1ee"/>
  <rect x="36" y="112" width="201.2" height="26" rx="13" fill="#fff1d6"/><text x="48" y="130" font-size="13.5" font-weight="700" fill="#8a5a00" xml:space="preserve">Inheritance ✓   Priest ✗</text>
  <text x="38" y="158" font-size="12" font-style="italic" fill="#56637a">The father’s first; the womb already opened</text>
  <text x="38" y="180" font-size="12.5" fill="#1d2738" xml:space="preserve">• After a nonviable fetus, even if its head</text>
  <text x="38" y="197" font-size="12.5" fill="#1d2738" xml:space="preserve">   emerged alive</text>
  <text x="38" y="214" font-size="12.5" fill="#1d2738" xml:space="preserve">• After a full-term baby whose head</text>
  <text x="38" y="231" font-size="12.5" fill="#1d2738" xml:space="preserve">   emerged dead</text>
  <text x="38" y="248" font-size="12.5" fill="#1d2738" xml:space="preserve">• After an animal-like form (Rabbi Meir);</text>
  <text x="38" y="265" font-size="12.5" fill="#1d2738" xml:space="preserve">   the Rabbis: only after a human form</text>
  <text x="38" y="282" font-size="12.5" fill="#1d2738" xml:space="preserve">• After a sandal fish, an afterbirth, a formed</text>
  <text x="38" y="299" font-size="12.5" fill="#1d2738" xml:space="preserve">   sac, or a fetus that emerged in pieces</text>
  <text x="38" y="316" font-size="12.5" fill="#1d2738" xml:space="preserve">• Mother gave birth before, even while a</text>
  <text x="38" y="333" font-size="12.5" fill="#1d2738" xml:space="preserve">   maidservant or a gentile</text>
  <rect x="328" y="100" width="288" height="250" rx="12" fill="#fff" stroke="#d9e1ee"/>
  <rect x="340" y="112" width="201.2" height="26" rx="13" fill="#e3eefb"/><text x="352" y="130" font-size="13.5" font-weight="700" fill="#1f4f8a" xml:space="preserve">Priest ✓   Inheritance ✗</text>
  <text x="342" y="158" font-size="12" font-style="italic" fill="#56637a">Opens the womb, but not the father’s first</text>
  <text x="342" y="180" font-size="12.5" fill="#1d2738" xml:space="preserve">• The father already had sons</text>
  <text x="342" y="197" font-size="12.5" fill="#1d2738" xml:space="preserve">• The mother converted, or was freed, while</text>
  <text x="342" y="214" font-size="12.5" fill="#1d2738" xml:space="preserve">   pregnant</text>
  <text x="342" y="231" font-size="12.5" fill="#1d2738" xml:space="preserve">• Babies mixed up with a priest’s wife’s, a</text>
  <text x="342" y="248" font-size="12.5" fill="#1d2738" xml:space="preserve">   Levite’s wife’s, or a mother who had</text>
  <text x="342" y="265" font-size="12.5" fill="#1d2738" xml:space="preserve">   given birth before</text>
  <text x="342" y="282" font-size="12.5" fill="#1d2738" xml:space="preserve">• Mother remarried within three months:</text>
  <text x="342" y="299" font-size="12.5" fill="#1d2738" xml:space="preserve">   unknown whose son he is</text>
  <rect x="24" y="370" width="288" height="142" rx="12" fill="#fff" stroke="#d9e1ee"/>
  <rect x="36" y="382" width="69.8" height="26" rx="13" fill="#e3f1df"/><text x="48" y="400" font-size="13.5" font-weight="700" fill="#2e6b2a" xml:space="preserve">Both ✓</text>
  <text x="38" y="428" font-size="12" font-style="italic" fill="#56637a">Mishna on 47b</text>
  <text x="38" y="450" font-size="12.5" fill="#1d2738" xml:space="preserve">• After a sac of water or blood, a fish-like</text>
  <text x="38" y="467" font-size="12.5" fill="#1d2738" xml:space="preserve">   mass, or a miscarriage at forty days</text>
  <text x="38" y="484" font-size="12.5" fill="#1d2738" xml:space="preserve">• Rabbi Yosei HaGelili: also the son born</text>
  <text x="38" y="501" font-size="12.5" fill="#1d2738" xml:space="preserve">   after the mother joined the Jewish people</text>
  <rect x="328" y="370" width="288" height="142" rx="12" fill="#fff" stroke="#d9e1ee"/>
  <rect x="340" y="382" width="91.7" height="26" rx="13" fill="#f6e1e1"/><text x="352" y="400" font-size="13.5" font-weight="700" fill="#8a2a2a" xml:space="preserve">Neither ✗</text>
  <text x="342" y="428" font-size="12" font-style="italic" fill="#56637a">Mishna on 47b</text>
  <text x="342" y="450" font-size="12.5" fill="#1d2738" xml:space="preserve">• A son born by caesarean section,</text>
  <text x="342" y="467" font-size="12.5" fill="#1d2738" xml:space="preserve">   and the son born after him</text>
  <text x="32" y="540" font-size="12.5" fill="#56637a">Inheritance follows the father’s “first of his strength”; the priest’s five sela’im</text>
  <text x="32" y="558" font-size="12.5" fill="#56637a">follow the first to open a Jewish mother’s womb.</text>
</svg>
