<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" width="640" height="450" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="450" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">Rava: one flaw or two?</text>
  <text x="320" y="70" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="middle">His reading of the mishna (22a), so that it does not contradict Reish Lakish</text>
  <text x="342" y="106" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">BEFORE THE OWNER</text>
  <text x="342" y="121" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">ACHIEVED ATONEMENT</text>
  <text x="536" y="106" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">AFTER THE OWNER</text>
  <text x="536" y="121" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">ACHIEVED ATONEMENT</text>
  <rect x="20" y="132" width="228" height="78" rx="10" fill="#ffffff" stroke="#d5dde9"/>
  <text x="34" y="160" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="start">Its first year passed,</text>
  <text x="34" y="179" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="start">never lost</text>
  <text x="34" y="198" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">One flaw · Reish Lakish</text>
  <rect x="258" y="132" width="168" height="78" rx="10" fill="#e2f3e7" stroke="#9fd0ae"/>
  <text x="342" y="167" font-size="13.5" font-weight="600" fill="#1d5e34" text-anchor="middle">Grazes until blemished,</text>
  <text x="342" y="185" font-size="13.5" font-weight="600" fill="#1d5e34" text-anchor="middle">then is sold</text>
  <rect x="452" y="132" width="168" height="78" rx="10" fill="#e2f3e7" stroke="#9fd0ae"/>
  <text x="536" y="176" font-size="13.5" font-weight="600" fill="#1d5e34" text-anchor="middle">Still grazes</text>
  <rect x="20" y="222" width="228" height="78" rx="10" fill="#ffffff" stroke="#d5dde9"/>
  <text x="34" y="250" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="start">Its first year passed,</text>
  <text x="34" y="269" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="start">and it was lost</text>
  <text x="34" y="288" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Two flaws</text>
  <rect x="258" y="222" width="168" height="78" rx="10" fill="#e2f3e7" stroke="#9fd0ae"/>
  <text x="342" y="257" font-size="13.5" font-weight="600" fill="#1d5e34" text-anchor="middle">Grazes until blemished,</text>
  <text x="342" y="275" font-size="13.5" font-weight="600" fill="#1d5e34" text-anchor="middle">then is sold</text>
  <rect x="452" y="222" width="168" height="78" rx="10" fill="#fde4e2" stroke="#e8a9a3"/>
  <text x="536" y="266" font-size="13.5" font-weight="600" fill="#8f1d16" text-anchor="middle">Left to die</text>
  <rect x="20" y="312" width="228" height="78" rx="10" fill="#ffffff" stroke="#d5dde9"/>
  <text x="34" y="340" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="start">It was lost, and</text>
  <text x="34" y="359" font-size="14.5" font-weight="700" fill="#1f2937" text-anchor="start">found blemished</text>
  <text x="34" y="378" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Two flaws</text>
  <rect x="258" y="312" width="168" height="78" rx="10" fill="#fff2d2" stroke="#e6c879"/>
  <text x="342" y="340" font-size="13.5" font-weight="600" fill="#7a5300" text-anchor="middle">Sold at once, as it</text>
  <text x="342" y="358" font-size="13.5" font-weight="600" fill="#7a5300" text-anchor="middle">is already blemished</text>
  <text x="342" y="381" font-size="10.5" fill="#7a5300" text-anchor="middle" font-style="italic">per Rabbeinu Gershom</text>
  <rect x="452" y="312" width="168" height="78" rx="10" fill="#fde4e2" stroke="#e8a9a3"/>
  <text x="536" y="356" font-size="13.5" font-weight="600" fill="#8f1d16" text-anchor="middle">Left to die</text>
  <text x="320" y="416" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">Both of the mishna’s cases are needed: one past its year is not fit for its purpose,</text>
  <text x="320" y="433" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">and a blemished one is not fit for sacrifice at all.</text>
</svg>
