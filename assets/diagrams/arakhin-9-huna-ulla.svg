<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 603" width="640" height="603" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="603" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">“Not more than eight” of what?</text>
  <text x="320" y="68" text-anchor="middle" font-size="14" fill="#4b5563">Arakhin 9a–b: two readings of the mishna</text>
  <rect x="182" y="82" width="213" height="30" rx="9" fill="#7c3aed"/><text x="288.5" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Rav Huna</text><rect x="403" y="82" width="213" height="30" rx="9" fill="#0f766e"/><text x="509.5" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Ulla</text><rect x="24" y="120" width="150" height="50" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="35" y="141" font-size="13" font-weight="600" fill="#1f2937">Not more than</text><text x="35" y="158" font-size="13" font-weight="600" fill="#1f2937">eight…</text><rect x="182" y="120" width="213" height="50" rx="9" fill="#f1ebfd" stroke="#c9b5f3"/><text x="193" y="149.5" font-size="13" fill="#3b1f75">full (30-day) months</text><rect x="403" y="120" width="213" height="50" rx="9" fill="#e6f4f2" stroke="#a7d5cf"/><text x="414" y="149.5" font-size="13" fill="#134e48">deficient (29-day) months</text><rect x="24" y="176" width="150" height="50" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="35" y="205.5" font-size="13" font-weight="600" fill="#1f2937">Nine would mean</text><rect x="182" y="176" width="213" height="50" rx="9" fill="#f1ebfd" stroke="#c9b5f3"/><text x="193" y="197" font-size="13" fill="#3b1f75">the new moon arrives three</text><text x="193" y="214" font-size="13" fill="#3b1f75">days before Rosh HaShana</text><rect x="403" y="176" width="213" height="50" rx="9" fill="#e6f4f2" stroke="#a7d5cf"/><text x="414" y="197" font-size="13" fill="#134e48">the new moon appears three</text><text x="414" y="214" font-size="13" fill="#134e48">days after Rosh HaShana</text><rect x="24" y="232" width="150" height="84" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="35" y="270" font-size="13" font-weight="600" fill="#1f2937">Then why are eight</text><text x="35" y="287" font-size="13" font-weight="600" fill="#1f2937">allowed?</text><rect x="182" y="232" width="213" height="84" rx="9" fill="#f1ebfd" stroke="#c9b5f3"/><text x="193" y="253" font-size="13" fill="#3b1f75">The year before was a leap</text><text x="193" y="270" font-size="13" fill="#3b1f75">year with a 29-day added</text><text x="193" y="287" font-size="13" fill="#3b1f75">month: remove a full month</text><text x="193" y="304" font-size="13" fill="#3b1f75">against it</text><rect x="403" y="232" width="213" height="84" rx="9" fill="#e6f4f2" stroke="#a7d5cf"/><text x="414" y="253" font-size="13" fill="#134e48">The year before was a leap</text><text x="414" y="270" font-size="13" fill="#134e48">year with a 30-day added</text><text x="414" y="287" font-size="13" fill="#134e48">month: remove a deficient</text><text x="414" y="304" font-size="13" fill="#134e48">month against it</text><rect x="24" y="322" width="150" height="50" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="35" y="343" font-size="13" font-weight="600" fill="#1f2937">The one day still</text><text x="35" y="360" font-size="13" font-weight="600" fill="#1f2937">left</text><rect x="182" y="322" width="213" height="50" rx="9" fill="#f1ebfd" stroke="#c9b5f3"/><text x="193" y="343" font-size="13" fill="#3b1f75">People do not pay attention</text><text x="193" y="360" font-size="13" fill="#3b1f75">to one day</text><rect x="403" y="322" width="213" height="50" rx="9" fill="#e6f4f2" stroke="#a7d5cf"/><text x="414" y="343" font-size="13" fill="#134e48">People assume it was sighted</text><text x="414" y="360" font-size="13" fill="#134e48">and they did not notice</text><rect x="24" y="378" width="150" height="50" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="35" y="399" font-size="13" font-weight="600" fill="#1f2937">The added month of</text><text x="35" y="416" font-size="13" font-weight="600" fill="#1f2937">a leap year</text><rect x="182" y="378" width="213" height="50" rx="9" fill="#f1ebfd" stroke="#c9b5f3"/><text x="193" y="399" font-size="13" fill="#3b1f75">29 days, with Rabban Shimon</text><text x="193" y="416" font-size="13" fill="#3b1f75">ben Gamliel</text><rect x="403" y="378" width="213" height="50" rx="9" fill="#e6f4f2" stroke="#a7d5cf"/><text x="414" y="399" font-size="13" fill="#134e48">30 days, with the first</text><text x="414" y="416" font-size="13" fill="#134e48">tanna</text><rect x="24" y="434" width="150" height="84" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="35" y="480.5" font-size="13" font-weight="600" fill="#1f2937">Also held by</text><rect x="182" y="434" width="213" height="84" rx="9" fill="#f1ebfd" stroke="#c9b5f3"/><text x="193" y="455" font-size="13" fill="#3b1f75">Shmuel (a lunar year of 352</text><text x="193" y="472" font-size="13" fill="#3b1f75">to 356 days); Rabbi (his</text><text x="193" y="489" font-size="13" fill="#3b1f75">year of nine deficient</text><text x="193" y="506" font-size="13" fill="#3b1f75">months)</text><rect x="403" y="434" width="213" height="84" rx="9" fill="#e6f4f2" stroke="#a7d5cf"/><text x="414" y="480.5" font-size="13" fill="#134e48">—</text><text x="24" y="542" font-size="12" fill="#4b5563">A lunar month is about 29½ days, so a year of six full and six deficient months keeps pace</text><text x="24" y="559" font-size="12" fill="#4b5563">with the moon; each extra full month moves Rosh HaShana half a day later than the moon, each</text><text x="24" y="576" font-size="12" fill="#4b5563">extra deficient month half a day earlier.</text>
</svg>
