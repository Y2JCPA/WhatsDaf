<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>Person or animal</title>
  <rect width="640" height="500" rx="18" fill="#f3f6fb"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1d2a3a">A priest or an offering?</text>
  <text x="32" y="68" font-size="14" fill="#5a6b80">The two mishnayot of 45b, side by side</text>

  <rect x="24" y="86" width="290" height="390" rx="14" fill="#fff" stroke="#d9e1ec"/>
  <rect x="24" y="86" width="290" height="50" rx="14" fill="#e3ebf7"/>
  <rect x="24" y="120" width="290" height="16" fill="#e3ebf7"/>
  <text x="40" y="108" font-size="14" font-weight="700" fill="#1d2a3a">Disqualify a priest,</text>
  <text x="40" y="127" font-size="14" font-weight="700" fill="#1d2a3a">valid in an animal</text>
  <g font-size="13" fill="#3d4b5e">
    <text x="40" y="162"><tspan font-weight="700" fill="#1d2a3a">Kushi</tspan>: very black skin</text>
    <text x="40" y="188"><tspan font-weight="700" fill="#1d2a3a">Giḥor</tspan>: very red skin</text>
    <text x="40" y="214"><tspan font-weight="700" fill="#1d2a3a">Lavkan</tspan>: very white skin</text>
    <text x="40" y="240"><tspan font-weight="700" fill="#1d2a3a">Kipe’aḥ</tspan>: very tall and gaunt</text>
    <text x="40" y="266"><tspan font-weight="700" fill="#1d2a3a">Dwarf</tspan></text>
    <text x="40" y="292"><tspan font-weight="700" fill="#1d2a3a">Deaf-mute</tspan></text>
    <text x="40" y="318"><tspan font-weight="700" fill="#1d2a3a">Imbecile</tspan> *</text>
    <text x="40" y="344"><tspan font-weight="700" fill="#1d2a3a">Drunk</tspan>, not from wine</text>
    <text x="40" y="370"><tspan font-weight="700" fill="#1d2a3a">Pure skin marks</tspan></text>
    <text x="40" y="396"><tspan font-weight="700" fill="#1d2a3a">Hanging growths</tspan> (Rabbi Elazar)</text>
  </g>
  <text x="40" y="436" font-size="11.5" fill="#6b7a8f">* Rabban Shimon ben Gamliel: an imbecile</text>
  <text x="40" y="452" font-size="11.5" fill="#6b7a8f">animal is not the choicest offering.</text>

  <rect x="326" y="86" width="290" height="236" rx="14" fill="#fff" stroke="#d9e1ec"/>
  <rect x="326" y="86" width="290" height="50" rx="14" fill="#f6e9dc"/>
  <rect x="326" y="120" width="290" height="16" fill="#f6e9dc"/>
  <text x="342" y="108" font-size="14" font-weight="700" fill="#1d2a3a">Disqualify an animal,</text>
  <text x="342" y="127" font-size="14" font-weight="700" fill="#1d2a3a">not a priest</text>
  <g font-size="13" fill="#3d4b5e">
    <text x="342" y="162"><tspan font-weight="700" fill="#1d2a3a">Itself and its offspring</tspan>, same day</text>
    <text x="342" y="188"><tspan font-weight="700" fill="#1d2a3a">Tereifa</tspan></text>
    <text x="342" y="214"><tspan font-weight="700" fill="#1d2a3a">Born by caesarean section</tspan></text>
    <text x="342" y="240"><tspan font-weight="700" fill="#1d2a3a">Used in a transgression</tspan></text>
    <text x="342" y="266"><tspan font-weight="700" fill="#1d2a3a">Killed a person</tspan></text>
  </g>
  <text x="342" y="300" font-size="11.5" fill="#6b7a8f">For a priest, these are no flaw at all.</text>

  <rect x="326" y="334" width="290" height="142" rx="14" fill="#fff" stroke="#d9e1ec"/>
  <text x="342" y="360" font-size="14" font-weight="700" fill="#1d2a3a">A priest may serve again once…</text>
  <g font-size="13" fill="#3d4b5e">
    <text x="342" y="388">married to a forbidden woman:</text>
    <text x="342" y="406" fill="#1d2a3a" font-weight="600">he vows to derive no benefit from her</text>
    <text x="342" y="438">impure from corpses:</text>
    <text x="342" y="456" fill="#1d2a3a" font-weight="600">he resolves not to become so again</text>
  </g>
</svg>
