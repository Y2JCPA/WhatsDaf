<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 758" width="640" height="758" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<rect x="0" y="0" width="640" height="758" rx="18" fill="#f3f6fb"/>
<text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Why do I need the tally?</text>
<text x="320" y="70" text-anchor="middle" font-size="13.5" fill="#4b5563">Each number the Gemara asks about, and what it comes to teach or exclude</text>
<rect x="24" y="92" width="592" height="74" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="24" y="92" width="62" height="74" rx="10" fill="#e8eef8" stroke="#cbd5e1"/>
<text x="55" y="138" text-anchor="middle" font-size="26" font-weight="700" fill="#1e3a8a">36</text>
<text x="98" y="115" font-size="13.5" font-weight="700" fill="#1f2937">Transgressions punishable</text>
<text x="98" y="132" font-size="13.5" font-weight="700" fill="#1f2937">by karet</text>
<rect x="98" y="138" width="74" height="22" rx="11" fill="#e1f3e5" stroke="#7cbf8a"/><text x="135" y="153.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d5e2c">teaches</text>
<text x="182" y="153.5" font-size="11.5" fill="#6b7280">Keritot 2a</text>
<line x1="330" y1="102" x2="330" y2="156" stroke="#e2e8f0"/>
<text x="342" y="114" font-size="12.5" font-weight="700" fill="#1d5e2c">Rabbi Yoḥanan:</text>
<text x="342" y="133" font-size="12" fill="#1f2937">If one did them all in one lapse of awareness,</text>
<text x="342" y="150" font-size="12" fill="#1f2937">he is liable for each and every one.</text>
<rect x="24" y="174" width="592" height="74" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="24" y="174" width="62" height="74" rx="10" fill="#e8eef8" stroke="#cbd5e1"/>
<text x="55" y="220" text-anchor="middle" font-size="26" font-weight="700" fill="#1e3a8a">39</text>
<text x="98" y="197" font-size="13.5" font-weight="700" fill="#1f2937">Primary categories of labor</text>
<rect x="98" y="220" width="74" height="22" rx="11" fill="#e1f3e5" stroke="#7cbf8a"/><text x="135" y="235.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d5e2c">teaches</text>
<text x="182" y="235.5" font-size="11.5" fill="#6b7280">Shabbat 73a</text>
<line x1="330" y1="184" x2="330" y2="238" stroke="#e2e8f0"/>
<text x="342" y="204" font-size="12" fill="#1f2937">If one did them all in one lapse of awareness,</text>
<text x="342" y="221" font-size="12" fill="#1f2937">he is liable for each and every one.</text>
<rect x="24" y="256" width="592" height="74" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="24" y="256" width="62" height="74" rx="10" fill="#e8eef8" stroke="#cbd5e1"/>
<text x="55" y="302" text-anchor="middle" font-size="26" font-weight="700" fill="#1e3a8a">4</text>
<text x="98" y="279" font-size="13.5" font-weight="700" fill="#1f2937">Those lacking atonement</text>
<rect x="98" y="302" width="74" height="22" rx="11" fill="#fde2e2" stroke="#e08a8a"/><text x="135" y="317.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8b1c1c">excludes</text>
<text x="182" y="317.5" font-size="11.5" fill="#6b7280">Keritot 8b</text>
<line x1="330" y1="266" x2="330" y2="320" stroke="#e2e8f0"/>
<text x="342" y="278" font-size="12.5" font-weight="700" fill="#8b1c1c">Rabbi Eliezer ben Ya’akov:</text>
<text x="342" y="297" font-size="12" fill="#1f2937">There are five: a convert, too, lacks atonement</text>
<text x="342" y="314" font-size="12" fill="#1f2937">until the blood is sprinkled on his behalf.</text>
<rect x="24" y="338" width="592" height="74" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="24" y="338" width="62" height="74" rx="10" fill="#e8eef8" stroke="#cbd5e1"/>
<text x="55" y="384" text-anchor="middle" font-size="26" font-weight="700" fill="#1e3a8a">4</text>
<text x="98" y="361" font-size="13.5" font-weight="700" fill="#1f2937">Bring for the intentional</text>
<text x="98" y="378" font-size="13.5" font-weight="700" fill="#1f2937">as for the unwitting</text>
<rect x="98" y="384" width="74" height="22" rx="11" fill="#fde2e2" stroke="#e08a8a"/><text x="135" y="399.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8b1c1c">excludes</text>
<text x="182" y="399.5" font-size="11.5" fill="#6b7280">Keritot 8b</text>
<line x1="330" y1="348" x2="330" y2="402" stroke="#e2e8f0"/>
<text x="342" y="360" font-size="12.5" font-weight="700" fill="#8b1c1c">Rabbi Shimon:</text>
<text x="342" y="379" font-size="12" fill="#1f2937">The intentional false oath on a deposit</text>
<text x="342" y="396" font-size="12" fill="#1f2937">is not given atonement.</text>
<rect x="24" y="420" width="592" height="74" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="24" y="420" width="62" height="74" rx="10" fill="#e8eef8" stroke="#cbd5e1"/>
<text x="55" y="466" text-anchor="middle" font-size="26" font-weight="700" fill="#1e3a8a">5</text>
<text x="98" y="443" font-size="13.5" font-weight="700" fill="#1f2937">Bring one offering for</text>
<text x="98" y="460" font-size="13.5" font-weight="700" fill="#1f2937">several transgressions</text>
<rect x="98" y="466" width="74" height="22" rx="11" fill="#e1f3e5" stroke="#7cbf8a"/><text x="135" y="481.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d5e2c">teaches</text>
<text x="182" y="481.5" font-size="11.5" fill="#6b7280">Keritot 9a</text>
<line x1="330" y1="430" x2="330" y2="484" stroke="#e2e8f0"/>
<text x="342" y="442" font-size="12.5" font-weight="700" fill="#1d5e2c">The latter clause:</text>
<text x="342" y="461" font-size="12" fill="#1f2937">A nazirite impure several times; so the mishna</text>
<text x="342" y="478" font-size="12" fill="#1f2937">follows Rabbi Yosei son of Rabbi Yehuda.</text>
<rect x="24" y="502" width="592" height="74" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="24" y="502" width="62" height="74" rx="10" fill="#e8eef8" stroke="#cbd5e1"/>
<text x="55" y="548" text-anchor="middle" font-size="26" font-weight="700" fill="#1e3a8a">5</text>
<text x="98" y="525" font-size="13.5" font-weight="700" fill="#1f2937">Bring a sliding-scale offering</text>
<rect x="98" y="548" width="74" height="22" rx="11" fill="#fde2e2" stroke="#e08a8a"/><text x="135" y="563.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8b1c1c">excludes</text>
<text x="182" y="563.5" font-size="11.5" fill="#6b7280">Keritot 9a</text>
<line x1="330" y1="512" x2="330" y2="566" stroke="#e2e8f0"/>
<text x="342" y="524" font-size="12.5" font-weight="700" fill="#8b1c1c">Rabbi Eliezer:</text>
<text x="342" y="543" font-size="12" fill="#1f2937">A king brings a goat.</text>
<rect x="24" y="584" width="592" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="24" y="584" width="62" height="150" rx="10" fill="#e8eef8" stroke="#cbd5e1"/>
<text x="55" y="668" text-anchor="middle" font-size="26" font-weight="700" fill="#1e3a8a">4</text>
<text x="98" y="612" font-size="13.5" font-weight="700" fill="#1f2937">Primary categories of damage</text>
<text x="98" y="634" font-size="11.5" fill="#6b7280">Bava Kamma 2a</text>
<rect x="98" y="650" width="162" height="66" rx="10" fill="#fdf6e7" stroke="#e0c48a"/>
<text x="179" y="672" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5a12">The 4</text>
<text x="179" y="690" text-anchor="middle" font-size="11.5" fill="#8b1c1c">excludes Rabbi Oshaya’s</text>
<text x="179" y="706" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">13</text>
<path d="M262 683 h10 m-5 -4 l5 4 l-5 4" stroke="#6b7280" stroke-width="1.6" fill="none"/>
<rect x="274" y="650" width="162" height="66" rx="10" fill="#fdf6e7" stroke="#e0c48a"/>
<text x="355" y="672" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5a12">The 13</text>
<text x="355" y="690" text-anchor="middle" font-size="11.5" fill="#8b1c1c">excludes Rabbi Ḥiyya’s</text>
<text x="355" y="706" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">24</text>
<path d="M438 683 h10 m-5 -4 l5 4 l-5 4" stroke="#6b7280" stroke-width="1.6" fill="none"/>
<rect x="450" y="650" width="162" height="66" rx="10" fill="#fdf6e7" stroke="#e0c48a"/>
<text x="531" y="672" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5a12">The 24</text>
<text x="531" y="690" text-anchor="middle" font-size="11.5" fill="#8b1c1c">excludes the informer and</text>
<text x="531" y="706" text-anchor="middle" font-size="11.5" fill="#1f2937">one who renders piggul</text>
</svg>
