<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 804" width="640" height="804" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="804" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">What the priestly vestments atone for</text>
  <text x="320" y="68" text-anchor="middle" font-size="14" fill="#4b5563">Arakhin 16a: Rabbi Anani bar Sason</text>
  <rect x="24" y="82" width="150" height="30" rx="9" fill="#334155"/><text x="99" y="102.3" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Garment</text><rect x="182" y="82" width="150" height="30" rx="9" fill="#334155"/><text x="257" y="102.3" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Atones for</text><rect x="340" y="82" width="276" height="30" rx="9" fill="#334155"/><text x="478" y="102.3" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Why</text><rect x="24" y="120" width="150" height="48" rx="9" fill="#fdf2e3" stroke="#e8c48f"/><text x="36" y="139.9" font-size="14" font-weight="700" fill="#1f2937">Tunic</text><text x="36" y="157.9" font-size="14" font-weight="700" fill="#1f2937">(ketonet)</text><rect x="182" y="120" width="150" height="48" rx="9" fill="#fdf2e3" stroke="#e8c48f"/><text x="194" y="148.6" font-size="13" font-weight="600" fill="#1e3a8a">Bloodshed</text><rect x="340" y="120" width="276" height="48" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="352" y="140.1" font-size="12.5" fill="#374151">“They dipped the coat [ketonet]</text><text x="352" y="156.6" font-size="12.5" fill="#374151">in the blood” (Genesis 37:31)</text><rect x="24" y="174" width="150" height="48" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="36" y="202.9" font-size="14" font-weight="700" fill="#1f2937">Trousers</text><rect x="182" y="174" width="150" height="48" rx="9" fill="#eef2ff" stroke="#c7d2fe"/><text x="194" y="194.1" font-size="13" font-weight="600" fill="#1e3a8a">Forbidden sexual</text><text x="194" y="211.1" font-size="13" font-weight="600" fill="#1e3a8a">relations</text><rect x="340" y="174" width="276" height="48" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="352" y="194.1" font-size="12.5" fill="#374151">“To cover the flesh of their</text><text x="352" y="210.6" font-size="12.5" fill="#374151">nakedness” (Exodus 28:42)</text><rect x="24" y="228" width="150" height="48" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="36" y="256.9" font-size="14" font-weight="700" fill="#1f2937">Mitre</text><rect x="182" y="228" width="150" height="48" rx="9" fill="#eef2ff" stroke="#c7d2fe"/><text x="194" y="256.6" font-size="13" font-weight="600" fill="#1e3a8a">The arrogant</text><rect x="340" y="228" width="276" height="48" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="352" y="248.1" font-size="12.5" fill="#374151">An item on high atones for a</text><text x="352" y="264.6" font-size="12.5" fill="#374151">high heart (Rabbi Ḥanina)</text><rect x="24" y="282" width="150" height="48" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="36" y="310.9" font-size="14" font-weight="700" fill="#1f2937">Belt</text><rect x="182" y="282" width="150" height="48" rx="9" fill="#eef2ff" stroke="#c7d2fe"/><text x="194" y="310.6" font-size="13" font-weight="600" fill="#1e3a8a">Thought of the heart</text><rect x="340" y="282" width="276" height="48" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="352" y="302.1" font-size="12.5" fill="#374151">Where it is: “upon Aaron’s</text><text x="352" y="318.6" font-size="12.5" fill="#374151">heart” (Exodus 28:30)</text><rect x="24" y="336" width="150" height="48" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="36" y="364.9" font-size="14" font-weight="700" fill="#1f2937">Breastplate</text><rect x="182" y="336" width="150" height="48" rx="9" fill="#eef2ff" stroke="#c7d2fe"/><text x="194" y="364.6" font-size="13" font-weight="600" fill="#1e3a8a">Improper judgments</text><rect x="340" y="336" width="276" height="48" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="352" y="356.1" font-size="12.5" fill="#374151">“A breastplate of judgment”</text><text x="352" y="372.6" font-size="12.5" fill="#374151">(Exodus 28:15)</text><rect x="24" y="390" width="150" height="48" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="36" y="418.9" font-size="14" font-weight="700" fill="#1f2937">Ephod</text><rect x="182" y="390" width="150" height="48" rx="9" fill="#eef2ff" stroke="#c7d2fe"/><text x="194" y="418.6" font-size="13" font-weight="600" fill="#1e3a8a">Idol worship</text><rect x="340" y="390" width="276" height="48" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="352" y="410.1" font-size="12.5" fill="#374151">“Without ephod or teraphim”</text><text x="352" y="426.6" font-size="12.5" fill="#374151">(Hosea 3:4)</text><rect x="24" y="444" width="150" height="48" rx="9" fill="#fdf2e3" stroke="#e8c48f"/><text x="36" y="472.9" font-size="14" font-weight="700" fill="#1f2937">Robe</text><rect x="182" y="444" width="150" height="48" rx="9" fill="#fdf2e3" stroke="#e8c48f"/><text x="194" y="472.6" font-size="13" font-weight="600" fill="#1e3a8a">Malicious speech</text><rect x="340" y="444" width="276" height="48" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="352" y="464.1" font-size="12.5" fill="#374151">Its bells: an item of sound for</text><text x="352" y="480.6" font-size="12.5" fill="#374151">an act of sound</text><rect x="24" y="498" width="150" height="48" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="36" y="526.9" font-size="14" font-weight="700" fill="#1f2937">Frontplate</text><rect x="182" y="498" width="150" height="48" rx="9" fill="#eef2ff" stroke="#c7d2fe"/><text x="194" y="526.5" font-size="13" font-weight="600" fill="#1e3a8a">Brazenness</text><rect x="340" y="498" width="276" height="48" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="352" y="518.1" font-size="12.5" fill="#374151">“Aaron’s forehead” and “a prostitute’s</text><text x="352" y="534.6" font-size="12.5" fill="#374151">forehead” (Exodus 28:38; Jeremiah 3:3)</text><text x="24" y="574.9" font-size="14" font-weight="700" fill="#1f2937">How the Gemara squares the highlighted rows with Rabbi Yehoshua ben Levi:</text><rect x="24" y="586" width="292" height="158" rx="9" fill="#fdf2e3" stroke="#e8c48f"/><text x="36" y="610.9" font-size="14" font-weight="700" fill="#7c4a03">Bloodshed</text><text x="36" y="632.5" font-size="13" font-weight="700" fill="#1f2937">Tunic</text><text x="36" y="650.4" font-size="12.5" fill="#374151">the killer is known but cannot be</text><text x="36" y="666.9" font-size="12.5" fill="#374151">executed (killed intentionally,</text><text x="36" y="683.4" font-size="12.5" fill="#374151">without a warning)</text><text x="36" y="712.0" font-size="13" font-weight="700" fill="#1f2937">Heifer whose neck is broken</text><text x="36" y="729.9" font-size="12.5" fill="#374151">the killer is not known</text><rect x="324" y="586" width="292" height="158" rx="9" fill="#fdf2e3" stroke="#e8c48f"/><text x="336" y="610.9" font-size="14" font-weight="700" fill="#7c4a03">Malicious speech</text><text x="336" y="632.5" font-size="13" font-weight="700" fill="#1f2937">Robe</text><text x="336" y="650.4" font-size="12.5" fill="#374151">spoken in public</text><text x="336" y="679.0" font-size="13" font-weight="700" fill="#1f2937">Incense</text><text x="336" y="696.9" font-size="12.5" fill="#374151">spoken in private</text><text x="24" y="768.2" font-size="12" fill="#4b5563">And leprous marks? They come when his malicious speech was effective and caused harm;</text><text x="24" y="785.2" font-size="12" fill="#4b5563">when it was not effective, the robe atones (16a).</text>
</svg>
