<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>How many sets of lashes</title>
  <rect width="640" height="470" rx="18" fill="#f3f6fb"/>
  <text x="24" y="44" font-size="22" font-weight="700" fill="#1f2a3a">How many sets of lashes?</text>
  <text x="24" y="68" font-size="13" fill="#5a6678">For one who eats, as Keritot 4 counts them</text>

  <!-- row 1 -->
  <rect x="20" y="86" width="600" height="76" rx="12" fill="#fff" stroke="#d5deea"/>
  <text x="34" y="118" font-size="14" font-weight="700" fill="#1f2a3a">Fat of ox,</text>
  <text x="34" y="137" font-size="14" font-weight="700" fill="#1f2a3a">sheep and goat</text>
  <circle cx="200" cy="124" r="18" fill="#1565c0"/><text x="200" y="130" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">3</text>
  <text x="226" y="119" font-size="13" font-weight="700" fill="#1f2a3a">Rabbi Yishmael</text>
  <text x="226" y="137" font-size="12" fill="#4a5568">one for each animal</text>
  <circle cx="420" cy="124" r="18" fill="#2e7d32"/><text x="420" y="130" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">1</text>
  <text x="446" y="119" font-size="13" font-weight="700" fill="#1f2a3a">The Rabbis</text>
  <text x="446" y="137" font-size="12" fill="#4a5568">only one set</text>

  <!-- row 2 -->
  <rect x="20" y="172" width="600" height="76" rx="12" fill="#fff" stroke="#d5deea"/>
  <text x="34" y="214" font-size="14" font-weight="700" fill="#1f2a3a">Fat of a carcass</text>
  <circle cx="200" cy="210" r="18" fill="#7b5ea7"/><text x="200" y="216" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">2</text>
  <text x="226" y="205" font-size="13" font-weight="700" fill="#1f2a3a">The baraita</text>
  <text x="226" y="223" font-size="12" fill="#4a5568">forbidden fat + eating a carcass</text>

  <!-- row 3 -->
  <rect x="20" y="258" width="600" height="76" rx="12" fill="#fff" stroke="#d5deea"/>
  <text x="34" y="290" font-size="14" font-weight="700" fill="#1f2a3a">Fat of a</text>
  <text x="34" y="309" font-size="14" font-weight="700" fill="#1f2a3a">sacrificial animal</text>
  <circle cx="200" cy="296" r="18" fill="#2e7d32"/><text x="200" y="302" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">2</text>
  <text x="226" y="291" font-size="13" font-weight="700" fill="#1f2a3a">The Rabbis</text>
  <text x="226" y="309" font-size="12" fill="#4a5568">fat + a non-priest eating</text>
  <text x="226" y="324" font-size="12" fill="#4a5568">sacred food</text>
  <circle cx="420" cy="296" r="18" fill="#b5651d"/><text x="420" y="302" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">3</text>
  <text x="446" y="291" font-size="13" font-weight="700" fill="#1f2a3a">Rabbi Yehuda</text>
  <text x="446" y="309" font-size="12" fill="#4a5568">two fat prohibitions</text>
  <text x="446" y="324" font-size="12" fill="#4a5568">+ a non-priest</text>

  <!-- row 4 -->
  <rect x="20" y="344" width="600" height="76" rx="12" fill="#fff" stroke="#d5deea"/>
  <text x="34" y="376" font-size="14" font-weight="700" fill="#1f2a3a">Blood of a</text>
  <text x="34" y="395" font-size="14" font-weight="700" fill="#1f2a3a">sacrificial animal</text>
  <circle cx="200" cy="382" r="18" fill="#2e7d32"/><text x="200" y="388" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">1</text>
  <text x="226" y="377" font-size="13" font-weight="700" fill="#1f2a3a">The Rabbis</text>
  <text x="226" y="395" font-size="12" fill="#4a5568">only one prohibition</text>
  <circle cx="420" cy="382" r="18" fill="#b5651d"/><text x="420" y="388" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">3</text>
  <text x="446" y="377" font-size="13" font-weight="700" fill="#1f2a3a">Rabbi Yehuda</text>
  <text x="446" y="395" font-size="12" fill="#4a5568">like fat, by the juxtaposition</text>
  <text x="446" y="410" font-size="12" fill="#4a5568">“neither fat nor blood”</text>

  <text x="24" y="446" font-size="12" fill="#5a6678">Lashes only. For a sin offering, Rabbi Ḥanina says Rabbi Yishmael concedes only one;</text>
  <text x="24" y="462" font-size="12" fill="#5a6678">Rabbi Eliezer says the same of Rabbi Yehuda.</text>
</svg>
