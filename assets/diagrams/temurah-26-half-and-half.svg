<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 750" width="640" height="750" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="750" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2a44">Half one offering, half another</text>
  <text x="320" y="68" text-anchor="middle" font-size="14" fill="#4a5672">What one animal designated two ways becomes, on 26a–b</text>
  <rect x="272" y="84" width="166" height="24" rx="8" fill="#fde8e8"/><text x="355" y="100.5" text-anchor="middle" font-size="12" font-weight="700" fill="#9b2c22">RABBI MEIR</text>
  <rect x="450" y="84" width="166" height="24" rx="8" fill="#e3edf9"/><text x="533" y="100.5" text-anchor="middle" font-size="12" font-weight="700" fill="#1f4e79">RABBI YOSEI</text>
  <rect x="24" y="118" width="236" height="105" rx="10" fill="#ffffff" stroke="#c9d3e6"/>
  <text x="36" y="150.2" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2a44">Half the substitute of a burnt</text>
  <text x="36" y="167.2" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2a44">offering, half the substitute</text>
  <text x="36" y="184.2" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2a44">of a peace offering</text>
  <text x="36" y="201.0" font-size="11.5" fill="#6b7690">26a, first baraita</text>
  <rect x="272" y="118" width="166" height="105" rx="10" fill="#fdf3f3"/>
  <text x="355" y="166.7" text-anchor="middle" font-size="13.5" font-weight="600" fill="#9b2c22">All sacrificed as</text>
  <text x="355" y="183.7" text-anchor="middle" font-size="13.5" font-weight="600" fill="#9b2c22">a burnt offering</text>
  <rect x="450" y="118" width="166" height="105" rx="10" fill="#f2f7fd"/>
  <text x="533" y="141.6" text-anchor="middle" font-size="13" font-weight="600" fill="#1f4e79">Grazes until blemished,</text>
  <text x="533" y="158.6" text-anchor="middle" font-size="13" font-weight="600" fill="#1f4e79">is sold; substitute burnt</text>
  <text x="533" y="175.6" text-anchor="middle" font-size="13" font-weight="600" fill="#1f4e79">and peace offerings with</text>
  <text x="533" y="192.6" text-anchor="middle" font-size="13" font-weight="600" fill="#1f4e79">half the money each</text>
  <text x="533" y="208.5" text-anchor="middle" font-size="11.5" fill="#4a5672">(the Rabbis = Rabbi Yosei)</text>
  <rect x="24" y="233" width="236" height="71" rx="10" fill="#ffffff" stroke="#c9d3e6"/>
  <text x="36" y="256.7" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2a44">Half a burnt offering,</text>
  <text x="36" y="273.7" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2a44">half a sin offering</text>
  <text x="36" y="290.5" font-size="11.5" fill="#6b7690">26a, second baraita</text>
  <rect x="272" y="233" width="166" height="71" rx="10" fill="#fdf3f3"/>
  <text x="355" y="264.7" text-anchor="middle" font-size="13.5" font-weight="600" fill="#9b2c22">All sacrificed as</text>
  <text x="355" y="281.7" text-anchor="middle" font-size="13.5" font-weight="600" fill="#9b2c22">a burnt offering</text>
  <rect x="450" y="233" width="166" height="71" rx="10" fill="#f2f7fd"/>
  <text x="533" y="273.2" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f4e79">Left to die</text>
  <rect x="24" y="314" width="236" height="71" rx="10" fill="#ffffff" stroke="#c9d3e6"/>
  <text x="36" y="337.7" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2a44">Half a sin offering,</text>
  <text x="36" y="354.7" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2a44">half a burnt offering</text>
  <text x="36" y="371.5" font-size="11.5" fill="#6b7690">26a, second baraita</text>
  <rect x="272" y="314" width="344" height="71" rx="10" fill="#e8f3ea"/>
  <text x="444" y="354.2" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1d5a2c">Both agree: left to die</text>
  <rect x="24" y="395" width="236" height="71" rx="10" fill="#ffffff" stroke="#c9d3e6"/>
  <text x="36" y="418.7" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2a44">Half a burnt offering,</text>
  <text x="36" y="435.7" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2a44">half a peace offering</text>
  <text x="36" y="452.5" font-size="11.5" fill="#6b7690">26a, third baraita</text>
  <rect x="272" y="395" width="344" height="71" rx="10" fill="#e8f3ea"/>
  <text x="444" y="426.7" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1d5a2c">Rabbi Yosei’s view: consecrated, not sacrificed;</text>
  <text x="444" y="443.7" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1d5a2c">its substitute is like it</text>
  <rect x="24" y="476" width="236" height="88" rx="10" fill="#ffffff" stroke="#c9d3e6"/>
  <text x="36" y="499.7" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2a44">A partner consecrates his half,</text>
  <text x="36" y="516.7" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2a44">then buys the other half</text>
  <text x="36" y="533.7" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2a44">and consecrates it</text>
  <text x="36" y="550.5" font-size="11.5" fill="#6b7690">Rabbi Yoḥanan, 26a–b</text>
  <rect x="272" y="476" width="344" height="88" rx="10" fill="#e8f3ea"/>
  <text x="444" y="516.2" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1d5a2c">Consecrated, not sacrificed;</text>
  <text x="444" y="533.2" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1d5a2c">its substitute is like it</text>
  <rect x="24" y="574" width="236" height="71" rx="10" fill="#ffffff" stroke="#c9d3e6"/>
  <text x="36" y="597.7" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2a44">Half a burnt offering,</text>
  <text x="36" y="614.7" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2a44">half an animal tithe</text>
  <text x="36" y="631.5" font-size="11.5" fill="#6b7690">Abaye, 26b</text>
  <rect x="272" y="574" width="344" height="71" rx="10" fill="#e8f3ea"/>
  <text x="444" y="614.2" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1d5a2c">Everyone agrees: sacrificed as a burnt offering</text>
  <rect x="24" y="655" width="236" height="71" rx="10" fill="#ffffff" stroke="#c9d3e6"/>
  <text x="36" y="678.7" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2a44">Half a substitute,</text>
  <text x="36" y="695.7" text-anchor="start" font-size="13.5" font-weight="600" fill="#1f2a44">half an animal tithe</text>
  <text x="36" y="712.5" font-size="11.5" fill="#6b7690">Abaye, 26b</text>
  <rect x="272" y="655" width="344" height="71" rx="10" fill="#f1edf9"/>
  <text x="444" y="686.7" text-anchor="middle" font-size="13.5" font-weight="600" fill="#4a2f86">Sacrificed as a substitute, or as a tithe?</text>
  <text x="444" y="703.7" text-anchor="middle" font-size="13.5" font-weight="400" fill="#4a2f86">Unresolved (<tspan font-style="italic">teiku</tspan>)</text>
</svg>
