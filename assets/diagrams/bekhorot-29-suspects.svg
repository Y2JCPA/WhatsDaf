<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 772" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>Buying from a suspect</title>
  <rect width="640" height="772" rx="18" fill="#f3f6fb"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1f2d3d">Buying from a suspect</text>
  <text x="32" y="66" font-size="13" fill="#5d6d7e">Grey lines give the explanations in the Gemara and its translation.</text>
  <rect x="24" y="80" width="592" height="280" rx="14" fill="#fff" stroke="#d6e0ee"/><line x1="324" y1="120" x2="324" y2="348" stroke="#e3e9f2"/><text x="40" y="108" font-size="16" font-weight="700" fill="#1f3a5f">Suspected about firstborns</text><text x="40" y="132" font-size="12.5" font-weight="700" fill="#b03a2e">MAY NOT BUY</text><text x="336" y="132" font-size="12.5" font-weight="700" fill="#1e8449">MAY BUY</text><circle cx="45" cy="151" r="4" fill="#c0392b"/><text x="56" y="156" font-size="14" font-weight="600" fill="#22313f">Meat, even deer meat</text><text x="56" y="172" font-size="12" fill="#5d6d7e">it can be confused with calf meat</text><circle cx="45" cy="197" r="4" fill="#c0392b"/><text x="56" y="202" font-size="14" font-weight="600" fill="#22313f">Hides that are not tanned</text><circle cx="45" cy="227" r="4" fill="#c0392b"/><text x="56" y="232" font-size="14" font-weight="600" fill="#22313f">Wool bleached from its dirt</text><text x="56" y="248" font-size="12" fill="#5d6d7e">“bleached or dirty” is one case</text><circle cx="45" cy="273" r="4" fill="#c0392b"/><text x="56" y="278" font-size="14" font-weight="600" fill="#22313f">Hides of female animals, per the</text><text x="56" y="296" font-size="14" font-weight="600" fill="#22313f">first tanna</text><text x="56" y="312" font-size="12" fill="#5d6d7e">he might cut off the male organ and say</text><text x="56" y="328" font-size="12" fill="#5d6d7e">mice ate it</text><circle cx="341" cy="151" r="4" fill="#27ae60"/><text x="352" y="156" font-size="14" font-weight="600" fill="#22313f">Tanned hides</text><text x="352" y="172" font-size="12" fill="#5d6d7e">inferred: he would not take such trouble</text><text x="352" y="188" font-size="12" fill="#5d6d7e">over a firstborn’s hide</text><circle cx="341" cy="213" r="4" fill="#27ae60"/><text x="352" y="218" font-size="14" font-weight="600" fill="#22313f">Hides of female animals, per Rabbi</text><text x="352" y="236" font-size="14" font-weight="600" fill="#22313f">Eliezer</text><text x="352" y="252" font-size="12" fill="#5d6d7e">male and female hides can be told apart</text><circle cx="341" cy="277" r="4" fill="#27ae60"/><text x="352" y="282" font-size="14" font-weight="600" fill="#22313f">Spun thread</text><circle cx="341" cy="307" r="4" fill="#27ae60"/><text x="352" y="312" font-size="14" font-weight="600" fill="#22313f">Garments, i.e. felt</text><text x="352" y="328" font-size="12" fill="#5d6d7e">felt is not made of spun thread</text><rect x="24" y="374" width="592" height="154" rx="14" fill="#fff" stroke="#d6e0ee"/><line x1="324" y1="414" x2="324" y2="516" stroke="#e3e9f2"/><text x="40" y="402" font-size="16" font-weight="700" fill="#1f3a5f">Suspected about the Sabbatical Year</text><text x="40" y="426" font-size="12.5" font-weight="700" fill="#b03a2e">MAY NOT BUY</text><text x="336" y="426" font-size="12.5" font-weight="700" fill="#1e8449">MAY BUY</text><circle cx="45" cy="445" r="4" fill="#c0392b"/><text x="56" y="450" font-size="14" font-weight="600" fill="#22313f">Flax, even combed</text><circle cx="341" cy="445" r="4" fill="#27ae60"/><text x="352" y="450" font-size="14" font-weight="600" fill="#22313f">Spun thread</text><circle cx="341" cy="475" r="4" fill="#27ae60"/><text x="352" y="480" font-size="14" font-weight="600" fill="#22313f">Woven, i.e. chains</text><text x="352" y="496" font-size="12" fill="#5d6d7e">chains are not spun</text><rect x="24" y="542" width="592" height="206" rx="14" fill="#fff" stroke="#d6e0ee"/><line x1="324" y1="582" x2="324" y2="736" stroke="#e3e9f2"/><text x="40" y="570" font-size="16" font-weight="700" fill="#1f3a5f">Suspected of selling teruma as non-sacred</text><text x="40" y="594" font-size="12.5" font-weight="700" fill="#b03a2e">MAY NOT BUY</text><text x="336" y="594" font-size="12.5" font-weight="700" fill="#1e8449">MAY BUY</text><circle cx="45" cy="613" r="4" fill="#c0392b"/><text x="56" y="618" font-size="14" font-weight="600" fill="#22313f">Rabbi Yehuda: not even water and</text><text x="56" y="636" font-size="14" font-weight="600" fill="#22313f">salt</text><circle cx="45" cy="661" r="4" fill="#c0392b"/><text x="56" y="666" font-size="14" font-weight="600" fill="#22313f">Rabbi Shimon: anything that has</text><text x="56" y="684" font-size="14" font-weight="600" fill="#22313f">relevance to teruma and tithes</text><text x="56" y="700" font-size="12" fill="#5d6d7e">this adds fish innards, as olive oil is</text><text x="56" y="716" font-size="12" fill="#5d6d7e">mixed in</text><circle cx="341" cy="613" r="4" fill="#27ae60"/><text x="352" y="618" font-size="14" font-weight="600" fill="#22313f">Rabbi Shimon: water and salt</text><text x="352" y="634" font-size="12" fill="#5d6d7e">teruma and tithes do not apply to them</text>
</svg>
