<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="470" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2a3a">Two sales in a leap year</text>
  <text x="320" y="70" text-anchor="middle" font-size="14" fill="#55627a">Rabbi Abba bar Memel: when does each house become permanent? (31b)</text>

  <!-- month slots: x0=50, w=38.5 -->
  <g font-size="10.5" fill="#55627a" text-anchor="middle">
    <rect x="50" y="300" width="77" height="26" rx="4" fill="#fbe9c6"/>
    <rect x="127" y="300" width="423" height="26" fill="#e3e9f3"/>
    <rect x="550" y="300" width="38.5" height="26" rx="4" fill="#dcebe1"/>
    <line x1="88.5" y1="300" x2="88.5" y2="326" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="127" y1="300" x2="127" y2="326" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="165.5" y1="300" x2="165.5" y2="326" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="204" y1="300" x2="204" y2="326" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="242.5" y1="300" x2="242.5" y2="326" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="281" y1="300" x2="281" y2="326" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="319.5" y1="300" x2="319.5" y2="326" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="358" y1="300" x2="358" y2="326" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="396.5" y1="300" x2="396.5" y2="326" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="435" y1="300" x2="435" y2="326" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="473.5" y1="300" x2="473.5" y2="326" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="512" y1="300" x2="512" y2="326" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="550" y1="300" x2="550" y2="326" stroke="#ffffff" stroke-width="1.5"/>
    <text x="69" y="317">Adar I</text>
    <text x="108" y="317">Adar II</text>
    <text x="146" y="317">Nisan</text>
    <text x="185" y="317">Iyyar</text>
    <text x="223" y="317">Sivan</text>
    <text x="262" y="317">Tamm.</text>
    <text x="300" y="317">Av</text>
    <text x="339" y="317">Elul</text>
    <text x="377" y="317">Tishrei</text>
    <text x="416" y="317">Ḥesh.</text>
    <text x="454" y="317">Kislev</text>
    <text x="493" y="317">Tevet</text>
    <text x="531" y="317">Shevat</text>
    <text x="569" y="317">Adar</text>
  </g>
  <text x="88" y="346" text-anchor="middle" font-size="11.5" fill="#8a5a00">leap year</text>
  <text x="569" y="346" text-anchor="middle" font-size="11.5" fill="#1d6b35">next year</text>

  <!-- House sold 1 Adar II -->
  <text x="88.5" y="104" font-size="13.5" font-weight="700" fill="#2e5aa8">House sold on 1 Second Adar</text>
  <rect x="88.5" y="114" width="462" height="30" rx="8" fill="#cfe0f7" stroke="#2e5aa8"/>
  <text x="319" y="134" text-anchor="middle" font-size="13" fill="#1f2a3a">permanent once 1 Adar of the next year arrives</text>
  <circle cx="550.5" cy="129" r="6" fill="#2e5aa8"/>

  <!-- House sold 15 Adar I -->
  <text x="68" y="178" font-size="13.5" font-weight="700" fill="#9b2c2c">House sold on 15 First Adar</text>
  <rect x="68" y="188" width="500.5" height="30" rx="8" fill="#f7d9d9" stroke="#9b2c2c"/>
  <text x="300" y="208" text-anchor="middle" font-size="13" fill="#1f2a3a">not a year until 15 Adar of the next year</text>
  <circle cx="568.5" cy="203" r="6" fill="#9b2c2c"/>

  <!-- Rashi's counts -->
  <text x="320" y="244" text-anchor="middle" font-size="12" fill="#55627a">Rashi: from day to day, 15 Adar to 15 Adar, “even though now it is thirteen months”</text>

  <!-- Rashi b10 marker -->
  <line x1="530" y1="262" x2="530" y2="300" stroke="#8090a8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="522" y="276" text-anchor="end" font-size="11.5" fill="#55627a">Rashi (b10), on the lambs: were “full” not written,</text>
  <text x="522" y="291" text-anchor="end" font-size="11.5" fill="#55627a">the year from 15 First Adar would end on 15 Shevat</text>

  <!-- footer -->
  <rect x="24" y="364" width="592" height="88" rx="12" fill="#ffffff" stroke="#c9d3e3"/>
  <text x="40" y="390" font-size="13" fill="#1f2a3a"><tspan font-weight="700">Ravina:</tspan> let the first buyer say, “I preceded you and kindled a fire before you.”</text>
  <text x="40" y="412" font-size="13" fill="#1f2a3a"><tspan font-weight="700">Answer:</tspan> “You descended to the house during the intercalated month.”</text>
  <text x="40" y="436" font-size="13" fill="#1f2a3a"><tspan font-weight="700">Two lambs</tspan> born on the same two dates are counted the same way (“year”, “year”).</text>
</svg>
