<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 488" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title>One prohibition or two?</title>
<rect width="640" height="488" rx="18" fill="#f3f6fb"/>
<text x="32" y="44" font-size="22" font-weight="700" fill="#1f2d3d">One prohibition or two?</text>
<text x="32" y="70" font-size="14" fill="#56657a">Two acts in one lapse of awareness: one sin offering, or one for each?</text>
<text x="32" y="104" font-size="11" font-weight="700" fill="#7a879a">ACTS</text>
<text x="196" y="104" font-size="11" font-weight="700" fill="#7a879a">WHAT THE TORAH WRITES</text>
<text x="384" y="104" font-size="11" font-weight="700" fill="#7a879a">ON THIS DAF</text>
<rect x="20" y="116" width="600" height="104" rx="12" fill="#fff" stroke="#dbe3ee"/>
<text x="32" y="142" font-size="14.5" font-weight="700" fill="#1f2d3d">Blending the</text>
<text x="32" y="160" font-size="14.5" font-weight="700" fill="#1f2d3d">anointing oil;</text>
<text x="32" y="178" font-size="14.5" font-weight="700" fill="#1f2d3d">applying it</text>
<line x1="184" y1="128" x2="184" y2="208" stroke="#e1e6ee"/>
<line x1="372" y1="128" x2="372" y2="208" stroke="#e1e6ee"/>
<text x="196" y="142" font-size="15" font-weight="700" fill="#2f5d9a">2 prohibitions</text>
<text x="196" y="160" font-size="15" font-weight="700" fill="#2f5d9a">1 <tspan font-style="italic">karet</tspan></text>
<text x="196" y="180" font-size="12" fill="#56657a">Exodus 30:32, 30:33</text>
<text x="384" y="142" font-size="15" font-weight="700" fill="#2f6d3a">Divide: one for each</text>
<text x="384" y="162" font-size="12" fill="#56657a">Rabbi Elazar, from Rabbi Hoshaya;</text>
<text x="384" y="178" font-size="12" fill="#56657a">Rav Naḥman bar Yitzḥak finds it</text>
<text x="384" y="194" font-size="12" fill="#56657a">in the mishna’s order (3a)</text>
<rect x="20" y="230" width="600" height="110" rx="12" fill="#fff" stroke="#dbe3ee"/>
<text x="32" y="256" font-size="14.5" font-weight="700" fill="#1f2d3d">Slaughtering</text>
<text x="32" y="274" font-size="14.5" font-weight="700" fill="#1f2d3d">and offering up</text>
<text x="32" y="292" font-size="14.5" font-weight="700" fill="#1f2d3d">outside</text>
<line x1="184" y1="242" x2="184" y2="328" stroke="#e1e6ee"/>
<line x1="372" y1="242" x2="372" y2="328" stroke="#e1e6ee"/>
<text x="196" y="256" font-size="15" font-weight="700" fill="#2f5d9a">2 <tspan font-style="italic">karet</tspan></text>
<text x="196" y="276" font-size="12" fill="#56657a">Leviticus 17:3–4, 17:8–9;</text>
<text x="196" y="292" font-size="12" fill="#56657a">prohibition for offering up:</text>
<text x="196" y="308" font-size="12" fill="#56657a">Deuteronomy 12:13</text>
<text x="384" y="256" font-size="15" font-weight="700" fill="#2f6d3a">Two prohibitions</text>
<text x="384" y="276" font-size="12" fill="#56657a">Rabbi Zeira: the prohibition for</text>
<text x="384" y="292" font-size="12" fill="#56657a">slaughtering comes by verbal analogy</text>
<text x="384" y="308" font-size="12" fill="#56657a">or juxtaposition, so this is not</text>
<text x="384" y="324" font-size="12" fill="#56657a">Rabbi Yirmeya’s case (3b)</text>
<rect x="20" y="350" width="600" height="114" rx="12" fill="#fff" stroke="#dbe3ee"/>
<text x="32" y="376" font-size="14.5" font-weight="700" fill="#1f2d3d">Necromancer;</text>
<text x="32" y="394" font-size="14.5" font-weight="700" fill="#1f2d3d">sorcerer</text>
<line x1="184" y1="362" x2="184" y2="452" stroke="#e1e6ee"/>
<line x1="372" y1="362" x2="372" y2="452" stroke="#e1e6ee"/>
<text x="196" y="376" font-size="15" font-weight="700" fill="#2f5d9a">2 death penalties</text>
<text x="196" y="394" font-size="15" font-weight="700" fill="#2f5d9a">1 prohibition</text>
<text x="196" y="414" font-size="12" fill="#56657a">Leviticus 20:27; 19:31</text>
<text x="384" y="376" font-size="15" font-weight="700" fill="#9a4a2f">A dispute (3b)</text>
<text x="384" y="396" font-size="12" fill="#56657a">Rabbi Yoḥanan: one prohibition,</text>
<text x="384" y="412" font-size="12" fill="#56657a">so no division</text>
<text x="384" y="432" font-size="12" fill="#56657a">Reish Lakish: the sorcerer’s sin</text>
<text x="384" y="448" font-size="12" fill="#56657a">involves no action</text>
</svg>
