<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 472" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>Omit the tumtum</title>
  <rect width="640" height="472" rx="18" fill="#f6f8f1"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#24301b">“Omit the tumtum”</text>
  <text x="32" y="68" font-size="14" fill="#5d6b52">Each source lists the tumtum beside the hermaphrodite; each time the answer is the same</text>
  <rect x="24" y="88" width="592" height="40" rx="10" fill="#fff" stroke="#dfe6d3"/>
  <text x="40" y="106" font-size="14" font-weight="600" fill="#24301b">Valuations: “the male”</text>
  <text x="40" y="122" font-size="11.5" fill="#7a8770">Leviticus 27:3</text>
  <rect x="430" y="95" width="174" height="26" rx="13" fill="#e3f1df"/><text x="517" y="113" font-size="13" text-anchor="middle" fill="#2e6b2a" font-weight="700">✂ omit the tumtum</text>
  <rect x="24" y="136" width="592" height="40" rx="10" fill="#fff" stroke="#dfe6d3"/>
  <text x="40" y="154" font-size="14" font-weight="600" fill="#24301b">Valuations: “if a female”</text>
  <text x="40" y="170" font-size="11.5" fill="#7a8770">Leviticus 27:4</text>
  <rect x="430" y="143" width="174" height="26" rx="13" fill="#e3f1df"/><text x="517" y="161" font-size="13" text-anchor="middle" fill="#2e6b2a" font-weight="700">✂ omit the tumtum</text>
  <rect x="24" y="184" width="592" height="40" rx="10" fill="#fff" stroke="#dfe6d3"/>
  <text x="40" y="202" font-size="14" font-weight="600" fill="#24301b">Peace offering: “whether male or female”</text>
  <text x="40" y="218" font-size="11.5" fill="#7a8770">Leviticus 3:1</text>
  <rect x="430" y="191" width="174" height="26" rx="13" fill="#e3f1df"/><text x="517" y="209" font-size="13" text-anchor="middle" fill="#2e6b2a" font-weight="700">✂ omit the tumtum</text>
  <rect x="24" y="232" width="592" height="40" rx="10" fill="#fff" stroke="#dfe6d3"/>
  <text x="40" y="250" font-size="14" font-weight="600" fill="#24301b">Burnt offering: the second “male”</text>
  <text x="40" y="266" font-size="11.5" fill="#7a8770">Leviticus 1:10</text>
  <rect x="430" y="239" width="174" height="26" rx="13" fill="#e3f1df"/><text x="517" y="257" font-size="13" text-anchor="middle" fill="#2e6b2a" font-weight="700">✂ omit the tumtum</text>
  <rect x="24" y="280" width="592" height="40" rx="10" fill="#fff" stroke="#dfe6d3"/>
  <text x="40" y="298" font-size="14" font-weight="600" fill="#24301b">Bird offerings killed by pinching</text>
  <text x="40" y="314" font-size="11.5" fill="#7a8770">Rabbi Eliezer’s baraita</text>
  <rect x="430" y="287" width="174" height="26" rx="13" fill="#e3f1df"/><text x="517" y="305" font-size="13" text-anchor="middle" fill="#2e6b2a" font-weight="700">✂ omit the tumtum</text>
  <rect x="24" y="328" width="592" height="40" rx="10" fill="#fff" stroke="#dfe6d3"/>
  <text x="40" y="346" font-size="14" font-weight="600" fill="#24301b">Not consecrated, no substitute</text>
  <text x="40" y="362" font-size="11.5" fill="#7a8770">Rabbi Elazar, Shmuel</text>
  <rect x="430" y="335" width="174" height="26" rx="13" fill="#e3f1df"/><text x="517" y="353" font-size="13" text-anchor="middle" fill="#2e6b2a" font-weight="700">✂ omit the tumtum</text>
  <rect x="24" y="376" width="592" height="40" rx="10" fill="#fff" stroke="#dfe6d3"/>
  <text x="40" y="394" font-size="14" font-weight="600" fill="#24301b">“Five types” that are not consecrated</text>
  <text x="40" y="410" font-size="11.5" fill="#7a8770">Rabbi Elazar</text>
  <rect x="402" y="383" width="202" height="26" rx="13" fill="#fff1d6"/><text x="503" y="401" font-size="13" text-anchor="middle" fill="#8a5a00" font-weight="700">tumtum ➜ orphan</text>
  <text x="32" y="454" font-size="13" fill="#5d6b52">Removing the tumtum would leave four, so the orphan takes its place to keep the count at five.</text>
</svg>
