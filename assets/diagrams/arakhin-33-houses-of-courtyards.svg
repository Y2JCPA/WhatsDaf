<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 452" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title>Houses of the courtyards</title>
<rect width="640" height="452" rx="18" fill="#f3f6fb"/>
<text x="32" y="44" font-size="22" font-weight="700" fill="#1f2d3d">Houses of the courtyards</text>
<text x="32" y="70" font-size="14" fill="#56657a">The mishna (33a): the advantage of houses and the advantage of fields</text>

<!-- column heads -->
<rect x="140" y="88" width="152" height="52" rx="10" fill="#e8eaf6" stroke="#c5cae9"/>
<text x="216" y="110" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2d3d">House in a</text>
<text x="216" y="128" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2d3d">walled city</text>
<rect x="300" y="88" width="152" height="52" rx="10" fill="#e8eaf6" stroke="#c5cae9"/>
<text x="376" y="119" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2d3d">Ancestral field</text>
<rect x="460" y="88" width="160" height="52" rx="10" fill="#fff4d6" stroke="#ecd28c"/>
<text x="540" y="110" font-size="13.5" font-weight="700" text-anchor="middle" fill="#6b4e00">House of an</text>
<text x="540" y="128" font-size="13.5" font-weight="700" text-anchor="middle" fill="#6b4e00">unwalled courtyard</text>

<!-- row 1: when redeemed -->
<rect x="20" y="148" width="112" height="84" rx="10" fill="#fff" stroke="#dbe3ee"/>
<text x="76" y="186" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2d3d">Redeeming</text>
<text x="76" y="204" font-size="11.5" text-anchor="middle" fill="#56657a">after a sale</text>
<rect x="140" y="148" width="152" height="84" rx="10" fill="#fff" stroke="#dbe3ee"/>
<text x="216" y="178" font-size="12.5" text-anchor="middle" fill="#1f2d3d">Immediately,</text>
<text x="216" y="196" font-size="12.5" text-anchor="middle" fill="#1f2d3d">for twelve months;</text>
<text x="216" y="214" font-size="12.5" text-anchor="middle" fill="#1f2d3d">then the buyer’s for ever</text>
<rect x="300" y="148" width="152" height="84" rx="10" fill="#fff" stroke="#dbe3ee"/>
<text x="376" y="186" font-size="12.5" text-anchor="middle" fill="#1f2d3d">Only after</text>
<text x="376" y="204" font-size="12.5" text-anchor="middle" fill="#1f2d3d">two years</text>
<rect x="460" y="148" width="160" height="84" rx="10" fill="#e6f4ea" stroke="#b9dfc4"/>
<text x="540" y="178" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2f7a45">Like houses:</text>
<text x="540" y="196" font-size="12.5" text-anchor="middle" fill="#1f2d3d">immediately and the</text>
<text x="540" y="214" font-size="12.5" text-anchor="middle" fill="#1f2d3d">entire twelve months</text>

<!-- row 2: price -->
<rect x="20" y="240" width="112" height="76" rx="10" fill="#fff" stroke="#dbe3ee"/>
<text x="76" y="274" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2d3d">Price of</text>
<text x="76" y="292" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2d3d">redemption</text>
<rect x="140" y="240" width="152" height="76" rx="10" fill="#fff" stroke="#dbe3ee"/>
<text x="216" y="274" font-size="12.5" text-anchor="middle" fill="#1f2d3d">The full</text>
<text x="216" y="292" font-size="12.5" text-anchor="middle" fill="#1f2d3d">sale price</text>
<rect x="300" y="240" width="152" height="76" rx="10" fill="#fff" stroke="#dbe3ee"/>
<text x="376" y="274" font-size="12.5" text-anchor="middle" fill="#1f2d3d">A deduction for</text>
<text x="376" y="292" font-size="12.5" text-anchor="middle" fill="#1f2d3d">each year</text>
<rect x="460" y="240" width="160" height="76" rx="10" fill="#e6f4ea" stroke="#b9dfc4"/>
<text x="540" y="274" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2f7a45">Like fields:</text>
<text x="540" y="292" font-size="12.5" text-anchor="middle" fill="#1f2d3d">a deduction for each year</text>

<!-- row 3: Jubilee -->
<rect x="20" y="324" width="112" height="76" rx="10" fill="#fff" stroke="#dbe3ee"/>
<text x="76" y="358" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2d3d">In the</text>
<text x="76" y="376" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2d3d">Jubilee</text>
<rect x="140" y="324" width="152" height="76" rx="10" fill="#fff" stroke="#dbe3ee"/>
<text x="216" y="358" font-size="12.5" text-anchor="middle" fill="#1f2d3d">After the year, stays</text>
<text x="216" y="376" font-size="12.5" text-anchor="middle" fill="#1f2d3d">with the buyer</text>
<rect x="300" y="324" width="152" height="76" rx="10" fill="#fff" stroke="#dbe3ee"/>
<text x="376" y="358" font-size="12.5" text-anchor="middle" fill="#1f2d3d">Leaves the</text>
<text x="376" y="376" font-size="12.5" text-anchor="middle" fill="#1f2d3d">buyer’s possession</text>
<rect x="460" y="324" width="160" height="76" rx="10" fill="#e6f4ea" stroke="#b9dfc4"/>
<text x="540" y="358" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2f7a45">Like fields:</text>
<text x="540" y="376" font-size="12.5" text-anchor="middle" fill="#1f2d3d">leaves the buyer</text>

<text x="32" y="430" font-size="12.5" fill="#56657a">“Shall be reckoned with the fields of the country; they may be redeemed” (Lev. 25:31)</text>
</svg>
