<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 745" width="640" height="745" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<rect width="640" height="745" rx="18" fill="#f3f6fb"/>
<text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2933">Redeeming a firstborn donkey: with what?</text>
<text x="320" y="70" text-anchor="middle" font-size="13.5" fill="#555">What may stand in for the lamb, according to 12a–b</text>
<rect x="16" y="96" width="608" height="56" rx="10" fill="#ffffff"/>
<text x="30" y="120" font-size="15" font-weight="600" fill="#1f2933">Female, blemished or older lamb</text>
<text x="330" y="120" font-size="15" font-weight="700" fill="#2e7d32">✓ May redeem</text>
<text x="330" y="139" font-size="12.5" fill="#555">Included by “you shall redeem” twice</text>
<rect x="16" y="158" width="608" height="75" rx="10" fill="#eef2f8"/>
<text x="30" y="182" font-size="15" font-weight="600" fill="#1f2933">Calf, undomesticated animal,</text>
<text x="30" y="201" font-size="15" font-weight="600" fill="#1f2933">slaughtered animal, tereifa</text>
<text x="330" y="182" font-size="15" font-weight="700" fill="#c62828">✗ May not</text>
<text x="330" y="201" font-size="12.5" fill="#555">The mishna; ben Bag Bag: “lamb,” “lamb”</text>
<text x="330" y="220" font-size="12.5" fill="#555">from the Paschal offering</text>
<rect x="16" y="239" width="608" height="56" rx="10" fill="#ffffff"/>
<text x="30" y="263" font-size="15" font-weight="600" fill="#1f2933">Hybrid of sheep and goat</text>
<text x="330" y="263" font-size="15" font-weight="700" fill="#c62828">✗ Rabbis</text>
<text x="416.8" y="263" font-size="15" font-weight="700" fill="#2e7d32">✓ Rabbi Eliezer</text>
<text x="330" y="282" font-size="12.5" fill="#555">Rabbi Eliezer: “because it is a lamb”</text>
<rect x="16" y="301" width="608" height="56" rx="10" fill="#eef2f8"/>
<text x="30" y="325" font-size="15" font-weight="600" fill="#1f2933">Koy</text>
<text x="30" y="344" font-size="13" font-weight="400" fill="#555">(uncertain if domesticated)</text>
<text x="330" y="325" font-size="15" font-weight="700" fill="#c62828">✗ May not</text>
<text x="330" y="344" font-size="12.5" fill="#555">Even Rabbi Eliezer: its status is uncertain</text>
<rect x="16" y="363" width="608" height="56" rx="10" fill="#ffffff"/>
<text x="30" y="387" font-size="15" font-weight="600" fill="#1f2933">Ben pekua</text>
<text x="30" y="406" font-size="13" font-weight="400" fill="#555">(found alive in a slaughtered animal)</text>
<text x="330" y="387" font-size="15" font-weight="700" fill="#c62828">✗ Mar Zutra</text>
<text x="442.6" y="387" font-size="15" font-weight="700" fill="#2e7d32">✓ Rav Ashi</text>
<text x="330" y="406" font-size="12.5" fill="#555">Like meat in a pot, or a lamb that runs?</text>
<rect x="16" y="425" width="608" height="75" rx="10" fill="#eef2f8"/>
<text x="30" y="449" font-size="15" font-weight="600" fill="#1f2933">Lamb that looks like a goat</text>
<text x="30" y="468" font-size="13" font-weight="400" fill="#555">(both parents sheep)</text>
<text x="330" y="449" font-size="15" font-weight="700" fill="#2e7d32">✓ Rabbi Eliezer</text>
<text x="477" y="449" font-size="15" font-weight="700" fill="#b26a00">? Rabbis</text>
<text x="330" y="468" font-size="12.5" fill="#555">For the Rabbis the proofs are deflected;</text>
<text x="330" y="487" font-size="12.5" fill="#555">left unresolved (Rabbeinu Gershom)</text>
<rect x="16" y="506" width="608" height="56" rx="10" fill="#ffffff"/>
<text x="30" y="530" font-size="15" font-weight="600" fill="#1f2933">Cow’s offspring that looks</text>
<text x="30" y="549" font-size="15" font-weight="600" fill="#1f2933">like a goat</text>
<text x="330" y="530" font-size="15" font-weight="700" fill="#c62828">✗ May not</text>
<text x="330" y="549" font-size="12.5" fill="#555">Follow its mother: it is a calf</text>
<rect x="16" y="568" width="608" height="75" rx="10" fill="#eef2f8"/>
<text x="30" y="592" font-size="15" font-weight="600" fill="#1f2933">Redeemed disqualified</text>
<text x="30" y="611" font-size="15" font-weight="600" fill="#1f2933">consecrated animal</text>
<text x="330" y="592" font-size="15" font-weight="700" fill="#c62828">✗ May not</text>
<text x="330" y="611" font-size="12.5" fill="#555">Rav Mari: “like the gazelle and like the hart”;</text>
<text x="330" y="630" font-size="12.5" fill="#555">so even according to Rabbi Shimon</text>
<rect x="16" y="649" width="608" height="56" rx="10" fill="#ffffff"/>
<text x="30" y="673" font-size="15" font-weight="600" fill="#1f2933">Animal bought with</text>
<text x="30" y="692" font-size="15" font-weight="600" fill="#1f2933">Sabbatical Year produce</text>
<text x="330" y="673" font-size="15" font-weight="700" fill="#c62828">✗ Certain firstborn</text>
<text x="511.4" y="673" font-size="15" font-weight="700" fill="#2e7d32">✓ Uncertain</text>
<text x="330" y="692" font-size="12.5" fill="#555">Rav Ḥisda; “for consumption,” not commerce</text>
<text x="200" y="729" text-anchor="middle" font-size="12.5" fill="#555"><tspan fill="#2e7d32" font-weight="700">✓</tspan> may redeem with it</text>
<text x="330" y="729" text-anchor="middle" font-size="12.5" fill="#555"><tspan fill="#c62828" font-weight="700">✗</tspan> may not</text>
<text x="440" y="729" text-anchor="middle" font-size="12.5" fill="#555"><tspan fill="#b26a00" font-weight="700">?</tspan> unresolved</text>
</svg>
