<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 608" width="640" height="608" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="608" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Whom does Yom Kippur atone for?</text>
  <text x="320" y="68" text-anchor="middle" font-size="14" fill="#4b5563">Keritot 7a: two unattributed baraitot in the Sifra</text>
  <rect x="24" y="88" width="288" height="112" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="40" y="114" font-size="15" font-weight="700" fill="#1e3a5f">Baraita 1 · “Yet” divides</text>
  <text x="40" y="140" font-size="13.5" fill="#1f2937">Yom Kippur atones only for those</text>
  <text x="40" y="160" font-size="13.5" fill="#1f2937">who repent (Leviticus 23:27).</text>
  <rect x="328" y="88" width="288" height="112" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="344" y="114" font-size="15" font-weight="700" fill="#1e3a5f">Baraita 2 · “It is Yom Kippur”</text>
  <text x="344" y="140" font-size="13.5" fill="#1f2937">It atones in any case, even for one</text>
  <text x="344" y="160" font-size="13.5" fill="#1f2937">who did not fast, did labor, or did</text>
  <text x="344" y="180" font-size="13.5" fill="#1f2937">not declare it a holy convocation.</text>
  <text x="24" y="232" font-size="15" font-weight="700" fill="#7c3aed">Abaye</text>
  <rect x="24" y="242" width="288" height="52" rx="10" fill="#f5f0ff" stroke="#c4b5fd"/>
  <text x="40" y="266" font-size="13.5" fill="#1f2937">Rabbi, in accordance with</text>
  <text x="40" y="284" font-size="13.5" fill="#1f2937">Rabbi Yehuda</text>
  <rect x="328" y="242" width="288" height="52" rx="10" fill="#f5f0ff" stroke="#c4b5fd"/>
  <text x="344" y="266" font-size="13.5" fill="#1f2937">Rabbi, in accordance with</text>
  <text x="344" y="284" font-size="13.5" fill="#1f2937">his own view</text>
  <text x="24" y="326" font-size="15" font-weight="700" fill="#0f766e">Rava</text>
  <rect x="24" y="336" width="592" height="52" rx="10" fill="#ecfdf8" stroke="#99d8c9"/>
  <text x="40" y="358" font-size="13.5" fill="#1f2937">Both are Rabbi’s own view, but Rabbi concedes that Yom Kippur does</text>
  <text x="40" y="377" font-size="13.5" fill="#1f2937">not atone for transgressions of Yom Kippur itself.</text>
  <rect x="24" y="398" width="288" height="52" rx="10" fill="#ffffff" stroke="#99d8c9"/>
  <text x="40" y="420" font-size="13" fill="#1f2937">“Yet” speaks of the day’s own</text>
  <text x="40" y="438" font-size="13" fill="#4b5563">transgressions (Rashi)</text>
  <rect x="328" y="398" width="288" height="52" rx="10" fill="#ffffff" stroke="#99d8c9"/>
  <text x="344" y="420" font-size="13" fill="#1f2937">It atones for the year’s transgressions,</text>
  <text x="344" y="438" font-size="13" fill="#4b5563">not for the failure to fast (Rashi)</text>
  <rect x="24" y="470" width="592" height="92" rx="10" fill="#fff7e6" stroke="#f0cf8f"/>
  <text x="40" y="494" font-size="15" font-weight="700" fill="#8a5a00">Rabbi’s own view (baraita)</text>
  <text x="40" y="516" font-size="13.5" fill="#1f2937">For all transgressions in the Torah, whether or not one repented, Yom Kippur</text>
  <text x="40" y="534" font-size="13.5" fill="#1f2937">atones, except one who divests the yoke, reveals facets of the Torah, or</text>
  <text x="40" y="552" font-size="13.5" fill="#1f2937">nullifies the covenant of the flesh: for these, only if he repented.</text>
  <text x="320" y="588" text-anchor="middle" font-size="13" fill="#4b5563">Rava’s reason: otherwise, how could karet for Yom Kippur itself be found?</text>
</svg>
