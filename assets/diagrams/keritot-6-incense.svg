<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 668" width="640" height="668" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="668" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">The blending of the incense</text><text x="320" y="68" text-anchor="middle" font-size="14" fill="#4b5563">Keritot 6a: the eleven spices of the baraita, by weight in maneh</text><text x="24" y="108" font-size="15" font-weight="700" fill="#1e3a5f">70 maneh each</text><rect x="24" y="118" width="141" height="42" rx="9" fill="#fff7e6" stroke="#f0cf8f"/><text x="94.5" y="144" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Balm</text><rect x="175" y="118" width="141" height="42" rx="9" fill="#fff7e6" stroke="#f0cf8f"/><text x="245.5" y="144" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Onycha</text><rect x="326" y="118" width="141" height="42" rx="9" fill="#fff7e6" stroke="#f0cf8f"/><text x="396.5" y="144" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Galbanum</text><rect x="477" y="118" width="141" height="42" rx="9" fill="#fff7e6" stroke="#f0cf8f"/><text x="547.5" y="144" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Frankincense</text><text x="24" y="188" font-size="15" font-weight="700" fill="#1e3a5f">16 maneh each</text><rect x="24" y="198" width="141" height="42" rx="9" fill="#eef6ee" stroke="#a9d3ad"/><text x="94.5" y="224" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Myrrh</text><rect x="175" y="198" width="141" height="42" rx="9" fill="#eef6ee" stroke="#a9d3ad"/><text x="245.5" y="224" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Cassia</text><rect x="326" y="198" width="141" height="42" rx="9" fill="#eef6ee" stroke="#a9d3ad"/><text x="396.5" y="224" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Spikenard</text><rect x="477" y="198" width="141" height="42" rx="9" fill="#eef6ee" stroke="#a9d3ad"/><text x="547.5" y="224" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Saffron</text><text x="24" y="268" font-size="15" font-weight="700" fill="#1e3a5f">And three more</text><rect x="24" y="278" width="191" height="50" rx="9" fill="#f1ecf8" stroke="#c7b6e3"/><text x="119.5" y="300" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Costus</text><text x="119.5" y="318" text-anchor="middle" font-size="12.5" fill="#4b5563">12 maneh</text><rect x="225" y="278" width="191" height="50" rx="9" fill="#f1ecf8" stroke="#c7b6e3"/><text x="320.5" y="300" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Aromatic bark</text><text x="320.5" y="318" text-anchor="middle" font-size="12.5" fill="#4b5563">3 maneh</text><rect x="426" y="278" width="191" height="50" rx="9" fill="#f1ecf8" stroke="#c7b6e3"/><text x="521.5" y="300" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Cinnamon</text><text x="521.5" y="318" text-anchor="middle" font-size="12.5" fill="#4b5563">9 maneh</text><rect x="24" y="344" width="592" height="100" rx="12" fill="#ffffff" stroke="#94a3b8"/><text x="44" y="378" font-size="22" font-weight="700" fill="#1e3a5f">368 maneh</text><text x="44" y="400" font-size="13" fill="#4b5563">in all</text><text x="190" y="374" font-size="13.5" fill="#1f2937">365: one for each day of the solar year</text><text x="190" y="396" font-size="13.5" fill="#1f2937">3 extra: from them the High Priest brings in his</text><text x="190" y="414" font-size="13.5" fill="#1f2937">handful on Yom Kippur</text><text x="190" y="430" font-size="12" fill="#4b5563">The rest is given to the artisans as their wages.</text><text x="24" y="474" font-size="15" font-weight="700" fill="#1e3a5f">Also in the baraita, measured by volume</text><rect x="24" y="484" width="141" height="50" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="94.5" y="506" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2937">Kersannah lye</text><text x="94.5" y="524" text-anchor="middle" font-size="12.5" fill="#4b5563">9 kav</text><rect x="175" y="484" width="141" height="50" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="245.5" y="506" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2937">Cyprus wine</text><text x="245.5" y="524" text-anchor="middle" font-size="12.5" fill="#4b5563">3 se’a and 3 kav</text><rect x="326" y="484" width="141" height="50" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="396.5" y="506" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2937">Sodomite salt</text><text x="396.5" y="524" text-anchor="middle" font-size="12.5" fill="#4b5563">a quarter-kav</text><rect x="477" y="484" width="141" height="50" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="547.5" y="506" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2937">Smoke raiser</text><text x="547.5" y="524" text-anchor="middle" font-size="12.5" fill="#4b5563">a minimal amount</text><text x="24" y="554" font-size="12.5" fill="#374151">No Cyprus wine? Bring old white wine. Rabbi Natan: also a minimal amount of Jordan amber.</text><text x="24" y="574" font-size="12.5" fill="#374151">Rabbi Shimon: the lye is to rub the onycha so it is pleasant; the wine, to soak it so it is strong.</text><text x="24" y="594" font-size="12.5" fill="#374151">Rashi: lye, wine and the smoke raiser are not spices.</text><rect x="24" y="616" width="592" height="34" rx="9" fill="#fbecec" stroke="#e8b4b4"/><text x="320" y="638" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">Honey disqualifies it. Omitting any one of its spices: liable to death.</text>
</svg>
