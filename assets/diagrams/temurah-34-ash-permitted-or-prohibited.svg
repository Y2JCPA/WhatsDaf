<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 548" width="640" height="548" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="640" height="548" rx="18" fill="#f3f6fb"/><text x="320" y="44" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">Is the ash permitted?</text><text x="320" y="70" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="middle">Why what is buried may not be burned, and the challenges (34a)</text><rect x="24" y="88" width="592" height="88" rx="10" fill="#ffffff" stroke="#d5dde9"/><text x="40" y="112" font-size="11" font-weight="700" fill="#475569" text-anchor="start">THE GEMARA’S REASON</text><text x="40" y="136" font-size="14" font-weight="700" fill="#9f1239" text-anchor="start">Buried items: their ash is prohibited.</text><text x="330" y="136" font-size="14" font-weight="700" fill="#166534" text-anchor="start">Burned items: their ash is permitted.</text><text x="40" y="160" font-size="13" font-weight="400" fill="#374151" text-anchor="start">So one may not burn what is buried, lest he come to derive benefit from its ash.</text><text x="28" y="208" font-size="13.5" font-weight="700" fill="#9f1239" text-anchor="start">Is the ash of buried items</text><text x="28" y="226" font-size="13.5" font-weight="700" fill="#9f1239" text-anchor="start">prohibited?</text><rect x="24" y="240" width="288" height="92" rx="10" fill="#fdf0f3" stroke="#e7a3b5"/><text x="38" y="262" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Baraita: the blood of a menstruating</text><text x="38" y="280" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">woman and the flesh of a corpse that</text><text x="38" y="298" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">crumbled are ritually pure.</text><text x="38" y="320" font-size="13" font-weight="700" fill="#9f1239" text-anchor="start">No: pure, but prohibited.</text><rect x="24" y="342" width="288" height="110" rx="10" fill="#fdf0f3" stroke="#e7a3b5"/><text x="38" y="364" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Rav Pineḥas, from a baraita: the crop</text><text x="38" y="382" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">and feathers of a bird burnt offering</text><text x="38" y="400" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">whose blood was squeezed have been</text><text x="38" y="418" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">removed from misuse.</text><text x="38" y="440" font-size="13" font-weight="700" fill="#9f1239" text-anchor="start">No: removed from misuse, but prohibited.</text><text x="332" y="208" font-size="13.5" font-weight="700" fill="#166534" text-anchor="start">Is the ash of burned consecrated</text><text x="332" y="226" font-size="13.5" font-weight="700" fill="#166534" text-anchor="start">items permitted?</text><rect x="328" y="240" width="288" height="88" rx="10" fill="#e7f5ec" stroke="#7cc49a"/><text x="342" y="262" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Baraita: the ash of all items that are</text><text x="342" y="280" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">burned is permitted, except ashera</text><text x="342" y="298" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">wood; ash of consecrated property is</text><text x="342" y="316" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">prohibited forever.</text><rect x="328" y="338" width="288" height="88" rx="10" fill="#ffffff" stroke="#7cc49a"/><text x="342" y="360" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Rami bar Ḥama: a fire fell by itself</text><text x="342" y="378" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">onto consecrated wood; no person</text><text x="342" y="396" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">misused it, so its ash does not become</text><text x="342" y="414" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">non-sacred.</text><rect x="328" y="436" width="288" height="88" rx="10" fill="#ffffff" stroke="#7cc49a"/><text x="342" y="458" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">Rav Shemaya: the baraita speaks of the</text><text x="342" y="476" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">removal of the ashes, which are placed</text><text x="342" y="494" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">beside the altar: “and he shall put</text><text x="342" y="512" font-size="13" font-weight="400" fill="#1f2937" text-anchor="start">them.”</text></svg>