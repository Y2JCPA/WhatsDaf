<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 530" width="640" height="530" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="530" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Twenty-five years of captivity</text><text x="320" y="68" text-anchor="middle" font-size="14" fill="#4b5563">Arakhin 12a–b: two exiles, and the count behind Ezekiel 40:1</text><rect x="24" y="86" width="150" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="34" y="103" font-size="13" font-weight="600" fill="#1f2937">Nebuchadnezzar’s</text><text x="34" y="118" font-size="13" font-weight="600" fill="#1f2937">reign</text><rect x="182" y="86" width="104" height="40" rx="9" fill="#1e3a5f"/><text x="234" y="110.5" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Year 1</text><rect x="292" y="86" width="104" height="40" rx="9" fill="#1e3a5f"/><text x="344" y="110.5" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Year 2</text><rect x="402" y="86" width="104" height="40" rx="9" fill="#1e3a5f"/><text x="454" y="110.5" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Year 8</text><rect x="512" y="86" width="104" height="40" rx="9" fill="#1e3a5f"/><text x="564" y="110.5" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Year 19</text><rect x="24" y="132" width="150" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="34" y="149" font-size="13" font-weight="600" fill="#1f2937">From subjugating</text><text x="34" y="164" font-size="13" font-weight="600" fill="#1f2937">Jehoiakim</text><rect x="182" y="132" width="104" height="40" rx="9" fill="#dbe7f5" stroke="#a9c1de"/><text x="234" y="156.5" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a5f">—</text><rect x="292" y="132" width="104" height="40" rx="9" fill="#dbe7f5" stroke="#a9c1de"/><text x="344" y="156.5" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a5f">Year 1</text><rect x="402" y="132" width="104" height="40" rx="9" fill="#dbe7f5" stroke="#a9c1de"/><text x="454" y="156.5" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a5f">Year 7</text><rect x="512" y="132" width="104" height="40" rx="9" fill="#dbe7f5" stroke="#a9c1de"/><text x="564" y="156.5" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a5f">Year 18</text><text x="390" y="144" text-anchor="end" font-size="10.5" font-style="italic" fill="#6b7280">implied</text><rect x="24" y="178" width="150" height="84" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="34" y="224.5" font-size="13" font-weight="600" fill="#1f2937">What happened</text><rect x="182" y="178" width="104" height="84" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="234" y="216.5" text-anchor="middle" font-size="12.5" fill="#1f2937">Conquers</text><text x="234" y="232.5" text-anchor="middle" font-size="12.5" fill="#1f2937">Nineveh</text><rect x="292" y="178" width="104" height="84" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="344" y="216.5" text-anchor="middle" font-size="12.5" fill="#1f2937">Conquers</text><text x="344" y="232.5" text-anchor="middle" font-size="12.5" fill="#1f2937">Jehoiakim</text><rect x="402" y="178" width="104" height="84" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="454" y="200.5" text-anchor="middle" font-size="12.5" fill="#1f2937">First exile:</text><text x="454" y="216.5" text-anchor="middle" font-size="12.5" fill="#1f2937">Jehoiachin,</text><text x="454" y="232.5" text-anchor="middle" font-size="12.5" fill="#1f2937">Ezekiel among</text><text x="454" y="248.5" text-anchor="middle" font-size="12.5" fill="#1f2937">them (Rashi)</text><rect x="512" y="178" width="104" height="84" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="564" y="208.5" text-anchor="middle" font-size="12.5" fill="#1f2937">Second exile:</text><text x="564" y="224.5" text-anchor="middle" font-size="12.5" fill="#1f2937">the Temple</text><text x="564" y="240.5" text-anchor="middle" font-size="12.5" fill="#1f2937">destroyed</text><text x="24" y="300" font-size="14" font-weight="700" fill="#1f2937">Counting the twenty-five years, as the Gemara concludes</text><rect x="24" y="314" width="96" height="76" rx="9" fill="#eceff3" stroke="#cbd5e1"/><text x="72" y="340.5" text-anchor="middle" font-size="12" fill="#4b5563">Year of</text><text x="72" y="356.5" text-anchor="middle" font-size="12" fill="#4b5563">the exile</text><text x="72" y="372.5" text-anchor="middle" font-size="12" fill="#4b5563">not counted</text><rect x="126" y="314" width="226" height="76" rx="9" fill="#dbe7f5" stroke="#a9c1de"/><text x="239" y="339.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a5f">11 years</text><text x="239" y="356.5" text-anchor="middle" font-size="12.5" fill="#1e3a5f">from the exile to the destruction</text><text x="239" y="373.5" text-anchor="middle" font-size="12.5" fill="#1e3a5f">ending with the year of destruction</text><text x="346" y="328" text-anchor="end" font-size="10.5" font-style="italic" fill="#6b7280">implied</text><rect x="358" y="314" width="258" height="76" rx="9" fill="#e7f6ec" stroke="#9fd3b0"/><text x="487" y="339.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">14 years</text><text x="487" y="356.5" text-anchor="middle" font-size="12.5" fill="#166534">“in the fourteenth year after the</text><text x="487" y="373.5" text-anchor="middle" font-size="12.5" fill="#166534">year that the city was smitten” (Ravina)</text><path d="M604 392 L604 410" stroke="#166534" stroke-width="2"/><path d="M598 404 L604 412 L610 404" fill="none" stroke="#166534" stroke-width="2"/><text x="616" y="428" text-anchor="end" font-size="12.5" font-weight="600" fill="#166534">The Jubilee: “at the beginning of the year, on the tenth day of the month”</text><text x="320" y="458" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">11 + 14 = 25: “in the twenty-fifth year of our captivity”</text><text x="24" y="484" font-size="12" fill="#4b5563">The baraita’s “seventh … eighth” and “eighteenth … nineteenth” are one exile each, counted from</text><text x="24" y="501" font-size="12" fill="#4b5563">the subjugation and from Nebuchadnezzar’s reign. The destruction fell in year 36 of the Jubilee</text><text x="24" y="518" font-size="12" fill="#4b5563">cycle, the year after a Sabbatical Year, and the Jubilee came fourteen years later.</text>
</svg>
