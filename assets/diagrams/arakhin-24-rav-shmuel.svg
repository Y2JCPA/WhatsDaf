<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 692" width="640" height="692" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="692" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">A field consecrated in the Jubilee Year</text>
  <text x="320" y="70" text-anchor="middle" font-size="14" fill="#4b5563">Rav and Shmuel, an ancestral field, per beit kor (24a–b)</text>
  <text x="306" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#33691e">Rav</text>
  <text x="516" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#1c3f78">Shmuel</text>
  <rect x="24" y="118" width="172" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="110" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Consecrated in the</text>
  <text x="110" y="161" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Jubilee Year itself</text>
  <text x="110" y="177" text-anchor="middle" font-size="11" fill="#6b7280">24a</text>
  <rect x="206" y="118" width="200" height="76" rx="10" fill="#eaf4e2" stroke="#a5c98b"/>
  <text x="306" y="144" text-anchor="middle" font-size="13.5" fill="#2f5517">Consecrated;</text>
  <text x="306" y="161" text-anchor="middle" font-size="13.5" fill="#2f5517">redeemed for the</text>
  <text x="306" y="178" text-anchor="middle" font-size="13.5" fill="#2f5517">full fifty sela</text>
  <rect x="416" y="118" width="200" height="76" rx="10" fill="#e3edfb" stroke="#8fb0e0"/>
  <text x="516" y="152.5" text-anchor="middle" font-size="13.5" fill="#1c3f78">Not consecrated</text>
  <text x="516" y="169.5" text-anchor="middle" font-size="13.5" fill="#1c3f78">at all</text>
  <rect x="24" y="202" width="172" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="110" y="229" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">“If from the Jubilee</text>
  <text x="110" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Year”: full valuation</text>
  <text x="110" y="261" text-anchor="middle" font-size="11" fill="#6b7280">Leviticus 27:17</text>
  <rect x="206" y="202" width="200" height="76" rx="10" fill="#eaf4e2" stroke="#a5c98b"/>
  <text x="306" y="236.5" text-anchor="middle" font-size="13.5" fill="#2f5517">The Jubilee Year</text>
  <text x="306" y="253.5" text-anchor="middle" font-size="13.5" fill="#2f5517">itself is included</text>
  <rect x="416" y="202" width="200" height="76" rx="10" fill="#e3edfb" stroke="#8fb0e0"/>
  <text x="516" y="236.5" text-anchor="middle" font-size="13.5" fill="#1c3f78">From the year</text>
  <text x="516" y="253.5" text-anchor="middle" font-size="13.5" fill="#1c3f78">after the Jubilee</text>
  <rect x="24" y="286" width="172" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="110" y="313" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">“But if after the</text>
  <text x="110" y="329" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Jubilee”: a deduction</text>
  <text x="110" y="345" text-anchor="middle" font-size="11" fill="#6b7280">Leviticus 27:18</text>
  <rect x="206" y="286" width="200" height="76" rx="10" fill="#eaf4e2" stroke="#a5c98b"/>
  <text x="306" y="320.5" text-anchor="middle" font-size="13.5" fill="#2f5517">The year after</text>
  <text x="306" y="337.5" text-anchor="middle" font-size="13.5" fill="#2f5517">the Jubilee</text>
  <rect x="416" y="286" width="200" height="76" rx="10" fill="#e3edfb" stroke="#8fb0e0"/>
  <text x="516" y="320.5" text-anchor="middle" font-size="13.5" fill="#1c3f78">The year after the</text>
  <text x="516" y="337.5" text-anchor="middle" font-size="13.5" fill="#1c3f78">year after the Jubilee</text>
  <rect x="24" y="370" width="172" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="110" y="397" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Rav Yosef’s</text>
  <text x="110" y="413" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">a fortiori from sale</text>
  <text x="110" y="429" text-anchor="middle" font-size="11" fill="#6b7280">24a–b</text>
  <rect x="206" y="370" width="200" height="76" rx="10" fill="#eaf4e2" stroke="#a5c98b"/>
  <text x="306" y="396" text-anchor="middle" font-size="13.5" fill="#2f5517">Fails: the field goes</text>
  <text x="306" y="413" text-anchor="middle" font-size="13.5" fill="#2f5517">to the priests, it does</text>
  <text x="306" y="430" text-anchor="middle" font-size="13.5" fill="#2f5517">not return to the owner</text>
  <rect x="416" y="370" width="200" height="76" rx="10" fill="#e3edfb" stroke="#8fb0e0"/>
  <text x="516" y="396" text-anchor="middle" font-size="13.5" fill="#1c3f78">Holds, following</text>
  <text x="516" y="413" text-anchor="middle" font-size="13.5" fill="#1c3f78">Rabbi Shimon: the priests</text>
  <text x="516" y="430" text-anchor="middle" font-size="13.5" fill="#1c3f78">enter but do not pay</text>
  <rect x="24" y="454" width="172" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="110" y="473" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">The baraita: “if he</text>
  <text x="110" y="489" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">consecrated it, it is</text>
  <text x="110" y="505" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">not consecrated”</text>
  <text x="110" y="521" text-anchor="middle" font-size="11" fill="#6b7280">24b</text>
  <rect x="206" y="454" width="200" height="76" rx="10" fill="#eaf4e2" stroke="#a5c98b"/>
  <text x="306" y="480" text-anchor="middle" font-size="13.5" fill="#2f5517">Follows the Rabbis;</text>
  <text x="306" y="497" text-anchor="middle" font-size="13.5" fill="#2f5517">Rav rules like Rabbi:</text>
  <text x="306" y="514" text-anchor="middle" font-size="13.5" fill="#2f5517">“the first is included”</text>
  <rect x="416" y="454" width="200" height="76" rx="10" fill="#e3edfb" stroke="#8fb0e0"/>
  <text x="516" y="480" text-anchor="middle" font-size="13.5" fill="#1c3f78">Even Rabbi agrees here,</text>
  <text x="516" y="497" text-anchor="middle" font-size="13.5" fill="#1c3f78">since “until” is not</text>
  <text x="516" y="514" text-anchor="middle" font-size="13.5" fill="#1c3f78">written (Rashi)</text>
  <rect x="24" y="538" width="172" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="110" y="565" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Rabbi’s “a sela and</text>
  <text x="110" y="581" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">a pundeyon” a year</text>
  <text x="110" y="597" text-anchor="middle" font-size="11" fill="#6b7280">24b</text>
  <rect x="206" y="538" width="200" height="76" rx="10" fill="#eaf4e2" stroke="#a5c98b"/>
  <text x="306" y="564" text-anchor="middle" font-size="13.5" fill="#2f5517">Rabbi follows Rabbi</text>
  <text x="306" y="581" text-anchor="middle" font-size="13.5" fill="#2f5517">Yehuda: the fiftieth year</text>
  <text x="306" y="598" text-anchor="middle" font-size="13.5" fill="#2f5517">counts for both cycles</text>
  <rect x="416" y="538" width="200" height="76" rx="10" fill="#e3edfb" stroke="#8fb0e0"/>
  <text x="516" y="572.5" text-anchor="middle" font-size="13.5" fill="#1c3f78">Rabbi follows</text>
  <text x="516" y="589.5" text-anchor="middle" font-size="13.5" fill="#1c3f78">the Rabbis</text>
  <rect x="24" y="624" width="592" height="50" rx="10" fill="#e8eef8"/>
  <text x="40" y="645" font-size="13" fill="#374151"><tspan font-weight="700">Both agree:</tspan> a field consecrated less than two years before the Jubilee</text>
  <text x="40" y="663" font-size="13" fill="#374151">is not redeemed with a deduction (24a).</text>
</svg>
