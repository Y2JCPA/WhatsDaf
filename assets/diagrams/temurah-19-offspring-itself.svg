<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 632" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>When is the offspring itself offered?</title>
  <rect width="640" height="632" rx="18" fill="#f3f6fb"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1f2d3d">When is the offspring itself offered?</text>
  <text x="32" y="70" font-size="14" fill="#5b6b7d">A female set aside for a Paschal offering, which must be a male,</text>
  <text x="32" y="90" font-size="14" fill="#5b6b7d">gives birth to a male. The baraitot on 19a, and the Gemara’s readings.</text>
  <g font-size="12" font-weight="700" fill="#7f8fa3" letter-spacing="0.6">
    <text x="182" y="110">THE RABBIS</text>
    <text x="388" y="110">RABBI ELAZAR</text>
  </g>
  <rect x="32" y="118" width="576" height="132" rx="10" fill="#ffffff" stroke="#dfe8f3"/>
  <text x="46" y="144" font-size="14" font-weight="700" fill="#1f2d3d">Gave birth</text>
  <text x="46" y="162" font-size="14" font-weight="700" fill="#1f2d3d">before Passover</text>
  <text x="46" y="184" font-size="11.5" fill="#7f8fa3">First baraita</text>
  <rect x="170" y="128" width="196" height="112" rx="9" fill="#e3edf9"/>
  <text x="182" y="150" font-size="12.5" fill="#1f4e79">Offspring grazes until unfit;</text>
  <text x="182" y="168" font-size="12.5" fill="#1f4e79">a Paschal offering is</text>
  <text x="182" y="186" font-size="12.5" fill="#1f4e79">brought with its money</text>
  <rect x="376" y="128" width="222" height="112" rx="9" fill="#fdf0d8"/>
  <text x="388" y="150" font-size="12.5" font-weight="700" fill="#7a4a00">The baraita states</text>
  <text x="388" y="168" font-size="12.5" font-weight="700" fill="#7a4a00">no dispute here</text>
  <text x="590" y="150" font-size="10.5" text-anchor="end" fill="#a07a40">implied</text>
  <text x="388" y="186" font-size="12.5" fill="#7a4a00">Rava: he disagrees here too</text>
  <text x="388" y="204" font-size="12.5" fill="#7a4a00">Abaye: nobody disagrees; the</text>
  <text x="388" y="222" font-size="12.5" fill="#7a4a00">offspring, like its mother, is for</text>
  <text x="388" y="240" font-size="12.5" fill="#7a4a00">the value of a Paschal offering</text>
  <rect x="32" y="260" width="576" height="132" rx="10" fill="#ffffff" stroke="#dfe8f3"/>
  <text x="46" y="286" font-size="14" font-weight="700" fill="#1f2d3d">Remained until</text>
  <text x="46" y="304" font-size="14" font-weight="700" fill="#1f2d3d">after Passover,</text>
  <text x="46" y="322" font-size="14" font-weight="700" fill="#1f2d3d">then gave birth</text>
  <text x="46" y="344" font-size="11.5" fill="#7f8fa3">First baraita</text>
  <rect x="170" y="270" width="196" height="112" rx="9" fill="#e3edf9"/>
  <text x="182" y="292" font-size="12.5" fill="#1f4e79">Offspring grazes until unfit;</text>
  <text x="182" y="310" font-size="12.5" fill="#1f4e79">a peace offering is brought</text>
  <text x="182" y="328" font-size="12.5" fill="#1f4e79">with its money</text>
  <rect x="376" y="270" width="222" height="112" rx="9" fill="#fdf0d8"/>
  <text x="388" y="292" font-size="12.5" font-weight="700" fill="#7a4a00">The offspring itself is</text>
  <text x="388" y="310" font-size="12.5" font-weight="700" fill="#7a4a00">sacrificed as a peace offering</text>
  <text x="388" y="328" font-size="12.5" fill="#7a4a00">Rava: a leftover Paschal offering</text>
  <text x="388" y="346" font-size="12.5" fill="#7a4a00">is itself a peace offering</text>
  <text x="388" y="364" font-size="12.5" fill="#7a4a00">Abaye: the offspring goes</text>
  <text x="388" y="382" font-size="12.5" fill="#7a4a00">where the leftover goes</text>
  <rect x="32" y="402" width="576" height="116" rx="10" fill="#ffffff" stroke="#dfe8f3"/>
  <text x="46" y="428" font-size="14" font-weight="700" fill="#1f2d3d">“It and its</text>
  <text x="46" y="446" font-size="14" font-weight="700" fill="#1f2d3d">offspring”</text>
  <text x="46" y="468" font-size="11.5" fill="#7f8fa3">Second baraita</text>
  <rect x="170" y="412" width="196" height="96" rx="9" fill="#e3edf9"/>
  <text x="182" y="434" font-size="12.5" fill="#1f4e79">Both graze until unfit;</text>
  <text x="182" y="452" font-size="12.5" fill="#1f4e79">a Paschal offering is</text>
  <text x="182" y="470" font-size="12.5" fill="#1f4e79">brought with their money</text>
  <rect x="376" y="412" width="222" height="96" rx="9" fill="#fdf0d8"/>
  <text x="388" y="434" font-size="12.5" font-weight="700" fill="#7a4a00">The offspring itself is</text>
  <text x="388" y="452" font-size="12.5" font-weight="700" fill="#7a4a00">sacrificed as a Paschal offering</text>
  <text x="388" y="470" font-size="12.5" fill="#7a4a00">Ravina: it was pregnant when set</text>
  <text x="388" y="488" font-size="12.5" fill="#7a4a00">aside, and a fetus is not its</text>
  <text x="388" y="506" font-size="12.5" fill="#7a4a00">mother’s thigh (Rabbi Yoḥanan)</text>
  <rect x="32" y="528" width="576" height="82" rx="10" fill="#ffffff" stroke="#dfe8f3"/>
  <text x="46" y="554" font-size="14" font-weight="700" fill="#1f2d3d">Set aside for</text>
  <text x="46" y="572" font-size="14" font-weight="700" fill="#1f2d3d">a guilt offering</text>
  <text x="46" y="592" font-size="11.5" fill="#7f8fa3">19b</text>
  <rect x="170" y="538" width="428" height="62" rx="9" fill="#fdf0d8"/>
  <text x="182" y="560" font-size="12.5" font-weight="700" fill="#7a4a00">Rabbi Yosei son of Rabbi Ḥanina: Rabbi Elazar concedes</text>
  <text x="182" y="578" font-size="12.5" fill="#7a4a00">its offspring is not sacrificed as a guilt offering, as there is</text>
  <text x="182" y="594" font-size="12.5" fill="#7a4a00">no guilt offering status for its mother</text>
</svg>
