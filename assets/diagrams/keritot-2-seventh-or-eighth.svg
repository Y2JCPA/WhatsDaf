<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 574" width="640" height="574" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<rect x="0" y="0" width="640" height="574" rx="18" fill="#f3f6fb"/>
<text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">The impure nazirite: seventh or eighth?</text>
<text x="320" y="70" text-anchor="middle" font-size="13.5" font-style="italic" fill="#4b5563">“And he shall sanctify his head that same day” (Numbers 6:11)</text>
<rect x="40" y="92" width="64" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="72" y="117" text-anchor="middle" font-size="13" fill="#1f2937">Day 1</text>
<rect x="110" y="92" width="64" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="142" y="117" text-anchor="middle" font-size="13" fill="#1f2937">Day 2</text>
<rect x="180" y="92" width="64" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="212" y="117" text-anchor="middle" font-size="13" fill="#1f2937">Day 3</text>
<rect x="250" y="92" width="64" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="282" y="117" text-anchor="middle" font-size="13" fill="#1f2937">Day 4</text>
<rect x="320" y="92" width="64" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="352" y="117" text-anchor="middle" font-size="13" fill="#1f2937">Day 5</text>
<rect x="390" y="92" width="64" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<text x="422" y="117" text-anchor="middle" font-size="13" fill="#1f2937">Day 6</text>
<rect x="460" y="92" width="64" height="40" rx="8" fill="#fdf6e7" stroke="#e0c48a"/>
<text x="492" y="117" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Day 7</text>
<rect x="530" y="92" width="64" height="40" rx="8" fill="#e1f3e5" stroke="#7cbf8a"/>
<text x="562" y="117" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Day 8</text>
<text x="492" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#7a5a12">shaving</text>
<text x="562" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#1d5e2c">offerings</text>
<text x="40" y="150" font-size="12" fill="#6b7280">Days of purification after impurity</text>
<rect x="32" y="172" width="282" height="92" rx="10" fill="#ffffff" stroke="#7cbf8a"/>
<text x="173" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Rabbi</text>
<text x="173" y="220" text-anchor="middle" font-size="12.5" fill="#1f2937">“That same day”: the day of</text>
<text x="173" y="238" text-anchor="middle" font-size="12.5" fill="#1f2937">bringing his offerings, the eighth</text>
<text x="173" y="256" text-anchor="middle" font-size="11.5" fill="#6b7280">naziriteship of purity from the 8th</text>
<rect x="326" y="172" width="282" height="92" rx="10" fill="#ffffff" stroke="#e0c48a"/>
<text x="467" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Rabbi Yosei son of Rabbi Yehuda</text>
<text x="467" y="220" text-anchor="middle" font-size="12.5" fill="#1f2937">“That same day”: the day of</text>
<text x="467" y="238" text-anchor="middle" font-size="12.5" fill="#1f2937">his shaving, the seventh</text>
<text x="467" y="256" text-anchor="middle" font-size="11.5" fill="#6b7280">naziriteship of purity from the 7th</text>
<text x="320" y="290" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Two cases of repeated impurity</text>
<text x="320" y="318" text-anchor="middle" font-size="12.5" font-weight="700" fill="#374151">Rabbi</text>
<text x="517" y="318" text-anchor="middle" font-size="12.5" font-weight="700" fill="#374151">Rabbi Yosei son of R. Yehuda</text>
<rect x="32" y="330" width="182" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="44" y="357" font-size="12.5" font-weight="700" fill="#1f2937">Impure on the 7th,</text>
<text x="44" y="375" font-size="12.5" font-weight="700" fill="#1f2937">and again on the 7th</text>
<rect x="222" y="330" width="196" height="64" rx="10" fill="#fde2e2" stroke="#e08a8a"/>
<text x="320" y="357" text-anchor="middle" font-size="13" font-weight="700" fill="#8b1c1c">One long impurity</text>
<text x="320" y="376" text-anchor="middle" font-size="11" fill="#4b5563">not “several impurities”</text>
<rect x="426" y="330" width="182" height="64" rx="10" fill="#fdf6e7" stroke="#e0c48a"/>
<text x="517" y="357" text-anchor="middle" font-size="13" font-weight="700" fill="#7a5a12">Several impurities,</text>
<text x="517" y="376" text-anchor="middle" font-size="11" fill="#4b5563">one offering</text>
<rect x="32" y="402" width="182" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="44" y="429" font-size="12.5" font-weight="700" fill="#1f2937">Impure on the 8th,</text>
<text x="44" y="447" font-size="12.5" font-weight="700" fill="#1f2937">and again on the 8th</text>
<rect x="222" y="402" width="196" height="64" rx="10" fill="#e1f3e5" stroke="#7cbf8a"/>
<text x="320" y="429" text-anchor="middle" font-size="13" font-weight="700" fill="#1d5e2c">Liable for each one</text>
<text x="320" y="448" text-anchor="middle" font-size="11" fill="#4b5563">he left at a time fit for an offering</text>
<rect x="426" y="402" width="182" height="64" rx="10" fill="#e1f3e5" stroke="#7cbf8a"/>
<text x="517" y="429" text-anchor="middle" font-size="13" font-weight="700" fill="#1d5e2c">Liable for each one</text>
<text x="517" y="448" text-anchor="middle" font-size="11" font-style="italic" fill="#4b5563">implied</text>
<rect x="32" y="480" width="576" height="70" rx="10" fill="#e8eef8" stroke="#9fb3d9"/>
<text x="320" y="508" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">The mishna’s five include “a nazirite impure several times,”</text>
<text x="320" y="530" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">so it follows Rabbi Yosei son of Rabbi Yehuda.</text>
</svg>
