<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="640" height="560" rx="18" fill="#f3f6fb" stroke="none"/>
  <text x="320" y="44" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">Paying the Temple the difference</text>
  <text x="320" y="70" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="middle">Rabbi Yoḥanan and Reish Lakish: which case do they dispute? (27a–b)</text>
  <text x="34" y="108" font-size="11.5" font-weight="700" fill="#475569" text-anchor="start">THE CASE</text>
  <text x="262" y="101" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">RABBI</text>
  <text x="262" y="115" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">YOḤANAN</text>
  <text x="362" y="101" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">REISH</text>
  <text x="362" y="115" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">LAKISH</text>
  <text x="518" y="108" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">WHAT FOLLOWS</text>
  <rect x="20" y="126" width="188" height="92" rx="10" fill="#ffffff" stroke="#d5dde9"/>
  <text x="34" y="156" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">Exactly one-sixth</text>
  <text x="34" y="174" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">(exploitation)</text>
  <text x="34" y="200" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">first suggestion</text>
  <rect x="216" y="126" width="92" height="92" rx="10" fill="#ffffff" stroke="#d5dde9"/>
  <rect x="224" y="157" width="76" height="30" rx="15" fill="#fff2d2" stroke="#e6c879"/>
  <text x="262" y="177" font-size="12.5" font-weight="700" fill="#7a5300" text-anchor="middle">Rabbinic</text>
  <rect x="316" y="126" width="92" height="92" rx="10" fill="#ffffff" stroke="#d5dde9"/>
  <rect x="324" y="157" width="76" height="30" rx="15" fill="#dbe7fb" stroke="#9db8e8"/>
  <text x="362" y="177" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Torah law</text>
  <rect x="416" y="126" width="204" height="92" rx="10" fill="#fde4e2" stroke="#e8a9a3"/>
  <text x="518" y="149" font-size="12" font-weight="600" fill="#8f1d16" text-anchor="middle">Difficulty: the mishna</text>
  <text x="518" y="165" font-size="12" font-weight="600" fill="#8f1d16" text-anchor="middle">(Bava Metzia 56a) says</text>
  <text x="518" y="181" font-size="12" font-weight="600" fill="#8f1d16" text-anchor="middle">consecrated property is not</text>
  <text x="518" y="197" font-size="12" font-weight="600" fill="#8f1d16" text-anchor="middle">subject to exploitation</text>
  <rect x="20" y="228" width="188" height="92" rx="10" fill="#ffffff" stroke="#d5dde9"/>
  <text x="34" y="258" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">More than one-sixth</text>
  <text x="34" y="276" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">(nullification)</text>
  <text x="34" y="302" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">second suggestion</text>
  <rect x="216" y="228" width="92" height="92" rx="10" fill="#ffffff" stroke="#d5dde9"/>
  <rect x="224" y="259" width="76" height="30" rx="15" fill="#fff2d2" stroke="#e6c879"/>
  <text x="262" y="279" font-size="12.5" font-weight="700" fill="#7a5300" text-anchor="middle">Rabbinic</text>
  <rect x="316" y="228" width="92" height="92" rx="10" fill="#ffffff" stroke="#d5dde9"/>
  <rect x="324" y="259" width="76" height="30" rx="15" fill="#dbe7fb" stroke="#9db8e8"/>
  <text x="362" y="279" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Torah law</text>
  <rect x="416" y="228" width="204" height="92" rx="10" fill="#fde4e2" stroke="#e8a9a3"/>
  <text x="518" y="251" font-size="12" font-weight="600" fill="#8f1d16" text-anchor="middle">Difficulty: Rabbi Yona says</text>
  <text x="518" y="267" font-size="12" font-weight="600" fill="#8f1d16" text-anchor="middle">in Rabbi Yoḥanan’s name that</text>
  <text x="518" y="283" font-size="12" font-weight="600" fill="#8f1d16" text-anchor="middle">consecrated property is subject</text>
  <text x="518" y="299" font-size="12" font-weight="600" fill="#8f1d16" text-anchor="middle">to nullification</text>
  <rect x="20" y="330" width="188" height="92" rx="10" fill="#ffffff" stroke="#d5dde9"/>
  <text x="34" y="360" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">More than one-sixth,</text>
  <text x="34" y="378" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">attributions reversed</text>
  <text x="34" y="404" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">works for Rabbi Yona</text>
  <rect x="216" y="330" width="92" height="92" rx="10" fill="#ffffff" stroke="#d5dde9"/>
  <rect x="224" y="361" width="76" height="30" rx="15" fill="#dbe7fb" stroke="#9db8e8"/>
  <text x="262" y="381" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Torah law</text>
  <rect x="316" y="330" width="92" height="92" rx="10" fill="#ffffff" stroke="#d5dde9"/>
  <rect x="324" y="361" width="76" height="30" rx="15" fill="#fff2d2" stroke="#e6c879"/>
  <text x="362" y="381" font-size="12.5" font-weight="700" fill="#7a5300" text-anchor="middle">Rabbinic</text>
  <rect x="416" y="330" width="204" height="92" rx="10" fill="#e2f3e7" stroke="#9fd0ae"/>
  <text x="518" y="353" font-size="12" font-weight="600" fill="#1d5e34" text-anchor="middle">But Rabbi Yirmeya, in whose</text>
  <text x="518" y="369" font-size="12" font-weight="600" fill="#1d5e34" text-anchor="middle">version only lands are subject</text>
  <text x="518" y="385" font-size="12" font-weight="600" fill="#1d5e34" text-anchor="middle">to nullification, says:</text>
  <text x="518" y="401" font-size="12" font-weight="600" fill="#1d5e34" text-anchor="middle">do not reverse</text>
  <rect x="20" y="432" width="188" height="92" rx="10" fill="#ffffff" stroke="#d5dde9"/>
  <text x="34" y="462" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">Exactly one-sixth,</text>
  <text x="34" y="480" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">not reversed</text>
  <text x="34" y="506" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start" font-style="italic">“if you wish, say”</text>
  <rect x="216" y="432" width="92" height="92" rx="10" fill="#ffffff" stroke="#d5dde9"/>
  <rect x="224" y="463" width="76" height="30" rx="15" fill="#fff2d2" stroke="#e6c879"/>
  <text x="262" y="483" font-size="12.5" font-weight="700" fill="#7a5300" text-anchor="middle">Rabbinic</text>
  <rect x="316" y="432" width="92" height="92" rx="10" fill="#ffffff" stroke="#d5dde9"/>
  <rect x="324" y="463" width="76" height="30" rx="15" fill="#dbe7fb" stroke="#9db8e8"/>
  <text x="362" y="483" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Torah law</text>
  <rect x="416" y="432" width="204" height="92" rx="10" fill="#e2f3e7" stroke="#9fd0ae"/>
  <text x="518" y="455" font-size="12" font-weight="600" fill="#1d5e34" text-anchor="middle">The mishna follows Rav Ḥisda:</text>
  <text x="518" y="471" font-size="12" font-weight="600" fill="#1d5e34" text-anchor="middle">not the usual rules, as one</text>
  <text x="518" y="487" font-size="12" font-weight="600" fill="#1d5e34" text-anchor="middle">may renege even for less</text>
  <text x="518" y="503" font-size="12" font-weight="600" fill="#1d5e34" text-anchor="middle">than one-sixth</text>
  <text x="320" y="548" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">Torah law or rabbinic: the source of the duty to conduct an appraisal and pay the difference.</text>
</svg>
