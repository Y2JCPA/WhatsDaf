<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 436" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>Rav Shimi bar Ziri’s baraita</title>
  <rect width="640" height="436" rx="18" fill="#f3f6fb"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1f2d3d">Rav Shimi bar Ziri’s baraita</text>
  <text x="32" y="70" font-size="14" fill="#5b6b7d">A sin offering was lost and another took its place. Does the one</text>
  <text x="32" y="90" font-size="14" fill="#5b6b7d">not sacrificed die or graze, according to Rabbi and to the Rabbis?</text>

  <g font-size="12" font-weight="700" fill="#7f8fa3" letter-spacing="0.6">
    <text x="292" y="126" text-anchor="middle">AS HE TAUGHT IT</text>
    <text x="508" y="126" text-anchor="middle">“RATHER, TEACH IT THUS”</text>
  </g>
  <g font-size="13" font-weight="700" fill="#1f2d3d" text-anchor="middle">
    <text x="240" y="150">Rabbi</text>
    <text x="344" y="150">The Rabbis</text>
    <text x="456" y="150">Rabbi</text>
    <text x="560" y="150">The Rabbis</text>
  </g>

  <!-- Row 1: lost at the designation -->
  <rect x="32" y="162" width="576" height="76" rx="10" fill="#ffffff" stroke="#dfe8f3"/>
  <text x="46" y="186" font-size="14" font-weight="700" fill="#1f2d3d">Lost at the</text>
  <text x="46" y="204" font-size="14" font-weight="700" fill="#1f2d3d">designation</text>
  <text x="46" y="223" font-size="11.5" fill="#5b6b7d">found before the second</text>
  <rect x="194" y="172" width="92" height="56" rx="8" fill="#fbe3e1"/>
  <text x="240" y="206" font-size="14" font-weight="700" fill="#8a2a22" text-anchor="middle">dies</text>
  <rect x="298" y="172" width="92" height="56" rx="8" fill="#dff3e4"/>
  <text x="344" y="206" font-size="14" font-weight="700" fill="#1e6b3a" text-anchor="middle">grazes</text>
  <rect x="410" y="172" width="92" height="56" rx="8" fill="#fbe3e1"/>
  <text x="456" y="206" font-size="14" font-weight="700" fill="#8a2a22" text-anchor="middle">dies</text>
  <rect x="514" y="172" width="92" height="56" rx="8" fill="#dff3e4"/>
  <text x="560" y="206" font-size="14" font-weight="700" fill="#1e6b3a" text-anchor="middle">grazes</text>

  <!-- Row 2: lost at the atonement -->
  <rect x="32" y="248" width="576" height="76" rx="10" fill="#ffffff" stroke="#dfe8f3"/>
  <text x="46" y="272" font-size="14" font-weight="700" fill="#1f2d3d">Lost at the</text>
  <text x="46" y="290" font-size="14" font-weight="700" fill="#1f2d3d">atonement</text>
  <text x="46" y="309" font-size="11.5" fill="#5b6b7d">when another atoned</text>
  <rect x="194" y="258" width="92" height="56" rx="8" fill="#dff3e4"/>
  <text x="240" y="292" font-size="14" font-weight="700" fill="#1e6b3a" text-anchor="middle">grazes</text>
  <rect x="298" y="258" width="92" height="56" rx="8" fill="#fbe3e1"/>
  <text x="344" y="292" font-size="14" font-weight="700" fill="#8a2a22" text-anchor="middle">dies</text>
  <rect x="410" y="258" width="196" height="56" rx="8" fill="#fbe3e1"/>
  <text x="508" y="284" font-size="14" font-weight="700" fill="#8a2a22" text-anchor="middle">all agree: dies</text>
  <text x="508" y="302" font-size="11.5" fill="#8a2a22" text-anchor="middle">Rabbi and the Rabbis</text>

  <line x1="400" y1="112" x2="400" y2="324" stroke="#c9d6e6" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Rav Pappa's a fortiori -->
  <rect x="32" y="338" width="576" height="76" rx="10" fill="#fff6dd" stroke="#f0dfae"/>
  <text x="46" y="361" font-size="13" font-weight="700" fill="#6b4e00">Rav Pappa’s <tspan font-style="italic">a fortiori</tspan></text>
  <text x="46" y="381" font-size="12.5" fill="#6b4e00">Lost at the designation, the Rabbis say “graze” and Rabbi says “die”;</text>
  <text x="46" y="399" font-size="12.5" fill="#6b4e00">lost at the atonement, the Rabbis say “die”: all the more so Rabbi.</text>
</svg>
