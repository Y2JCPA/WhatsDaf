<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 649" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title>Blemish first or consecration first</title>
<rect width="640" height="649" rx="18" fill="#f3f6fb"/>
<text x="24" y="44" font-size="22" font-weight="700" fill="#1f2a3a">Which came first? The baraita’s two clauses</text>
<text x="24" y="68" font-size="13" fill="#4a5568">Redeemed blemished consecrated animals, in the baraita cited for Rav Sheshet (15b)</text>
<rect x="212" y="84" width="200" height="46" rx="10" fill="#bfe3c7"/>
<text x="312" y="103" font-size="14" font-weight="700" text-anchor="middle" fill="#1e5b31">Permanent blemish</text>
<text x="312" y="120" font-size="14" font-weight="700" text-anchor="middle" fill="#1e5b31">came first</text>
<rect x="420" y="84" width="196" height="46" rx="10" fill="#f6d8a8"/>
<text x="518" y="103" font-size="14" font-weight="700" text-anchor="middle" fill="#7a4a10">Consecration</text>
<text x="518" y="120" font-size="14" font-weight="700" text-anchor="middle" fill="#7a4a10">came first*</text>
<rect x="24" y="136" width="180" height="54" rx="8" fill="#e6ebf3"/>
<text x="36" y="168" font-size="13" font-weight="700" fill="#1f2a3a">Firstborn and the gifts</text>
<rect x="212" y="136" width="200" height="54" rx="8" fill="#e2f1e5"/>
<text x="312" text-anchor="middle" y="168" font-size="13" fill="#1e5b31">Obligated</text>
<rect x="420" y="136" width="196" height="54" rx="8" fill="#fbeedb"/>
<text x="518" text-anchor="middle" y="168" font-size="13" fill="#7a4a10">Exempt</text>
<rect x="24" y="196" width="180" height="54" rx="8" fill="#e6ebf3"/>
<text x="36" y="219.5" font-size="13" font-weight="700" fill="#1f2a3a">Shearing or labor,</text>
<text x="36" y="236.5" font-size="13" font-weight="700" fill="#1f2a3a">before or after</text>
<rect x="212" y="196" width="200" height="54" rx="8" fill="#e2f1e5"/>
<text x="312" text-anchor="middle" y="228" font-size="13" fill="#1e5b31">No forty lashes</text>
<rect x="420" y="196" width="196" height="54" rx="8" fill="#fbeedb"/>
<text x="518" text-anchor="middle" y="228" font-size="13" fill="#7a4a10">Forty lashes</text>
<rect x="24" y="256" width="180" height="54" rx="8" fill="#e6ebf3"/>
<text x="36" y="279.5" font-size="13" font-weight="700" fill="#1f2a3a">An animal substituted</text>
<text x="36" y="296.5" font-size="13" font-weight="700" fill="#1f2a3a">for them, before or after</text>
<rect x="212" y="256" width="200" height="54" rx="8" fill="#e2f1e5"/>
<text x="312" text-anchor="middle" y="288" font-size="13" fill="#1e5b31">Not sacred</text>
<rect x="420" y="256" width="196" height="54" rx="8" fill="#fbeedb"/>
<text x="518" text-anchor="middle" y="288" font-size="13" fill="#7a4a10">Sacred</text>
<rect x="24" y="316" width="180" height="54" rx="8" fill="#e6ebf3"/>
<text x="36" y="339.5" font-size="13" font-weight="700" fill="#1f2a3a">Misuse of consecrated</text>
<text x="36" y="356.5" font-size="13" font-weight="700" fill="#1f2a3a">property</text>
<rect x="212" y="316" width="200" height="54" rx="8" fill="#e2f1e5"/>
<text x="312" text-anchor="middle" y="339.5" font-size="13" fill="#1e5b31">Before redemption: liable</text>
<text x="312" text-anchor="middle" y="356.5" font-size="13" fill="#1e5b31">After redemption: not liable</text>
<rect x="420" y="316" width="196" height="54" rx="8" fill="#fbeedb"/>
<text x="518" text-anchor="middle" y="339.5" font-size="13" fill="#7a4a10">Before redemption: liable</text>
<text x="518" text-anchor="middle" y="356.5" font-size="13" fill="#7a4a10">After redemption: not liable</text>
<rect x="24" y="376" width="180" height="54" rx="8" fill="#e6ebf3"/>
<text x="36" y="408" font-size="13" font-weight="700" fill="#1f2a3a">Their offspring</text>
<rect x="212" y="376" width="200" height="54" rx="8" fill="#e2f1e5"/>
<text x="312" text-anchor="middle" y="399.5" font-size="13" fill="#1e5b31">Non-sacred; and may be</text>
<text x="312" text-anchor="middle" y="416.5" font-size="13" fill="#1e5b31">redeemed unblemished</text>
<rect x="420" y="376" width="196" height="54" rx="8" fill="#fbeedb"/>
<text x="518" text-anchor="middle" y="399.5" font-size="13" fill="#7a4a10">Sacred; may not be</text>
<text x="518" text-anchor="middle" y="416.5" font-size="13" fill="#7a4a10">redeemed unblemished</text>
<rect x="24" y="436" width="180" height="54" rx="8" fill="#e6ebf3"/>
<text x="36" y="459.5" font-size="13" font-weight="700" fill="#1f2a3a">Dedicate the offspring</text>
<text x="36" y="476.5" font-size="13" font-weight="700" fill="#1f2a3a">as any offering?</text>
<rect x="212" y="436" width="200" height="54" rx="8" fill="#e2f1e5"/>
<text x="312" text-anchor="middle" y="468" font-size="13" fill="#1e5b31">Yes</text>
<rect x="420" y="436" width="196" height="54" rx="8" fill="#fbeedb"/>
<text x="518" text-anchor="middle" y="468" font-size="13" fill="#7a4a10">No, as Rav Sheshet rules</text>
<rect x="24" y="496" width="180" height="71" rx="8" fill="#e6ebf3"/>
<text x="36" y="536.5" font-size="13" font-weight="700" fill="#1f2a3a">The principle</text>
<rect x="212" y="496" width="200" height="71" rx="8" fill="#e2f1e5"/>
<text x="312" text-anchor="middle" y="519.5" font-size="13" fill="#1e5b31">Like non-sacred animals</text>
<text x="312" text-anchor="middle" y="536.5" font-size="13" fill="#1e5b31">in all matters; only the</text>
<text x="312" text-anchor="middle" y="553.5" font-size="13" fill="#1e5b31">mitzva of value</text>
<rect x="420" y="496" width="196" height="71" rx="8" fill="#fbeedb"/>
<text x="518" text-anchor="middle" y="519.5" font-size="13" fill="#7a4a10">Like sacrificial animals</text>
<text x="518" text-anchor="middle" y="536.5" font-size="13" fill="#7a4a10">in all matters; only the</text>
<text x="518" text-anchor="middle" y="553.5" font-size="13" fill="#7a4a10">permission to eat</text>
<text x="24" y="587" font-size="11.5" fill="#4a5568">* Or a temporary blemish before consecration and a permanent one after it.</text>
<text x="24" y="605" font-size="11.5" fill="#4a5568">Offspring in the first clause, as the translation explains: non-sacred if born after the</text>
<text x="24" y="621" font-size="11.5" fill="#4a5568">mother’s redemption; may be redeemed unblemished if born before it.</text>
</svg>
