<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>If male, if female</title>
  <rect width="640" height="560" rx="18" fill="#f3f6fb"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1f2d3d">“If male, if female”</text>
  <text x="32" y="70" font-size="14" fill="#5b6b7d">Leviticus 3:1, on peace offerings, as the baraita reads the extra words</text>

  <g font-size="12.5" font-weight="700" fill="#7f8fa3" letter-spacing="0.6">
    <text x="186" y="106">“MALE”</text>
    <text x="408" y="106">“FEMALE”</text>
  </g>

  <!-- row: the word -->
  <text x="32" y="146" font-size="13" font-weight="700" fill="#5b6b7d">The word</text>
  <rect x="176" y="114" width="208" height="56" rx="10" fill="#ffffff" stroke="#dfe8f3"/>
  <text x="192" y="137" font-size="14.5" font-weight="700" fill="#1f2d3d">the offspring</text>
  <text x="192" y="157" font-size="13" fill="#5b6b7d">of unblemished animals</text>
  <rect x="398" y="114" width="210" height="56" rx="10" fill="#ffffff" stroke="#dfe8f3"/>
  <text x="414" y="137" font-size="14.5" font-weight="700" fill="#1f2d3d">the substitute</text>
  <text x="414" y="157" font-size="13" fill="#5b6b7d">of unblemished animals</text>

  <!-- row: if -->
  <text x="32" y="210" font-size="13" font-weight="700" fill="#5b6b7d">With its “if”</text>
  <rect x="176" y="178" width="208" height="56" rx="10" fill="#ffffff" stroke="#dfe8f3"/>
  <text x="192" y="201" font-size="14.5" font-weight="700" fill="#1f2d3d">the offspring</text>
  <text x="192" y="221" font-size="13" fill="#5b6b7d">of blemished animals</text>
  <rect x="398" y="178" width="210" height="56" rx="10" fill="#ffffff" stroke="#dfe8f3"/>
  <text x="414" y="201" font-size="14.5" font-weight="700" fill="#1f2d3d">the substitute</text>
  <text x="414" y="221" font-size="13" fill="#5b6b7d">of blemished animals</text>

  <text x="32" y="262" font-size="13.5" fill="#5b6b7d">Why a verse? An <tspan font-style="italic">a fortiori</tspan> from the substitute is refuted: substitution</text>
  <text x="32" y="281" font-size="13.5" fill="#5b6b7d">applies to all sacrificial animals, offspring not to all, as some are male.</text>

  <g font-size="12.5" font-weight="700" fill="#7f8fa3" letter-spacing="0.6">
    <text x="32" y="318">RAV SAFRA TO ABAYE: WHY NOT REVERSE?</text>
  </g>

  <rect x="32" y="330" width="576" height="94" rx="12" fill="#ffffff" stroke="#dfe8f3"/>
  <text x="48" y="356" font-size="14" font-weight="700" fill="#b23b3b">Swap the two “if”s</text>
  <text x="48" y="376" font-size="13.5" fill="#1f2d3d">“if male”: substitute of blemished; “if female”: offspring of blemished.</text>
  <text x="48" y="402" font-size="13.5" fill="#1e6b3a"><tspan font-weight="700">↳ Abaye:</tspan> each is included from the same place as the unblemished one.</text>

  <rect x="32" y="436" width="576" height="94" rx="12" fill="#ffffff" stroke="#dfe8f3"/>
  <text x="48" y="462" font-size="14" font-weight="700" fill="#b23b3b">Swap the whole verse</text>
  <text x="48" y="482" font-size="13.5" fill="#1f2d3d">“male”: the substitute; “female”: the offspring.</text>
  <text x="48" y="508" font-size="13.5" fill="#1e6b3a"><tspan font-weight="700">↳ Abaye:</tspan> <tspan font-style="italic">valad</tspan> (offspring) is masculine, <tspan font-style="italic">temura</tspan> (substitute) feminine.</text>
</svg>
