<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 530" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>Ox, sheep and goat</title>
  <rect width="640" height="530" rx="18" fill="#f3f6fb"/>
  <text x="24" y="44" font-size="22" font-weight="700" fill="#1f2a3a">Ox, sheep and goat</text>
  <text x="24" y="68" font-size="13" fill="#5a6678">Rabbi Ḥanina: why the verse on the firstborn names all three (Numbers 18:17)</text>

  <text x="24" y="100" font-size="15" font-weight="700" fill="#1f2a3a">Write one, learn the other two</text>
  <!-- card 1 -->
  <rect x="20" y="112" width="192" height="150" rx="12" fill="#fff" stroke="#d5deea"/>
  <text x="34" y="136" font-size="12" fill="#5a6678">Write only</text>
  <rect x="34" y="144" width="56" height="24" rx="12" fill="#a1683a"/><text x="62" y="161" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">Ox</text>
  <text x="98" y="161" font-size="12" fill="#5a6678">→ sheep, goat</text>
  <text x="34" y="194" font-size="12" font-weight="700" fill="#c0392b">Refuted:</text>
  <text x="34" y="214" font-size="13" fill="#2b3442">an ox has more wine</text>
  <text x="34" y="232" font-size="13" fill="#2b3442">libations</text>
  <!-- card 2 -->
  <rect x="224" y="112" width="192" height="150" rx="12" fill="#fff" stroke="#d5deea"/>
  <text x="238" y="136" font-size="12" fill="#5a6678">Write only</text>
  <rect x="238" y="144" width="70" height="24" rx="12" fill="#6f7f99"/><text x="273" y="161" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">Sheep</text>
  <text x="316" y="161" font-size="12" fill="#5a6678">→ ox, goat</text>
  <text x="238" y="194" font-size="12" font-weight="700" fill="#c0392b">Refuted:</text>
  <text x="238" y="214" font-size="13" fill="#2b3442">a sheep’s tail is burned</text>
  <text x="238" y="232" font-size="13" fill="#2b3442">on the altar</text>
  <!-- card 3 -->
  <rect x="428" y="112" width="192" height="150" rx="12" fill="#fff" stroke="#d5deea"/>
  <text x="442" y="136" font-size="12" fill="#5a6678">Write only</text>
  <rect x="442" y="144" width="62" height="24" rx="12" fill="#5f8a3a"/><text x="473" y="161" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">Goat</text>
  <text x="512" y="161" font-size="12" fill="#5a6678">→ ox, sheep</text>
  <text x="442" y="194" font-size="12" font-weight="700" fill="#c0392b">Refuted:</text>
  <text x="442" y="214" font-size="13" fill="#2b3442">a goat is brought for</text>
  <text x="442" y="232" font-size="13" fill="#2b3442">idol worship</text>
  <text x="442" y="250" font-size="11" fill="#7a8596">(Rashi: by an individual)</text>

  <text x="24" y="296" font-size="15" font-weight="700" fill="#1f2a3a">Write two, learn the third</text>
  <!-- card 4 -->
  <rect x="20" y="308" width="192" height="162" rx="12" fill="#fff" stroke="#d5deea"/>
  <text x="34" y="332" font-size="12" fill="#5a6678">Learn from sheep + goat</text>
  <rect x="34" y="340" width="56" height="24" rx="12" fill="#a1683a"/><text x="62" y="357" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">Ox</text>
  <text x="34" y="390" font-size="12" font-weight="700" fill="#c0392b">Refuted:</text>
  <text x="34" y="410" font-size="13" fill="#2b3442">sheep and goat are fit</text>
  <text x="34" y="428" font-size="13" fill="#2b3442">for the Paschal offering</text>
  <!-- card 5 -->
  <rect x="224" y="308" width="192" height="162" rx="12" fill="#fff" stroke="#d5deea"/>
  <text x="238" y="332" font-size="12" fill="#5a6678">Learn from ox + goat</text>
  <rect x="238" y="340" width="70" height="24" rx="12" fill="#6f7f99"/><text x="273" y="357" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">Sheep</text>
  <text x="238" y="390" font-size="12" font-weight="700" fill="#c0392b">Refuted:</text>
  <text x="238" y="410" font-size="13" fill="#2b3442">ox and goat are brought</text>
  <text x="238" y="428" font-size="13" fill="#2b3442">for idol worship</text>
  <text x="238" y="446" font-size="11" fill="#7a8596">(Rashi: a bull for the community,</text>
  <text x="238" y="460" font-size="11" fill="#7a8596">a goat for an individual)</text>
  <!-- card 6 -->
  <rect x="428" y="308" width="192" height="162" rx="12" fill="#fff" stroke="#d5deea"/>
  <text x="442" y="332" font-size="12" fill="#5a6678">Learn from ox + sheep</text>
  <rect x="442" y="340" width="62" height="24" rx="12" fill="#5f8a3a"/><text x="473" y="357" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">Goat</text>
  <text x="442" y="390" font-size="12" font-weight="700" fill="#c0392b">Refuted:</text>
  <text x="442" y="410" font-size="13" fill="#2b3442">each has more at the altar:</text>
  <text x="442" y="428" font-size="13" fill="#2b3442">ox libations, sheep’s tail</text>

  <text x="320" y="506" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2a3a">“Therefore, they cannot be derived from each other.”</text>
</svg>
