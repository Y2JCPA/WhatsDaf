<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 466" width="640" height="466" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="466" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Eleven ingredients from one verse</text><text x="320" y="68" text-anchor="middle" font-size="14" fill="#4b5563">Keritot 6b: Rav Huna reads Exodus 30:34</text><text x="44" y="100" font-size="12.5" font-weight="700" fill="#4b5563">Words of the verse</text><text x="430" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4b5563">Adds</text><text x="548" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4b5563">Total</text><rect x="24" y="112" width="352" height="52" rx="9" fill="#fff7e6" stroke="#f0cf8f"/><text x="44" y="134" font-size="15" font-weight="600" fill="#1f2937">“Take for you spices”</text><text x="44" y="153" font-size="12.5" fill="#4b5563">plural: two</text><rect x="392" y="112" width="76" height="52" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="430" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a5f">2</text><rect x="484" y="112" width="132" height="52" rx="9" fill="#ffffff" stroke="#94a3b8"/><text x="550" y="146" text-anchor="middle" font-size="22" font-weight="700" fill="#1e3a5f">2</text><rect x="24" y="174" width="352" height="52" rx="9" fill="#eef6ee" stroke="#a9d3ad"/><text x="44" y="196" font-size="15" font-weight="600" fill="#1f2937">“stacte, and onycha, and galbanum”</text><text x="44" y="215" font-size="12.5" fill="#4b5563">three</text><rect x="392" y="174" width="76" height="52" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="430" y="207" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a5f">+3</text><rect x="484" y="174" width="132" height="52" rx="9" fill="#ffffff" stroke="#94a3b8"/><text x="550" y="208" text-anchor="middle" font-size="22" font-weight="700" fill="#1e3a5f">5</text><rect x="24" y="236" width="352" height="52" rx="9" fill="#fff7e6" stroke="#f0cf8f"/><text x="44" y="258" font-size="15" font-weight="600" fill="#1f2937">“spices”</text><text x="44" y="277" font-size="12.5" fill="#4b5563">again: another five</text><rect x="392" y="236" width="76" height="52" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="430" y="269" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a5f">+5</text><rect x="484" y="236" width="132" height="52" rx="9" fill="#ffffff" stroke="#94a3b8"/><text x="550" y="270" text-anchor="middle" font-size="22" font-weight="700" fill="#1e3a5f">10</text><rect x="24" y="298" width="352" height="52" rx="9" fill="#f1ecf8" stroke="#c7b6e3"/><text x="44" y="320" font-size="15" font-weight="600" fill="#1f2937">“pure frankincense”</text><text x="44" y="339" font-size="12.5" fill="#4b5563">one</text><rect x="392" y="298" width="76" height="52" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="430" y="331" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a5f">+1</text><rect x="484" y="298" width="132" height="52" rx="9" fill="#ffffff" stroke="#94a3b8"/><text x="550" y="332" text-anchor="middle" font-size="22" font-weight="700" fill="#1e3a5f">11</text><rect x="24" y="366" width="592" height="82" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="40" y="390" font-size="13.5" font-weight="700" fill="#1f2937">Why not two for the second “spices”, like the first?</text><text x="40" y="412" font-size="13" fill="#374151">If so, let the verse write “spices” “spices” together,</text><text x="40" y="432" font-size="13" fill="#374151">and afterward “stacte, and onycha, and galbanum.”</text>
</svg>
