<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 616" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>The snake’s curse as a ratio</title>
  <rect width="640" height="616" rx="18" fill="#f3f6fb"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1f2d3d">Why the snake carries seven years</text>
  <text x="32" y="68" font-size="14" fill="#5b6b7d">“Cursed are you from among all animals, and from among all</text>
  <text x="32" y="88" font-size="14" fill="#5b6b7d">beasts of the field” (Genesis 3:14)</text>
  <rect x="24" y="108" width="592" height="140" rx="12" fill="#ffffff" stroke="#d5dfeb"/><rect x="24" y="108" width="8" height="140" rx="4" fill="#1e6b35"/><text x="48" y="134" font-size="12.5" font-weight="700" fill="#5b6b7d" letter-spacing="0.4">Rav Yehuda, citing Rav · 8a</text><text x="48" y="158" font-size="17" font-weight="700" fill="#1f2d3d">Domesticated over wild: 1 to 7</text><text x="48" y="182" font-size="14" fill="#33475b">donkey 12 months  vs  cat 52 days</text><rect x="44" y="192" width="320.4" height="28" rx="14" fill="#e3f1e6"/><text x="56" y="211" font-size="14" font-weight="700" fill="#1e6b35">snake = 7 × the donkey’s year = 7 years</text><text x="48" y="236" font-size="13" fill="#5b6b7d">Both challenges below are answered, so seven years stands.</text><rect x="24" y="262" width="592" height="158" rx="12" fill="#ffffff" stroke="#d5dfeb"/><rect x="24" y="262" width="8" height="158" rx="4" fill="#a12d22"/><text x="48" y="288" font-size="12.5" font-weight="700" fill="#5b6b7d" letter-spacing="0.4">Challenge · 8a</text><text x="48" y="312" font-size="17" font-weight="700" fill="#1f2d3d">Wild over domesticated: 1 to 3</text><text x="48" y="336" font-size="14" fill="#33475b">lion 3 years  vs  donkey 1 year</text><rect x="44" y="346" width="328" height="28" rx="14" fill="#fde2e1"/><text x="56" y="365" font-size="14" font-weight="700" fill="#a12d22">snake = 3 × the lion’s 3 years = 9 years</text><text x="48" y="390" font-size="13" fill="#5b6b7d">Answer (8b): the verse says “animals” first, then “beasts”:</text><text x="48" y="408" font-size="13" fill="#5b6b7d">the snake is measured from the animals that were cursed beyond the beasts.</text><rect x="24" y="434" width="592" height="158" rx="12" fill="#ffffff" stroke="#d5dfeb"/><rect x="24" y="434" width="8" height="158" rx="4" fill="#a12d22"/><text x="48" y="460" font-size="12.5" font-weight="700" fill="#5b6b7d" letter-spacing="0.4">Challenge · 8b</text><text x="48" y="484" font-size="17" font-weight="700" fill="#1f2d3d">Domesticated over wild: 1 to 3</text><text x="48" y="508" font-size="14" fill="#33475b">goat 5 months  vs  cat 52 days</text><rect x="44" y="518" width="350.8" height="28" rx="14" fill="#fde2e1"/><text x="56" y="537" font-size="14" font-weight="700" fill="#a12d22">snake = 3 × the goat’s 5 months = 15 months</text><text x="48" y="562" font-size="13" fill="#5b6b7d">Answer: “from among all animals,” the most accursed, the donkey;</text><text x="48" y="580" font-size="13" fill="#5b6b7d">or: it is a curse, so the heaviest curse is imposed on it.</text>
</svg>
