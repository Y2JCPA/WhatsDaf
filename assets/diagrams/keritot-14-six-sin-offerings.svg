<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 542" width="640" height="542" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="542" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">One act, six sin offerings</text>
  <text x="320" y="68" text-anchor="middle" font-size="14" fill="#4b5563">Keritot 14b: how each prohibition in the mishna comes to apply</text>
  <text x="34" y="100" font-size="12" font-weight="700" fill="#6b7280">WHAT HAPPENS</text>
  <text x="246" y="100" font-size="12" font-weight="700" fill="#6b7280">PROHIBITION</text>
  <text x="430" y="100" font-size="12" font-weight="700" fill="#6b7280">WHY IT TAKES EFFECT</text>
  <rect x="24" y="112" width="592" height="58" rx="9" fill="#fff7e6" stroke="#f0cf8f"/>
  <circle cx="44" cy="141" r="11" fill="#1e3a5f"/>
  <text x="44" y="145.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="64" y="137" font-size="13" fill="#1f2937">Born of his intercourse</text>
  <text x="64" y="154" font-size="13" fill="#1f2937">with his mother</text>
  <rect x="240" y="118" width="172" height="21" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="326" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a5f">His daughter</text>
  <rect x="240" y="143" width="172" height="21" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="326" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a5f">His sister</text>
  <text x="426" y="145.5" font-size="12.5" fill="#374151">Both come at once</text>
  <rect x="24" y="178" width="592" height="58" rx="9" fill="#eaf2fb" stroke="#a9c6e8"/>
  <circle cx="44" cy="207" r="11" fill="#1e3a5f"/>
  <text x="44" y="211.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="64" y="211.5" font-size="13" fill="#1f2937">She marries his brother</text>
  <rect x="240" y="187" width="172" height="40" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="326" y="211.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a5f">The wife of his brother</text>
  <text x="426" y="203" font-size="12.5" fill="#374151">Expanded: added for</text>
  <text x="426" y="220" font-size="12.5" fill="#374151">his other brothers</text>
  <rect x="24" y="244" width="592" height="58" rx="9" fill="#eaf2fb" stroke="#a9c6e8"/>
  <circle cx="44" cy="273" r="11" fill="#1e3a5f"/>
  <text x="44" y="277.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="64" y="269" font-size="13" fill="#1f2937">She marries his</text>
  <text x="64" y="286" font-size="13" fill="#1f2937">father’s brother</text>
  <rect x="240" y="253" width="172" height="40" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="326" y="269.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a5f">The wife of his</text>
  <text x="326" y="285.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a5f">father’s brother</text>
  <text x="426" y="269" font-size="12.5" fill="#374151">Expanded: added for the sons</text>
  <text x="426" y="286" font-size="12.5" fill="#374151">of his father’s other brothers</text>
  <rect x="24" y="310" width="592" height="58" rx="9" fill="#eaf2fb" stroke="#a9c6e8"/>
  <circle cx="44" cy="339" r="11" fill="#1e3a5f"/>
  <text x="44" y="343.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>
  <text x="64" y="343.5" font-size="13" fill="#1f2937">She is a married woman</text>
  <rect x="240" y="319" width="172" height="40" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="326" y="343.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a5f">A married woman</text>
  <text x="426" y="335" font-size="12.5" fill="#374151">Expanded: added for</text>
  <text x="426" y="352" font-size="12.5" fill="#374151">every man in the world</text>
  <rect x="24" y="376" width="592" height="58" rx="9" fill="#eaf2fb" stroke="#a9c6e8"/>
  <circle cx="44" cy="405" r="11" fill="#1e3a5f"/>
  <text x="44" y="409.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">5</text>
  <text x="64" y="401" font-size="13" fill="#1f2937">She becomes</text>
  <text x="64" y="418" font-size="13" fill="#1f2937">menstruating</text>
  <rect x="240" y="385" width="172" height="40" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="326" y="409.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a5f">A menstruating woman</text>
  <text x="426" y="401" font-size="12.5" fill="#374151">Expanded: added for</text>
  <text x="426" y="418" font-size="12.5" fill="#374151">her husband</text>
  <rect x="24" y="444" width="592" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="320" y="469" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a5f">Six prohibitions in one act: six sin offerings</text>
  <text x="320" y="506" text-anchor="middle" font-size="12" fill="#4b5563">Rabbi Meir does not hold that a prohibition takes effect where another already exists,</text>
  <text x="320" y="523" text-anchor="middle" font-size="12" fill="#4b5563">but with an expanded or a more inclusive prohibition he holds that it does.</text>
</svg>
