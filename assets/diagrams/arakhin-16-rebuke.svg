<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="420" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">How far must one keep rebuking?</text>
  <text x="320" y="68" text-anchor="middle" font-size="14" fill="#4b5563">Arakhin 16b: until the one rebuked responds with…</text>
  <rect x="152" y="82" width="149.33333333333334" height="30" rx="9" fill="#7c3aed"/><text x="226.66666666666669" y="102.3" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Until hitting</text><rect x="309.33333333333337" y="82" width="149.33333333333334" height="30" rx="9" fill="#0f766e"/><text x="384.00000000000006" y="102.3" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Until cursing</text><rect x="466.6666666666667" y="82" width="149.33333333333334" height="30" rx="9" fill="#b45309"/><text x="541.3333333333334" y="102.3" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Until reprimand</text><rect x="24" y="120" width="120" height="46" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="36" y="147.6" font-size="13" font-weight="700" fill="#1f2937">Amoraim</text><rect x="152" y="120" width="149.33333333333334" height="46" rx="9" fill="#f1ebfd" stroke="#c9b5f3"/><text x="164" y="147.9" font-size="14" font-weight="600" fill="#3b1f75">Rav</text><rect x="309.33333333333337" y="120" width="149.33333333333334" height="46" rx="9" fill="#e6f4f2" stroke="#a7d5cf"/><text x="321.33333333333337" y="147.9" font-size="14" font-weight="600" fill="#134e48">Shmuel</text><rect x="466.6666666666667" y="120" width="149.33333333333334" height="46" rx="9" fill="#fdf2e3" stroke="#e8c48f"/><text x="478.6666666666667" y="147.9" font-size="14" font-weight="600" fill="#7c4a03">Rabbi Yoḥanan</text><rect x="24" y="172" width="120" height="46" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="36" y="199.6" font-size="13" font-weight="700" fill="#1f2937">Tannaim</text><rect x="152" y="172" width="149.33333333333334" height="46" rx="9" fill="#f1ebfd" stroke="#c9b5f3"/><text x="164" y="199.9" font-size="14" font-weight="600" fill="#3b1f75">Rabbi Eliezer</text><rect x="309.33333333333337" y="172" width="149.33333333333334" height="46" rx="9" fill="#e6f4f2" stroke="#a7d5cf"/><text x="321.33333333333337" y="199.9" font-size="14" font-weight="600" fill="#134e48">Rabbi Yehoshua</text><rect x="466.6666666666667" y="172" width="149.33333333333334" height="46" rx="9" fill="#fdf2e3" stroke="#e8c48f"/><text x="478.6666666666667" y="199.9" font-size="14" font-weight="600" fill="#7c4a03">ben Azzai</text><rect x="24" y="224" width="120" height="84" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="36" y="245.1" font-size="13" font-weight="700" fill="#1f2937">Words of the</text><text x="36" y="262.1" font-size="13" font-weight="700" fill="#1f2937">verse (Rav</text><text x="36" y="279.1" font-size="13" font-weight="700" fill="#1f2937">Naḥman bar</text><text x="36" y="296.1" font-size="13" font-weight="700" fill="#1f2937">Yitzḥak)</text><rect x="152" y="224" width="149.33333333333334" height="84" rx="9" fill="#f1ebfd" stroke="#c9b5f3"/><text x="164" y="245.6" font-size="12.5" fill="#3b1f75">“And Saul cast his</text><text x="164" y="262.1" font-size="12.5" fill="#3b1f75">spear at him to</text><text x="164" y="278.6" font-size="12.5" fill="#3b1f75">smite him”</text><text x="164" y="295.1" font-size="12.5" fill="#3b1f75">(I Samuel 20:33)</text><rect x="309.33333333333337" y="224" width="149.33333333333334" height="84" rx="9" fill="#e6f4f2" stroke="#a7d5cf"/><text x="321.33333333333337" y="245.6" font-size="12.5" fill="#134e48">“…to the shame of</text><text x="321.33333333333337" y="262.1" font-size="12.5" fill="#134e48">your mother’s</text><text x="321.33333333333337" y="278.6" font-size="12.5" fill="#134e48">nakedness”</text><text x="321.33333333333337" y="295.1" font-size="12.5" fill="#134e48">(I Samuel 20:30)</text><rect x="466.6666666666667" y="224" width="149.33333333333334" height="84" rx="9" fill="#fdf2e3" stroke="#e8c48f"/><text x="478.6666666666667" y="245.6" font-size="12.5" fill="#7c4a03">“Then Saul’s anger</text><text x="478.6666666666667" y="262.1" font-size="12.5" fill="#7c4a03">was kindled against</text><text x="478.6666666666667" y="278.6" font-size="12.5" fill="#7c4a03">Jonathan”</text><text x="478.6666666666667" y="295.1" font-size="12.5" fill="#7c4a03">(I Samuel 20:30)</text><text x="24" y="336.2" font-size="12" fill="#4b5563">Jonathan rebuked his father Saul over David. Saul’s anger was kindled, he cursed him,</text><text x="24" y="353.2" font-size="12" fill="#4b5563">and then cast his spear at him.</text><text x="24" y="376.2" font-size="12" fill="#4b5563">But on the reprimand view, the verse records cursing and hitting too? Out of his special</text><text x="24" y="393.2" font-size="12" fill="#4b5563">fondness for David, Jonathan subjected himself to more than the halakha requires.</text>
</svg>
