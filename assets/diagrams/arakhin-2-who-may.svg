<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 632" width="640" height="632" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="632" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Who pledges, and who is pledged</text>
  <text x="320" y="70" text-anchor="middle" font-size="14" fill="#4b5563">Valuation: the Torah’s fixed sum. Assessment: one’s worth as a slave.</text>
  <text x="267" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">Pledges a</text>
  <text x="267" y="117" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">valuation</text>
  <text x="267" y="137" text-anchor="middle" font-size="13" fill="#6b7280">מעריך</text>
  <text x="366" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">Is</text>
  <text x="366" y="117" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">valuated</text>
  <text x="366" y="137" text-anchor="middle" font-size="13" fill="#6b7280">נערך</text>
  <text x="465" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">Pledges an</text>
  <text x="465" y="117" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">assessment</text>
  <text x="465" y="137" text-anchor="middle" font-size="13" fill="#6b7280">נודר</text>
  <text x="564" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">Is</text>
  <text x="564" y="117" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">assessed</text>
  <text x="564" y="137" text-anchor="middle" font-size="13" fill="#6b7280">נידר</text>
  <rect x="24" y="150" width="190" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="119" y="174" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937">Priests, Levites, Israelites,</text>
  <text x="119" y="192" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937">women and slaves</text>
  <rect x="222" y="150" width="90" height="58" rx="10" fill="#e1f3e5" stroke="#7cbf8a"/>
  <text x="267" y="187" text-anchor="middle" font-size="22" font-weight="700" fill="#1d5e2c">✓</text>
