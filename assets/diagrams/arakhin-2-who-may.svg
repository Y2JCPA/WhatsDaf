  <rect x="24" y="414" width="190" height="58" rx="10" fill="#fdf6e7" stroke="#e0c48a"/>
  <text x="119" y="438" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937">Repulsive man, one</text>
  <text x="119" y="456" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937">afflicted with boils</text>
  <rect x="222" y="414" width="90" height="58" rx="10" fill="#eef1f5" stroke="#d5dbe3"/>
  <text x="267" y="451" text-anchor="middle" font-size="22" font-weight="700" fill="#9aa3ae">—</text>
  <rect x="321" y="414" width="90" height="58" rx="10" fill="#e1f3e5" stroke="#7cbf8a"/>
  <text x="366" y="451" text-anchor="middle" font-size="22" font-weight="700" fill="#1d5e2c">✓</text>
  <rect x="420" y="414" width="90" height="58" rx="10" fill="#e1f3e5" stroke="#7cbf8a"/>
  <text x="465" y="445" text-anchor="middle" font-size="22" font-weight="700" fill="#1d5e2c">✓</text>
  <text x="465" y="462" text-anchor="middle" font-size="11" fill="#1d5e2c">per Rashi</text>
  <rect x="519" y="414" width="90" height="58" rx="10" fill="#fde2e2" stroke="#e08a8a"/>
  <text x="564" y="451" text-anchor="middle" font-size="22" font-weight="700" fill="#8b1c1c">✗</text>
  <rect x="24" y="480" width="190" height="58" rx="10" fill="#fdf6e7" stroke="#e0c48a"/>
  <text x="119" y="504" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937">Infant less than</text>
  <text x="119" y="522" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937">a month old</text>
  <rect x="222" y="480" width="90" height="58" rx="10" fill="#eef1f5" stroke="#d5dbe3"/>
  <text x="267" y="517" text-anchor="middle" font-size="22" font-weight="700" fill="#9aa3ae">—</text>
  <rect x="321" y="480" width="90" height="58" rx="10" fill="#fde2e2" stroke="#e08a8a"/>
