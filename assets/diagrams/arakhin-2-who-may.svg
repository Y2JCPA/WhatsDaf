  <text x="366" y="319" text-anchor="middle" font-size="22" font-weight="700" fill="#1d5e2c">✓</text>
  <rect x="420" y="282" width="90" height="58" rx="10" fill="#fde2e2" stroke="#e08a8a"/>
  <text x="465" y="319" text-anchor="middle" font-size="22" font-weight="700" fill="#8b1c1c">✗</text>
