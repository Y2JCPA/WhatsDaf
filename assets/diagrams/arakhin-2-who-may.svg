  <text x="564" y="517" text-anchor="middle" font-size="22" font-weight="700" fill="#1d5e2c">✓</text>
  <rect x="24" y="550" width="592" height="70" rx="10" fill="#e8eef8"/>
  <text x="40" y="572" font-size="13" fill="#374151"><tspan font-weight="700">White rows:</tspan> the mishna. <tspan font-weight="700">Gold rows:</tspan> what the Gemara says “everyone” adds.</text>
  <text x="40" y="592" font-size="13" fill="#374151"><tspan font-weight="700">✗</tspan> tumtum: only a definite male or female is valuated; deaf-mute etc.: no</text>
  <text x="40" y="610" font-size="13" fill="#374151">mental competence; repulsive man: no market value. <tspan font-weight="700">—</tspan> not stated on this daf.</text>
