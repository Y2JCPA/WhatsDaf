  <text x="119" y="306" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937">Deaf-mute, imbecile</text>
  <text x="119" y="324" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937">and minor</text>
