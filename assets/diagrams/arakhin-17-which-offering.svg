<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 468" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title>Which offering fixes his status?</title>
<rect width="640" height="468" rx="18" fill="#f3f6fb"/>
<text x="32" y="44" font-size="22" font-weight="700" fill="#1f2d3d">Which offering fixes his status?</text>
<text x="32" y="70" font-size="14" fill="#56657a">A leper became wealthy or poor while bringing his offerings: everything follows…</text>

<text x="32" y="106" font-size="11" font-weight="700" fill="#7a879a">TANNA</text>
<text x="252" y="106" font-size="11" font-weight="700" fill="#2f5d9a">EVERYTHING FOLLOWS</text>
<text x="432" y="106" font-size="11" font-weight="700" fill="#9a4a2f">BECAUSE IT IS</text>

<rect x="20" y="118" width="600" height="80" rx="12" fill="#fff" stroke="#dbe3ee"/>
<text x="34" y="148" font-size="14.5" font-weight="700" fill="#1f2d3d">Rabbi Shimon</text>
<text x="34" y="168" font-size="11.5" fill="#56657a">mishna, Nega’im 14:11</text>
<line x1="240" y1="128" x2="240" y2="188" stroke="#e1e6ee"/>
<line x1="420" y1="128" x2="420" y2="188" stroke="#e1e6ee"/>
<text x="252" y="152" font-size="16" font-weight="700" fill="#2f5d9a">the sin offering</text>
<text x="432" y="152" font-size="14" font-weight="700" fill="#9a4a2f">“an item that atones”</text>

<rect x="20" y="206" width="600" height="80" rx="12" fill="#fff" stroke="#dbe3ee"/>
<text x="34" y="236" font-size="14.5" font-weight="700" fill="#1f2d3d">Rabbi Yehuda</text>
<text x="34" y="256" font-size="11.5" fill="#56657a">mishna, Nega’im 14:11</text>
<line x1="240" y1="216" x2="240" y2="276" stroke="#e1e6ee"/>
<line x1="420" y1="216" x2="420" y2="276" stroke="#e1e6ee"/>
<text x="252" y="240" font-size="16" font-weight="700" fill="#2f5d9a">the guilt offering</text>
<text x="432" y="236" font-size="14" font-weight="700" fill="#9a4a2f">“an item that renders</text>
<text x="432" y="254" font-size="14" font-weight="700" fill="#9a4a2f">him fit”</text>
<text x="432" y="272" font-size="11.5" fill="#56657a">Temple, consecrated food</text>

<rect x="20" y="294" width="600" height="80" rx="12" fill="#fff" stroke="#dbe3ee"/>
<text x="34" y="324" font-size="14.5" font-weight="700" fill="#1f2d3d">Rabbi Eliezer ben Ya’akov</text>
<text x="34" y="344" font-size="11.5" fill="#56657a">baraita</text>
<line x1="240" y1="304" x2="240" y2="364" stroke="#e1e6ee"/>
<line x1="420" y1="304" x2="420" y2="364" stroke="#e1e6ee"/>
<text x="252" y="328" font-size="16" font-weight="700" fill="#2f5d9a">the birds</text>
<text x="252" y="346" font-size="11.5" fill="#56657a">brought seven days earlier</text>
<text x="432" y="324" font-size="14" font-weight="700" fill="#9a4a2f">“that which causes</text>
<text x="432" y="342" font-size="14" font-weight="700" fill="#9a4a2f">him purity”</text>

<text x="32" y="404" font-size="12.5" fill="#56657a">Rav Yehuda in the name of Rav: all three expound one verse, “whose means do not</text>
<text x="32" y="422" font-size="12.5" fill="#56657a">suffice for that which pertains to his purification” (Leviticus 14:32). None of them</text>
<text x="32" y="440" font-size="12.5" fill="#56657a">requires him to be poor from beginning to end.</text>
</svg>
