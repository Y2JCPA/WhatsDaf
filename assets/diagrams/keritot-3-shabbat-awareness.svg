<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 486" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title>What did he know?</title>
<rect width="640" height="486" rx="18" fill="#f3f6fb"/>
<text x="32" y="44" font-size="22" font-weight="700" fill="#1f2d3d">What did he know?</text>
<text x="32" y="70" font-size="14" fill="#56657a">Sin offerings for many labors on Shabbat, by the baraitot on “from one of them”</text>
<text x="226" y="108" font-size="11" font-weight="700" fill="#7a879a">KNEW THE LABORS ARE FORBIDDEN</text>
<text x="436" y="108" font-size="11" font-weight="700" fill="#7a879a">DID NOT KNOW THE LABORS</text>
<text x="32" y="150" font-size="11" font-weight="700" fill="#7a879a">DID NOT KNOW</text>
<text x="32" y="165" font-size="11" font-weight="700" fill="#7a879a">IT WAS SHABBAT</text>
<text x="32" y="290" font-size="11" font-weight="700" fill="#7a879a">KNEW IT WAS</text>
<text x="32" y="305" font-size="11" font-weight="700" fill="#7a879a">SHABBAT</text>
<rect x="214" y="120" width="198" height="128" rx="12" fill="#fff" stroke="#2f5d9a" stroke-width="2"/>
<text x="228" y="148" font-size="16" font-weight="700" fill="#2f5d9a">One sin offering</text>
<text x="228" y="170" font-size="12" fill="#56657a">“them” that is “one”</text>
<text x="228" y="196" font-size="12" fill="#56657a">The case the mishna teaches,</text>
<text x="228" y="212" font-size="12" fill="#56657a">says Rabbi Yoḥanan: not exempt</text>
<text x="228" y="228" font-size="12" fill="#56657a">from at least one</text>
<rect x="424" y="120" width="198" height="128" rx="12" fill="#fff" stroke="#dbe3ee"/>
<text x="438" y="148" font-size="16" font-weight="700" fill="#7a5a1f">One, or two?</text>
<text x="438" y="170" font-size="12" fill="#56657a">Unaware of both</text>
<text x="438" y="196" font-size="12" fill="#56657a">Rava’s dilemma before</text>
<text x="438" y="212" font-size="12" fill="#56657a">Rav Naḥman; he never asked</text>
<text x="438" y="228" font-size="12" fill="#56657a">whether to exempt him (3b)</text>
<rect x="214" y="260" width="198" height="128" rx="12" fill="#fff" stroke="#dbe3ee"/>
<text x="228" y="288" font-size="16" font-weight="700" fill="#9a4a2f">Intentional</text>
<text x="228" y="310" font-size="12" fill="#56657a">The mishna: <tspan font-style="italic">karet</tspan> for</text>
<text x="228" y="326" font-size="12" fill="#56657a">intentional violation, a sin</text>
<text x="228" y="342" font-size="12" fill="#56657a">offering for unwitting (2a)</text>
<rect x="424" y="260" width="198" height="128" rx="12" fill="#fff" stroke="#2f5d9a" stroke-width="2"/>
<text x="438" y="288" font-size="16" font-weight="700" fill="#2f5d9a">One per primary labor</text>
<text x="438" y="310" font-size="12" fill="#56657a">“one” that is “them”</text>
<text x="438" y="336" font-size="12" fill="#56657a">Up to forty-less-one sin</text>
<text x="438" y="352" font-size="12" fill="#56657a">offerings</text>
<rect x="20" y="404" width="600" height="58" rx="12" fill="#eef1f6"/>
<text x="32" y="428" font-size="12.5" font-weight="700" fill="#1f2d3d">Idol worship, likewise (3a):</text>
<text x="32" y="447" font-size="12" fill="#56657a">unwitting of the idol worship, intentional of the rites: one sin offering, though he did four rites.</text>
</svg>
