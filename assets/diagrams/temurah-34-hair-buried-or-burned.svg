<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 627" width="640" height="627" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="640" height="627" rx="18" fill="#f3f6fb"/><text x="320" y="44" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">Buried here, burned in Orla?</text><text x="320" y="70" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="middle">Tavi’s contradiction before Rav Naḥman, and the answers (34a)</text><rect x="24" y="88" width="284" height="104" rx="10" fill="#ffffff" stroke="#d5dde9"/><text x="40" y="112" font-size="11" font-weight="700" fill="#475569" text-anchor="start">OUR MISHNA (33b)</text><text x="40" y="138" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">Hair of a nazirite: buried</text><text x="40" y="162" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">Firstborn donkey: buried</text><rect x="332" y="88" width="284" height="104" rx="10" fill="#fff4e5" stroke="#f0b46a"/><text x="348" y="112" font-size="11" font-weight="700" fill="#9a5b13" text-anchor="start">ORLA 3:3</text><text x="348" y="138" font-size="14" font-weight="700" fill="#7c3f06" text-anchor="start">Hair of a nazirite or of a</text><text x="348" y="159" font-size="14" font-weight="700" fill="#7c3f06" text-anchor="start">firstborn donkey woven into a</text><text x="348" y="180" font-size="14" font-weight="700" fill="#7c3f06" text-anchor="start">sack: the sack is ignited</text><text x="320" y="146" font-size="13" font-weight="700" fill="#64748b" text-anchor="middle">vs</text><rect x="24" y="214" width="592" height="135" rx="10" fill="#eef4ff" stroke="#9db8e8"/><line x1="174" y1="226" x2="174" y2="337" stroke="#9db8e8"/><text x="38" y="240" font-size="14.5" font-weight="700" fill="#1e40af" text-anchor="start">Rav Naḥman</text><text x="38" y="260" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">also Rabbi Elazar</text><text x="186" y="240" font-size="13.5" font-weight="700" fill="#1e40af" text-anchor="start">Buried:</text><text x="248" y="240" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">the hair of a ritually impure nazirite.</text><text x="186" y="265" font-size="13.5" font-weight="700" fill="#1e40af" text-anchor="start">Burned:</text><text x="248" y="265" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">the hair of a ritually pure nazirite (“put it on</text><text x="248" y="284" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">the fire,” Numbers 6:18).</text><text x="186" y="311" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start" font-style="italic">Tavi: you answered nazirite against nazirite; firstborn donkey</text><text x="186" y="328" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start" font-style="italic">against firstborn donkey is still difficult.</text><rect x="24" y="361" width="592" height="116" rx="10" fill="#e7f5ec" stroke="#7cc49a"/><line x1="174" y1="373" x2="174" y2="465" stroke="#7cc49a"/><text x="38" y="387" font-size="14.5" font-weight="700" fill="#166534" text-anchor="start">Rav Sheshet</text><text x="38" y="407" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">reported by Tavi;</text><text x="38" y="424" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">also Rabbi Yosei,</text><text x="38" y="441" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">son of Rabbi Ḥanina</text><text x="186" y="387" font-size="13.5" font-weight="700" fill="#166534" text-anchor="start">Buried:</text><text x="248" y="387" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">the hair by itself.</text><text x="186" y="412" font-size="13.5" font-weight="700" fill="#166534" text-anchor="start">Burned:</text><text x="248" y="412" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">hair woven into a sack.</text><text x="186" y="439" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start" font-style="italic">Let the sack nullify it by the majority? Rav Pappa: a bird</text><text x="186" y="456" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start" font-style="italic">design is not nullified. Then let him remove the bird!</text><rect x="24" y="489" width="592" height="118" rx="10" fill="#f5effc" stroke="#b9a0dc"/><line x1="174" y1="501" x2="174" y2="595" stroke="#b9a0dc"/><text x="38" y="515" font-size="14.5" font-weight="700" fill="#5b21b6" text-anchor="start">Rabbi Yirmeya</text><text x="186" y="515" font-size="13.5" font-weight="700" fill="#5b21b6" text-anchor="start">Orla:</text><text x="248" y="515" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">follows Rabbi Yehuda, who permits one who wishes</text><text x="248" y="534" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">to be stringent to burn what is buried.</text><text x="186" y="559" font-size="13.5" font-weight="700" fill="#5b21b6" text-anchor="start">So:</text><text x="248" y="559" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">if the design can be removed, fine; if not, follow</text><text x="248" y="578" font-size="13.5" font-weight="400" fill="#1f2937" text-anchor="start">Rabbi Yehuda.</text></svg>