<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 596" width="640" height="596" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="596" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2a3a">Does the priest own it while the Temple stands?</text>
  <text x="320" y="70" text-anchor="middle" font-size="13.5" fill="#55627a"><tspan fill="#37474f" font-weight="700">Rav Naḥman</tspan> (7b): an unblemished firstborn then stands for sacrifice and may not be sold</text>
  <rect x="24" y="90" width="592" height="36" rx="10" fill="#e3e9f3"/>
  <text x="38" y="113" font-size="13" font-weight="700" fill="#1f2a3a">The source</text>
  <text x="232" y="113" font-size="13" font-weight="700" fill="#bf360c">The challenge</text>
  <text x="432" y="113" font-size="13" font-weight="700" fill="#2e5aa8">The answer</text>
  <rect x="24" y="136" width="592" height="50" rx="10" fill="#ffffff" stroke="#c9d3e3"/>
  <rect x="24" y="136" width="6" height="50" rx="3" fill="#8a6d9a"/>
  <text x="38" y="157.0" font-size="12.5" fill="#1f2a3a">Baraita: “you shall not</text>
  <text x="38" y="173.0" font-size="12.5" fill="#1f2a3a">redeem” … but it may be sold</text>
  <text x="232" y="157.0" font-size="12.5" fill="#bf360c">The verse goes on to the altar:</text>
  <text x="232" y="173.0" font-size="12.5" fill="#bf360c">so Temple times, unblemished</text>
  <text x="432" y="157.0" font-size="12.5" fill="#2e5aa8">The first clause is blemished;</text>
  <text x="432" y="173.0" font-size="12.5" fill="#2e5aa8">the latter clause, unblemished</text>
  <rect x="24" y="192" width="592" height="66" rx="10" fill="#ffffff" stroke="#c9d3e3"/>
  <rect x="24" y="192" width="6" height="66" rx="3" fill="#2e7d6b"/>
  <text x="38" y="213.0" font-size="12.5" fill="#1f2a3a">Mishna (Yevamot 99a): a</text>
  <text x="38" y="229.0" font-size="12.5" fill="#1f2a3a">priestess’s child mixed up</text>
  <text x="38" y="245.0" font-size="12.5" fill="#1f2a3a">with her maidservant’s</text>
  <text x="232" y="213.0" font-size="12.5" fill="#bf360c">Their firstborns graze till</text>
  <text x="232" y="229.0" font-size="12.5" fill="#bf360c">blemished; else let the</text>
  <text x="232" y="245.0" font-size="12.5" fill="#bf360c">treasurer take them</text>
  <text x="432" y="213.0" font-size="12.5" fill="#2e5aa8">The present day: as doubtful</text>
  <text x="432" y="229.0" font-size="12.5" fill="#2e5aa8">priests they can fend off</text>
  <text x="432" y="245.0" font-size="12.5" fill="#2e5aa8">other priests</text>
  <rect x="24" y="264" width="592" height="66" rx="10" fill="#ffffff" stroke="#c9d3e3"/>
  <rect x="24" y="264" width="6" height="66" rx="3" fill="#bf360c"/>
  <text x="38" y="285.0" font-size="12.5" fill="#1f2a3a">Baraita: idolatrous city;</text>
  <text x="38" y="301.0" font-size="12.5" fill="#1f2a3a">“its animals” excludes</text>
  <text x="38" y="317.0" font-size="12.5" fill="#1f2a3a">the firstborn</text>
  <text x="232" y="285.0" font-size="12.5" fill="#bf360c">Blemished is “its animals”;</text>
  <text x="232" y="301.0" font-size="12.5" fill="#bf360c">if the priest owns nothing,</text>
  <text x="232" y="317.0" font-size="12.5" fill="#bf360c">“its spoil” would suffice</text>
  <text x="432" y="285.0" font-size="12.5" fill="#2e5aa8">Blemished: “its animals” is</text>
  <text x="432" y="301.0" font-size="12.5" fill="#2e5aa8">what is eaten in their manner,</text>
  <text x="432" y="317.0" font-size="12.5" fill="#2e5aa8">unlike firstborn and tithe</text>
  <rect x="24" y="336" width="592" height="66" rx="10" fill="#ffffff" stroke="#c9d3e3"/>
  <rect x="24" y="336" width="6" height="66" rx="3" fill="#4527a0"/>
  <text x="38" y="357.0" font-size="12.5" fill="#1f2a3a">Baraita: denying a deposit;</text>
  <text x="38" y="373.0" font-size="12.5" fill="#1f2a3a">Abba Yosei ben Dosai:</text>
  <text x="38" y="389.0" font-size="12.5" fill="#1f2a3a">only the firstborn</text>
  <text x="232" y="365.0" font-size="12.5" fill="#bf360c">Like peace offerings: so</text>
  <text x="232" y="381.0" font-size="12.5" fill="#bf360c">Temple times, unblemished</text>
  <text x="432" y="357.0" font-size="12.5" fill="#2e5aa8">Abaye: a firstborn from</text>
  <text x="432" y="373.0" font-size="12.5" fill="#2e5aa8">outside Eretz Yisrael,</text>
  <text x="432" y="389.0" font-size="12.5" fill="#2e5aa8">as Rabbi Shimon holds</text>
  <rect x="24" y="408" width="592" height="66" rx="10" fill="#ffffff" stroke="#c9d3e3"/>
  <rect x="24" y="408" width="6" height="66" rx="3" fill="#1565c0"/>
  <text x="38" y="429.0" font-size="12.5" fill="#1f2a3a">Mishna (7b): Rabbi Yoḥanan</text>
  <text x="38" y="445.0" font-size="12.5" fill="#1f2a3a">ben Nuri, “which priests</text>
  <text x="38" y="461.0" font-size="12.5" fill="#1f2a3a">acquire during its lifetime”</text>
  <text x="232" y="437.0" font-size="12.5" fill="#bf360c">Like sin and guilt offerings:</text>
  <text x="232" y="453.0" font-size="12.5" fill="#bf360c">so unblemished</text>
  <text x="432" y="429.0" font-size="12.5" fill="#2e5aa8">Ravina: this too is from</text>
  <text x="432" y="445.0" font-size="12.5" fill="#2e5aa8">outside Eretz Yisrael,</text>
  <text x="432" y="461.0" font-size="12.5" fill="#2e5aa8">as Rabbi Shimon holds</text>
  <rect x="24" y="480" width="592" height="66" rx="10" fill="#ffffff" stroke="#c9d3e3"/>
  <rect x="24" y="480" width="6" height="66" rx="3" fill="#5d6d3a"/>
  <text x="38" y="501.0" font-size="12.5" fill="#1f2a3a">Baraita: substitution in the</text>
  <text x="38" y="517.0" font-size="12.5" fill="#1f2a3a">owner’s house and in the</text>
  <text x="38" y="533.0" font-size="12.5" fill="#1f2a3a">priest’s house</text>
  <text x="232" y="501.0" font-size="12.5" fill="#bf360c">First tanna: the priest</text>
  <text x="232" y="517.0" font-size="12.5" fill="#bf360c">substitutes, so he has</text>
  <text x="232" y="533.0" font-size="12.5" fill="#bf360c">acquired it</text>
  <text x="432" y="501.0" font-size="12.5" fill="#2e5aa8">Outside Eretz Yisrael: Rabbi</text>
  <text x="432" y="517.0" font-size="12.5" fill="#2e5aa8">Yoḥanan ben Nuri versus</text>
  <text x="432" y="533.0" font-size="12.5" fill="#2e5aa8">Rabbi Akiva</text>
  <text x="320" y="570" text-anchor="middle" font-size="12" fill="#55627a">Rabbi Shimon: if unblemished firstborns came from outside Eretz Yisrael, they are sacrificed.</text>
</svg>
