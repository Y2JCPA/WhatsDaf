<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title>Priests and Levites</title>
<rect width="640" height="470" rx="18" fill="#f3f6fb"/>
<text x="32" y="44" font-size="22" font-weight="700" fill="#1f2d3d">May priests and Levites dedicate?</text>
<text x="32" y="70" font-size="14" fill="#56657a">The mishna (28a) and the Gemara’s explanation of it</text>

<!-- column heads -->
<rect x="160" y="88" width="148" height="40" rx="10" fill="#e8eaf6" stroke="#c5cae9"/>
<text x="234" y="113" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2d3d">Rabbi Yehuda</text>
<rect x="316" y="88" width="148" height="40" rx="10" fill="#e8eaf6" stroke="#c5cae9"/>
<text x="390" y="113" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2d3d">Rabbi Shimon</text>
<rect x="472" y="88" width="148" height="40" rx="10" fill="#e8eaf6" stroke="#c5cae9"/>
<text x="546" y="113" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2d3d">Rabbi</text>

<!-- row: priests -->
<rect x="20" y="136" width="132" height="84" rx="10" fill="#fff" stroke="#dbe3ee"/>
<text x="86" y="174" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2d3d">Priests</text>
<text x="86" y="193" font-size="11.5" text-anchor="middle" fill="#56657a">any property</text>
<rect x="160" y="136" width="304" height="84" rx="10" fill="#fdecea" stroke="#f3c4bd"/>
<text x="312" y="166" font-size="14" font-weight="700" text-anchor="middle" fill="#a3362a">May not dedicate</text>
<text x="312" y="186" font-size="12" text-anchor="middle" fill="#56657a">“the dedications are theirs”:</text>
<text x="312" y="203" font-size="12" text-anchor="middle" fill="#56657a">“Everything dedicated in Israel shall be yours”</text>
<rect x="472" y="136" width="148" height="84" rx="10" fill="#fff" stroke="#dbe3ee" stroke-dasharray="4 3"/>
<text x="546" y="183" font-size="12" font-style="italic" text-anchor="middle" fill="#7a879a">not addressed</text>

<!-- row: Levites, land -->
<rect x="20" y="228" width="132" height="84" rx="10" fill="#fff" stroke="#dbe3ee"/>
<text x="86" y="264" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2d3d">Levites</text>
<text x="86" y="283" font-size="12" text-anchor="middle" fill="#56657a">land</text>
<rect x="160" y="228" width="148" height="84" rx="10" fill="#fdecea" stroke="#f3c4bd"/>
<text x="234" y="256" font-size="14" font-weight="700" text-anchor="middle" fill="#a3362a">May not</text>
<text x="234" y="276" font-size="11.5" text-anchor="middle" fill="#56657a">“that is their perpetual</text>
<text x="234" y="292" font-size="11.5" text-anchor="middle" fill="#56657a">possession”</text>
<rect x="316" y="228" width="148" height="84" rx="10" fill="#fdecea" stroke="#f3c4bd"/>
<text x="390" y="256" font-size="14" font-weight="700" text-anchor="middle" fill="#a3362a">May not</text>
<text x="390" y="276" font-size="11.5" text-anchor="middle" fill="#56657a">he concedes to</text>
<text x="390" y="292" font-size="11.5" text-anchor="middle" fill="#56657a">Rabbi Yehuda</text>
<rect x="472" y="228" width="148" height="84" rx="10" fill="#fdecea" stroke="#f3c4bd"/>
<text x="546" y="256" font-size="14" font-weight="700" text-anchor="middle" fill="#a3362a">May not</text>
<text x="546" y="276" font-size="11.5" text-anchor="middle" fill="#56657a">Rabbi Yehuda’s</text>
<text x="546" y="292" font-size="11" text-anchor="middle" fill="#56657a">statement appears correct</text>

<!-- row: Levites, movables -->
<rect x="20" y="320" width="132" height="84" rx="10" fill="#fff" stroke="#dbe3ee"/>
<text x="86" y="356" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2d3d">Levites</text>
<text x="86" y="375" font-size="12" text-anchor="middle" fill="#56657a">movable property</text>
<rect x="160" y="320" width="148" height="84" rx="10" fill="#fdecea" stroke="#f3c4bd"/>
<text x="234" y="348" font-size="14" font-weight="700" text-anchor="middle" fill="#a3362a">May not</text>
<text x="234" y="368" font-size="11.5" text-anchor="middle" fill="#56657a">the verse juxtaposes</text>
<text x="234" y="384" font-size="11.5" text-anchor="middle" fill="#56657a">movable property to land</text>
<rect x="316" y="320" width="148" height="84" rx="10" fill="#e6f4ea" stroke="#b9dfc4"/>
<text x="390" y="348" font-size="14" font-weight="700" text-anchor="middle" fill="#2f7a45">May dedicate</text>
<text x="390" y="368" font-size="11.5" text-anchor="middle" fill="#56657a">the dedications are not</text>
<text x="390" y="384" font-size="11.5" text-anchor="middle" fill="#56657a">theirs; no juxtaposition</text>
<rect x="472" y="320" width="148" height="84" rx="10" fill="#e6f4ea" stroke="#b9dfc4"/>
<text x="546" y="348" font-size="14" font-weight="700" text-anchor="middle" fill="#2f7a45">May dedicate</text>
<text x="546" y="368" font-size="11.5" text-anchor="middle" fill="#56657a">Rabbi Shimon’s</text>
<text x="546" y="384" font-size="11" text-anchor="middle" fill="#56657a">statement appears correct</text>

<text x="32" y="434" font-size="12.5" fill="#1f2d3d"><tspan font-weight="700">The Gemara:</tspan> even Rabbi Shimon disagrees only with regard to movable</text>
<text x="32" y="452" font-size="12.5" fill="#1f2d3d">property; with regard to land he concedes to Rabbi Yehuda.</text>
</svg>
