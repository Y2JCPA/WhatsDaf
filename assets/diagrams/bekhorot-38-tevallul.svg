<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>The tevallul</title>
  <rect width="640" height="420" rx="18" fill="#f3f6fb"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1f2a3d">The tevallul: a thread across the ring</text>
  <text x="32" y="68" font-size="13.5" fill="#55627a">Schematic only. The sira is the ring around the black (Rashi).</text>

  <!-- Panel A -->
  <rect x="22" y="86" width="290" height="310" rx="14" fill="#fff" stroke="#d9e1ee"/>
  <text x="167" y="114" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2a3d">White thread into the black</text>
  <circle cx="167" cy="196" r="66" fill="#eef1f6" stroke="#9aa6b8" stroke-width="1.5"/>
  <circle cx="167" cy="196" r="32" fill="#2b3442"/>
  <circle cx="167" cy="196" r="34" fill="none" stroke="#c9862b" stroke-width="3"/>
  <line x1="112" y1="160" x2="160" y2="190" stroke="#7d8ca3" stroke-width="7" stroke-linecap="round"/>
  <line x1="112" y1="160" x2="160" y2="190" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <text x="250" y="160" font-size="12" fill="#55627a">white</text>
  <line x1="248" y1="156" x2="226" y2="168" stroke="#9aa6b8"/>
  <text x="250" y="236" font-size="12" fill="#c9862b">sira</text>
  <line x1="248" y1="232" x2="196" y2="214" stroke="#c9862b"/>
  <text x="62" y="250" font-size="12" fill="#2b3442">black</text>
  <line x1="94" y1="246" x2="150" y2="214" stroke="#2b3442"/>
  <text x="167" y="300" font-size="14" text-anchor="middle" fill="#1f2a3d">Rabbi Meir: <tspan font-weight="700" fill="#c0392b">a blemish</tspan></text>
  <text x="167" y="324" font-size="14" text-anchor="middle" fill="#1f2a3d">Rabbi Yosei: <tspan font-weight="700" fill="#c0392b">a blemish</tspan></text>
  <text x="167" y="362" font-size="12.5" text-anchor="middle" fill="#55627a">The mishna’s tevallul</text>

  <!-- Panel B -->
  <rect x="328" y="86" width="290" height="310" rx="14" fill="#fff" stroke="#d9e1ee"/>
  <text x="473" y="114" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2a3d">Black thread into the white</text>
  <circle cx="473" cy="196" r="66" fill="#eef1f6" stroke="#9aa6b8" stroke-width="1.5"/>
  <circle cx="473" cy="196" r="32" fill="#2b3442"/>
  <circle cx="473" cy="196" r="34" fill="none" stroke="#c9862b" stroke-width="3"/>
  <line x1="480" y1="202" x2="526" y2="236" stroke="#2b3442" stroke-width="5" stroke-linecap="round"/>
  <text x="473" y="300" font-size="14" text-anchor="middle" fill="#1f2a3d">Rabbi Meir: <tspan font-weight="700" fill="#c0392b">a blemish</tspan></text>
  <text x="473" y="324" font-size="14" text-anchor="middle" fill="#1f2a3d">Rabbi Yosei: <tspan font-weight="700" fill="#2e7d32">not a blemish</tspan></text>
  <text x="473" y="362" font-size="12.5" text-anchor="middle" fill="#55627a">“There are no blemishes in the white”</text>
  <text x="473" y="380" font-size="12.5" text-anchor="middle" fill="#55627a">The mishna follows Rabbi Yosei</text>
</svg>
