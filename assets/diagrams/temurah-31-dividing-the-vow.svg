<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 693" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>Dividing a vow</title>
  <rect width="640" height="693" rx="18" fill="#f3f6fb"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1f2d3d">Dividing a vow</text>
  <text x="32" y="70" font-size="14" fill="#5b6b7d">Rav Adda bar Ahava in Rav’s name: two versions of the dispute (31b)</text>
  <rect x="32" y="90" width="576" height="215" rx="12" fill="#ffffff" stroke="#dfe8f3"/>
  <text x="48" y="114" font-size="12" font-weight="700" fill="#2f5d9e" letter-spacing="0.6">FIRST VERSION</text>
  <text x="214" y="114" font-size="12" font-weight="700" fill="#7f8fa3" letter-spacing="0.4">RABBI ELIEZER</text>
  <text x="418" y="114" font-size="12" font-weight="700" fill="#7f8fa3" letter-spacing="0.4">RABBI YEHOSHUA</text>
  <rect x="48" y="126" width="544" height="52" rx="8" fill="#eaf6ee"/>
  <text x="60" y="148" font-size="13.5" font-weight="700" fill="#1f2d3d">A herd entirely</text>
  <text x="60" y="165" font-size="13.5" font-weight="700" fill="#1f2d3d">male</text>
  <text x="214" y="157" font-size="13.5" fill="#1e6b3a" font-weight="600">Both agree: the animals are brought as burnt offerings</text>
  <rect x="48" y="186" width="544" height="103" rx="8" fill="#f6f8fb"/>
  <text x="60" y="208" font-size="13.5" font-weight="700" fill="#1f2d3d">A herd half male,</text>
  <text x="60" y="225" font-size="13.5" font-weight="700" fill="#1f2d3d">half female</text>
  <text x="214" y="208" font-size="13" fill="#1f2d3d">Does not divide his vow:</text>
  <text x="214" y="225" font-size="13" fill="#1f2d3d">the females are not burnt</text>
  <text x="214" y="242" font-size="13" fill="#1f2d3d">offerings, so the males</text>
  <text x="214" y="259" font-size="13" fill="#1f2d3d">are not either</text>
  <text x="418" y="208" font-size="13" fill="#1f2d3d">Divides his vow: the males</text>
  <text x="418" y="225" font-size="13" fill="#1f2d3d">are burnt offerings; the</text>
  <text x="418" y="242" font-size="13" fill="#1f2d3d">females are sold for peace</text>
  <text x="418" y="259" font-size="13" fill="#1f2d3d">offerings and the money</text>
  <text x="418" y="276" font-size="13" fill="#1f2d3d">buys burnt offerings</text>
  <rect x="32" y="319" width="576" height="198" rx="12" fill="#ffffff" stroke="#dfe8f3"/>
  <text x="48" y="343" font-size="12" font-weight="700" fill="#2f5d9e" letter-spacing="0.6">LATTER VERSION</text>
  <text x="214" y="343" font-size="12" font-weight="700" fill="#7f8fa3" letter-spacing="0.4">RABBI ELIEZER</text>
  <text x="418" y="343" font-size="12" font-weight="700" fill="#7f8fa3" letter-spacing="0.4">RABBI YEHOSHUA</text>
  <rect x="48" y="355" width="544" height="52" rx="8" fill="#eaf6ee"/>
  <text x="60" y="377" font-size="13.5" font-weight="700" fill="#1f2d3d">Only animals</text>
  <text x="60" y="394" font-size="13.5" font-weight="700" fill="#1f2d3d">consecrated</text>
  <text x="214" y="386" font-size="13.5" fill="#1e6b3a" font-weight="600">Both agree: all are consecrated for the altar</text>
  <rect x="48" y="415" width="544" height="86" rx="8" fill="#f6f8fb"/>
  <text x="60" y="437" font-size="13.5" font-weight="700" fill="#1f2d3d">Animals with</text>
  <text x="60" y="454" font-size="13.5" font-weight="700" fill="#1f2d3d">other property</text>
  <text x="214" y="437" font-size="13" fill="#1f2d3d">Does not divide his vow:</text>
  <text x="214" y="454" font-size="13" fill="#1f2d3d">the other property is not</text>
  <text x="214" y="471" font-size="13" fill="#1f2d3d">for the altar, so the</text>
  <text x="214" y="488" font-size="13" fill="#1f2d3d">animals are not either</text>
  <text x="418" y="437" font-size="13" fill="#1f2d3d">Divides his vow: the</text>
  <text x="418" y="454" font-size="13" fill="#1f2d3d">animals are for the altar,</text>
  <text x="418" y="471" font-size="13" fill="#1f2d3d">the other property for</text>
  <text x="418" y="488" font-size="13" fill="#1f2d3d">Temple maintenance</text>
  <rect x="32" y="531" width="576" height="138" rx="12" fill="#fff8e6" stroke="#ecd9a8"/>
  <text x="48" y="557" font-size="12" font-weight="700" fill="#b26a00" letter-spacing="0.6">WHY THEY AGREE</text>
  <text x="48" y="575" font-size="13.5" fill="#1f2d3d">A person does not set aside sanctity for the altar and</text>
  <text x="48" y="593" font-size="13.5" fill="#1f2d3d">consecrate for Temple maintenance instead.</text>
  <text x="48" y="617" font-size="12" font-weight="700" fill="#b26a00" letter-spacing="0.6">“WITH THE REST OF HIS PROPERTY”</text>
  <text x="48" y="635" font-size="13.5" fill="#1f2d3d">Rabbi Eliezer’s words fit the latter version. For the first,</text>
  <text x="48" y="653" font-size="13.5" fill="#1f2d3d">a <tspan font-style="italic">baraita</tspan> also teaches: “allocated for Temple maintenance.”</text>
</svg>
