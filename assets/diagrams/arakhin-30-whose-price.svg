<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="560" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2a3a">Whose price sets the redemption?</text>
  <text x="320" y="70" text-anchor="middle" font-size="14" fill="#55627a">An ancestral field sold and then redeemed before the Jubilee (30a)</text>

  <!-- Section 1: two buyers -->
  <text x="32" y="104" font-size="15" font-weight="700" fill="#2e5aa8">The mishna and Rabbi: the field passes to a second buyer</text>

  <rect x="24" y="116" width="592" height="70" rx="12" fill="#ffffff" stroke="#c9d3e3"/>
  <text x="40" y="140" font-size="13" fill="#1f2a3a">Owner → first buyer for <tspan font-weight="700">100</tspan> → second buyer for <tspan font-weight="700">200</tspan></text>
  <text x="40" y="164" font-size="12" fill="#55627a">“to the man to whom he sold it”</text>
  <rect x="404" y="128" width="198" height="46" rx="10" fill="#dff1e3"/>
  <text x="503" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#1d6b35">Reckon with the first</text>
  <text x="503" y="166" text-anchor="middle" font-size="13" fill="#1d6b35">at 100</text>

  <rect x="24" y="196" width="592" height="70" rx="12" fill="#ffffff" stroke="#c9d3e3"/>
  <text x="40" y="220" font-size="13" fill="#1f2a3a">Owner → first buyer for <tspan font-weight="700">200</tspan> → second buyer for <tspan font-weight="700">100</tspan></text>
  <text x="40" y="244" font-size="12" fill="#55627a">“to the man”: the one now in possession</text>
  <rect x="404" y="208" width="198" height="46" rx="10" fill="#dff1e3"/>
  <text x="503" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#1d6b35">Reckon with the last</text>
  <text x="503" y="246" text-anchor="middle" font-size="13" fill="#1d6b35">at 100</text>

  <!-- Section 2: Rabbi Dostai -->
  <text x="32" y="300" font-size="15" font-weight="700" fill="#2e5aa8">Rabbi Dostai ben Yehuda: one buyer, the value changes</text>

  <rect x="24" y="312" width="592" height="70" rx="12" fill="#ffffff" stroke="#c9d3e3"/>
  <text x="40" y="336" font-size="13" fill="#1f2a3a">Sold for <tspan font-weight="700">100</tspan>, appreciated to <tspan font-weight="700">200</tspan></text>
  <text x="40" y="360" font-size="12" fill="#55627a">“the remainder”: the remainder that is in his hand</text>
  <rect x="404" y="324" width="198" height="46" rx="10" fill="#dff1e3"/>
  <text x="503" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#1d6b35">Reckon at 100</text>

  <rect x="24" y="392" width="592" height="70" rx="12" fill="#ffffff" stroke="#c9d3e3"/>
  <text x="40" y="416" font-size="13" fill="#1f2a3a">Sold for <tspan font-weight="700">200</tspan>, depreciated to <tspan font-weight="700">100</tspan></text>
  <text x="40" y="440" font-size="12" fill="#55627a">“the remainder”: what remains of the land</text>
  <rect x="404" y="404" width="198" height="46" rx="10" fill="#dff1e3"/>
  <text x="503" y="432" text-anchor="middle" font-size="13" font-weight="700" fill="#1d6b35">Reckon at 100</text>

  <!-- Section 3: where they differ -->
  <rect x="24" y="474" width="592" height="70" rx="12" fill="#fff7e6" stroke="#e8c98a"/>
  <text x="40" y="496" font-size="13" font-weight="700" fill="#8a5a00">Where they differ: worth 200 at the first sale, 100 at the second, 200 again</text>
  <text x="40" y="520" font-size="13" fill="#1f2a3a"><tspan font-weight="700">Rabbi:</tspan> 100, what the second buyer paid</text>
  <text x="330" y="520" font-size="13" fill="#1f2a3a"><tspan font-weight="700">Rabbi Dostai:</tspan> 200, by either reading</text>
</svg>
