<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="600" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2a3a">Counting the years of redemption</text>
  <text x="320" y="70" text-anchor="middle" font-size="14" fill="#55627a">An ancestral field redeemed after the Jubilee, per beit kor (25a)</text>

  <!-- Card A -->
  <rect x="24" y="92" width="290" height="270" rx="12" fill="#ffffff" stroke="#c9d3e3"/>
  <text x="40" y="120" font-size="15" font-weight="700" fill="#2e5aa8">Months do not lower the price</text>
  <text x="40" y="140" font-size="12" fill="#55627a">The Gemara’s example (25a)</text>
  <rect x="40" y="156" width="258" height="44" rx="8" fill="#eef2f8"/>
  <text x="169" y="175" text-anchor="middle" font-size="13.5" fill="#1f2a3a">5½ years remain</text>
  <text x="169" y="192" text-anchor="middle" font-size="13.5" fill="#1f2a3a">until the Jubilee</text>
  <text x="169" y="222" text-anchor="middle" font-size="18" fill="#55627a">↓</text>
  <rect x="40" y="234" width="258" height="44" rx="8" fill="#dff1e3"/>
  <text x="169" y="253" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1d6b35">He gives 6 sela</text>
  <text x="169" y="270" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1d6b35">and 6 pundeyon</text>
  <rect x="40" y="290" width="258" height="44" rx="8" fill="#fbe3e3"/>
  <text x="169" y="309" text-anchor="middle" font-size="13" fill="#9b2c2c">not 5½ of each of a sela</text>
  <text x="169" y="326" text-anchor="middle" font-size="13" fill="#9b2c2c">and a pundeyon</text>
  <text x="169" y="352" text-anchor="middle" font-size="11.5" fill="#55627a">“You calculate years, not months”</text>

  <!-- Card B -->
  <rect x="326" y="92" width="290" height="270" rx="12" fill="#ffffff" stroke="#c9d3e3"/>
  <text x="342" y="120" font-size="15" font-weight="700" fill="#2e5aa8">Months may count as a year</text>
  <text x="342" y="140" font-size="12" fill="#55627a">The baraita’s case (25a)</text>
  <rect x="342" y="156" width="258" height="44" rx="8" fill="#eef2f8"/>
  <text x="471" y="175" text-anchor="middle" font-size="13.5" fill="#1f2a3a">Consecrated in the middle</text>
  <text x="471" y="192" text-anchor="middle" font-size="13.5" fill="#1f2a3a">of the forty-eighth year</text>
  <text x="471" y="222" text-anchor="middle" font-size="18" fill="#55627a">↓</text>
  <rect x="342" y="234" width="258" height="44" rx="8" fill="#dff1e3"/>
  <text x="471" y="253" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1d6b35">Months counted as a year:</text>
  <text x="471" y="270" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1d6b35">full valuation, 50 sela</text>
  <rect x="342" y="290" width="258" height="44" rx="8" fill="#fbe3e3"/>
  <text x="471" y="309" text-anchor="middle" font-size="13" fill="#9b2c2c">not 2 sela and 2 pundeyon,</text>
  <text x="471" y="326" text-anchor="middle" font-size="13" fill="#9b2c2c">as if two years remained</text>
  <text x="471" y="352" text-anchor="middle" font-size="11.5" fill="#55627a">“The priest shall reckon for him”: in any case</text>

  <!-- Rules strip -->
  <rect x="24" y="378" width="592" height="198" rx="12" fill="#ffffff" stroke="#c9d3e3"/>
  <text x="40" y="404" font-size="15" font-weight="700" fill="#2e5aa8">The mishna’s rates and the baraitot</text>
  <text x="40" y="432" font-size="13.5" fill="#1f2a3a"><tspan font-weight="700">50 sela</tspan> for the sowing of a kor (ḥomer) of barley seed</text>
  <text x="40" y="458" font-size="13.5" fill="#1f2a3a"><tspan font-weight="700">1 sela + 1 pundeyon</tspan> (1/48 sela) per year left until the Jubilee</text>
  <text x="40" y="484" font-size="13.5" fill="#1f2a3a">Years the field stood with the Temple treasury are deducted too</text>
  <text x="40" y="510" font-size="13.5" fill="#1f2a3a">The whole sum is paid at once, not year by year</text>
  <text x="40" y="536" font-size="13.5" fill="#1f2a3a">The owner adds <tspan font-weight="700">one-fifth</tspan>; any other redeemer does not</text>
  <text x="40" y="560" font-size="11.5" fill="#55627a">Mishna 25a (a6–a7); baraitot on “and a deduction shall be made” and “the money” (Leviticus 27:18)</text>
</svg>
