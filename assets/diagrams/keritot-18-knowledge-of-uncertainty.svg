<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 816" width="640" height="816" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="816" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Does knowledge of uncertainty divide?</text>
  <text x="320" y="68" text-anchor="middle" font-size="14" fill="#4b5563">Keritot 18b: two readings of Rabbi’s “just as … so too”</text>
  <rect x="24" y="84" width="592" height="62" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="106" font-size="12.5" fill="#374151">He ate possibly forbidden fat and was informed; again possibly forbidden fat, and was informed.</text>
  <text x="40" y="128" font-size="12.5" fill="#1f2937"><tspan font-weight="700">Rabbi:</tspan> just as a sin offering for each one, so a provisional guilt offering for each one.</text>
  <rect x="24" y="156" width="290" height="140" rx="9" fill="#e8f0fb" stroke="#9fbbe0"/>
  <text x="38" y="180" font-size="14" font-weight="700" fill="#1e3a5f">Divides into sin offerings</text>
  <text x="38" y="200" font-size="12.5" font-weight="600" fill="#1f2937">Rabbi Zeira · Reish Lakish · Abaye</text>
  <text x="38" y="224" font-size="12.5" fill="#374151">“Here Rabbi taught”: knowledge of an</text>
  <text x="38" y="242" font-size="12.5" fill="#374151">uncertainty in between divides them, so</text>
  <text x="38" y="260" font-size="12.5" fill="#374151">if he later learns they were forbidden fat,</text>
  <text x="38" y="278" font-size="12.5" fill="#374151">a sin offering for each one.</text>
  <rect x="326" y="156" width="290" height="140" rx="9" fill="#fff7e6" stroke="#f0cf8f"/>
  <text x="340" y="180" font-size="14" font-weight="700" fill="#7a4a00">Does not divide</text>
  <text x="340" y="200" font-size="12.5" font-weight="600" fill="#1f2937">Rava · Rabbi Yoḥanan</text>
  <text x="340" y="224" font-size="12.5" fill="#374151">Rabbi means: just as with definite</text>
  <text x="340" y="242" font-size="12.5" fill="#374151">knowledge in between, a sin offering for</text>
  <text x="340" y="260" font-size="12.5" fill="#374151">each; so with knowledge of uncertainty,</text>
  <text x="340" y="278" font-size="12.5" fill="#374151">a provisional guilt offering for each.</text>
  <text x="24" y="322" font-size="14" font-weight="700" fill="#1f2937">Challenges on the daf</text>
  <rect x="24" y="334" width="592" height="66" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="24" y="334" width="7" height="66" rx="3" fill="#f0cf8f"/>
  <text x="42" y="354" font-size="13" font-weight="700" fill="#1f2937">Abaye, to Rava</text>
  <rect x="436" y="341" width="170" height="20" rx="10" fill="#fff7e6" stroke="#f0cf8f"/>
  <text x="521" y="355" text-anchor="middle" font-size="11" font-weight="600" fill="#7a4a00">against “does not divide”</text>
  <text x="42" y="374" font-size="12.5" fill="#374151">A baraita: wherever they are divided for sin offerings,</text>
  <text x="42" y="392" font-size="12.5" fill="#374151">they are divided for guilt offerings.</text>
  <rect x="24" y="406" width="592" height="84" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="24" y="406" width="7" height="84" rx="3" fill="#9fbbe0"/>
  <text x="42" y="426" font-size="13" font-weight="700" fill="#1f2937">Rava bar Ḥanan, to Abaye</text>
  <rect x="436" y="413" width="170" height="20" rx="10" fill="#e8f0fb" stroke="#9fbbe0"/>
  <text x="521" y="427" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a5f">against “divides”</text>
  <text x="42" y="446" font-size="12.5" fill="#374151">Fat before Yom Kippur and after it: two sin offerings? He ate both in one lapse.</text>
  <text x="42" y="464" font-size="12.5" fill="#374151">Abaye: perhaps Yom Kippur atones only for what he knew.</text>
  <text x="42" y="482" font-size="12.5" fill="#374151">Rava: we learned “informed or not informed.”</text>
  <rect x="24" y="496" width="592" height="84" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="24" y="496" width="7" height="84" rx="3" fill="#9fbbe0"/>
  <text x="42" y="516" font-size="13" font-weight="700" fill="#1f2937">Some say: Rava bar Ḥanan, to Abaye</text>
  <rect x="436" y="503" width="170" height="20" rx="10" fill="#e8f0fb" stroke="#9fbbe0"/>
  <text x="521" y="517" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a5f">against “divides”</text>
  <text x="42" y="536" font-size="12.5" fill="#374151">Fat in the morning of Yom Kippur and in the afternoon: two sin offerings?</text>
  <text x="42" y="554" font-size="12.5" fill="#374151">Abaye: perhaps the whole day atones from the evening.</text>
  <text x="42" y="572" font-size="12.5" fill="#374151">Rabba bar bar Ḥana: even at nightfall he is exempt; the whole day atones.</text>
  <rect x="24" y="586" width="592" height="66" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="24" y="586" width="7" height="66" rx="3" fill="#9fbbe0"/>
  <text x="42" y="606" font-size="13" font-weight="700" fill="#1f2937">Rav Idi bar Avin, against Abaye</text>
  <rect x="436" y="593" width="170" height="20" rx="10" fill="#e8f0fb" stroke="#9fbbe0"/>
  <text x="521" y="607" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a5f">against “divides”</text>
  <text x="42" y="626" font-size="12.5" fill="#374151">He ate and drank on Yom Kippur in one lapse: only one sin offering.</text>
  <text x="42" y="644" font-size="12.5" fill="#374151">Answer: Rabbi Zeira spoke for Rabbi; that mishna is the Rabbis.</text>
  <rect x="24" y="658" width="592" height="66" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="24" y="658" width="7" height="66" rx="3" fill="#9fbbe0"/>
  <text x="42" y="678" font-size="13" font-weight="700" fill="#1f2937">Rava, to Abaye</text>
  <rect x="436" y="665" width="170" height="20" rx="10" fill="#e8f0fb" stroke="#9fbbe0"/>
  <text x="521" y="679" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a5f">against “divides”</text>
  <text x="42" y="698" font-size="12.5" fill="#374151">Misuse today and tomorrow combines to a peruta, with Yom Kippur between.</text>
  <text x="42" y="716" font-size="12.5" fill="#374151">Answer: Yom Kippur does not atone for monetary matters, or for half a measure.</text>
  <rect x="24" y="730" width="592" height="66" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="24" y="730" width="7" height="66" rx="3" fill="#9fbbe0"/>
  <text x="42" y="750" font-size="13" font-weight="700" fill="#1f2937">Against Reish Lakish</text>
  <rect x="436" y="737" width="170" height="20" rx="10" fill="#e8f0fb" stroke="#9fbbe0"/>
  <text x="521" y="751" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a5f">against “divides”</text>
  <text x="42" y="770" font-size="12.5" fill="#374151">Rabbi should then have tied the sin offering to the guilt offering.</text>
  <text x="42" y="788" font-size="12.5" fill="#374151">This is difficult.</text>
</svg>
