<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>An extra digit from a corpse</title>
  <rect width="640" height="520" rx="18" fill="#f3f6fb"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1d2a3a">An extra digit from a corpse</text>
  <text x="32" y="68" font-size="14" fill="#5a6b80">A bone but no nail: two rulings, reconciled by where the digit sits (45a)</text>

  <text x="400" y="104" font-size="13" font-weight="700" fill="#5a6b80" text-anchor="middle">Contact and carrying</text>
  <text x="548" y="104" font-size="13" font-weight="700" fill="#5a6b80" text-anchor="middle">In a tent</text>

  <rect x="24" y="116" width="592" height="64" rx="12" fill="#fff" stroke="#d9e1ec"/>
  <text x="40" y="142" font-size="15" font-weight="600" fill="#1d2a3a">Counted in the row of the fingers</text>
  <text x="40" y="164" font-size="12.5" fill="#6b7a8f">A limb (the baraita)</text>
  <rect x="352" y="134" width="96" height="28" rx="14" fill="#fbe3e0"/><text x="400" y="153" font-size="13.5" font-weight="700" fill="#a3362a" text-anchor="middle">impure</text>
  <rect x="500" y="134" width="96" height="28" rx="14" fill="#fbe3e0"/><text x="548" y="153" font-size="13.5" font-weight="700" fill="#a3362a" text-anchor="middle">impure</text>

  <rect x="24" y="188" width="592" height="64" rx="12" fill="#fff" stroke="#d9e1ec"/>
  <text x="40" y="214" font-size="15" font-weight="600" fill="#1d2a3a">Not counted in the row</text>
  <text x="40" y="236" font-size="12.5" fill="#6b7a8f">Rav, cited by Rav Ḥisda</text>
  <rect x="352" y="206" width="96" height="28" rx="14" fill="#fbe3e0"/><text x="400" y="225" font-size="13.5" font-weight="700" fill="#a3362a" text-anchor="middle">impure</text>
  <rect x="500" y="206" width="96" height="28" rx="14" fill="#e2f0e4"/><text x="548" y="225" font-size="13.5" font-weight="700" fill="#2f6b3a" text-anchor="middle">pure</text>

  <text x="32" y="292" font-size="16" font-weight="700" fill="#1d2a3a">Why impure by contact, but not in a tent?</text>

  <rect x="24" y="306" width="592" height="62" rx="12" fill="#fff" stroke="#d9e1ec"/>
  <text x="40" y="330" font-size="14" font-weight="700" fill="#1d2a3a">Rabbi Yoḥanan</text>
  <text x="40" y="352" font-size="13" fill="#3d4b5e">“Like statements of prophecy”: no reason can be given either way.</text>

  <rect x="24" y="376" width="592" height="62" rx="12" fill="#fff" stroke="#d9e1ec"/>
  <text x="40" y="400" font-size="14" font-weight="700" fill="#1d2a3a">Rav Huna bar Manoaḥ, citing Rav Aḥa son of Rav Ika</text>
  <text x="40" y="422" font-size="13" fill="#3d4b5e">It is treated like a bone the size of a barley grain.</text>

  <rect x="24" y="446" width="592" height="62" rx="12" fill="#fff" stroke="#d9e1ec"/>
  <text x="40" y="470" font-size="14" font-weight="700" fill="#1d2a3a">Rav Pappa</text>
  <text x="40" y="492" font-size="13" fill="#3d4b5e">A decree because of the counted digit; no tent, so teruma is not burned for it.</text>
</svg>
