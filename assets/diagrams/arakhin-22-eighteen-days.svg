<text x="36" y="523" font-size="13.5" font-weight="700" fill="#1f2d3d">Rashi and Rabbeinu Gershom: count from a Monday.</text>
<text x="36" y="545" font-size="13" fill="#56657a">Eight weeks are 56 days, with 16 Mondays and Thursdays.</text>
<text x="36" y="567" font-size="13" fill="#56657a">Four more days, Monday to Thursday, make 60 days and 18 proclamations.</text>
<text x="36" y="589" font-size="13.5" font-weight="700" fill="#1f2d3d">On consecutive days: thirty days.</text>
<text x="36" y="611" font-size="13" font-style="italic" fill="#56657a">“Since the matter extends, people hear.”</text>
