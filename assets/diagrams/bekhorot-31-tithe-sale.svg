<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>Selling the meat of an animal tithe</title>
  <rect width="640" height="520" rx="18" fill="#f3f6fb"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1f2d3d">Selling the meat of an animal tithe</text>
  <text x="32" y="70" font-size="13" fill="#4a5a6e">The baraita: “An animal tithe of orphans: one may sell it. And an animal tithe</text>
  <text x="32" y="88" font-size="13" fill="#4a5a6e">that one has slaughtered: one may include it in its hide, fat, sinews and horns.”</text>

  <!-- column headers -->
  <rect x="190" y="106" width="206" height="54" rx="12" fill="#dbe7f6"/>
  <text x="293" y="129" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2d3d">Abaye</text>
  <text x="293" y="149" font-size="12.5" text-anchor="middle" fill="#4a5a6e">one case</text>
  <rect x="408" y="106" width="206" height="54" rx="12" fill="#e3f0e3"/>
  <text x="511" y="129" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2d3d">Rava</text>
  <text x="511" y="149" font-size="12.5" text-anchor="middle" fill="#4a5a6e">two cases: “animal tithe” twice</text>

  <!-- row 1 -->
  <rect x="26" y="172" width="152" height="86" rx="12" fill="#ffffff" stroke="#d5deea"/>
  <text x="102" y="210" font-size="14.5" font-weight="700" text-anchor="middle" fill="#1f2d3d">Orphans’</text>
  <text x="102" y="230" font-size="14.5" font-weight="700" text-anchor="middle" fill="#1f2d3d">tithe</text>
  <rect x="190" y="172" width="206" height="86" rx="12" fill="#ffffff" stroke="#d5deea"/>
  <text x="293" y="208" font-size="14" text-anchor="middle" fill="#1f2d3d">May be sold,</text>
  <text x="293" y="228" font-size="14" text-anchor="middle" fill="#1f2d3d">but only by inclusion</text>
  <rect x="408" y="172" width="206" height="86" rx="12" fill="#ffffff" stroke="#d5deea"/>
  <text x="511" y="208" font-size="14" text-anchor="middle" fill="#1f2d3d">May be sold</text>
  <text x="511" y="228" font-size="14" text-anchor="middle" fill="#1f2d3d">in its usual manner</text>

  <!-- row 2 -->
  <rect x="26" y="270" width="152" height="96" rx="12" fill="#ffffff" stroke="#d5deea"/>
  <text x="102" y="306" font-size="14.5" font-weight="700" text-anchor="middle" fill="#1f2d3d">An adult’s tithe,</text>
  <text x="102" y="326" font-size="14.5" font-weight="700" text-anchor="middle" fill="#1f2d3d">slaughtered</text>
  <rect x="190" y="270" width="206" height="96" rx="12" fill="#ffffff" stroke="#d5deea"/>
  <text x="293" y="306" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="700">Not even by inclusion</text>
  <text x="293" y="328" font-size="12" text-anchor="middle" fill="#6b7a8e">the Gemara’s inference</text>
  <text x="293" y="346" font-size="12" text-anchor="middle" fill="#6b7a8e">from Abaye’s reading</text>
  <rect x="408" y="270" width="206" height="96" rx="12" fill="#ffffff" stroke="#d5deea"/>
  <text x="511" y="300" font-size="14" text-anchor="middle" fill="#2e7d32" font-weight="700">Only by inclusion</text>
  <text x="511" y="322" font-size="13" text-anchor="middle" fill="#1f2d3d">in the price of the hide,</text>
  <text x="511" y="340" font-size="13" text-anchor="middle" fill="#1f2d3d">fat, sinews and horns</text>

  <!-- row 3: why -->
  <rect x="26" y="378" width="152" height="118" rx="12" fill="#ffffff" stroke="#d5deea"/>
  <text x="102" y="442" font-size="14.5" font-weight="700" text-anchor="middle" fill="#1f2d3d">Why</text>
  <rect x="190" y="378" width="206" height="118" rx="12" fill="#ffffff" stroke="#d5deea"/>
  <text x="293" y="406" font-size="12.5" text-anchor="middle" fill="#1f2d3d">An etrog folded into a</text>
  <text x="293" y="424" font-size="12.5" text-anchor="middle" fill="#1f2d3d">lulav’s price is not evident;</text>
  <text x="293" y="442" font-size="12.5" text-anchor="middle" fill="#1f2d3d">meat folded into the price</text>
  <text x="293" y="460" font-size="12.5" text-anchor="middle" fill="#1f2d3d">of a hide is evident</text>
  <rect x="408" y="378" width="206" height="118" rx="12" fill="#ffffff" stroke="#d5deea"/>
  <text x="511" y="400" font-size="12.5" text-anchor="middle" fill="#1f2d3d">Like substitution, the Torah</text>
  <text x="511" y="418" font-size="12.5" text-anchor="middle" fill="#1f2d3d">forbids sale only while alive.</text>
  <text x="511" y="436" font-size="12.5" text-anchor="middle" fill="#1f2d3d">The Sages’ decree after</text>
  <text x="511" y="454" font-size="12.5" text-anchor="middle" fill="#1f2d3d">slaughter covers what is</text>
  <text x="511" y="472" font-size="12.5" text-anchor="middle" fill="#1f2d3d">appraised alive: the meat</text>
</svg>
