<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 756" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>Two ewes give birth together</title>
  <rect width="640" height="756" rx="18" fill="#f3f6fb"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1f2a3a">Two ewes give birth together</text><text x="32" y="68" font-size="14" fill="#5a6577">Mishna, Bekhorot 18b: what the priest receives</text><rect x="20" y="98" width="600" height="30" rx="8" fill="#dfe7f3"/><text x="32" y="118" font-size="14.5" font-weight="700" fill="#24324a">Both ewes had not given birth before</text><rect x="20" y="138" width="600" height="58" rx="10" fill="#fff" stroke="#d8e0ec"/><circle cx="44" cy="167" r="11" fill="#5b8fd6"/><text x="44" y="171.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M</text><circle cx="70" cy="167" r="11" fill="#5b8fd6"/><text x="70" y="171.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M</text><rect x="172" y="148" width="5" height="38" rx="2" fill="#2e7d32"/><text x="188" y="164" font-size="15" font-weight="700" fill="#1f2a3a">Both males to the priest</text><text x="188" y="183" font-size="12.5" fill="#5a6577">Each is its own mother’s firstborn</text><rect x="20" y="204" width="600" height="58" rx="10" fill="#fff" stroke="#d8e0ec"/><circle cx="44" cy="233" r="11" fill="#5b8fd6"/><text x="44" y="237.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M</text><circle cx="70" cy="233" r="11" fill="#d77fa6"/><text x="70" y="237.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">F</text><rect x="172" y="214" width="5" height="38" rx="2" fill="#2e7d32"/><text x="188" y="230" font-size="15" font-weight="700" fill="#1f2a3a">The male to the priest</text><text x="188" y="249" font-size="12.5" fill="#5a6577">It is its mother’s firstborn</text><rect x="20" y="270" width="600" height="96" rx="10" fill="#fff" stroke="#d8e0ec"/><circle cx="44" cy="299" r="11" fill="#5b8fd6"/><text x="44" y="303.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M</text><circle cx="70" cy="299" r="11" fill="#5b8fd6"/><text x="70" y="303.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M</text><circle cx="96" cy="299" r="11" fill="#d77fa6"/><text x="96" y="303.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">F</text><rect x="172" y="280" width="5" height="76" rx="2" fill="#b26a00"/><text x="188" y="296" font-size="15" font-weight="700" fill="#1f2a3a">One male to the priest, one to the owner</text><text x="188" y="315" font-size="12.5" fill="#5a6577">The female may have come out first (Rashi)</text><text x="188" y="336" font-size="12.5" fill="#b26a00">Rabbi Tarfon: the priest chooses the better one</text><text x="188" y="354" font-size="12.5" fill="#b26a00">Rabbi Akiva: they assess, and the priest takes the leaner</text><rect x="20" y="374" width="600" height="78" rx="10" fill="#fff" stroke="#d8e0ec"/><circle cx="44" cy="398" r="11" fill="#d77fa6"/><text x="44" y="402.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">F</text><circle cx="70" cy="398" r="11" fill="#d77fa6"/><text x="70" y="402.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">F</text><circle cx="96" cy="398" r="11" fill="#5b8fd6"/><text x="96" y="402.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M</text><text x="36" y="433" font-size="12" fill="#5a6577">or</text><circle cx="62" cy="429" r="11" fill="#5b8fd6"/><text x="62" y="433.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M</text><circle cx="88" cy="429" r="11" fill="#5b8fd6"/><text x="88" y="433.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M</text><circle cx="114" cy="429" r="11" fill="#d77fa6"/><text x="114" y="433.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">F</text><circle cx="140" cy="429" r="11" fill="#d77fa6"/><text x="140" y="433.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">F</text><rect x="172" y="384" width="5" height="58" rx="2" fill="#c0392b"/><text x="188" y="400" font-size="15" font-weight="700" fill="#1f2a3a">Nothing for the priest</text><text x="188" y="419" font-size="12.5" fill="#5a6577">Perhaps both ewes gave birth to females first</text><rect x="20" y="474" width="600" height="30" rx="8" fill="#dfe7f3"/><text x="32" y="494" font-size="14.5" font-weight="700" fill="#24324a">One ewe had given birth before, one had not</text><rect x="20" y="514" width="600" height="96" rx="10" fill="#fff" stroke="#d8e0ec"/><circle cx="44" cy="543" r="11" fill="#5b8fd6"/><text x="44" y="547.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M</text><circle cx="70" cy="543" r="11" fill="#5b8fd6"/><text x="70" y="547.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M</text><rect x="172" y="524" width="5" height="76" rx="2" fill="#b26a00"/><text x="188" y="540" font-size="15" font-weight="700" fill="#1f2a3a">One male to the priest, one to the owner</text><text x="188" y="559" font-size="12.5" fill="#5a6577">Only one of them is a firstborn</text><text x="604" y="559" font-size="11" font-style="italic" fill="#8a94a6" text-anchor="end">reason implied</text><text x="188" y="580" font-size="12.5" fill="#b26a00">Rabbi Tarfon: the priest chooses the better one</text><text x="188" y="598" font-size="12.5" fill="#b26a00">Rabbi Akiva: they assess, and the priest takes the leaner</text><rect x="20" y="618" width="600" height="58" rx="10" fill="#fff" stroke="#d8e0ec"/><circle cx="44" cy="647" r="11" fill="#5b8fd6"/><text x="44" y="651.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">M</text><circle cx="70" cy="647" r="11" fill="#d77fa6"/><text x="70" y="651.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">F</text><rect x="172" y="628" width="5" height="38" rx="2" fill="#c0392b"/><text x="188" y="644" font-size="15" font-weight="700" fill="#1f2a3a">Nothing for the priest</text><text x="188" y="663" font-size="12.5" fill="#5a6577">Perhaps the ewe that had given birth bore the male</text><circle cx="36" cy="690" r="8" fill="#5b8fd6"/><text x="50" y="694.5" font-size="12.5" fill="#5a6577">male</text><circle cx="104" cy="690" r="8" fill="#d77fa6"/><text x="118" y="694.5" font-size="12.5" fill="#5a6577">female</text><text x="32" y="718" font-size="12.5" fill="#5a6577">The owner’s doubtful male grazes until it is blemished. Priestly gifts from it:</text><text x="32" y="736" font-size="12.5" fill="#5a6577">Rabbi Meir obligates; Rabbi Yosei exempts, since its replacement is with the priest.</text>
</svg>
