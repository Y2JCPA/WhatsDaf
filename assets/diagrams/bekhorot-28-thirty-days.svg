<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="560" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#1d2733">How long may a blemished firstborn be kept?</text>
  <text x="320" y="70" text-anchor="middle" font-size="14" fill="#55606e">After a blemish appears, until it is given to a priest (28a)</text>

  <!-- axis -->
  <line x1="60" y1="112" x2="590" y2="112" stroke="#8a96a6" stroke-width="2"/>
  <line x1="60" y1="104" x2="60" y2="120" stroke="#8a96a6" stroke-width="2"/>
  <line x1="470" y1="98" x2="470" y2="470" stroke="#8a96a6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="580" y1="104" x2="580" y2="120" stroke="#8a96a6" stroke-width="2"/>
  <text x="60" y="98" text-anchor="start" font-size="13" fill="#55606e">Birth</text>
  <text x="466" y="94" text-anchor="end" font-size="13" fill="#55606e">12 months</text>
  <text x="584" y="98" text-anchor="end" font-size="13" fill="#55606e">+30 days</text>

  <!-- row 1 -->
  <text x="24" y="150" font-size="15" font-weight="bold" fill="#1d2733">Blemish early in the first year</text>
  <rect x="200" y="162" width="270" height="18" rx="9" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <circle cx="200" cy="171" r="8" fill="#c62828"/>
  <text x="24" y="202" font-size="13" fill="#3b4652">Keep it until the twelve months end, and no more (mishna; Rashi)</text>

  <!-- row 2 -->
  <text x="24" y="242" font-size="15" font-weight="bold" fill="#1d2733">Blemish 15 days before the year ends</text>
  <rect x="415" y="254" width="110" height="18" rx="9" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <circle cx="415" cy="263" r="8" fill="#c62828"/>
  <text x="24" y="294" font-size="13" fill="#3b4652">15 more days after the year: thirty from the blemish (baraita)</text>

  <!-- row 3 -->
  <text x="24" y="334" font-size="15" font-weight="bold" fill="#1d2733">Blemish after the first year</text>
  <rect x="480" y="346" width="110" height="18" rx="9" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <circle cx="480" cy="355" r="8" fill="#c62828"/>
  <text x="24" y="386" font-size="13" fill="#3b4652">Thirty days from the blemish (mishna)</text>

  <!-- row 4: refuted -->
  <text x="24" y="426" font-size="15" font-weight="bold" fill="#7a7f87">Rabbi Elazar, second version</text>
  <rect x="470" y="438" width="110" height="18" rx="9" fill="#eceff1" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="24" y="452" font-size="13" fill="#7a7f87">Any blemish in the year: thirty days</text>
  <text x="24" y="470" font-size="13" fill="#7a7f87">after the year</text>
  <text x="24" y="490" font-size="13" font-weight="bold" fill="#c62828">✖ Refuted by the baraita of the fifteen days</text>

  <!-- legend / footnote -->
  <circle cx="32" cy="522" r="6" fill="#c62828"/>
  <text x="44" y="527" font-size="12.5" fill="#3b4652">blemish appears</text>
  <rect x="160" y="515" width="34" height="14" rx="7" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="202" y="527" font-size="12.5" fill="#3b4652">may keep it</text>
  <text x="24" y="547" font-size="12" fill="#55606e">The thirty days let the owner find a priest (baraita). Bars are not to scale within the year.</text>
</svg>
