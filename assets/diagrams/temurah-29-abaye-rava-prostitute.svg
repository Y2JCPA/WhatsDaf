<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="640" height="560" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2a44">Abaye and Rava on a prostitute’s payment</text>
  <text x="320" y="68" text-anchor="middle" font-size="13.5" font-weight="400" fill="#4a5672">Is her payment prohibited for the altar? Is a priest flogged for “a prostitute”?</text>
  <rect x="184" y="84" width="212" height="34" rx="8" fill="#fdf0d8"/>
  <text x="290" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#7a4a00">GENTILE PROSTITUTE</text>
  <rect x="408" y="84" width="208" height="34" rx="8" fill="#e3edf9"/>
  <text x="512" y="106" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f4e79">JEWISH PROSTITUTE (UNMARRIED)</text>
  <rect x="24" y="132" width="148" height="148" rx="10" fill="#ffffff" stroke="#c9d3e6" stroke-width="1"/>
  <text x="98" y="204" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2a44">Abaye</text>
  <text x="98" y="222" text-anchor="middle" font-size="11.5" font-weight="400" fill="#4a5672"></text>
  <text x="176" y="146" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2a44"></text>
  <rect x="184" y="132" width="212" height="70" rx="10" fill="#fbe3e0"/><text x="290" y="156" text-anchor="middle" font-size="14" font-weight="700" fill="#922b21">Payment prohibited</text><text x="290" y="174" text-anchor="middle" font-size="11.5" font-weight="400" fill="#4a5672">“abomination”: betrothal</text><text x="290" y="189" text-anchor="middle" font-size="11.5" font-weight="400" fill="#4a5672">does not take effect</text>
  <rect x="408" y="132" width="208" height="70" rx="10" fill="#e6f4ea"/><text x="512" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#1e6b3a">Payment permitted</text><text x="512" y="182" text-anchor="middle" font-size="11.5" font-weight="400" fill="#4a5672">betrothal takes effect</text>
  <text x="176" y="224" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2a44"></text>
  <rect x="184" y="210" width="212" height="70" rx="10" fill="#e6f4ea"/><text x="290" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#1e6b3a">Priest not flogged</text><text x="290" y="252" text-anchor="middle" font-size="11.5" font-weight="400" fill="#4a5672">her offspring are not</text><text x="290" y="267" text-anchor="middle" font-size="11.5" font-weight="400" fill="#4a5672">attributed to him</text>
  <rect x="408" y="210" width="208" height="70" rx="10" fill="#fbe3e0"/><text x="512" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#922b21">Priest flogged</text><text x="512" y="252" text-anchor="middle" font-size="11.5" font-weight="400" fill="#4a5672">his offspring are</text><text x="512" y="267" text-anchor="middle" font-size="11.5" font-weight="400" fill="#4a5672">attributed to him</text>
  <rect x="24" y="298" width="148" height="148" rx="10" fill="#ffffff" stroke="#c9d3e6" stroke-width="1"/>
  <text x="98" y="370" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2a44">Rava</text>
  <text x="98" y="388" text-anchor="middle" font-size="11.5" font-weight="400" fill="#4a5672"></text>
  <text x="176" y="312" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2a44"></text>
  <rect x="184" y="298" width="212" height="70" rx="10" fill="#fbe3e0"/><text x="290" y="338" text-anchor="middle" font-size="14" font-weight="700" fill="#922b21">Payment prohibited</text>
  <rect x="408" y="298" width="208" height="70" rx="10" fill="#fbe3e0"/><text x="512" y="338" text-anchor="middle" font-size="14" font-weight="700" fill="#922b21">Payment prohibited</text>
  <text x="176" y="390" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2a44"></text>
  <rect x="184" y="376" width="212" height="70" rx="10" fill="#fbe3e0"/><text x="290" y="416" text-anchor="middle" font-size="14" font-weight="700" fill="#922b21">Priest flogged</text>
  <rect x="408" y="376" width="208" height="70" rx="10" fill="#fbe3e0"/><text x="512" y="416" text-anchor="middle" font-size="14" font-weight="700" fill="#922b21">Priest flogged</text>
  <text x="400" y="464" text-anchor="middle" font-size="12.5" font-weight="400" fill="#4a5672" font-style="italic">Rava: “they are derived from one another”</text>
  <rect x="24" y="480" width="592" height="62" rx="12" fill="#ffffff" stroke="#d08a1e" stroke-width="1"/>
  <text x="320" y="504" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2a44">Baraita: “Both a gentile prostitute and a Jewish prostitute, their payment is prohibited.”</text>
  <text x="320" y="524" text-anchor="middle" font-size="11.5" font-weight="400" fill="#4a5672">Abaye: it follows Rabbi Akiva, for whom betrothal does not take effect with those liable for prohibitions.</text>
</svg>
