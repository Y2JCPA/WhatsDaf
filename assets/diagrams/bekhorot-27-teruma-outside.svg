<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 686" width="640" height="686" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<rect width="640" height="686" rx="18" fill="#f3f6fb"/>
<text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2d45">Teruma from outside Eretz Yisrael</text>
<text x="34" y="88" font-size="12" font-weight="700" fill="#5a6b85" letter-spacing=".5">WHO</text>
<text x="150" y="88" font-size="12" font-weight="700" fill="#5a6b85" letter-spacing=".5">RULING</text>
<text x="416" y="88" font-size="12" font-weight="700" fill="#5a6b85" letter-spacing=".5">ON THE DAF</text>
<rect x="20" y="104" width="600" height="58" rx="10" fill="#e8eef8" stroke="#c9d4e6"/>
<text x="34" y="129" font-size="15" font-weight="700" fill="#1f2d45">Rava</text>
<text x="150" y="129" font-size="13.5" fill="#1f2d45">A priest who helps at the threshing</text>
<text x="150" y="147" font-size="13.5" fill="#1f2d45">floor may be given it</text>
<text x="416" y="129" font-size="12.5" fill="#44546e" >Rav Ḥama gave it to his</text>
<text x="416" y="147" font-size="12.5" fill="#44546e" >servant, a priest, as wages</text>
<rect x="20" y="170" width="600" height="112" rx="10" fill="#ffffff" stroke="#c9d4e6"/>
<text x="34" y="195" font-size="15" font-weight="700" fill="#1f2d45">Shmuel</text>
<text x="150" y="195" font-size="13.5" fill="#1f2d45">Nullified in a majority</text>
<text x="150" y="213" font-size="13.5" fill="#1f2d45">(ordinary teruma needs</text>
<text x="150" y="231" font-size="13.5" fill="#1f2d45">one hundred parts)</text>
<text x="416" y="195" font-size="12.5" fill="#44546e" >Rabba nullified it and ate it</text>
<text x="416" y="213" font-size="12.5" fill="#44546e" >in his days of impurity.</text>
<text x="416" y="231" font-size="12.5" fill="#44546e" >Rav Huna, son of Rav Yehoshua:</text>
<text x="416" y="249" font-size="12.5" fill="#44546e" >2 non-sacred + 1 teruma, out 1;</text>
<text x="416" y="267" font-size="12.5" fill="#44546e" >then 1 teruma in, 1 out</text>
<rect x="20" y="290" width="600" height="58" rx="10" fill="#e8eef8" stroke="#c9d4e6"/>
<text x="34" y="315" font-size="15" font-weight="700" fill="#1f2d45">Shmuel</text>
<text x="150" y="315" font-size="13.5" fill="#1f2d45">Eat the produce first,</text>
<text x="150" y="333" font-size="13.5" fill="#1f2d45">separate the teruma afterward</text>
<rect x="20" y="356" width="600" height="76" rx="10" fill="#ffffff" stroke="#c9d4e6"/>
<text x="34" y="381" font-size="15" font-weight="700" fill="#1f2d45">Shmuel</text>
<text x="150" y="381" font-size="13.5" fill="#1f2d45">Forbidden only to one whose</text>
<text x="150" y="399" font-size="13.5" fill="#1f2d45">impurity comes from his body;</text>
<text x="150" y="417" font-size="13.5" fill="#1f2d45">only eating, not touching</text>
<rect x="20" y="440" width="600" height="94" rx="10" fill="#e8eef8" stroke="#c9d4e6"/>
<text x="34" y="465" font-size="15" font-weight="700" fill="#1f2d45">Ravina</text>
<text x="150" y="465" font-size="13.5" fill="#1f2d45">A menstruating woman separates</text>
<text x="150" y="483" font-size="13.5" fill="#1f2d45">ḥalla and a minor priest eats it.</text>
<text x="150" y="501" font-size="13.5" fill="#1f2d45">If none: she throws it in the oven</text>
<text x="150" y="519" font-size="13.5" fill="#1f2d45">and separates another for an adult</text>
<text x="416" y="465" font-size="12.5" fill="#44546e" >“So that the category of</text>
<text x="416" y="483" font-size="12.5" fill="#44546e" >ḥalla should not be forgotten”</text>
<rect x="20" y="542" width="600" height="58" rx="10" fill="#fdecea" stroke="#c9d4e6"/>
<text x="34" y="567" font-size="15" font-weight="700" fill="#1f2d45">Rav</text>
<text x="34" y="585" font-size="12" fill="#5a6b85">via Rav Amram</text>
<text x="150" y="567" font-size="13.5" fill="#1f2d45">One impure from a corpse</text>
<text x="150" y="585" font-size="13.5" fill="#1f2d45">immerses and eats</text>
<text x="416" y="567" font-size="12.5" fill="#b3261e" font-weight="700">The halakha is not</text>
<text x="416" y="585" font-size="12.5" fill="#b3261e" font-weight="700">in accordance with him</text>
<rect x="20" y="608" width="600" height="58" rx="10" fill="#fdecea" stroke="#c9d4e6"/>
<text x="34" y="633" font-size="15" font-weight="700" fill="#1f2d45">Rav Sheshet</text>
<text x="34" y="651" font-size="12" fill="#5a6b85">via Mar Zutra</text>
<text x="150" y="633" font-size="13.5" fill="#1f2d45">One impure from a creeping</text>
<text x="150" y="651" font-size="13.5" fill="#1f2d45">animal immerses and eats</text>
<text x="416" y="633" font-size="12.5" fill="#b3261e" font-weight="700">The halakha is not</text>
<text x="416" y="651" font-size="12.5" fill="#b3261e" font-weight="700">in accordance with him</text>
</svg>