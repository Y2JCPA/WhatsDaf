<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 484" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="484" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2a3a">Pulling or money?</text>
  <text x="320" y="70" text-anchor="middle" font-size="14" fill="#55627a">Two readings of “or buy of your counterpart’s hand” (Leviticus 25:14)</text>

  <!-- column headers -->
  <rect x="190" y="92" width="210" height="58" rx="10" fill="#dfe8f6"/>
  <text x="295" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2a3a">Abaye, explaining</text>
  <text x="295" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2a3a">Rabbi Oshaya (13a)</text>
  <rect x="410" y="92" width="210" height="58" rx="10" fill="#e9e1f3"/>
  <text x="515" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2a3a">Ameimar, if he follows</text>
  <text x="515" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2a3a">Rabbi Yoḥanan (13b)</text>

  <!-- row 1 -->
  <text x="24" y="190" font-size="15" font-weight="700" fill="#1f2a3a">A Jew from</text>
  <text x="24" y="210" font-size="15" font-weight="700" fill="#1f2a3a">a Jew</text>
  <rect x="190" y="162" width="210" height="72" rx="10" fill="#ffffff" stroke="#c7d3e6"/>
  <text x="295" y="194" text-anchor="middle" font-size="18" font-weight="700" fill="#2e6bb8">Pulling</text>
  <text x="295" y="218" text-anchor="middle" font-size="12.5" fill="#55627a">“your counterpart” by pulling</text>
  <rect x="410" y="162" width="210" height="72" rx="10" fill="#ffffff" stroke="#d6cbe6"/>
  <text x="515" y="194" text-anchor="middle" font-size="18" font-weight="700" fill="#b8860b">Money</text>
  <text x="515" y="218" text-anchor="middle" font-size="12.5" fill="#55627a">by Torah law, money acquires</text>

  <!-- row 2 -->
  <text x="24" y="270" font-size="15" font-weight="700" fill="#1f2a3a">Between a Jew</text>
  <text x="24" y="290" font-size="15" font-weight="700" fill="#1f2a3a">and a gentile</text>
  <rect x="190" y="246" width="210" height="72" rx="10" fill="#ffffff" stroke="#c7d3e6"/>
  <text x="295" y="278" text-anchor="middle" font-size="18" font-weight="700" fill="#b8860b">Money</text>
  <text x="295" y="302" text-anchor="middle" font-size="12.5" fill="#55627a">even without pulling, either way</text>
  <rect x="410" y="246" width="210" height="72" rx="10" fill="#ffffff" stroke="#d6cbe6"/>
  <text x="515" y="278" text-anchor="middle" font-size="18" font-weight="700" fill="#2e6bb8">Pulling</text>
  <text x="515" y="302" text-anchor="middle" font-size="12.5" fill="#55627a">pulling acquires with a gentile</text>

  <!-- row 3 -->
  <text x="24" y="354" font-size="15" font-weight="700" fill="#1f2a3a">Why “your</text>
  <text x="24" y="374" font-size="15" font-weight="700" fill="#1f2a3a">counterpart”?</text>
  <rect x="190" y="330" width="210" height="72" rx="10" fill="#ffffff" stroke="#c7d3e6"/>
  <text x="295" y="360" text-anchor="middle" font-size="12.5" fill="#1f2a3a">only one act, like your</text>
  <text x="295" y="378" text-anchor="middle" font-size="12.5" fill="#1f2a3a">counterpart, not both or either</text>
  <rect x="410" y="330" width="210" height="72" rx="10" fill="#ffffff" stroke="#d6cbe6"/>
  <text x="515" y="360" text-anchor="middle" font-size="12.5" fill="#1f2a3a">your counterpart with money,</text>
  <text x="515" y="378" text-anchor="middle" font-size="12.5" fill="#1f2a3a">a gentile by pulling</text>

  <!-- footnote -->
  <text x="24" y="440" font-size="13" fill="#55627a">If Ameimar followed Reish Lakish (“pulling is explicit in the Torah”), both</text>
  <text x="24" y="460" font-size="13" fill="#55627a">would be by pulling, and “your counterpart” would teach exploitation (13b).</text>
</svg>
