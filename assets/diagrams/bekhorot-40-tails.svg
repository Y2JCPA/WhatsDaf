<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>Tail joints of a kid and a lamb</title>
  <rect width="640" height="450" rx="18" fill="#f6f8f1"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#24301b">How many joints in the tail?</text>
  <text x="32" y="68" font-size="14" fill="#5d6b52">Red = a blemish · green = not a blemish</text>
  <text x="32" y="116" font-size="16" font-weight="700" fill="#24301b">✔ Kid · baraita</text>
  <g>
    <circle cx="220" cy="110" r="10" fill="#c0392b"/>
    <text x="220" y="140" font-size="13" fill="#3d4a33">1 joint: blemish</text>
  </g>
  <g>
    <circle cx="410" cy="110" r="10" fill="#2e7d32"/>
    <circle cx="434" cy="110" r="10" fill="#2e7d32"/>
    <text x="410" y="140" font-size="13" fill="#3d4a33">2 joints: fine</text>
  </g>
  <text x="32" y="194" font-size="16" font-weight="700" fill="#24301b">✔ Lamb · baraita</text>
  <g>
    <circle cx="220" cy="188" r="10" fill="#c0392b"/>
    <circle cx="244" cy="188" r="10" fill="#c0392b"/>
    <text x="220" y="218" font-size="13" fill="#3d4a33">2 joints: blemish</text>
  </g>
  <g>
    <circle cx="410" cy="188" r="10" fill="#2e7d32"/>
    <circle cx="434" cy="188" r="10" fill="#2e7d32"/>
    <circle cx="458" cy="188" r="10" fill="#2e7d32"/>
    <text x="410" y="218" font-size="13" fill="#3d4a33">3 joints: fine</text>
  </g>
  <line x1="32" y1="240" x2="608" y2="240" stroke="#c8d0bd" stroke-width="2"/>
  <text x="32" y="262" font-size="13" font-weight="600" fill="#a33">Rav Huna’s version, refuted by the baraita:</text>
  <text x="32" y="292" font-size="16" font-weight="700" fill="#8a8f85">✖ Kid · Rav Huna</text>
  <g opacity="0.55">
    <circle cx="220" cy="286" r="10" fill="#c0392b"/>
    <circle cx="244" cy="286" r="10" fill="#c0392b"/>
    <text x="220" y="316" font-size="13" fill="#3d4a33">2 joints: blemish</text>
  </g>
  <g opacity="0.55">
    <circle cx="410" cy="286" r="10" fill="#2e7d32"/>
    <circle cx="434" cy="286" r="10" fill="#2e7d32"/>
    <circle cx="458" cy="286" r="10" fill="#2e7d32"/>
    <text x="410" y="316" font-size="13" fill="#3d4a33">3 joints: fine</text>
  </g>
  <text x="32" y="370" font-size="16" font-weight="700" fill="#8a8f85">✖ Lamb · Rav Huna</text>
  <g opacity="0.55">
    <circle cx="220" cy="364" r="10" fill="#c0392b"/>
    <circle cx="244" cy="364" r="10" fill="#c0392b"/>
    <circle cx="268" cy="364" r="10" fill="#c0392b"/>
    <text x="220" y="394" font-size="13" fill="#3d4a33">3 joints: blemish</text>
  </g>
  <g opacity="0.55">
    <circle cx="410" cy="364" r="10" fill="#2e7d32"/>
    <circle cx="434" cy="364" r="10" fill="#2e7d32"/>
    <circle cx="458" cy="364" r="10" fill="#2e7d32"/>
    <circle cx="482" cy="364" r="10" fill="#2e7d32"/>
    <text x="410" y="394" font-size="13" fill="#3d4a33">4 joints: fine</text>
  </g>
  <text x="32" y="434" font-size="13" fill="#5d6b52">The mishna’s “fewer than three joints” is about a lamb, not a kid (40b).</text>
</svg>
