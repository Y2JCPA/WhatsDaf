<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="640" height="640" rx="18" fill="#f3f6fb" stroke="none"/>
  <text x="320" y="44" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">“These are hereby in place of those”</text>
  <text x="320" y="70" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="middle">Substitution or desacralization? The dilemmas of 27a</text>
  <rect x="92" y="86" width="18" height="18" rx="4" fill="#d9a43a" stroke="#d9a43a" stroke-width="2"/>
  <text x="116" y="100" font-size="12" font-weight="400" fill="#475569" text-anchor="start">consecrated</text>
  <rect x="222" y="86" width="18" height="18" rx="4" fill="#7f97b2" stroke="#7f97b2" stroke-width="2"/>
  <text x="246" y="100" font-size="12" font-weight="400" fill="#475569" text-anchor="start">non-sacred</text>
  <rect x="340" y="86" width="18" height="18" rx="4" fill="#ffffff" stroke="#d9a43a" stroke-width="2"/>
  <line x1="343" y1="101" x2="355" y2="89" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="362" y="86" width="18" height="18" rx="4" fill="#ffffff" stroke="#7f97b2" stroke-width="2"/>
  <line x1="365" y1="101" x2="377" y2="89" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/>
  <text x="386" y="100" font-size="12" font-weight="400" fill="#475569" text-anchor="start">blemished (outlined, struck)</text>
  <text x="332" y="134" font-size="11.5" font-weight="700" fill="#8f1d16" text-anchor="middle">READ AS ASSOCIATION</text>
  <text x="332" y="149" font-size="11" font-weight="400" fill="#8f1d16" text-anchor="middle">(substitution, with lashes)</text>
  <text x="526" y="134" font-size="11.5" font-weight="700" fill="#1d5e34" text-anchor="middle">THE PERMITTED WAY</text>
  <text x="526" y="149" font-size="11" font-weight="400" fill="#1d5e34" text-anchor="middle">(desacralization)</text>
  <rect x="20" y="162" width="212" height="96" rx="10" fill="#ffffff" stroke="#d5dde9"/>
  <text x="34" y="186" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">1 · Abaye</text>
  <text x="34" y="214" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">Consecrated</text>
  <text x="34" y="242" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">Non-sacred</text>
  <rect x="120" y="200" width="18" height="18" rx="4" fill="#ffffff" stroke="#d9a43a" stroke-width="2"/>
  <line x1="123" y1="215" x2="135" y2="203" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="145" y="200" width="18" height="18" rx="4" fill="#ffffff" stroke="#d9a43a" stroke-width="2"/>
  <line x1="148" y1="215" x2="160" y2="203" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="120" y="228" width="18" height="18" rx="4" fill="#7f97b2" stroke="#7f97b2" stroke-width="2"/>
  <rect x="145" y="228" width="18" height="18" rx="4" fill="#7f97b2" stroke="#7f97b2" stroke-width="2"/>
  <rect x="240" y="162" width="184" height="96" rx="10" fill="#fde4e2" stroke="#e8a9a3"/>
  <text x="332" y="207" font-size="12" font-weight="600" fill="#8f1d16" text-anchor="middle">Two substitutes:</text>
  <text x="332" y="223" font-size="12" font-weight="600" fill="#8f1d16" text-anchor="middle">two sets of lashes</text>
  <rect x="432" y="162" width="188" height="96" rx="10" fill="#e2f3e7" stroke="#9fd0ae"/>
  <text x="526" y="199" font-size="12" font-weight="600" fill="#1d5e34" text-anchor="middle">Both consecrated animals</text>
  <text x="526" y="215" font-size="12" font-weight="600" fill="#1d5e34" text-anchor="middle">are desacralized:</text>
  <text x="526" y="231" font-size="12" font-weight="600" fill="#1d5e34" text-anchor="middle">no lashes</text>
  <rect x="20" y="268" width="212" height="96" rx="10" fill="#ffffff" stroke="#d5dde9"/>
  <text x="34" y="292" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">2 · “And if you say…”</text>
  <text x="34" y="320" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">Consecrated</text>
  <text x="34" y="348" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">Non-sacred</text>
  <rect x="120" y="306" width="18" height="18" rx="4" fill="#d9a43a" stroke="#d9a43a" stroke-width="2"/>
  <rect x="145" y="306" width="18" height="18" rx="4" fill="#ffffff" stroke="#d9a43a" stroke-width="2"/>
  <line x1="148" y1="321" x2="160" y2="309" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="120" y="334" width="18" height="18" rx="4" fill="#7f97b2" stroke="#7f97b2" stroke-width="2"/>
  <rect x="145" y="334" width="18" height="18" rx="4" fill="#ffffff" stroke="#7f97b2" stroke-width="2"/>
  <line x1="148" y1="349" x2="160" y2="337" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="240" y="268" width="184" height="96" rx="10" fill="#fde4e2" stroke="#e8a9a3"/>
  <text x="332" y="305" font-size="12" font-weight="600" fill="#8f1d16" text-anchor="middle">Unblemished for blemished,</text>
  <text x="332" y="321" font-size="12" font-weight="600" fill="#8f1d16" text-anchor="middle">blemished for unblemished:</text>
  <text x="332" y="337" font-size="12" font-weight="600" fill="#8f1d16" text-anchor="middle">lashes for both</text>
  <rect x="432" y="268" width="188" height="96" rx="10" fill="#e2f3e7" stroke="#9fd0ae"/>
  <text x="526" y="305" font-size="12" font-weight="600" fill="#1d5e34" text-anchor="middle">Like for like: unblemished</text>
  <text x="526" y="321" font-size="12" font-weight="600" fill="#1d5e34" text-anchor="middle">pair substituted, blemished</text>
  <text x="526" y="337" font-size="12" font-weight="600" fill="#1d5e34" text-anchor="middle">pair desacralized</text>
  <rect x="20" y="374" width="212" height="96" rx="10" fill="#ffffff" stroke="#d5dde9"/>
  <text x="34" y="398" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">3 · “And if you say…”</text>
  <text x="34" y="426" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">Consecrated</text>
  <text x="34" y="454" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">Non-sacred</text>
  <rect x="120" y="412" width="18" height="18" rx="4" fill="#d9a43a" stroke="#d9a43a" stroke-width="2"/>
  <rect x="145" y="412" width="18" height="18" rx="4" fill="#d9a43a" stroke="#d9a43a" stroke-width="2"/>
  <rect x="170" y="412" width="18" height="18" rx="4" fill="#ffffff" stroke="#d9a43a" stroke-width="2"/>
  <line x1="173" y1="427" x2="185" y2="415" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="120" y="440" width="18" height="18" rx="4" fill="#7f97b2" stroke="#7f97b2" stroke-width="2"/>
  <rect x="145" y="440" width="18" height="18" rx="4" fill="#7f97b2" stroke="#7f97b2" stroke-width="2"/>
  <rect x="170" y="440" width="18" height="18" rx="4" fill="#7f97b2" stroke="#7f97b2" stroke-width="2"/>
  <rect x="240" y="374" width="184" height="96" rx="10" fill="#fde4e2" stroke="#e8a9a3"/>
  <text x="332" y="411" font-size="12" font-weight="600" fill="#8f1d16" text-anchor="middle">As with the two</text>
  <text x="332" y="427" font-size="12" font-weight="600" fill="#8f1d16" text-anchor="middle">unblemished pairs:</text>
  <text x="332" y="443" font-size="12" font-weight="600" fill="#8f1d16" text-anchor="middle">three sets of lashes</text>
  <rect x="432" y="374" width="188" height="96" rx="10" fill="#e2f3e7" stroke="#9fd0ae"/>
  <text x="526" y="411" font-size="12" font-weight="600" fill="#1d5e34" text-anchor="middle">He does not perform the</text>
  <text x="526" y="427" font-size="12" font-weight="600" fill="#1d5e34" text-anchor="middle">prohibition: the blemished</text>
  <text x="526" y="443" font-size="12" font-weight="600" fill="#1d5e34" text-anchor="middle">one is desacralized</text>
  <rect x="20" y="480" width="212" height="96" rx="10" fill="#ffffff" stroke="#d5dde9"/>
  <text x="34" y="504" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">4 · Rav Ashi</text>
  <text x="34" y="532" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">Consecrated</text>
  <text x="34" y="560" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">Non-sacred</text>
  <rect x="120" y="518" width="18" height="18" rx="4" fill="#d9a43a" stroke="#d9a43a" stroke-width="2"/>
  <rect x="145" y="518" width="18" height="18" rx="4" fill="#d9a43a" stroke="#d9a43a" stroke-width="2"/>
  <rect x="170" y="518" width="18" height="18" rx="4" fill="#d9a43a" stroke="#d9a43a" stroke-width="2"/>
  <rect x="195" y="518" width="18" height="18" rx="4" fill="#ffffff" stroke="#d9a43a" stroke-width="2"/>
  <line x1="198" y1="533" x2="210" y2="521" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="120" y="546" width="18" height="18" rx="4" fill="#7f97b2" stroke="#7f97b2" stroke-width="2"/>
  <rect x="145" y="546" width="18" height="18" rx="4" fill="#7f97b2" stroke="#7f97b2" stroke-width="2"/>
  <rect x="170" y="546" width="18" height="18" rx="4" fill="#7f97b2" stroke="#7f97b2" stroke-width="2"/>
  <rect x="195" y="546" width="18" height="18" rx="4" fill="#7f97b2" stroke="#7f97b2" stroke-width="2"/>
  <rect x="240" y="480" width="184" height="96" rx="10" fill="#fde4e2" stroke="#e8a9a3"/>
  <text x="332" y="509" font-size="12" font-weight="600" fill="#8f1d16" text-anchor="middle">Three certain substitutions</text>
  <text x="332" y="525" font-size="12" font-weight="600" fill="#8f1d16" text-anchor="middle">establish him as one</text>
  <text x="332" y="541" font-size="12" font-weight="600" fill="#8f1d16" text-anchor="middle">who transgresses:</text>
  <text x="332" y="557" font-size="12" font-weight="600" fill="#8f1d16" text-anchor="middle">four sets of lashes</text>
  <rect x="432" y="480" width="188" height="96" rx="10" fill="#e2f3e7" stroke="#9fd0ae"/>
  <text x="526" y="509" font-size="12" font-weight="600" fill="#1d5e34" text-anchor="middle">Even so, he does not</text>
  <text x="526" y="525" font-size="12" font-weight="600" fill="#1d5e34" text-anchor="middle">cast aside the permitted</text>
  <text x="526" y="541" font-size="12" font-weight="600" fill="#1d5e34" text-anchor="middle">way: the blemished one</text>
  <text x="526" y="557" font-size="12" font-weight="600" fill="#1d5e34" text-anchor="middle">is desacralized</text>
  <text x="320" y="600" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">Each time he says “These are hereby in place of those.”</text>
  <text x="320" y="618" font-size="12.5" font-weight="700" fill="#475569" text-anchor="middle">All of these dilemmas stand unresolved (teiku).</text>
</svg>
