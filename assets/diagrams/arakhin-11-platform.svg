<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>What the platform proves</title>
  <rect width="640" height="400" rx="18" fill="#f3f6fb"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1f2d3d">What the platform proves</text>
  <text x="32" y="70" font-size="14" fill="#56657a">All agree the primary component of song is with the mouth. They disagree</text>
  <text x="32" y="89" font-size="14" fill="#56657a">whether one who played on the platform is thereby presumed of pure lineage</text>
  <text x="32" y="108" font-size="14" fill="#56657a">and entitled to tithes.</text>

  <!-- header -->
  <text x="48" y="140" font-size="12" font-weight="700" fill="#7a879a">THE MUSICIANS WERE</text>
  <text x="430" y="140" font-size="12" font-weight="700" fill="#7a879a" text-anchor="middle">LINEAGE</text>
  <text x="540" y="140" font-size="12" font-weight="700" fill="#7a879a" text-anchor="middle">TITHES</text>

  <!-- row 1 -->
  <rect x="24" y="152" width="592" height="62" rx="12" fill="#fff" stroke="#dbe3ee"/>
  <rect x="24" y="152" width="8" height="62" rx="4" fill="#9aa7b8"/>
  <text x="48" y="178" font-size="16" font-weight="700" fill="#1f2d3d">Slaves of priests</text>
  <text x="48" y="199" font-size="13.5" fill="#56657a">Rabbi Meir</text>
  <circle cx="430" cy="183" r="14" fill="#fbeaea" stroke="#e3b4b4"/>
  <text x="430" y="188.5" font-size="15" font-weight="700" fill="#b23b3b" text-anchor="middle">✕</text>
  <circle cx="540" cy="183" r="14" fill="#fbeaea" stroke="#e3b4b4"/>
  <text x="540" y="188.5" font-size="15" font-weight="700" fill="#b23b3b" text-anchor="middle">✕</text>

  <!-- row 2 -->
  <rect x="24" y="224" width="592" height="62" rx="12" fill="#fff" stroke="#dbe3ee"/>
  <rect x="24" y="224" width="8" height="62" rx="4" fill="#e3a857"/>
  <text x="48" y="250" font-size="16" font-weight="700" fill="#1f2d3d">Israelites of pure lineage</text>
  <text x="48" y="271" font-size="13.5" fill="#56657a">Rabbi Yosei</text>
  <circle cx="430" cy="255" r="14" fill="#e8f4ea" stroke="#a9d3b0"/>
  <text x="430" y="260.5" font-size="15" font-weight="700" fill="#2e7d4f" text-anchor="middle">✓</text>
  <circle cx="540" cy="255" r="14" fill="#fbeaea" stroke="#e3b4b4"/>
  <text x="540" y="260.5" font-size="15" font-weight="700" fill="#b23b3b" text-anchor="middle">✕</text>

  <!-- row 3 -->
  <rect x="24" y="296" width="592" height="62" rx="12" fill="#fff" stroke="#dbe3ee"/>
  <rect x="24" y="296" width="8" height="62" rx="4" fill="#6f8fc7"/>
  <text x="48" y="322" font-size="16" font-weight="700" fill="#1f2d3d">Levites</text>
  <text x="48" y="343" font-size="13.5" fill="#56657a">Rabbi Ḥanina ben Antigonus</text>
  <circle cx="430" cy="327" r="14" fill="#e8f4ea" stroke="#a9d3b0"/>
  <text x="430" y="332.5" font-size="15" font-weight="700" fill="#2e7d4f" text-anchor="middle">✓</text>
  <circle cx="540" cy="327" r="14" fill="#e8f4ea" stroke="#a9d3b0"/>
  <text x="540" y="332.5" font-size="15" font-weight="700" fill="#2e7d4f" text-anchor="middle">✓</text>

  <text x="32" y="384" font-size="12" fill="#7a879a">Lineage: fit to marry into the priesthood (Rabbeinu Gershom). Tithes: presumed a Levite (Rashi).</text>
</svg>
