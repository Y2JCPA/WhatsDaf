<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <rect width="640" height="420" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">“Great” three times, “great things” once</text>
  <text x="320" y="70" text-anchor="middle" font-size="14" font-weight="400" fill="#4b5563">The school of Rabbi Yishmael’s verbal analogy (15b)</text>
  <rect x="24" y="92" width="184" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="116" y="116" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">Idol worship</text>
  <text x="116" y="140" text-anchor="middle" font-size="12.5" font-weight="400" fill="#374151">“This people have sinned</text>
  <text x="116" y="158" text-anchor="middle" font-size="12.5" font-weight="400" fill="#374151">a great sin”</text>
  <text x="116" y="180" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">Exodus 32:31</text>
  <line x1="116" y1="200" x2="230" y2="250" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="228" y="92" width="184" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="320" y="116" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">Forbidden relations</text>
  <text x="320" y="140" text-anchor="middle" font-size="12.5" font-weight="400" fill="#374151">“How can I do this</text>
  <text x="320" y="158" text-anchor="middle" font-size="12.5" font-weight="400" fill="#374151">great wickedness”</text>
  <text x="320" y="180" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">Genesis 39:9</text>
  <line x1="320" y1="200" x2="320" y2="250" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="432" y="92" width="184" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="524" y="116" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">Bloodshed</text>
  <text x="524" y="140" text-anchor="middle" font-size="12.5" font-weight="400" fill="#374151">“My punishment is greater</text>
  <text x="524" y="158" text-anchor="middle" font-size="12.5" font-weight="400" fill="#374151">than I can bear”</text>
  <text x="524" y="180" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">Genesis 4:13</text>
  <line x1="524" y1="200" x2="410" y2="250" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="120" y="256" width="400" height="82" rx="10" fill="#fde8e8" stroke="#e0a3a3"/>
  <text x="320" y="280" text-anchor="middle" font-size="16" font-weight="700" fill="#8b1d1d">Malicious speech</text>
  <text x="320" y="302" text-anchor="middle" font-size="12.5" font-weight="400" fill="#7f1d1d">“The tongue that speaks great things” · Psalms 12:4</text>
  <text x="320" y="323" text-anchor="middle" font-size="13" font-weight="700" fill="#8b1d1d">corresponds to all three together</text>
  <text x="24" y="366" text-anchor="start" font-size="12" font-weight="400" fill="#4b5563">The Gemara: “great things” is plural; why not say only two of the three?</text>
  <text x="24" y="386" text-anchor="start" font-size="12" font-weight="400" fill="#4b5563">Which of them could be taken out? (Rashi: “great” is written of all of them.)</text>
</svg>
