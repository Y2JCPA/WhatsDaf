<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>Priest, offerings, firstborn</title>
  <rect width="640" height="560" rx="18" fill="#f3f6fb"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1f2d3d">Three blemish laws, none learned from the rest</text>
  <text x="32" y="68" font-size="14" fill="#5b6b7d">Rava: what each case has that the others might lack</text>

  <rect x="24" y="86" width="188" height="150" rx="14" fill="#fff" stroke="#dbe3ee"/>
  <text x="40" y="114" font-size="16" font-weight="700" fill="#1a5276">Priest</text>
  <text x="40" y="134" font-size="12" fill="#7f8fa3">Leviticus 21:17–23</text>
  <text x="40" y="162" font-size="14" fill="#1f2d3d">Included in many</text>
  <text x="40" y="182" font-size="14" fill="#1f2d3d">mitzvot</text>
  <text x="40" y="210" font-size="14" fill="#1f2d3d">Holy by birth</text>

  <rect x="226" y="86" width="188" height="150" rx="14" fill="#fff" stroke="#dbe3ee"/>
  <text x="242" y="114" font-size="16" font-weight="700" fill="#2e7d32">Offerings</text>
  <text x="242" y="134" font-size="12" fill="#7f8fa3">Leviticus 22:20–25</text>
  <text x="242" y="162" font-size="14" fill="#1f2d3d">Offered on the altar</text>
  <text x="242" y="190" font-size="14" fill="#1f2d3d">Greater sanctity:</text>
  <text x="242" y="210" font-size="14" fill="#1f2d3d">many kinds</text>

  <rect x="428" y="86" width="188" height="150" rx="14" fill="#fff" stroke="#dbe3ee"/>
  <text x="444" y="114" font-size="16" font-weight="700" fill="#a86b00">Firstborn</text>
  <text x="444" y="134" font-size="12" fill="#7f8fa3">Deuteronomy 15:21</text>
  <text x="444" y="162" font-size="14" fill="#1f2d3d">Offered on the altar</text>
  <text x="444" y="190" font-size="14" fill="#1f2d3d">Holy from the womb</text>

  <text x="32" y="270" font-size="12" font-weight="700" fill="#7f8fa3" letter-spacing=".5">LEARN ONE FROM THE OTHER TWO?</text>

  <rect x="24" y="284" width="592" height="64" rx="12" fill="#fff" stroke="#dbe3ee"/>
  <text x="40" y="310" font-size="14" font-weight="700" fill="#a86b00">Firstborn from priest + offerings?</text>
  <text x="40" y="332" font-size="13" fill="#5b6b7d">No: those have greater sanctity, and apply to ordinary, non-firstborn ones.</text>

  <rect x="24" y="358" width="592" height="64" rx="12" fill="#fff" stroke="#dbe3ee"/>
  <text x="40" y="384" font-size="14" font-weight="700" fill="#2e7d32">Offerings from priest + firstborn?</text>
  <text x="40" y="406" font-size="13" fill="#5b6b7d">No: those are holy on their own, with no act of consecration.</text>

  <rect x="24" y="432" width="592" height="64" rx="12" fill="#fff" stroke="#dbe3ee"/>
  <text x="40" y="458" font-size="14" font-weight="700" fill="#1a5276">Priest from firstborn + offerings?</text>
  <text x="40" y="480" font-size="13" fill="#5b6b7d">No: those are themselves offered on the altar.</text>

  <rect x="24" y="506" width="592" height="40" rx="12" fill="#e3f0e5"/>
  <text x="40" y="531" font-size="14" font-weight="700" fill="#1b5e20">So all three verses are necessary.</text>
</svg>
