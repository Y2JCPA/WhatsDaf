<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 676" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title>Whose means count?</title>
<rect width="640" height="676" rx="18" fill="#f3f6fb"/>
<text x="32" y="44" font-size="22" font-weight="700" fill="#1f2d3d">Whose means count?</text>
<text x="32" y="70" font-size="14" fill="#56657a">Valuations in the mishna, and a leper’s offering that another person vows to bring</text>

<text x="32" y="106" font-size="11" font-weight="700" fill="#7a879a">VALUATIONS · MISHNA 17a</text>

<rect x="20" y="118" width="600" height="54" rx="12" fill="#fff" stroke="#dbe3ee"/>
<text x="34" y="141" font-size="14" font-weight="700" fill="#1f2d3d">A poor person valuates a wealthy person</text>
<text x="34" y="160" font-size="11.5" fill="#56657a">“the Merciful One renders it dependent on the one who vows”</text>
<rect x="436" y="131" width="172" height="28" rx="14" fill="#e3effb" stroke="#b9d3ef"/>
<text x="522" y="150" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2f5d9a">poor person’s valuation</text>

<rect x="20" y="180" width="600" height="54" rx="12" fill="#fff" stroke="#dbe3ee"/>
<text x="34" y="203" font-size="14" font-weight="700" fill="#1f2d3d">A wealthy person valuates a poor person</text>
<text x="34" y="222" font-size="11.5" fill="#56657a">the sum fixed in the Torah</text>
<rect x="436" y="193" width="172" height="28" rx="14" fill="#fbeee6" stroke="#efcdb9"/>
<text x="522" y="212" font-size="12.5" font-weight="700" text-anchor="middle" fill="#9a4a2f">wealthy person’s valuation</text>

<rect x="20" y="242" width="600" height="70" rx="12" fill="#fff" stroke="#dbe3ee"/>
<text x="34" y="265" font-size="14" font-weight="700" fill="#1f2d3d">Rabbi: a wealthy person vows his own valuation,</text>
<text x="34" y="283" font-size="14" font-weight="700" fill="#1f2d3d">a poor person says “what he said is upon me”</text>
<text x="34" y="301" font-size="11.5" fill="#56657a">the wealthy person was himself obligated, as with offerings</text>
<rect x="436" y="263" width="172" height="28" rx="14" fill="#fbeee6" stroke="#efcdb9"/>
<text x="522" y="282" font-size="12.5" font-weight="700" text-anchor="middle" fill="#9a4a2f">wealthy person’s valuation</text>

<text x="32" y="346" font-size="11" font-weight="700" fill="#7a879a">“THE OFFERING OF THIS LEPER IS UPON ME” · GEMARA 17a–b</text>

<text x="315" y="376" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2d3d">One who vows is poor</text>
<text x="525" y="376" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2d3d">One who vows is wealthy</text>

<rect x="20" y="390" width="190" height="104" rx="12" fill="#eef1f6" stroke="#dbe3ee"/>
<text x="34" y="438" font-size="14" font-weight="700" fill="#1f2d3d">The leper</text>
<text x="34" y="456" font-size="14" font-weight="700" fill="#1f2d3d">is poor</text>

<rect x="20" y="502" width="190" height="104" rx="12" fill="#eef1f6" stroke="#dbe3ee"/>
<text x="34" y="550" font-size="14" font-weight="700" fill="#1f2d3d">The leper</text>
<text x="34" y="568" font-size="14" font-weight="700" fill="#1f2d3d">is wealthy</text>

<rect x="218" y="390" width="196" height="104" rx="12" fill="#e3effb" stroke="#b9d3ef"/>
<text x="232" y="416" font-size="14.5" font-weight="700" fill="#2f5d9a">Poor person’s offering</text>
<text x="232" y="438" font-size="11.5" fill="#56657a">the mishna’s case (Rabbi Yitzḥak);</text>
<text x="232" y="455" font-size="11.5" fill="#56657a">“and his means do not suffice”</text>
<text x="232" y="472" font-size="11.5" fill="#56657a">includes the one who vows</text>
<text x="232" y="487" font-size="11.5" fill="#56657a">(Rav Adda bar Ahava)</text>

<rect x="424" y="390" width="196" height="104" rx="12" fill="#fbeee6" stroke="#efcdb9"/>
<text x="438" y="416" font-size="14.5" font-weight="700" fill="#9a4a2f">Wealthy offering</text>
<text x="438" y="438" font-size="11.5" fill="#56657a">“so too he brings in wealth”</text>
<text x="438" y="455" font-size="11.5" fill="#56657a">(17a); for Rabbi, this is what</text>
<text x="438" y="472" font-size="11.5" fill="#56657a">“he” teaches (17b)</text>

<rect x="218" y="502" width="196" height="104" rx="12" fill="#fbeee6" stroke="#efcdb9"/>
<text x="232" y="528" font-size="14.5" font-weight="700" fill="#9a4a2f">Wealthy offering</text>
<text x="232" y="550" font-size="11.5" fill="#56657a">“but with offerings it is not so”;</text>
<text x="232" y="567" font-size="11.5" fill="#56657a">for the Rabbis, this is what</text>
<text x="232" y="584" font-size="11.5" fill="#56657a">“if he is poor” teaches (baraita)</text>

<rect x="424" y="502" width="196" height="104" rx="12" fill="#fbeee6" stroke="#efcdb9"/>
<text x="438" y="528" font-size="14.5" font-weight="700" fill="#9a4a2f">Wealthy offering</text>
<text x="438" y="550" font-size="11.5" fill="#56657a">both are wealthy</text>
<rect x="438" y="562" width="56" height="18" rx="9" fill="#eef1f6" stroke="#cfd7e3"/>
<text x="466" y="575" font-size="10.5" font-weight="700" text-anchor="middle" fill="#56657a">implied</text>

<text x="32" y="638" font-size="12.5" fill="#56657a">Read together, the four cells: the poor person’s offering is brought only when</text>
<text x="32" y="656" font-size="12.5" fill="#56657a">the leper and the one who vows for him are both poor.</text>
</svg>
