<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" width="640" height="540" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="540" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Counted from time to time</text>
  <text x="320" y="70" text-anchor="middle" font-size="14" fill="#4b5563">Baraita 18b: these years run from a day and hour to the same day</text>
  <text x="320" y="88" text-anchor="middle" font-size="14" fill="#4b5563">and hour, not by the world’s count of years.</text>

  <text x="114" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">Period</text>
  <text x="316" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">Verse</text>
  <text x="521" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">What it shows</text>

  <rect x="24" y="132" width="180" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="114" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">One year</text>
  <text x="114" y="177" text-anchor="middle" font-size="13" fill="#374151">offerings</text>
  <rect x="212" y="132" width="208" height="62" rx="10" fill="#e3edfb" stroke="#8fb0e0"/>
  <text x="316" y="158" text-anchor="middle" font-size="13" fill="#1c3f78">“A sheep in its first year”</text>
  <text x="316" y="177" text-anchor="middle" font-size="12" fill="#4b5563">Leviticus 12:6</text>
  <rect x="428" y="132" width="188" height="62" rx="10" fill="#fdf6e3" stroke="#e2c98a"/>
  <text x="522" y="158" text-anchor="middle" font-size="13" fill="#5c4210">its own year, not the</text>
  <text x="522" y="177" text-anchor="middle" font-size="13" fill="#5c4210">world’s (Rav Aḥa bar Ya’akov)</text>

  <rect x="24" y="202" width="180" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="114" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">One year</text>
  <text x="114" y="247" text-anchor="middle" font-size="13" fill="#374151">houses of walled cities</text>
  <rect x="212" y="202" width="208" height="62" rx="10" fill="#e3edfb" stroke="#8fb0e0"/>
  <text x="316" y="223" text-anchor="middle" font-size="13" fill="#1c3f78">“within a whole year after</text>
  <text x="316" y="240" text-anchor="middle" font-size="13" fill="#1c3f78">it is sold”</text>
  <text x="316" y="256" text-anchor="middle" font-size="12" fill="#4b5563">Leviticus 25:29</text>
  <rect x="428" y="202" width="188" height="62" rx="10" fill="#fdf6e3" stroke="#e2c98a"/>
  <text x="522" y="228" text-anchor="middle" font-size="13" fill="#5c4210">a year from its own sale,</text>
  <text x="522" y="247" text-anchor="middle" font-size="13" fill="#5c4210">not the world’s count</text>

  <rect x="24" y="272" width="180" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="114" y="298" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Two years</text>
  <text x="114" y="317" text-anchor="middle" font-size="13" fill="#374151">an ancestral field</text>
  <rect x="212" y="272" width="208" height="62" rx="10" fill="#e3edfb" stroke="#8fb0e0"/>
  <text x="316" y="293" text-anchor="middle" font-size="13" fill="#1c3f78">“the number of years of</text>
  <text x="316" y="310" text-anchor="middle" font-size="13" fill="#1c3f78">the crops”</text>
  <text x="316" y="326" text-anchor="middle" font-size="12" fill="#4b5563">Leviticus 25:15</text>
  <rect x="428" y="272" width="188" height="62" rx="10" fill="#fdf6e3" stroke="#e2c98a"/>
  <text x="522" y="298" text-anchor="middle" font-size="13" fill="#5c4210">sometimes three crops</text>
  <text x="522" y="317" text-anchor="middle" font-size="13" fill="#5c4210">are eaten in two years</text>

  <rect x="24" y="342" width="180" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="114" y="368" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Six years</text>
  <text x="114" y="387" text-anchor="middle" font-size="13" fill="#374151">a Hebrew slave</text>
  <rect x="212" y="342" width="208" height="62" rx="10" fill="#e3edfb" stroke="#8fb0e0"/>
  <text x="316" y="363" text-anchor="middle" font-size="13" fill="#1c3f78">“Six years he shall work;</text>
  <text x="316" y="380" text-anchor="middle" font-size="13" fill="#1c3f78">and in the seventh”</text>
  <text x="316" y="396" text-anchor="middle" font-size="12" fill="#4b5563">Exodus 21:2</text>
  <rect x="428" y="342" width="188" height="62" rx="10" fill="#fdf6e3" stroke="#e2c98a"/>
  <text x="522" y="368" text-anchor="middle" font-size="13" fill="#5c4210">sometimes he works in</text>
  <text x="522" y="387" text-anchor="middle" font-size="13" fill="#5c4210">the seventh year too</text>

  <rect x="24" y="412" width="180" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="114" y="438" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">The years of</text>
  <text x="114" y="457" text-anchor="middle" font-size="13" fill="#374151">a son and a daughter</text>
  <rect x="212" y="412" width="404" height="62" rx="10" fill="#efe8f7" stroke="#b9a3d8"/>
  <text x="414" y="438" text-anchor="middle" font-size="13" fill="#3f2a63"><tspan font-weight="700">Rav</tspan> (via Rav Giddel): for valuations.</text>
  <text x="414" y="457" text-anchor="middle" font-size="13" fill="#3f2a63"><tspan font-weight="700">Rav Yosef:</tspan> for the chapter Yotze Dofen (Nidda).</text>

  <text x="320" y="500" text-anchor="middle" font-size="13" fill="#374151">Rav Yosef to Abaye: they do not disagree.</text>
  <text x="320" y="518" text-anchor="middle" font-size="13" fill="#374151">“I said one matter and he said one matter.”</text>
</svg>
