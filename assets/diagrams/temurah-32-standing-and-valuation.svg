<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 548" width="640" height="548" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="640" height="548" rx="18" fill="#f3f6fb"/><text x="320" y="44" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">Standing and valuation</text><text x="320" y="70" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="middle">Consecrated animals that died before redemption (32b)</text><text x="320" y="90" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="middle">Included in standing and valuation: buried. Not included: redeemed.</text><text x="315.5" y="112" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle">Consecrated</text><text x="315.5" y="128" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle">for the altar</text><text x="520.5" y="112" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle">Consecrated for</text><text x="520.5" y="128" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle">Temple maintenance</text><rect x="20" y="140" width="190" height="84" rx="10" fill="#ffffff" stroke="#d5dde9"/><text x="34" y="178" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">The Rabbis,</text><text x="34" y="197" font-size="13" font-weight="400" fill="#374151" text-anchor="start">per Rabbi Yoḥanan</text><rect x="216" y="140" width="199" height="84" rx="10" fill="#eaf1fb" stroke="#93b4e0"/><text x="315.5" y="178" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Included</text><text x="315.5" y="196" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">if it died: buried</text><rect x="421" y="140" width="199" height="84" rx="10" fill="#eaf1fb" stroke="#93b4e0"/><text x="520.5" y="178" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Included</text><text x="520.5" y="196" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">if it died: buried</text><rect x="20" y="230" width="190" height="84" rx="10" fill="#ffffff" stroke="#d5dde9"/><text x="34" y="268" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">The Rabbis,</text><text x="34" y="287" font-size="13" font-weight="400" fill="#374151" text-anchor="start">per Reish Lakish</text><rect x="216" y="230" width="199" height="84" rx="10" fill="#fdf3e3" stroke="#e2b46b"/><text x="315.5" y="268" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="middle">Not included</text><text x="315.5" y="286" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">if it died: redeemed</text><rect x="421" y="230" width="199" height="84" rx="10" fill="#eaf1fb" stroke="#93b4e0"/><text x="520.5" y="268" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Included</text><text x="520.5" y="286" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">if it died: buried</text><rect x="20" y="320" width="190" height="84" rx="10" fill="#ffffff" stroke="#d5dde9"/><text x="34" y="358" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">Rabbi Shimon,</text><text x="34" y="377" font-size="13" font-weight="400" fill="#374151" text-anchor="start">as both explain him</text><rect x="216" y="320" width="199" height="84" rx="10" fill="#eaf1fb" stroke="#93b4e0"/><text x="315.5" y="358" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Included</text><text x="315.5" y="376" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">if it died: buried</text><rect x="421" y="320" width="199" height="84" rx="10" fill="#fdf3e3" stroke="#e2b46b"/><text x="520.5" y="358" font-size="12.5" font-weight="700" fill="#92400e" text-anchor="middle">Not included</text><text x="520.5" y="376" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">if it died: redeemed</text><rect x="20" y="410" width="600" height="88" rx="10" fill="#fdf3e3" stroke="#e2b46b"/><text x="34" y="438" font-size="13.5" font-weight="700" fill="#92400e" text-anchor="start">Everyone agrees, by both accounts:</text><text x="34" y="460" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">an animal blemished from the outset, consecrated for the altar,</text><text x="34" y="478" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">was not included; if it died it may be redeemed.</text><text x="24" y="526" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">A baraita is taught in accordance with Rabbi Yoḥanan (32b–33a).</text></svg>
