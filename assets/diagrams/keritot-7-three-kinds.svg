<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 622" width="640" height="622" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="622" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Which miscarriages bring an offering</text>
  <text x="320" y="68" text-anchor="middle" font-size="14" fill="#4b5563">Keritot 7b: the mishna’s three groups</text>
  <rect x="24" y="88" width="592" height="174" rx="10" fill="#eef6ee" stroke="#a9d3ad"/>
  <text x="44" y="116" font-size="16" font-weight="700" fill="#256c2e">Brings an offering, and it is eaten</text>
  <circle cx="50" cy="137" r="3" fill="#256c2e"/>
  <text x="62" y="142" font-size="14" fill="#1f2937">A form like a domesticated or undomesticated animal, or a bird</text>
  <text x="62" y="166" font-size="14" fill="#1f2937"></text>
  <text x="68" y="166" font-size="13" font-style="italic" fill="#4b5563">   Rabbi Meir; the Rabbis: only if it has the form of a person</text>
  <circle cx="50" cy="185" r="3" fill="#256c2e"/>
  <text x="62" y="190" font-size="14" fill="#1f2937">A sandal fetus, a placenta, or an amniotic sac in which tissue developed</text>
  <circle cx="50" cy="209" r="3" fill="#256c2e"/>
  <text x="62" y="214" font-size="14" fill="#1f2937">A fetus that emerged cut, in pieces</text>
  <circle cx="50" cy="233" r="3" fill="#256c2e"/>
  <text x="62" y="238" font-size="14" fill="#1f2937">A Canaanite maidservant who miscarried</text>
  <rect x="24" y="274" width="592" height="126" rx="10" fill="#fff7e6" stroke="#f0cf8f"/>
  <text x="44" y="302" font-size="16" font-weight="700" fill="#8a5a00">Brings an offering, but it is not eaten</text>
  <circle cx="50" cy="323" r="3" fill="#8a5a00"/>
  <text x="62" y="328" font-size="14" fill="#1f2937">One who does not know what she miscarried</text>
  <circle cx="50" cy="347" r="3" fill="#8a5a00"/>
  <text x="62" y="352" font-size="14" fill="#1f2937">Two women, one of an exempt type and one of a liable type, not known which</text>
  <text x="62" y="376" font-size="14" fill="#1f2937"></text>
  <text x="68" y="376" font-size="13" font-style="italic" fill="#4b5563">   Rabbi Yosei: if both stand together, they bring one, and it is eaten</text>
  <rect x="24" y="412" width="592" height="150" rx="10" fill="#f1f3f6" stroke="#cbd5e1"/>
  <text x="44" y="440" font-size="16" font-weight="700" fill="#475569">Brings no offering</text>
  <circle cx="50" cy="461" r="3" fill="#475569"/>
  <text x="62" y="466" font-size="14" fill="#1f2937">An amniotic sac full of water, of blood, or of colors</text>
  <circle cx="50" cy="485" r="3" fill="#475569"/>
  <text x="62" y="490" font-size="14" fill="#1f2937">A form like fish, grasshoppers, repugnant creatures or creeping animals</text>
  <circle cx="50" cy="509" r="3" fill="#475569"/>
  <text x="62" y="514" font-size="14" fill="#1f2937">A miscarriage on the fortieth day</text>
  <circle cx="50" cy="533" r="3" fill="#475569"/>
  <text x="62" y="538" font-size="14" fill="#1f2937">A caesarean section</text>
  <text x="202.9" y="538" font-size="13" font-style="italic" fill="#4b5563">   Rabbi Shimon: liable</text>
  <text x="320" y="582" text-anchor="middle" font-size="13" fill="#4b5563">Why the second group’s offering is not eaten (Rashi): perhaps she owes no offering,</text>
  <text x="320" y="601" text-anchor="middle" font-size="13" fill="#4b5563">and the bird killed by melika would then be like a mere carcass.</text>
</svg>
