<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 590" width="640" height="590" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="590" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Two pieces, one of them forbidden</text>
  <text x="320" y="68" text-anchor="middle" font-size="14" fill="#4b5563">Keritot 18a: the baraita · one piece of forbidden fat, one of permitted fat</text>
  <rect x="24" y="86" width="592" height="40" rx="9" fill="#1e3a5f"/>
  <text x="40" y="111" font-size="13.5" font-weight="700" fill="#ffffff">Who ate which piece</text>
  <text x="434" y="104" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">The baraita</text>
  <text x="434" y="119" text-anchor="middle" font-size="11" fill="#dbe4f0">provisional guilt offering</text>
  <text x="560" y="111" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">Rabbi</text>
  <rect x="24" y="132" width="592" height="52" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="153" font-size="13.5" font-weight="700" fill="#1f2937">Jew first, then a gentile, dog or raven</text>
  <text x="40" y="172" font-size="12" fill="#374151">the Jew ate one of two pieces</text>
  <rect x="370" y="139" width="128" height="38" rx="7" fill="#eef6ee" stroke="#a9d3ad"/>
  <text x="434" y="162.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e5a2a">liable</text>
  <rect x="510" y="139" width="100" height="38" rx="7" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="560" y="162.5" text-anchor="middle" font-size="12.5" font-style="italic" fill="#6b7280">not stated</text>
  <rect x="24" y="190" width="592" height="52" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="211" font-size="13.5" font-weight="700" fill="#1f2937">Gentile first, then a Jew</text>
  <text x="40" y="230" font-size="12" fill="#374151">only one piece was left when the Jew ate</text>
  <rect x="370" y="197" width="128" height="38" rx="7" fill="#fdecec" stroke="#e8b4b4"/>
  <text x="434" y="220.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7a2e2e">exempt</text>
  <rect x="510" y="197" width="100" height="38" rx="7" fill="#eef6ee" stroke="#a9d3ad"/>
  <text x="560" y="220.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e5a2a">obligated</text>
  <rect x="24" y="248" width="592" height="52" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="269" font-size="13.5" font-weight="700" fill="#1f2937">First unwittingly, second intentionally</text>
  <text x="40" y="288" font-size="12" fill="#374151">liable for the first piece</text>
  <rect x="370" y="255" width="128" height="38" rx="7" fill="#eef6ee" stroke="#a9d3ad"/>
  <text x="434" y="278.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e5a2a">liable</text>
  <rect x="510" y="255" width="100" height="38" rx="7" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="560" y="278.5" text-anchor="middle" font-size="12.5" font-style="italic" fill="#6b7280">not stated</text>
  <rect x="24" y="306" width="592" height="52" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="327" font-size="13.5" font-weight="700" fill="#1f2937">First intentionally, second unwittingly</text>
  <text x="40" y="346" font-size="12" fill="#374151">only one piece was present at the second</text>
  <rect x="370" y="313" width="128" height="38" rx="7" fill="#fdecec" stroke="#e8b4b4"/>
  <text x="434" y="336.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7a2e2e">exempt</text>
  <rect x="510" y="313" width="100" height="38" rx="7" fill="#eef6ee" stroke="#a9d3ad"/>
  <text x="560" y="336.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e5a2a">obligated</text>
  <rect x="24" y="364" width="592" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="389" font-size="13.5" font-weight="700" fill="#1f2937">Both intentionally</text>
  <rect x="370" y="371" width="128" height="26" rx="7" fill="#fdecec" stroke="#e8b4b4"/>
  <text x="434" y="388.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7a2e2e">exempt from anything</text>
  <rect x="510" y="371" width="100" height="26" rx="7" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="560" y="388.5" text-anchor="middle" font-size="12.5" font-style="italic" fill="#6b7280">not stated</text>
  <rect x="24" y="410" width="592" height="72" rx="9" fill="#fff7e6" stroke="#f0cf8f"/>
  <text x="40" y="431" font-size="13.5" font-weight="700" fill="#1f2937">Two Jews, each unwittingly ate one</text>
  <text x="40" y="450" font-size="12" fill="#374151">the second not by law: if he were exempt, the first</text>
  <text x="40" y="467" font-size="12" fill="#374151">would be established as liable to a sin offering</text>
  <rect x="370" y="426" width="128" height="40" rx="7" fill="#eef6ee" stroke="#a9d3ad"/>
  <text x="434" y="450.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e5a2a">both liable</text>
  <rect x="510" y="426" width="100" height="40" rx="7" fill="#eef6ee" stroke="#a9d3ad"/>
  <text x="560" y="444" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e5a2a">certainly by law</text>
  <text x="560" y="459" text-anchor="middle" font-size="10.5" fill="#6b7280">so the Gemara</text>
  <rect x="24" y="494" width="592" height="78" rx="9" fill="#f1ecf8" stroke="#c7b6e3"/>
  <text x="40" y="516" font-size="13" font-weight="700" fill="#1f2937">Rav Ashi: it is Rabbi Eliezer, who lets one volunteer every day</text>
  <text x="40" y="536" font-size="12.5" fill="#374151">The second brings a provisional guilt offering and stipulates: if the first ate</text>
  <text x="40" y="554" font-size="12.5" fill="#374151">the permitted fat, let it be an atonement; and if not, let it be a gift offering.</text>
</svg>
