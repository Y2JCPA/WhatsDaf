<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 424" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title>And they shall go out</title>
<rect width="640" height="424" rx="18" fill="#f3f6fb"/>
<text x="32" y="44" font-size="22" font-weight="700" fill="#1f2d3d">Why “and they shall go out in the Jubilee”?</text>
<text x="32" y="70" font-size="14" fill="#56657a">A house of an unwalled courtyard, and the Jubilee arrives in the second year</text>

<!-- column heads -->
<rect x="20" y="88" width="150" height="40" rx="10" fill="#e8eaf6" stroke="#c5cae9"/>
<text x="95" y="113" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2d3d">The case</text>
<rect x="178" y="88" width="144" height="40" rx="10" fill="#e8eaf6" stroke="#c5cae9"/>
<text x="250" y="106" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2d3d">If compared to a</text>
<text x="250" y="121" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2d3d">walled-city house</text>
<rect x="330" y="88" width="144" height="40" rx="10" fill="#e8eaf6" stroke="#c5cae9"/>
<text x="402" y="106" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2d3d">If compared to an</text>
<text x="402" y="121" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2d3d">ancestral field</text>
<rect x="482" y="88" width="138" height="40" rx="10" fill="#e6f4ea" stroke="#b9dfc4"/>
<text x="551" y="113" font-size="13" font-weight="700" text-anchor="middle" fill="#2f7a45">The verse teaches</text>

<!-- row: Rav Huna -->
<rect x="20" y="136" width="150" height="108" rx="10" fill="#fff" stroke="#dbe3ee"/>
<text x="95" y="160" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2d3d">Rav Huna</text>
<text x="95" y="182" font-size="11.5" text-anchor="middle" fill="#56657a">he consecrated it,</text>
<text x="95" y="198" font-size="11.5" text-anchor="middle" fill="#56657a">another redeemed it</text>
<text x="95" y="214" font-size="11.5" text-anchor="middle" fill="#56657a">from the Temple</text>
<text x="95" y="230" font-size="11.5" text-anchor="middle" fill="#56657a">treasury</text>
<rect x="178" y="136" width="144" height="108" rx="10" fill="#fdecea" stroke="#f3c4bd"/>
<text x="250" y="184" font-size="12.5" text-anchor="middle" fill="#1f2d3d">The buyer’s</text>
<text x="250" y="202" font-size="12.5" text-anchor="middle" fill="#1f2d3d">in perpetuity</text>
<rect x="330" y="136" width="144" height="108" rx="10" fill="#fdecea" stroke="#f3c4bd"/>
<text x="402" y="184" font-size="12.5" text-anchor="middle" fill="#1f2d3d">Goes out to</text>
<text x="402" y="202" font-size="12.5" text-anchor="middle" fill="#1f2d3d">the priests</text>
<rect x="482" y="136" width="138" height="108" rx="10" fill="#e6f4ea" stroke="#b9dfc4"/>
<text x="551" y="184" font-size="12.5" text-anchor="middle" fill="#1f2d3d">Returns to</text>
<text x="551" y="202" font-size="12.5" text-anchor="middle" fill="#1f2d3d">its owner</text>

<!-- row: Rav Pappa -->
<rect x="20" y="252" width="150" height="108" rx="10" fill="#fff" stroke="#dbe3ee"/>
<text x="95" y="276" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2d3d">Rav Pappa</text>
<text x="95" y="294" font-size="11" text-anchor="middle" fill="#56657a">according to Rabbi Oshaya</text>
<text x="95" y="318" font-size="11.5" text-anchor="middle" fill="#56657a">he sold it</text>
<rect x="178" y="252" width="144" height="108" rx="10" fill="#fdecea" stroke="#f3c4bd"/>
<text x="250" y="300" font-size="12.5" text-anchor="middle" fill="#1f2d3d">The buyer’s</text>
<text x="250" y="318" font-size="12.5" text-anchor="middle" fill="#1f2d3d">in perpetuity</text>
<rect x="330" y="252" width="144" height="108" rx="10" fill="#fdecea" stroke="#f3c4bd"/>
<text x="402" y="288" font-size="12.5" text-anchor="middle" fill="#1f2d3d">Requires completion:</text>
<text x="402" y="306" font-size="12.5" text-anchor="middle" fill="#1f2d3d">another year after</text>
<text x="402" y="324" font-size="12.5" text-anchor="middle" fill="#1f2d3d">the Jubilee</text>
<rect x="482" y="252" width="138" height="108" rx="10" fill="#e6f4ea" stroke="#b9dfc4"/>
<text x="551" y="300" font-size="12.5" text-anchor="middle" fill="#1f2d3d">Returns to</text>
<text x="551" y="318" font-size="12.5" text-anchor="middle" fill="#1f2d3d">its owner</text>

<text x="32" y="386" font-size="12.5" fill="#1f2d3d"><tspan font-weight="700">Rabbi Oshaya:</tspan> what is redeemed from the Temple treasury “will be assured to him.”</text>
<text x="32" y="408" font-size="12.5" fill="#1f2d3d"><tspan font-weight="700">A baraita</tspan> accords with Rav Huna and conclusively refutes Rabbi Oshaya.</text>
</svg>
