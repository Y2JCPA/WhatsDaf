<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title>Which priest receives</title>
<defs>
<marker id="ah28" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a97aa"/></marker>
</defs>
<rect width="640" height="560" rx="18" fill="#f3f6fb"/>
<text x="32" y="44" font-size="22" font-weight="700" fill="#1f2d3d">Which priest receives the dedication?</text>
<text x="32" y="70" font-size="14" fill="#56657a">The rulings on 28a–b, and the dilemma that follows</text>

<!-- row 1 -->
<rect x="20" y="90" width="250" height="78" rx="12" fill="#fff" stroke="#dbe3ee"/>
<text x="145" y="125" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2d3d">He dedicated</text>
<text x="145" y="145" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2d3d">movable property</text>
<line x1="272" y1="129" x2="318" y2="129" stroke="#8a97aa" stroke-width="1.6" marker-end="url(#ah28)"/>
<rect x="320" y="90" width="300" height="78" rx="12" fill="#e6f4ea" stroke="#b9dfc4"/>
<text x="470" y="118" font-size="14" font-weight="700" text-anchor="middle" fill="#2f7a45">Any priest he wishes</text>
<text x="470" y="139" font-size="11.5" text-anchor="middle" fill="#56657a">“Everything dedicated in Israel</text>
<text x="470" y="155" font-size="11.5" text-anchor="middle" fill="#56657a">shall be yours” (Numbers 18:14)</text>

<!-- row 2 -->
<rect x="20" y="180" width="250" height="78" rx="12" fill="#fff" stroke="#dbe3ee"/>
<text x="145" y="215" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2d3d">He dedicated</text>
<text x="145" y="235" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2d3d">his fields</text>
<line x1="272" y1="219" x2="318" y2="219" stroke="#8a97aa" stroke-width="1.6" marker-end="url(#ah28)"/>
<rect x="320" y="180" width="300" height="78" rx="12" fill="#e3effb" stroke="#b9d3ef"/>
<text x="470" y="206" font-size="14" font-weight="700" text-anchor="middle" fill="#2f5d9a">A priest of that watch</text>
<text x="470" y="226" font-size="11.5" text-anchor="middle" fill="#56657a">“to the priest” (Leviticus 27:21), learned from</text>
<text x="470" y="242" font-size="11.5" text-anchor="middle" fill="#56657a">“to the priest” of robbery from a convert</text>

<!-- row 3 -->
<rect x="20" y="270" width="250" height="78" rx="12" fill="#fff" stroke="#dbe3ee"/>
<text x="145" y="297" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2d3d">A field that goes out</text>
<text x="145" y="317" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2d3d">to the priests</text>
<text x="145" y="336" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2d3d">at the Jubilee</text>
<line x1="272" y1="309" x2="318" y2="309" stroke="#8a97aa" stroke-width="1.6" marker-end="url(#ah28)"/>
<rect x="320" y="270" width="300" height="78" rx="12" fill="#e3effb" stroke="#b9d3ef"/>
<text x="470" y="303" font-size="14" font-weight="700" text-anchor="middle" fill="#2f5d9a">The watch serving when</text>
<text x="470" y="323" font-size="14" font-weight="700" text-anchor="middle" fill="#2f5d9a">the Jubilee began</text>

<!-- Shabbat dilemma -->
<text x="32" y="384" font-size="11" font-weight="700" fill="#7a879a">IF THE JUBILEE BEGAN ON SHABBAT, WHEN THE WATCHES ROTATE</text>
<line x1="40" y1="438" x2="600" y2="438" stroke="#8a97aa" stroke-width="2"/>
<rect x="40" y="420" width="300" height="36" rx="8" fill="#fbeee6" stroke="#efcdb9"/>
<text x="190" y="443" font-size="12.5" font-weight="700" text-anchor="middle" fill="#9a4a2f">Outgoing watch still serving</text>
<rect x="344" y="420" width="256" height="36" rx="8" fill="#eef1f6" stroke="#d3dae5"/>
<text x="472" y="443" font-size="12.5" text-anchor="middle" fill="#56657a">Incoming watch</text>
<line x1="56" y1="404" x2="56" y2="470" stroke="#1f2d3d" stroke-width="2"/>
<text x="62" y="410" font-size="11.5" fill="#1f2d3d">Evening: Rosh HaShana, the Jubilee begins</text>
<line x1="342" y1="470" x2="342" y2="404" stroke="#1f2d3d" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="348" y="482" font-size="11.5" fill="#1f2d3d">Morning: the watches rotate</text>
<rect x="20" y="496" width="600" height="46" rx="12" fill="#e6f4ea" stroke="#b9dfc4"/>
<text x="320" y="516" font-size="13.5" font-weight="700" text-anchor="middle" fill="#2f7a45">One gives it to the outgoing watch</text>
<text x="320" y="533" font-size="11.5" text-anchor="middle" fill="#56657a">Rav Ḥiyya bar Ami in the name of Ḥulfana</text>
</svg>
