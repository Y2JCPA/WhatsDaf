<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 684" width="640" height="684" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="684" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2a3a">Does a forbidden act take effect?</text>
  <text x="320" y="70" text-anchor="middle" font-size="14" fill="#55627a"><tspan fill="#4527a0" font-weight="700">Abaye</tspan>: it is effective. <tspan fill="#bf360c" font-weight="700">Rava</tspan>: it is not. The challenges of 5a–5b</text>
  <rect x="24" y="90" width="592" height="36" rx="10" fill="#e3e9f3"/>
  <text x="36" y="113" font-size="13" font-weight="700" fill="#1f2a3a">The case</text>
  <text x="236" y="113" font-size="13" font-weight="700" fill="#1f2a3a">After the fact</text>
  <text x="384" y="113" font-size="13" font-weight="700" fill="#1f2a3a">Challenges</text>
  <text x="466" y="113" font-size="13" font-weight="700" fill="#1f2a3a">“Different there”</text>
  <rect x="24" y="136" width="592" height="46" rx="10" fill="#ffffff" stroke="#c9d3e3"/>
  <rect x="24" y="136" width="6" height="46" rx="3" fill="#8a6d9a"/>
  <text x="36" y="155.5" font-size="12.5" fill="#1f2a3a">Rapist who divorced,</text>
  <text x="36" y="171.5" font-size="12.5" fill="#1f2a3a">if an Israelite (versions 1, 2)</text>
  <text x="236" y="155.5" font-size="12.5" fill="#33415c">remarries;</text>
  <text x="236" y="171.5" font-size="12.5" fill="#33415c">not flogged</text>
  <text x="384" y="155.5" font-size="12.5" font-weight="700" fill="#bf360c">Rava (1)</text>
  <text x="384" y="171.5" font-size="12.5" font-weight="700" fill="#4527a0">Abaye (2)</text>
  <text x="466" y="163.5" font-size="12.5" fill="#2e5aa8">“all his days”</text>
  <rect x="24" y="186" width="592" height="46" rx="10" fill="#ffffff" stroke="#c9d3e3"/>
  <rect x="24" y="186" width="6" height="46" rx="3" fill="#bf360c"/>
  <text x="36" y="205.5" font-size="12.5" fill="#1f2a3a">Teruma from poor produce</text>
  <text x="36" y="221.5" font-size="12.5" fill="#1f2a3a">for superior produce</text>
  <text x="236" y="213.5" font-size="12.5" fill="#33415c">it is teruma</text>
  <text x="384" y="213.5" font-size="12.5" font-weight="700" fill="#bf360c">Rava</text>
  <text x="466" y="205.5" font-size="12.5" fill="#2e5aa8">“you shall bear no sin”</text>
  <text x="466" y="221.5" font-size="12.5" fill="#2e5aa8">(Rabbi Ile’a)</text>
  <rect x="24" y="236" width="592" height="46" rx="10" fill="#ffffff" stroke="#c9d3e3"/>
  <rect x="24" y="236" width="6" height="46" rx="3" fill="#4527a0"/>
  <text x="36" y="255.5" font-size="12.5" fill="#1f2a3a">Teruma from one kind</text>
  <text x="36" y="271.5" font-size="12.5" fill="#1f2a3a">for another kind</text>
  <text x="236" y="263.5" font-size="12.5" fill="#33415c">not teruma</text>
  <text x="384" y="263.5" font-size="12.5" font-weight="700" fill="#4527a0">Abaye</text>
  <text x="466" y="263.5" font-size="12.5" fill="#2e5aa8">“the first part of them”</text>
  <rect x="24" y="286" width="592" height="46" rx="10" fill="#ffffff" stroke="#c9d3e3"/>
  <rect x="24" y="286" width="6" height="46" rx="3" fill="#4527a0"/>
  <text x="36" y="313.5" font-size="12.5" fill="#1f2a3a">Dedications to priests</text>
  <text x="236" y="313.5" font-size="12.5" fill="#33415c">not redeemed</text>
  <text x="384" y="313.5" font-size="12.5" font-weight="700" fill="#4527a0">Abaye</text>
  <text x="466" y="305.5" font-size="12.5" fill="#2e5aa8">“is most holy”:</text>
  <text x="466" y="321.5" font-size="12.5" fill="#2e5aa8">it shall be as it is</text>
  <rect x="24" y="336" width="592" height="46" rx="10" fill="#ffffff" stroke="#c9d3e3"/>
  <rect x="24" y="336" width="6" height="46" rx="3" fill="#bf360c"/>
  <text x="36" y="363.5" font-size="12.5" fill="#1f2a3a">Substitution</text>
  <text x="236" y="355.5" font-size="12.5" fill="#33415c">takes effect;</text>
  <text x="236" y="371.5" font-size="12.5" fill="#33415c">forty lashes</text>
  <text x="384" y="363.5" font-size="12.5" font-weight="700" fill="#bf360c">Rava</text>
  <text x="466" y="355.5" font-size="12.5" fill="#2e5aa8">“both it and its</text>
  <text x="466" y="371.5" font-size="12.5" fill="#2e5aa8">substitute shall be holy”</text>
  <rect x="24" y="386" width="592" height="46" rx="10" fill="#ffffff" stroke="#c9d3e3"/>
  <rect x="24" y="386" width="6" height="46" rx="3" fill="#4527a0"/>
  <text x="36" y="413.5" font-size="12.5" fill="#1f2a3a">Firstborn</text>
  <text x="236" y="413.5" font-size="12.5" fill="#33415c">no redemption</text>
  <text x="384" y="413.5" font-size="12.5" font-weight="700" fill="#4527a0">Abaye</text>
  <text x="466" y="405.5" font-size="12.5" fill="#2e5aa8">“they are holy”:</text>
  <text x="466" y="421.5" font-size="12.5" fill="#2e5aa8">as they are</text>
  <rect x="24" y="436" width="592" height="46" rx="10" fill="#ffffff" stroke="#c9d3e3"/>
  <rect x="24" y="436" width="6" height="46" rx="3" fill="#4527a0"/>
  <text x="36" y="463.5" font-size="12.5" fill="#1f2a3a">Animal tithe</text>
  <text x="236" y="463.5" font-size="12.5" fill="#33415c">no redemption</text>
  <text x="384" y="463.5" font-size="12.5" font-weight="700" fill="#4527a0">Abaye</text>
  <text x="466" y="455.5" font-size="12.5" fill="#2e5aa8">avara–avara,</text>
  <text x="466" y="471.5" font-size="12.5" fill="#2e5aa8">from the firstborn</text>
  <rect x="24" y="486" width="592" height="46" rx="10" fill="#ffffff" stroke="#c9d3e3"/>
  <rect x="24" y="486" width="6" height="46" rx="3" fill="#bf360c"/>
  <text x="36" y="513.5" font-size="12.5" fill="#1f2a3a">Teruma before first fruits</text>
  <text x="236" y="513.5" font-size="12.5" fill="#33415c">what he did is done</text>
  <text x="384" y="513.5" font-size="12.5" font-weight="700" fill="#bf360c">Rava</text>
  <text x="466" y="505.5" font-size="12.5" fill="#2e5aa8">“from all … you shall</text>
  <text x="466" y="521.5" font-size="12.5" fill="#2e5aa8">set apart teruma”</text>
  <rect x="24" y="536" width="592" height="46" rx="10" fill="#ffffff" stroke="#c9d3e3"/>
  <rect x="24" y="536" width="6" height="46" rx="3" fill="#bf360c"/>
  <text x="36" y="555.5" font-size="12.5" fill="#1f2a3a">Widow betrothed to</text>
  <text x="36" y="571.5" font-size="12.5" fill="#1f2a3a">a High Priest</text>
  <text x="236" y="555.5" font-size="12.5" fill="#33415c">betrothal holds;</text>
  <text x="236" y="571.5" font-size="12.5" fill="#33415c">child follows the flaw</text>
  <text x="384" y="563.5" font-size="12.5" font-weight="700" fill="#bf360c">Rava</text>
  <text x="466" y="555.5" font-size="12.5" fill="#2e5aa8">“he shall not profane</text>
  <text x="466" y="571.5" font-size="12.5" fill="#2e5aa8">his seed”</text>
  <rect x="24" y="586" width="592" height="46" rx="10" fill="#ffffff" stroke="#c9d3e3"/>
  <rect x="24" y="586" width="6" height="46" rx="3" fill="#bf360c"/>
  <text x="36" y="605.5" font-size="12.5" fill="#1f2a3a">Blemished animals</text>
  <text x="36" y="621.5" font-size="12.5" fill="#1f2a3a">consecrated for the altar</text>
  <text x="236" y="613.5" font-size="12.5" fill="#33415c">what he did is done</text>
  <text x="384" y="613.5" font-size="12.5" font-weight="700" fill="#bf360c">Rava</text>
  <text x="466" y="605.5" font-size="12.5" fill="#2e5aa8">“but for a vow it shall</text>
  <text x="466" y="621.5" font-size="12.5" fill="#2e5aa8">not be accepted”</text>
  <text x="320" y="656" text-anchor="middle" font-size="12" fill="#55627a">Next: unblemished animals consecrated for Temple maintenance (continued on 6a).</text>
</svg>
