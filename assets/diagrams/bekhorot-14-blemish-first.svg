<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 536" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>Which came first, blemish or consecration?</title>
  <rect width="640" height="536" rx="18" fill="#f3f6fb"/>
  <text x="24" y="44" font-size="22" font-weight="700" fill="#1f2d3d">Blemish first, or consecration first?</text>
  <text x="24" y="68" font-size="13.5" fill="#5b6b7d">The mishna on 14a. The first four rows apply once the animal is redeemed.</text>
  <rect x="268" y="86" width="182" height="56" rx="10" fill="#dcefe0"/>
  <text x="359" y="108" font-size="14" font-weight="700" text-anchor="middle" fill="#1e5631">Permanent blemish</text>
  <text x="359" y="127" font-size="14" font-weight="700" text-anchor="middle" fill="#1e5631">came first</text>
  <rect x="454" y="86" width="162" height="56" rx="10" fill="#f6e1dc"/>
  <text x="535" y="108" font-size="14" font-weight="700" text-anchor="middle" fill="#7a2a1a">Consecration came</text>
  <text x="535" y="127" font-size="14" font-weight="700" text-anchor="middle" fill="#7a2a1a">first†</text>
  <rect x="24" y="150" width="592" height="38" rx="9" fill="#ffffff" stroke="#dbe3ee"/>
  <text x="36" y="174" font-size="13.5" fill="#1f2d3d">Their offspring count as a firstborn</text>
  <text x="359" y="174" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1e5631">Yes</text>
  <text x="535" y="174" font-size="13.5" font-weight="600" text-anchor="middle" fill="#7a2a1a">No, exempt</text>
  <rect x="24" y="194" width="592" height="38" rx="9" fill="#ffffff" stroke="#dbe3ee"/>
  <text x="36" y="218" font-size="13.5" fill="#1f2d3d">Priestly gifts: foreleg, jaw, maw</text>
  <text x="359" y="218" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1e5631">Owed</text>
  <text x="535" y="218" font-size="13.5" font-weight="600" text-anchor="middle" fill="#7a2a1a">Exempt</text>
  <rect x="24" y="238" width="592" height="38" rx="9" fill="#ffffff" stroke="#dbe3ee"/>
  <text x="36" y="262" font-size="13.5" fill="#1f2d3d">Shearing and labor</text>
  <text x="359" y="262" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1e5631">Permitted: non-sacred</text>
  <text x="535" y="262" font-size="13.5" font-weight="600" text-anchor="middle" fill="#7a2a1a">Forbidden</text>
  <rect x="24" y="282" width="592" height="38" rx="9" fill="#ffffff" stroke="#dbe3ee"/>
  <text x="36" y="306" font-size="13.5" fill="#1f2d3d">Offspring and milk</text>
  <text x="359" y="306" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1e5631">Permitted</text>
  <text x="535" y="306" font-size="13.5" font-weight="600" text-anchor="middle" fill="#7a2a1a">Prohibited</text>
  <rect x="24" y="326" width="592" height="38" rx="9" fill="#ffffff" stroke="#dbe3ee"/>
  <text x="36" y="350" font-size="13.5" fill="#1f2d3d">Slaughtered outside the courtyard</text>
  <text x="359" y="350" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1e5631">Exempt from karet</text>
  <text x="535" y="350" font-size="13.5" font-weight="600" text-anchor="middle" fill="#7a2a1a">Liable to karet</text>
  <rect x="24" y="370" width="592" height="38" rx="9" fill="#ffffff" stroke="#dbe3ee"/>
  <text x="36" y="394" font-size="13.5" fill="#1f2d3d">An animal substituted for them</text>
  <text x="359" y="394" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1e5631">Not consecrated</text>
  <text x="535" y="394" font-size="13.5" font-weight="600" text-anchor="middle" fill="#7a2a1a">Consecrated</text>
  <rect x="24" y="414" width="592" height="38" rx="9" fill="#ffffff" stroke="#dbe3ee"/>
  <text x="36" y="438" font-size="13.5" fill="#1f2d3d">If they died before redemption</text>
  <text x="359" y="438" font-size="13.5" font-weight="600" text-anchor="middle" fill="#1e5631">Redeemed, fed to dogs*</text>
  <text x="535" y="438" font-size="13.5" font-weight="600" text-anchor="middle" fill="#7a2a1a">Buried</text>
  <text x="24" y="476" font-size="12" fill="#5b6b7d">* Except the firstborn and the animal tithe, which are sacred even with a blemish.</text>
  <text x="24" y="496" font-size="12" fill="#5b6b7d">† Or a temporary blemish before consecration, and a permanent one after it.</text>
  <text x="24" y="516" font-size="12" fill="#5b6b7d">Offspring and milk: conceived before redemption, born after it (the Gemara on 14a).</text>
</svg>
