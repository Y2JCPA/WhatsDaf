<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title>Valuation or assessment</title>
<rect width="640" height="640" rx="18" fill="#f3f6fb"/>
<text x="32" y="44" font-size="22" font-weight="700" fill="#1f2d3d">Valuation or assessment</text>
<text x="32" y="70" font-size="14" fill="#56657a">The mishna on 20a: the same words, as a valuation and as an assessment</text>
<text x="32" y="104" font-size="11" font-weight="700" fill="#7a879a">HE SAYS IT IS UPON HIM…</text>
<text x="226" y="104" font-size="11" font-weight="700" fill="#2f5d9a">VALUATION · FIXED BY THE TORAH</text>
<text x="432" y="104" font-size="11" font-weight="700" fill="#9a4a2f">ASSESSMENT · HIS WORTH</text>

<rect x="20" y="116" width="600" height="72" rx="12" fill="#fff" stroke="#dbe3ee"/>
<text x="32" y="142" font-size="14" font-weight="700" fill="#1f2d3d">“My …”, and then</text>
<text x="32" y="160" font-size="14" font-weight="700" fill="#1f2d3d">he dies</text>
<line x1="214" y1="126" x2="214" y2="178" stroke="#e1e6ee"/>
<line x1="420" y1="126" x2="420" y2="178" stroke="#e1e6ee"/>
<text x="226" y="142" font-size="15" font-weight="700" fill="#2f5d9a">Heirs give</text>
<text x="226" y="160" font-size="11.5" fill="#56657a">where he stood in judgment:</text>
<text x="226" y="175" font-size="11.5" fill="#56657a">nothing is lacking</text>
<text x="432" y="142" font-size="15" font-weight="700" fill="#9a4a2f">Heirs do not give</text>
<text x="432" y="160" font-size="11.5" fill="#56657a">no monetary value for the dead;</text>
<text x="432" y="175" font-size="11.5" fill="#56657a">the assessment is still lacking</text>

<rect x="20" y="198" width="600" height="72" rx="12" fill="#fff" stroke="#dbe3ee"/>
<text x="32" y="224" font-size="14" font-weight="700" fill="#1f2d3d">“… of my forearm”</text>
<text x="32" y="242" font-size="14" font-weight="700" fill="#1f2d3d">or “… of my leg”</text>
<line x1="214" y1="208" x2="214" y2="260" stroke="#e1e6ee"/>
<line x1="420" y1="208" x2="420" y2="260" stroke="#e1e6ee"/>
<text x="226" y="224" font-size="15" font-weight="700" fill="#2f5d9a">Nothing said</text>
<text x="226" y="242" font-size="11.5" fill="#56657a">Rav Giddel, for Rav: he gives its</text>
<text x="226" y="257" font-size="11.5" fill="#56657a">assessment, per Rabbi Meir</text>
<text x="432" y="224" font-size="15" font-weight="700" fill="#9a4a2f">Worth with and without</text><text x="432" y="242" font-size="11.5" fill="#56657a">he pays the difference</text><text x="432" y="257" font-size="11.5" fill="#56657a">(mishna, 19b)</text>

<rect x="20" y="280" width="600" height="72" rx="12" fill="#fff" stroke="#dbe3ee"/>
<text x="32" y="306" font-size="14" font-weight="700" fill="#1f2d3d">“… of my head”</text>
<text x="32" y="324" font-size="14" font-weight="700" fill="#1f2d3d">or “… of my liver”</text>
<line x1="214" y1="290" x2="214" y2="342" stroke="#e1e6ee"/>
<line x1="420" y1="290" x2="420" y2="342" stroke="#e1e6ee"/>
<text x="226" y="306" font-size="15" font-weight="700" fill="#2f5d9a">The whole valuation</text>
<text x="226" y="324" font-size="11.5" fill="#56657a">life depends on it; so too the leg</text>
<text x="226" y="339" font-size="11.5" fill="#56657a">from the knee and above</text>
<text x="432" y="306" font-size="15" font-weight="700" fill="#9a4a2f">The whole assessment</text>
<text x="432" y="324" font-size="11.5" fill="#56657a">by the mishna’s principle; so too</text>
<text x="432" y="339" font-size="11.5" fill="#56657a">the leg from the knee and above</text>

<rect x="20" y="362" width="600" height="72" rx="12" fill="#fff" stroke="#dbe3ee"/>
<text x="32" y="388" font-size="14" font-weight="700" fill="#1f2d3d">“Half of my …”</text>
<line x1="214" y1="372" x2="214" y2="424" stroke="#e1e6ee"/>
<line x1="420" y1="372" x2="420" y2="424" stroke="#e1e6ee"/>
<text x="226" y="388" font-size="15" font-weight="700" fill="#2f5d9a">Half the valuation</text>
<text x="226" y="406" font-size="11.5" fill="#56657a">Rabbi Yosei son of Rabbi Yehuda:</text>
<text x="226" y="421" font-size="11.5" fill="#56657a">the full valuation, by decree</text>
<text x="432" y="388" font-size="15" font-weight="700" fill="#9a4a2f">Half the assessment</text>

<rect x="20" y="444" width="600" height="72" rx="12" fill="#fff" stroke="#dbe3ee"/>
<text x="32" y="470" font-size="14" font-weight="700" fill="#1f2d3d">“The … of half</text>
<text x="32" y="488" font-size="14" font-weight="700" fill="#1f2d3d">of me”</text>
<line x1="214" y1="454" x2="214" y2="506" stroke="#e1e6ee"/>
<line x1="420" y1="454" x2="420" y2="506" stroke="#e1e6ee"/>
<text x="226" y="470" font-size="15" font-weight="700" fill="#2f5d9a">The whole valuation</text>
<text x="226" y="488" font-size="11.5" fill="#56657a">“a valuation of living people”</text>
<text x="432" y="470" font-size="15" font-weight="700" fill="#9a4a2f">The whole assessment</text>
<text x="432" y="488" font-size="11.5" fill="#56657a">“a vow by your valuation”</text>

<rect x="20" y="526" width="600" height="72" rx="12" fill="#fff" stroke="#dbe3ee"/>
<text x="32" y="552" font-size="14" font-weight="700" fill="#1f2d3d">“The … of</text>
<text x="32" y="570" font-size="14" font-weight="700" fill="#1f2d3d">so-and-so”</text>
<line x1="214" y1="536" x2="214" y2="588" stroke="#e1e6ee"/>
<line x1="420" y1="536" x2="420" y2="588" stroke="#e1e6ee"/>
<text x="226" y="552" font-size="15" font-weight="700" fill="#2f5d9a">Heirs give</text>
<text x="226" y="570" font-size="11.5" fill="#56657a">even when both the one who</text>
<text x="226" y="585" font-size="11.5" fill="#56657a">vowed and the one named die</text>
<text x="432" y="552" font-size="13" font-weight="700" fill="#9a4a2f">He dies: heirs give</text>
<text x="432" y="572" font-size="13" font-weight="700" fill="#9a4a2f">The one named dies:</text>
<text x="432" y="589" font-size="13" font-weight="700" fill="#9a4a2f">heirs do not give</text>

<text x="32" y="622" font-size="11.5" fill="#7a879a">Heirs pay where he stood in judgment before he died; assessing the one named is then a mere disclosure.</text>
</svg>
