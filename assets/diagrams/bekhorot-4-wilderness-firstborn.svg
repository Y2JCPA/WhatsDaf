<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 536" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title>Firstborn sanctity in the wilderness</title>
<rect width="640" height="536" rx="18" fill="#f3f6fb"/>
<text x="32" y="44" font-size="22" font-weight="700" fill="#1f2a3a">Were the firstborn sanctified?</text>
<text x="32" y="68" font-size="13" fill="#4a5568">Firstborn sons and animals, by period, in each version of the dispute</text>
<text x="229.25" y="104" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2a3a">In Egypt</text>
<text x="339.75" y="104" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2a3a">Wilderness,</text>
<text x="339.75" y="120" font-size="11.5" text-anchor="middle" fill="#4a5568">before the census</text>
<text x="450.25" y="104" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2a3a">Wilderness,</text>
<text x="450.25" y="120" font-size="11.5" text-anchor="middle" fill="#4a5568">after the census</text>
<text x="560.75" y="104" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2a3a">Entering</text>
<text x="560.75" y="120" font-size="11.5" text-anchor="middle" fill="#4a5568">the Land</text>
<text x="32" y="150" font-size="13" font-weight="700" fill="#2f6fb0">As the dispute was first stated (4b)</text>
<line x1="24" y1="158" x2="616" y2="158" stroke="#cfd8e6"/>
<text x="32" y="197" font-size="14" font-weight="700" fill="#1f2a3a">Rabbi Yoḥanan</text>
<text x="32" y="214" font-size="11.5" fill="#6b7280">“Sanctify to Me”</text>
<rect x="177" y="170" width="436" height="58" rx="8" fill="#d6efd9"/>
<text x="395" y="196" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e6b34">sanctified</text>
<text x="395" y="210" font-size="11" font-weight="400" text-anchor="middle" fill="#1e6b34">in Egypt, in the wilderness and in the Land</text>
<text x="32" y="265" font-size="14" font-weight="700" fill="#1f2a3a">Reish Lakish</text>
<text x="32" y="282" font-size="11.5" fill="#6b7280">“when He brings you”</text>
<rect x="177" y="238" width="104.5" height="58" rx="8" fill="#d6efd9"/>
<text x="229.25" y="271" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e6b34">sanctified</text>
<rect x="287.5" y="238" width="215" height="58" rx="8" fill="#e6e8ec"/>
<text x="395" y="264" font-size="12.5" font-weight="700" text-anchor="middle" fill="#5b6475">born here: not sanctified</text>
<text x="395" y="278" font-size="11" font-weight="400" text-anchor="middle" fill="#5b6475">those who left Egypt stay sanctified</text>
<rect x="508.5" y="238" width="104.5" height="58" rx="8" fill="#d6efd9"/>
<text x="560.75" y="271" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e6b34">sanctified</text>
<text x="32" y="324" font-size="13" font-weight="700" fill="#2f6fb0">Rav Pappa’s version (4b–5a)</text>
<line x1="24" y1="332" x2="616" y2="332" stroke="#cfd8e6"/>
<text x="32" y="371" font-size="14" font-weight="700" fill="#1f2a3a">Rabbi Yoḥanan</text>
<text x="32" y="388" font-size="11.5" fill="#6b7280">never ceased</text>
<rect x="177" y="344" width="436" height="58" rx="8" fill="#d6efd9"/>
<text x="395" y="370" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e6b34">sanctified</text>
<text x="395" y="384" font-size="11" font-weight="400" text-anchor="middle" fill="#1e6b34">and the sanctity never ceased</text>
<text x="32" y="439" font-size="14" font-weight="700" fill="#1f2a3a">Reish Lakish</text>
<text x="32" y="456" font-size="11.5" fill="#6b7280">ceased at the census</text>
<rect x="177" y="412" width="104.5" height="58" rx="8" fill="#d6efd9"/>
<text x="229.25" y="445" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e6b34">sanctified</text>
<rect x="287.5" y="412" width="104.5" height="58" rx="8" fill="#d6efd9"/>
<text x="339.75" y="438" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e6b34">sanctified</text>
<text x="339.75" y="452" font-size="11" font-weight="400" text-anchor="middle" fill="#1e6b34">counted, Num. 3:40</text>
<rect x="398" y="412" width="104.5" height="58" rx="8" fill="#fde6c4"/>
<text x="450.25" y="438" font-size="12.5" font-weight="700" text-anchor="middle" fill="#8a5a00">ceased</text>
<text x="450.25" y="452" font-size="11" font-weight="400" text-anchor="middle" fill="#8a5a00">(stated on 5a)</text>
<rect x="508.5" y="412" width="104.5" height="58" rx="8" fill="#d6efd9"/>
<text x="560.75" y="438" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1e6b34">sanctified</text><text x="560.75" y="455" font-size="11" text-anchor="middle" fill="#1e6b34">implied</text>
<text x="32" y="494" font-size="11.5" fill="#6b7280">Rav Pappa’s reason: the census counted firstborn “a month old and upward,” in the second year,</text>
<text x="32" y="510" font-size="11.5" fill="#6b7280">so it must have included firstborn born in the wilderness.</text>
</svg>
