<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 630" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title>No less, no more</title>
<rect width="640" height="630" rx="18" fill="#f3f6fb"/>
<text x="32" y="44" font-size="22" font-weight="700" fill="#1f2d3d">No less, no more</text>
<text x="32" y="70" font-size="14" fill="#56657a">The limits in the mishnayot of chapter 2 so far, and the case behind each</text>
<text x="32" y="104" font-size="11" font-weight="700" fill="#7a879a">WHAT IS LIMITED</text>
<text x="262" y="104" font-size="11" font-weight="700" fill="#2f5d9a">NO LESS THAN</text>
<text x="446" y="104" font-size="11" font-weight="700" fill="#9a4a2f">NO MORE THAN</text>
<rect x="20" y="118" width="600" height="62" rx="12" fill="#fff" stroke="#dbe3ee"/>
<text x="32" y="144" font-size="14.5" font-weight="700" fill="#1f2d3d">Valuation paid</text>
<rect x="32" y="154" width="28" height="17" rx="8.5" fill="#eef1f6" stroke="#cfd7e3"/>
<text x="46" y="166.5" font-size="10.5" font-weight="700" text-anchor="middle" fill="#56657a">7b</text>
<line x1="250" y1="128" x2="250" y2="170" stroke="#e1e6ee"/>
<line x1="434" y1="128" x2="434" y2="170" stroke="#e1e6ee"/>
<text x="262" y="142" font-size="17" font-weight="700" fill="#2f5d9a">1 <tspan font-style="italic">sela</tspan></text>
<text x="262" y="159" font-size="11.5" fill="#56657a">less, and he has not</text>
<text x="262" y="173" font-size="11.5" fill="#56657a">fulfilled his vow</text>
<text x="446" y="142" font-size="17" font-weight="700" fill="#9a4a2f">50 <tspan font-style="italic">sela</tspan></text>
<text x="446" y="159" font-size="11.5" fill="#56657a">“fifty”: the highest</text>
<text x="446" y="173" font-size="11.5" fill="#56657a">in the Torah’s table</text>
<rect x="20" y="188" width="600" height="62" rx="12" fill="#fff" stroke="#dbe3ee"/>
<text x="32" y="214" font-size="14.5" font-weight="700" fill="#1f2d3d">Unsure of her cycle</text>
<rect x="32" y="224" width="28" height="17" rx="8.5" fill="#eef1f6" stroke="#cfd7e3"/>
<text x="46" y="236.5" font-size="10.5" font-weight="700" text-anchor="middle" fill="#56657a">8a</text>
<line x1="250" y1="198" x2="250" y2="240" stroke="#e1e6ee"/>
<line x1="434" y1="198" x2="434" y2="240" stroke="#e1e6ee"/>
<text x="262" y="212" font-size="17" font-weight="700" fill="#2f5d9a">7 clean days</text>
<text x="262" y="229" font-size="11.5" fill="#56657a">after thirteen days</text>
<text x="262" y="243" font-size="11.5" fill="#56657a">of bleeding</text>
<text x="446" y="212" font-size="17" font-weight="700" fill="#9a4a2f">17 clean days</text>
<text x="446" y="229" font-size="11.5" fill="#56657a">after one, two or</text>
<text x="446" y="243" font-size="11.5" fill="#56657a">three days of bleeding</text>
<rect x="20" y="258" width="600" height="62" rx="12" fill="#fff" stroke="#dbe3ee"/>
<text x="32" y="284" font-size="14.5" font-weight="700" fill="#1f2d3d">Quarantine of leprous marks</text>
<rect x="32" y="294" width="28" height="17" rx="8.5" fill="#eef1f6" stroke="#cfd7e3"/>
<text x="46" y="306.5" font-size="10.5" font-weight="700" text-anchor="middle" fill="#56657a">8b</text>
<line x1="250" y1="268" x2="250" y2="310" stroke="#e1e6ee"/>
<line x1="434" y1="268" x2="434" y2="310" stroke="#e1e6ee"/>
<text x="262" y="282" font-size="17" font-weight="700" fill="#2f5d9a">1 week</text>
<text x="262" y="299" font-size="11.5" fill="#56657a">marks on a person</text>
<text x="446" y="282" font-size="17" font-weight="700" fill="#9a4a2f">3 weeks</text>
<text x="446" y="299" font-size="11.5" fill="#56657a">marks on a house</text>
<rect x="20" y="328" width="600" height="62" rx="12" fill="#fff" stroke="#dbe3ee"/>
<text x="32" y="354" font-size="14.5" font-weight="700" fill="#1f2d3d">Full 30-day months a year</text>
<rect x="32" y="364" width="28" height="17" rx="8.5" fill="#eef1f6" stroke="#cfd7e3"/>
<text x="46" y="376.5" font-size="10.5" font-weight="700" text-anchor="middle" fill="#56657a">8b</text>
<line x1="250" y1="338" x2="250" y2="380" stroke="#e1e6ee"/>
<line x1="434" y1="338" x2="434" y2="380" stroke="#e1e6ee"/>
<text x="262" y="352" font-size="17" font-weight="700" fill="#2f5d9a">4</text>
<text x="262" y="369" font-size="11.5" fill="#56657a">Ulla gives the reason</text>
<text x="262" y="383" font-size="11.5" fill="#56657a">in the Gemara (Rashi)</text>
<text x="446" y="352" font-size="17" font-weight="700" fill="#9a4a2f">8</text>
<text x="446" y="369" font-size="11.5" fill="#56657a">more did not seem right</text>
<text x="446" y="383" font-size="11.5" fill="#56657a">to the Sages (Rav Huna)</text>
<rect x="20" y="398" width="600" height="62" rx="12" fill="#fff" stroke="#dbe3ee"/>
<text x="32" y="424" font-size="14.5" font-weight="700" fill="#1f2d3d">Two loaves of <tspan font-style="italic">Shavuot</tspan></text>
<rect x="32" y="434" width="28" height="17" rx="8.5" fill="#eef1f6" stroke="#cfd7e3"/>
<text x="46" y="446.5" font-size="10.5" font-weight="700" text-anchor="middle" fill="#56657a">8b</text>
<line x1="250" y1="408" x2="250" y2="450" stroke="#e1e6ee"/>
<line x1="434" y1="408" x2="434" y2="450" stroke="#e1e6ee"/>
<text x="262" y="422" font-size="17" font-weight="700" fill="#2f5d9a">day 2</text>
<text x="262" y="439" font-size="11.5" fill="#56657a">baked on the festival eve,</text>
<text x="262" y="453" font-size="11.5" fill="#56657a">eaten on the festival (Rashi)</text>
<text x="446" y="422" font-size="17" font-weight="700" fill="#9a4a2f">day 3</text>
<text x="446" y="439" font-size="11.5" fill="#56657a"><tspan font-style="italic">Shavuot</tspan> on Sunday:</text>
<text x="446" y="453" font-size="11.5" fill="#56657a">baked Friday (Rashi)</text>
<rect x="20" y="468" width="600" height="62" rx="12" fill="#fff" stroke="#dbe3ee"/>
<text x="32" y="494" font-size="14.5" font-weight="700" fill="#1f2d3d">Shewbread eaten</text>
<rect x="32" y="504" width="28" height="17" rx="8.5" fill="#eef1f6" stroke="#cfd7e3"/>
<text x="46" y="516.5" font-size="10.5" font-weight="700" text-anchor="middle" fill="#56657a">8b</text>
<line x1="250" y1="478" x2="250" y2="520" stroke="#e1e6ee"/>
<line x1="434" y1="478" x2="434" y2="520" stroke="#e1e6ee"/>
<text x="262" y="492" font-size="17" font-weight="700" fill="#2f5d9a">day 9</text>
<text x="262" y="509" font-size="11.5" fill="#56657a">baked Friday, eaten</text>
<text x="262" y="523" font-size="11.5" fill="#56657a">the next Shabbat</text>
<text x="446" y="492" font-size="17" font-weight="700" fill="#9a4a2f">day 11</text>
<text x="446" y="509" font-size="11.5" fill="#56657a">Rosh HaShana Thu–Fri:</text>
<text x="446" y="523" font-size="11.5" fill="#56657a">baked Wednesday</text>
<rect x="20" y="538" width="600" height="62" rx="12" fill="#fff" stroke="#dbe3ee"/>
<text x="32" y="564" font-size="14.5" font-weight="700" fill="#1f2d3d">Circumcision</text>
<rect x="32" y="574" width="28" height="17" rx="8.5" fill="#eef1f6" stroke="#cfd7e3"/>
<text x="46" y="586.5" font-size="10.5" font-weight="700" text-anchor="middle" fill="#56657a">8b</text>
<line x1="250" y1="548" x2="250" y2="590" stroke="#e1e6ee"/>
<line x1="434" y1="548" x2="434" y2="590" stroke="#e1e6ee"/>
<text x="262" y="562" font-size="17" font-weight="700" fill="#2f5d9a">day 8</text>
<text x="262" y="579" font-size="11.5" fill="#56657a">the usual day</text>
<text x="446" y="562" font-size="17" font-weight="700" fill="#9a4a2f">day 12</text>
<text x="446" y="579" font-size="11.5" fill="#56657a">born Friday at twilight,</text>
<text x="446" y="593" font-size="11.5" fill="#56657a">Rosh HaShana Sun–Mon</text>
</svg>
