<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 590" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>One kidney: two baraitot</title>
  <rect width="640" height="590" rx="18" fill="#f3f6fb"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1f2d3d">One kidney: two baraitot</text>
  <text x="32" y="68" font-size="14" fill="#5b6b7d">Leviticus 3:4 · how the Gemara reconciles them (39a–b)</text>

  <rect x="212" y="86" width="192" height="64" rx="10" fill="#fde2e1"/>
  <text x="308" y="110" font-size="13.5" text-anchor="middle" fill="#a12d22"><tspan x="308" font-weight="700">“The two kidneys”</tspan><tspan x="308" dy="19">not one, nor three ✖</tspan></text>
  <rect x="416" y="86" width="192" height="64" rx="10" fill="#dcefdc"/>
  <text x="512" y="110" font-size="13.5" text-anchor="middle" fill="#1e5e2a"><tspan x="512" font-weight="700">“He shall take it away”</tspan><tspan x="512" dy="19">includes one kidney ✓</tspan></text>
  <text x="32" y="112" font-size="13" fill="#5b6b7d"><tspan x="32" font-weight="700" fill="#1f2d3d">The two baraitot</tspan><tspan x="32" dy="18">first · second</tspan></text>

  <g font-size="13">
    <rect x="32" y="168" width="576" height="88" rx="12" fill="#fff" stroke="#c9d6e6"/>
    <text x="48" y="192" font-weight="700" fill="#1f2d3d"><tspan x="48">First assumption</tspan></text>
    <text x="48" y="212" fill="#5b6b7d"><tspan x="48">No animal is born</tspan><tspan x="48" dy="17">with one kidney</tspan></text>
    <text x="308" y="200" text-anchor="middle" fill="#33475b"><tspan x="308">An internal lack</tspan><tspan x="308" dy="18" font-weight="700">is a lack</tspan></text>
    <text x="512" y="200" text-anchor="middle" fill="#33475b"><tspan x="512">An internal lack</tspan><tspan x="512" dy="18" font-weight="700">is not a lack</tspan></text>
    <text x="410" y="246" text-anchor="middle" font-size="12" fill="#5b6b7d">“Let us say they disagree about this”</text>

    <rect x="32" y="268" width="576" height="88" rx="12" fill="#fff" stroke="#c9d6e6"/>
    <text x="48" y="292" font-weight="700" fill="#1f2d3d">Rav Ḥiyya bar Yosef</text>
    <text x="48" y="312" fill="#5b6b7d"><tspan x="48">Some are born with one;</tspan><tspan x="48" dy="17">internal lack is a lack</tspan></text>
    <text x="308" y="300" text-anchor="middle" fill="#33475b"><tspan x="308">Created with two,</tspan><tspan x="308" dy="18" font-weight="700">one is lacking</tspan></text>
    <text x="512" y="300" text-anchor="middle" fill="#33475b"><tspan x="512">Created with one</tspan><tspan x="512" dy="18" font-weight="700">from the outset</tspan></text>
    <text x="410" y="346" text-anchor="middle" font-size="12" fill="#a12d22">✖ Refuted: “one” is taught like “three”, which is from the outset</text>

    <rect x="32" y="368" width="576" height="88" rx="12" fill="#fff" stroke="#c9d6e6"/>
    <text x="48" y="392" font-weight="700" fill="#1f2d3d">“Rather”</text>
    <text x="48" y="412" fill="#5b6b7d"><tspan x="48">Internal lack is a lack;</tspan><tspan x="48" dy="17">is one ever born so?</tspan></text>
    <text x="308" y="400" text-anchor="middle" fill="#33475b"><tspan x="308">No animal is created</tspan><tspan x="308" dy="18" font-weight="700">with one</tspan></text>
    <text x="512" y="400" text-anchor="middle" fill="#33475b"><tspan x="512">Some are created</tspan><tspan x="512" dy="18" font-weight="700">with one</tspan></text>

    <rect x="32" y="468" width="576" height="104" rx="12" fill="#fff" stroke="#c9d6e6"/>
    <text x="48" y="492" font-weight="700" fill="#1f2d3d">Rabbi Yoḥanan</text>
    <text x="48" y="512" fill="#5b6b7d"><tspan x="48">None born with one;</tspan><tspan x="48" dy="17">internal lack is a lack</tspan></text>
    <text x="308" y="500" text-anchor="middle" fill="#33475b"><tspan x="308">Lacked <tspan font-weight="700">before</tspan> slaughter</tspan><tspan x="308" dy="22" fill="#5b6b7d">→ before collection</tspan></text>
    <text x="512" y="500" text-anchor="middle" fill="#33475b"><tspan x="512">Lacked <tspan font-weight="700">after</tspan> slaughter</tspan><tspan x="512" dy="22" fill="#5b6b7d">→ after collection</tspan></text>
    <text x="410" y="560" text-anchor="middle" font-size="12" fill="#5b6b7d">Revised after Rav’s ruling on slitting the bull’s ear</text>
  </g>
</svg>
