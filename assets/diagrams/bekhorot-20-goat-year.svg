<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title>A goat’s first year after a discharge</title>
<rect width="640" height="600" rx="18" fill="#f3f6fb"/>
<text x="32" y="44" font-size="22" font-weight="700" fill="#1f2a3a">A goat’s first year after a discharge</text>
<text x="32" y="70" font-size="14" fill="#55657a">It expelled a murky discharge at the end of six months, as the seventh began</text>
<rect x="33" y="96" width="42" height="40" rx="6" fill="#e4e9f1"/>
<text x="54" y="121" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2a3a">1</text>
<rect x="77" y="96" width="42" height="40" rx="6" fill="#e4e9f1"/>
<text x="98" y="121" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2a3a">2</text>
<rect x="121" y="96" width="42" height="40" rx="6" fill="#e4e9f1"/>
<text x="142" y="121" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2a3a">3</text>
<rect x="165" y="96" width="42" height="40" rx="6" fill="#e4e9f1"/>
<text x="186" y="121" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2a3a">4</text>
<rect x="209" y="96" width="42" height="40" rx="6" fill="#e4e9f1"/>
<text x="230" y="121" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2a3a">5</text>
<rect x="253" y="96" width="42" height="40" rx="6" fill="#e4e9f1"/>
<text x="274" y="121" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2a3a">6</text>
<rect x="297" y="96" width="42" height="40" rx="6" fill="#fbe7c6"/>
<text x="318" y="121" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2a3a">7</text>
<rect x="341" y="96" width="42" height="40" rx="6" fill="#dce9f7"/>
<text x="362" y="121" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2a3a">8</text>
<rect x="385" y="96" width="42" height="40" rx="6" fill="#dce9f7"/>
<text x="406" y="121" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2a3a">9</text>
<rect x="429" y="96" width="42" height="40" rx="6" fill="#dce9f7"/>
<text x="450" y="121" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2a3a">10</text>
<rect x="473" y="96" width="42" height="40" rx="6" fill="#dce9f7"/>
<text x="494" y="121" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2a3a">11</text>
<rect x="517" y="96" width="42" height="40" rx="6" fill="#dce9f7"/>
<text x="538" y="121" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2a3a">12</text>
<rect x="561" y="96" width="42" height="40" rx="6" fill="#e3f2e6"/>
<text x="582" y="121" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2a3a">2·1</text>
<text x="32" y="156" font-size="12" fill="#55657a">Months of its first year</text>
<text x="582" y="156" font-size="12" text-anchor="middle" fill="#2e7d32">year 2, day 1</text>
<line x1="299" y1="176" x2="337" y2="176" stroke="#b7791f" stroke-width="2"/>
<line x1="299" y1="171" x2="299" y2="181" stroke="#b7791f" stroke-width="2"/><line x1="337" y1="171" x2="337" y2="181" stroke="#b7791f" stroke-width="2"/>
<line x1="343" y1="176" x2="557" y2="176" stroke="#2b6cb0" stroke-width="2"/>
<line x1="343" y1="171" x2="343" y2="181" stroke="#2b6cb0" stroke-width="2"/><line x1="557" y1="171" x2="557" y2="181" stroke="#2b6cb0" stroke-width="2"/>
<text x="318" y="198" font-size="12.5" font-weight="700" text-anchor="middle" fill="#9a6412">discharge</text>
<text x="318" y="214" font-size="11.5" text-anchor="middle" fill="#9a6412">30 days</text>
<text x="450" y="198" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2b6cb0">five months of pregnancy</text>
<text x="450" y="214" font-size="11.5" text-anchor="middle" fill="#2b6cb0">(a small animal)</text>
<text x="32" y="246" font-size="13" fill="#1f2a3a"><tspan font-weight="700">Ze’eiri:</tspan> no discharge lasts less than thirty days. With full months, the earliest</text>
<text x="32" y="265" font-size="13" fill="#1f2a3a">birth is the first day of the second year. That is Rabbi Yehoshua’s <tspan font-weight="700">tradition</tspan>.</text>
<text x="32" y="300" font-size="15" font-weight="700" fill="#1f2a3a">How his own reasoning allows a birth within the first year</text>
<rect x="22" y="314" width="596" height="62" rx="12" fill="#ffffff" stroke="#dde4ef"/>
<circle cx="46" cy="345" r="13" fill="#dce9f7"/><text x="46" y="350" font-size="14" font-weight="700" text-anchor="middle" fill="#2b6cb0">1</text>
<text x="70" y="340" font-size="14.5" font-weight="700" fill="#1f2a3a">He does not accept Ze’eiri</text>
<text x="596" y="340" font-size="11.5" text-anchor="end" fill="#7a8696">a12</text>
<text x="70" y="360" font-size="12.5" fill="#55657a">The discharge can be shorter, so it conceives sooner.</text>
<rect x="22" y="384" width="596" height="62" rx="12" fill="#ffffff" stroke="#dde4ef"/>
<circle cx="46" cy="415" r="13" fill="#dce9f7"/><text x="46" y="420" font-size="14" font-weight="700" text-anchor="middle" fill="#2b6cb0">2</text>
<text x="70" y="410" font-size="14.5" font-weight="700" fill="#1f2a3a">It gives birth after incomplete months</text>
<text x="596" y="410" font-size="11.5" text-anchor="end" fill="#7a8696">a13–b1</text>
<text x="70" y="430" font-size="12.5" fill="#55657a">All accept Ze’eiri, but the pregnancy can fall short.</text>
<rect x="22" y="454" width="596" height="76" rx="12" fill="#ffffff" stroke="#dde4ef"/>
<circle cx="46" cy="485" r="13" fill="#dce9f7"/><text x="46" y="490" font-size="14" font-weight="700" text-anchor="middle" fill="#2b6cb0">3</text>
<text x="70" y="480" font-size="14.5" font-weight="700" fill="#1f2a3a">Part of a day counts as a whole day</text>
<text x="596" y="480" font-size="11.5" text-anchor="end" fill="#7a8696">b2</text>
<text x="70" y="500" font-size="12.5" fill="#55657a">All accept Ze’eiri and full months, but it can conceive</text>
<text x="70" y="518" font-size="12.5" fill="#55657a">on the thirtieth day and give birth on the last day of the year.</text>
<text x="32" y="552" font-size="12.5" fill="#55657a">The Rabbis, by his tradition: becoming pregnant within thirty days of the discharge</text>
<text x="32" y="571" font-size="12.5" fill="#55657a">shows it was no sign of a fetus, so the next offspring is a firstborn.</text>
</svg>