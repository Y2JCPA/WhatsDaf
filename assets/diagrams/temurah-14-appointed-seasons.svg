<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>These you shall offer in your appointed seasons</title>
  <rect width="640" height="640" rx="18" fill="#f3f6fb"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1f2d3d">“In your appointed seasons”</text>
  <text x="32" y="70" font-size="14" fill="#5b6b7d">Numbers 29:39, phrase by phrase: Rav Dimi, from Rabbi Yoḥanan</text>
  <text x="32" y="90" font-size="14" fill="#5b6b7d">in the name of Rabbi Shimon ben Yehotzadak</text>

  <g font-size="12.5" font-weight="700" fill="#7f8fa3" letter-spacing="0.6">
    <text x="32" y="124">THE PHRASE</text>
    <text x="276" y="124">WHAT IT TEACHES</text>
  </g>

  <g font-size="13.5">
    <rect x="32" y="136" width="576" height="66" rx="10" fill="#ffffff" stroke="#dfe8f3"/>
    <text x="48" y="162" font-weight="700" fill="#1f2d3d">“These you shall offer</text>
    <text x="48" y="180" font-weight="700" fill="#1f2d3d">in your appointed seasons”</text>
    <text x="276" y="162" fill="#1f2d3d">Obligatory offerings of the pilgrimage Festival:</text>
    <text x="276" y="180" fill="#5b6b7d" font-size="12.5">burnt offerings of appearance, Festival offerings,</text>
    <text x="276" y="196" fill="#5b6b7d" font-size="12.5">additional offerings</text>

    <rect x="32" y="212" width="576" height="56" rx="10" fill="#ffffff" stroke="#dfe8f3"/>
    <text x="48" y="236" font-weight="700" fill="#1f2d3d">“Beside your vows and</text>
    <text x="48" y="254" font-weight="700" fill="#1f2d3d">your voluntary offerings”</text>
    <text x="276" y="236" fill="#1f2d3d">Vows and voluntary offerings are sacrificed</text>
    <text x="276" y="254" fill="#1f2d3d">on the intermediate days of a Festival</text>

    <rect x="32" y="278" width="576" height="66" rx="10" fill="#ffffff" stroke="#dfe8f3"/>
    <text x="48" y="306" font-weight="700" fill="#1f2d3d">“And your burnt offerings”</text>
    <text x="276" y="304" fill="#1f2d3d">The burnt offering of a woman who gave birth,</text>
    <text x="276" y="322" fill="#1f2d3d">and of a leper</text>
    <text x="276" y="338" fill="#5b6b7d" font-size="11.5">vow and voluntary ones were already said</text>

    <rect x="32" y="354" width="576" height="66" rx="10" fill="#ffffff" stroke="#dfe8f3"/>
    <text x="48" y="382" font-weight="700" fill="#1f2d3d">“And your meal offerings”</text>
    <text x="276" y="380" fill="#1f2d3d">The meal offering of a <tspan font-style="italic">sota</tspan>,</text>
    <text x="276" y="398" fill="#1f2d3d">the meal offering of jealousy</text>
    <text x="276" y="414" fill="#5b6b7d" font-size="11.5">vow and voluntary ones were already said</text>

    <rect x="32" y="430" width="576" height="56" rx="10" fill="#ffffff" stroke="#dfe8f3"/>
    <text x="48" y="454" font-weight="700" fill="#1f2d3d">“And your libations</text>
    <text x="48" y="472" font-weight="700" fill="#1f2d3d">and your peace offerings”</text>
    <text x="276" y="454" fill="#1f2d3d">Juxtaposed: like peace offerings,</text>
    <text x="276" y="472" fill="#1f2d3d">libations only during the day</text>

    <rect x="32" y="496" width="576" height="56" rx="10" fill="#ffffff" stroke="#dfe8f3"/>
    <text x="48" y="529" font-weight="700" fill="#1f2d3d">“And your peace offerings”</text>
    <text x="276" y="520" fill="#1f2d3d">Includes the peace offering of a nazirite</text>
    <text x="276" y="538" fill="#5b6b7d" font-size="12.5">on the intermediate days of a Festival</text>
  </g>

  <rect x="32" y="564" width="576" height="56" rx="10" fill="#fff6e0" stroke="#f0dca8"/>
  <text x="48" y="588" font-size="13" font-weight="700" fill="#7a5a12">Abaye: rather, the peace offering brought with a Paschal offering,</text>
  <text x="48" y="606" font-size="12.5" fill="#5b4a20">since a nazirite’s peace offering is already vowed or contributed</text>
</svg>
