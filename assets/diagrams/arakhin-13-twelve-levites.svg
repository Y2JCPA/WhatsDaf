<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 474" width="640" height="474" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="474" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Twelve Levites on the platform</text>
  <text x="320" y="70" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">Rav Pappa: the twelve correspond to the fewest instruments played</text>
  <rect x="29" y="96" width="40" height="40" rx="8" fill="#e8eefc" stroke="#9fb3e0"/>
  <text x="49" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">1</text>
  <rect x="75" y="96" width="40" height="40" rx="8" fill="#e8eefc" stroke="#9fb3e0"/>
  <text x="95" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">2</text>
  <rect x="121" y="96" width="40" height="40" rx="8" fill="#e8eefc" stroke="#9fb3e0"/>
  <text x="141" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">3</text>
  <rect x="167" y="96" width="40" height="40" rx="8" fill="#e8eefc" stroke="#9fb3e0"/>
  <text x="187" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">4</text>
  <rect x="213" y="96" width="40" height="40" rx="8" fill="#e8eefc" stroke="#9fb3e0"/>
  <text x="233" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">5</text>
  <rect x="259" y="96" width="40" height="40" rx="8" fill="#e8eefc" stroke="#9fb3e0"/>
  <text x="279" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">6</text>
  <rect x="305" y="96" width="40" height="40" rx="8" fill="#e8eefc" stroke="#9fb3e0"/>
  <text x="325" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">7</text>
  <rect x="351" y="96" width="40" height="40" rx="8" fill="#e8eefc" stroke="#9fb3e0"/>
  <text x="371" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">8</text>
  <rect x="397" y="96" width="40" height="40" rx="8" fill="#e8eefc" stroke="#9fb3e0"/>
  <text x="417" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">9</text>
  <text x="233" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">9 harps</text>
  <rect x="461" y="96" width="40" height="40" rx="8" fill="#fff4dc" stroke="#e5b94e"/>
  <text x="481" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#8a5a00">1</text>
  <rect x="507" y="96" width="40" height="40" rx="8" fill="#fff4dc" stroke="#e5b94e"/>
  <text x="527" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#8a5a00">2</text>
  <text x="504" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#8a5a00">2 lyres</text>
  <rect x="571" y="96" width="40" height="40" rx="8" fill="#fde8d8" stroke="#e0a47a"/>
  <text x="591" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#8a3b0d">1</text>
  <text x="591" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#8a3b0d">1 cymbal</text>
  <text x="320" y="182" text-anchor="middle" font-size="13" font-weight="400" fill="#374151">9 + 2 + 1 = 12 · “he and his brethren and sons were twelve” (I Chronicles 25:9)</text>
  <line x1="24" y1="202" x2="616" y2="202" stroke="#cbd5e1"/>
  <text x="24" y="228" text-anchor="start" font-size="11" font-weight="700" fill="#6b7280">IN THE MISHNAYOT</text>
  <text x="330" y="228" text-anchor="start" font-size="11" font-weight="700" fill="#6b7280">NO FEWER THAN</text>
  <text x="470" y="228" text-anchor="start" font-size="11" font-weight="700" fill="#6b7280">AT MOST</text>
  <rect x="24" y="238" width="592" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="260" text-anchor="start" font-size="14" font-weight="700" fill="#1f2937">Levites on the platform</text>
  <text x="358" y="260" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">12</text>
  <text x="494" y="260" text-anchor="middle" font-size="13" font-weight="700" fill="#8a3b0d">no limit</text>
  <rect x="24" y="278" width="592" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="300" text-anchor="start" font-size="14" font-weight="700" fill="#1f2937">Harps</text>
  <text x="358" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">9</text>
  <text x="494" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#8a3b0d">no limit</text>
  <rect x="24" y="318" width="592" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="340" text-anchor="start" font-size="14" font-weight="700" fill="#1f2937">Trumpets</text>
  <text x="358" y="340" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">2</text>
  <text x="494" y="340" text-anchor="middle" font-size="16" font-weight="700" fill="#8a3b0d">120</text>
  <text x="40" y="356" text-anchor="start" font-size="11" font-weight="400" fill="#6b7280">Rav Huna (II Chronicles 5:12)</text>
  <rect x="24" y="370" width="592" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="392" text-anchor="start" font-size="14" font-weight="700" fill="#1f2937">Cymbal</text>
  <text x="358" y="392" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">1</text>
  <text x="494" y="392" text-anchor="middle" font-size="16" font-weight="700" fill="#8a3b0d">1</text>
  <text x="40" y="408" text-anchor="start" font-size="11" font-weight="400" fill="#6b7280">“Asaph with the cymbals”: one player</text>
  <text x="24" y="436" text-anchor="start" font-size="11" font-weight="400" fill="#4b5563">Minor Levites sang with the mouth beside them; Rabbi Eliezer ben Ya’akov: they are not counted in the twelve.</text>
  <text x="24" y="454" text-anchor="start" font-size="11" font-weight="400" fill="#4b5563">Tosafot: the two trumpets were blown by priests, not Levites, so they are not among the twelve.</text>
</svg>
