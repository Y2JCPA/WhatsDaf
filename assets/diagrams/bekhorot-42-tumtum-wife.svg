<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>The tumtum’s widow</title>
  <rect width="640" height="440" rx="18" fill="#f3f6fb"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1f2d3d">The tumtum’s widow: two baraitot</text>
  <text x="32" y="68" font-size="14" fill="#5b6b7d">The Gemara’s conclusion: both worry that a tumtum may be a eunuch from birth</text>
  <rect x="24" y="88" width="290" height="254" rx="14" fill="#fff" stroke="#dbe3ee"/>
  <text x="40" y="116" font-size="16" font-weight="700" fill="#2e7d32">Baraita 1</text>
  <text x="40" y="142" font-size="14" fill="#1f2d3d">Its brothers perform ḥalitza with</text>
  <text x="40" y="162" font-size="14" fill="#1f2d3d">its wife, or take her in levirate</text>
  <text x="40" y="182" font-size="14" fill="#1f2d3d">marriage.</text>
  <text x="40" y="214" font-size="12" font-weight="700" fill="#7f8fa3" letter-spacing=".5">FOLLOWS</text>
  <text x="40" y="234" font-size="14" font-weight="700" fill="#2e7d32">Rabbi Eliezer</text>
  <text x="40" y="260" font-size="13" fill="#5b6b7d">Even a eunuch from birth’s widow may</text>
  <text x="40" y="278" font-size="13" fill="#5b6b7d">be taken in levirate marriage, so</text>
  <text x="40" y="296" font-size="13" fill="#5b6b7d">either way it is allowed.</text>
  <rect x="326" y="88" width="290" height="254" rx="14" fill="#fff" stroke="#dbe3ee"/>
  <text x="342" y="116" font-size="16" font-weight="700" fill="#1a5276">Baraita 2</text>
  <text x="342" y="142" font-size="14" fill="#1f2d3d">Its wife performs ḥalitza and is not</text>
  <text x="342" y="162" font-size="14" fill="#1f2d3d">taken in levirate marriage.</text>
  <text x="342" y="194" font-size="12" font-weight="700" fill="#7f8fa3" letter-spacing=".5">FOLLOWS</text>
  <text x="342" y="214" font-size="14" font-weight="700" fill="#1a5276">Rabbi Akiva’s view, as taught by</text>
  <text x="342" y="234" font-size="14" font-weight="700" fill="#1a5276">Rabbi Yosei son of Rabbi Yehuda</text>
  <text x="342" y="260" font-size="13" fill="#5b6b7d">Perhaps the tumtum is a eunuch from</text>
  <text x="342" y="278" font-size="13" fill="#5b6b7d">birth, perhaps not: so ḥalitza, but no</text>
  <text x="342" y="296" font-size="13" fill="#5b6b7d">levirate marriage.</text>
  <rect x="24" y="356" width="592" height="64" rx="12" fill="#fde2e1"/>
  <text x="40" y="382" font-size="14" font-weight="700" fill="#a12d22">Not Rabbi Yehuda:</text>
  <text x="40" y="404" font-size="13" fill="#7a2a22">a tumtum torn open and found male is a definite eunuch for him, so no ḥalitza at all.</text>
</svg>
