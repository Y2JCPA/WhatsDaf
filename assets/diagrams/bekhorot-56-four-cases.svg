<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>Rabbi Yirmeya's four cases</title>
  <rect width="640" height="490" rx="18" fill="#f3f6fb"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1f2d3d">Brothers who inherited: four cases</text>
  <text x="32" y="68" font-size="14" fill="#5b6b7d">Rabbi Yirmeya: what they divided decides what they owe</text>

  <text x="364" y="104" font-size="12" font-weight="700" fill="#7f8fa3" letter-spacing=".5" text-anchor="middle">ANIMALS</text>
  <text x="244" y="128" font-size="14" font-weight="700" fill="#1f2d3d" text-anchor="middle">Not divided</text>
  <text x="484" y="128" font-size="14" font-weight="700" fill="#1f2d3d" text-anchor="middle">Divided</text>

  <text x="40" y="104" font-size="12" font-weight="700" fill="#7f8fa3" letter-spacing=".5">MONEY</text>
  <text x="40" y="196" font-size="14" font-weight="700" fill="#1f2d3d">Not divided</text>
  <text x="40" y="346" font-size="14" font-weight="700" fill="#1f2d3d">Divided</text>

  <rect x="134" y="142" width="220" height="132" rx="14" fill="#fff" stroke="#dbe3ee"/>
  <text x="150" y="170" font-size="12" fill="#7f8fa3">Nothing divided (b14)</text>
  <rect x="150" y="184" width="188" height="30" rx="8" fill="#e3f0e5"/>
  <text x="162" y="204" font-size="14" font-weight="700" fill="#1b5e20">Animal tithe: owed</text>
  <rect x="150" y="222" width="188" height="30" rx="8" fill="#eef1f5"/>
  <text x="162" y="242" font-size="14" fill="#5b6b7d">Premium: exempt</text>

  <rect x="374" y="142" width="220" height="132" rx="14" fill="#fff" stroke="#dbe3ee"/>
  <text x="390" y="170" font-size="12" fill="#7f8fa3">Animals only (b12)</text>
  <rect x="390" y="184" width="188" height="30" rx="8" fill="#eef1f5"/>
  <text x="402" y="204" font-size="14" fill="#5b6b7d">Animal tithe: exempt</text>
  <rect x="390" y="222" width="188" height="30" rx="8" fill="#eef1f5"/>
  <text x="402" y="242" font-size="14" fill="#5b6b7d">Premium: exempt</text>

  <rect x="134" y="292" width="220" height="132" rx="14" fill="#fff" stroke="#dbe3ee"/>
  <text x="150" y="320" font-size="12" fill="#7f8fa3">Money only (b12)</text>
  <rect x="150" y="334" width="188" height="30" rx="8" fill="#e3f0e5"/>
  <text x="162" y="354" font-size="14" font-weight="700" fill="#1b5e20">Animal tithe: owed</text>
  <rect x="150" y="372" width="188" height="30" rx="8" fill="#fdf0d8"/>
  <text x="162" y="392" font-size="14" font-weight="700" fill="#8a5a00">Premium: owed</text>

  <rect x="374" y="292" width="220" height="132" rx="14" fill="#fff" stroke="#dbe3ee"/>
  <text x="390" y="320" font-size="12" fill="#7f8fa3">Both, then partners again (b13)</text>
  <rect x="390" y="334" width="188" height="30" rx="8" fill="#eef1f5"/>
  <text x="402" y="354" font-size="14" fill="#5b6b7d">Animal tithe: exempt</text>
  <rect x="390" y="372" width="188" height="30" rx="8" fill="#fdf0d8"/>
  <text x="402" y="392" font-size="14" font-weight="700" fill="#8a5a00">Premium: owed</text>

  <text x="32" y="450" font-size="13" fill="#5b6b7d">The guiding principle (b12): partners owe the premium but not the tithe;</text>
  <text x="32" y="470" font-size="13" fill="#5b6b7d">a single owner owes the tithe but not the premium.</text>
</svg>
