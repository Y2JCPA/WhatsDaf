<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 642" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <title>Like a non-kosher animal</title>
  <rect width="640" height="642" rx="18" fill="#f3f6fb"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#1f2d3d">“Like a non-kosher animal”</text>
  <text x="32" y="70" font-size="14" fill="#5b6b7d">Why Rabbi Elazar’s animals are neither sacred nor sanctify: diverse kinds,</text>
  <text x="32" y="89" font-size="14" fill="#5b6b7d">a <tspan font-style="italic">tereifa</tspan>, one born by caesarean section, a <tspan font-style="italic">tumtum</tspan>, a hermaphrodite.</text>

  <!-- Step 1 -->
  <rect x="32" y="108" width="576" height="190" rx="12" fill="#ffffff" stroke="#dfe8f3"/>
  <rect x="32" y="108" width="576" height="38" rx="12" fill="#e6eef8"/>
  <rect x="32" y="130" width="576" height="16" fill="#e6eef8"/>
  <text x="48" y="133" font-size="15" font-weight="700" fill="#1f2d3d">1 · Rav Pappa</text>
  <text x="48" y="170" font-size="14.5" font-weight="700" fill="#1f2d3d">Not sacrificed, and inherent sanctity does not rest on it.</text>
  <text x="48" y="198" font-size="13.5" fill="#b23b3b"><tspan font-weight="700">✗ Rav Pappa to Rava:</tspan> a blemished animal is not sacrificed,</text>
  <text x="64" y="216" font-size="13.5" fill="#b23b3b">yet inherent sanctity rests on it.</text>
  <text x="48" y="242" font-size="13.5" fill="#1e6b3a"><tspan font-weight="700">↳ Rava:</tspan> a blemished animal’s kind is sacrificed.</text>
  <text x="48" y="270" font-size="13.5" fill="#b23b3b"><tspan font-weight="700">✗ Rav Pappa:</tspan> then a <tspan font-style="italic">tereifa</tspan> too, since its kind is sacrificed?</text>

  <!-- Step 2 -->
  <rect x="32" y="312" width="576" height="138" rx="12" fill="#ffffff" stroke="#dfe8f3"/>
  <rect x="32" y="312" width="576" height="38" rx="12" fill="#e6eef8"/>
  <rect x="32" y="334" width="576" height="16" fill="#e6eef8"/>
  <text x="48" y="337" font-size="15" font-weight="700" fill="#1f2d3d">2 · Rather, Rava</text>
  <text x="48" y="374" font-size="14.5" font-weight="700" fill="#1f2d3d">An inherent disqualification; a blemished animal only lacks limbs.</text>
  <text x="48" y="402" font-size="13.5" fill="#b23b3b"><tspan font-weight="700">✗ Rav Adda:</tspan> “too long or closed” hooves are in the passage of</text>
  <text x="64" y="420" font-size="13.5" fill="#b23b3b">blemishes, and they are inherent disqualifications.</text>

  <!-- Step 3 -->
  <rect x="32" y="464" width="576" height="148" rx="12" fill="#ffffff" stroke="#9fd0b0"/>
  <rect x="32" y="464" width="576" height="38" rx="12" fill="#e3f3e8"/>
  <rect x="32" y="486" width="576" height="16" fill="#e3f3e8"/>
  <text x="48" y="489" font-size="15" font-weight="700" fill="#1e6b3a">3 · Rather, Rava</text>
  <text x="48" y="526" font-size="14.5" font-weight="700" fill="#1f2d3d">Nothing of its kind is sacrificed; a blemished animal’s kind is.</text>
  <text x="48" y="554" font-size="13.5" fill="#5b6b7d"><tspan font-weight="700" fill="#1f2d3d">And the <tspan font-style="italic">tereifa</tspan>?</tspan> It is not like a blemished animal:</text>
  <text x="48" y="574" font-size="13.5" fill="#5b6b7d">a non-kosher animal is forbidden for consumption, and a <tspan font-style="italic">tereifa</tspan></text>
  <text x="48" y="594" font-size="13.5" fill="#5b6b7d">is forbidden for consumption; a blemished animal is permitted.</text>
</svg>
