<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<rect x="0" y="0" width="640" height="470" rx="18" fill="#f3f6fb"/>
<text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Why do the Rabbis exempt him?</text>
<text x="320" y="70" text-anchor="middle" font-size="13.5" font-style="italic" fill="#4b5563">Witnesses: “You became impure” and entered the Temple. He: “I did not become impure.”</text>

<text x="48" y="108" font-size="12" font-weight="700" fill="#6b7280">IF THEIR REASON IS…</text>
<text x="350" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280">OLD IMPURITY</text>
<text x="350" y="116" text-anchor="middle" font-size="11.5" fill="#6b7280">impure yesterday, entered today</text>
<text x="525" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280">NEW IMPURITY</text>
<text x="525" y="116" text-anchor="middle" font-size="11.5" fill="#6b7280">impure the day he entered</text>

<rect x="32" y="128" width="576" height="112" rx="10" fill="#ffffff" stroke="#9fb3d9"/>
<text x="48" y="158" font-size="15" font-weight="700" fill="#1f2937">A person is credible</text>
<text x="48" y="178" font-size="15" font-weight="700" fill="#1f2937">about himself</text>
<text x="48" y="200" font-size="12.5" fill="#4b5563">more than the testimony</text>
<text x="48" y="217" font-size="12.5" fill="#4b5563">of one hundred people</text>
<rect x="270" y="146" width="160" height="40" rx="8" fill="#e6f4ea" stroke="#7cbf8a"/>
<text x="350" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#1d5e2c">exempt</text>
<rect x="445" y="146" width="160" height="40" rx="8" fill="#e6f4ea" stroke="#7cbf8a"/>
<text x="525" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#1d5e2c">exempt</text>
<text x="437" y="214" text-anchor="middle" font-size="12.5" fill="#374151">no different whether new or old</text>

<rect x="32" y="252" width="576" height="150" rx="10" fill="#ffffff" stroke="#e0c48a"/>
<text x="48" y="282" font-size="15" font-weight="700" fill="#1f2937"><tspan font-style="italic">Miggo</tspan>: since he could</text>
<text x="48" y="302" font-size="15" font-weight="700" fill="#1f2937">have made a better claim</text>
<text x="48" y="324" font-size="12.5" fill="#4b5563">as with forbidden fat:</text>
<text x="48" y="341" font-size="12.5" fill="#4b5563">“I did so intentionally”</text>
<rect x="270" y="270" width="160" height="40" rx="8" fill="#e6f4ea" stroke="#7cbf8a"/>
<text x="350" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#1d5e2c">exempt</text>
<text x="350" y="330" text-anchor="middle" font-size="12" fill="#374151">he could say “I immersed”;</text>
<text x="350" y="347" text-anchor="middle" font-size="12" fill="#374151">so “I did not become impure”</text>
<text x="350" y="364" text-anchor="middle" font-size="12" fill="#374151">means “I did not remain</text>
<text x="350" y="381" text-anchor="middle" font-size="12" fill="#374151">in my impurity”</text>
<rect x="445" y="270" width="160" height="40" rx="8" fill="#fbe9e7" stroke="#d98b7e"/>
<text x="525" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3412">liable</text>
<text x="525" y="330" text-anchor="middle" font-size="12" fill="#374151">even “I immersed” would</text>
<text x="525" y="347" text-anchor="middle" font-size="12" fill="#374151">not help: the witnesses</text>
<text x="525" y="364" text-anchor="middle" font-size="12" fill="#374151">say “You became</text>
<text x="525" y="381" text-anchor="middle" font-size="12" fill="#374151">impure just now”</text>

<text x="320" y="432" text-anchor="middle" font-size="12.5" fill="#4b5563">“What is the practical difference? To resolve from it the case of ritual impurity.”</text>
<text x="320" y="452" text-anchor="middle" font-size="11.5" fill="#6b7280">Old impurity as Rashi defines it: “yesterday you became impure, and today you entered.”</text>
</svg>
