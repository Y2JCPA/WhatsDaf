<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 668" width="640" height="668" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="640" height="668" rx="18" fill="#f3f6fb"/><text x="320" y="44" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">One sanctity onto another</text><text x="320" y="70" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="middle">An item already consecrated, then associated with a second sanctity (32a)</text><text x="28" y="104" font-size="11" font-weight="700" fill="#475569" text-anchor="start">FIRST CONSECRATED</text><text x="28" y="118" font-size="11" font-weight="700" fill="#475569" text-anchor="start">FOR…</text><text x="400" y="96" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">…THEN ASSOCIATED WITH</text><text x="242" y="118" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle">the altar</text><text x="400" y="118" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle">Temple maintenance</text><text x="558" y="118" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle">the priests’ dedications</text><rect x="20" y="130" width="140" height="100" rx="10" fill="#ffffff" stroke="#d5dde9"/><text x="34" y="185" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">The altar</text><rect x="166" y="130" width="152" height="100" rx="10" fill="#eef1f5" stroke="#d5dde9"/><text x="242" y="185" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">—</text><rect x="324" y="130" width="152" height="100" rx="10" fill="#e7f5ec" stroke="#7cc49a"/><text x="400" y="158" font-size="12.5" font-weight="700" fill="#166534" text-anchor="middle">Takes effect</text><text x="400" y="176" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">he gives a consecration</text><text x="400" y="194" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">of value (mishna;</text><text x="400" y="212" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">Rav Huna agrees)</text><rect x="482" y="130" width="152" height="100" rx="10" fill="#e7f5ec" stroke="#7cc49a"/><text x="558" y="158" font-size="12.5" font-weight="700" fill="#166534" text-anchor="middle">Takes effect</text><text x="558" y="176" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">Rav Huna: “nothing”</text><text x="558" y="194" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">refuted by two</text><text x="558" y="212" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">baraitot</text><rect x="20" y="236" width="140" height="100" rx="10" fill="#ffffff" stroke="#d5dde9"/><text x="34" y="282" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">Temple</text><text x="34" y="300" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">maintenance</text><rect x="166" y="236" width="152" height="100" rx="10" fill="#fdecec" stroke="#e5a3a3"/><text x="242" y="282" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="middle">Nothing</text><text x="242" y="300" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">(baraita)</text><rect x="324" y="236" width="152" height="100" rx="10" fill="#eef1f5" stroke="#d5dde9"/><text x="400" y="291" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">—</text><rect x="482" y="236" width="152" height="100" rx="10" fill="#fdecec" stroke="#e5a3a3"/><text x="558" y="282" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="middle">Nothing</text><text x="558" y="300" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">(baraita)</text><rect x="20" y="342" width="140" height="100" rx="10" fill="#ffffff" stroke="#d5dde9"/><text x="34" y="388" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">The priests’</text><text x="34" y="406" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">dedications</text><rect x="166" y="342" width="152" height="100" rx="10" fill="#fdecec" stroke="#e5a3a3"/><text x="242" y="388" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="middle">Nothing</text><text x="242" y="406" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">(baraita)</text><rect x="324" y="342" width="152" height="100" rx="10" fill="#fdecec" stroke="#e5a3a3"/><text x="400" y="388" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="middle">Nothing</text><text x="400" y="406" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">(baraita)</text><rect x="482" y="342" width="152" height="100" rx="10" fill="#eef1f5" stroke="#d5dde9"/><text x="558" y="397" font-size="12.5" font-weight="400" fill="#374151" text-anchor="middle">—</text><rect x="20" y="456" width="600" height="192" rx="10" fill="#ffffff" stroke="#d5dde9"/><text x="34" y="482" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="start">Temple maintenance:</text><text x="34" y="499" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">its body is not removed from Temple maintenance, and the benefit of discretion does</text><text x="34" y="516" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">not apply (Rashi).</text><text x="34" y="539" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="start">The priests’ dedications:</text><text x="34" y="556" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">no rights, not even the benefit of discretion; they go to the priestly watch then</text><text x="34" y="573" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">serving.</text><text x="34" y="596" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="start">By Torah law (32b):</text><text x="34" y="613" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">a burnt offering associated with Temple maintenance has only the treasurers’ delay;</text><text x="34" y="630" font-size="12.5" font-weight="400" fill="#374151" text-anchor="start">giving its value is rabbinic.</text></svg>
