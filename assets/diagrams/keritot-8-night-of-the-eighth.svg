<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" width="640" height="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="640" height="600" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Seeing again on the night of the eighth</text>
  <text x="320" y="68" text-anchor="middle" font-size="14" fill="#4b5563">Keritot 8a: is night “lacking time” for a zav’s offering?</text>

  <text x="24" y="104" font-size="13.5" font-weight="700" fill="#1e3a5f">Two baraitot: a zav sees three sightings on the night of the eighth</text>
  <rect x="24" y="116" width="288" height="84" rx="10" fill="#eef6ee" stroke="#a9d3ad"/>
  <text x="40" y="140" font-size="12.5" font-weight="700" fill="#4b5563">One baraita</text>
  <text x="40" y="162" font-size="15" font-weight="600" fill="#1f2937">He brings an additional offering</text>
  <text x="40" y="185" font-size="12.5" fill="#374151">Suggested: night is not “lacking time”</text>
  <rect x="328" y="116" width="288" height="84" rx="10" fill="#fdecec" stroke="#e8b4b4"/>
  <text x="344" y="140" font-size="12.5" font-weight="700" fill="#4b5563">Another baraita</text>
  <text x="344" y="162" font-size="15" font-weight="600" fill="#1f2937">He does not bring another</text>
  <text x="344" y="185" font-size="12.5" fill="#374151">Suggested: night is “lacking time”</text>

  <text x="24" y="232" font-size="13.5" font-weight="700" fill="#1e3a5f">Rabbi Elazar: both hold night is “lacking time”; the cases differ</text>
  <rect x="24" y="244" width="288" height="96" rx="10" fill="#ffffff" stroke="#a9d3ad"/>
  <text x="40" y="268" font-size="12.5" font-weight="700" fill="#4b5563">“He brings”</text>
  <text x="40" y="290" font-size="15" font-weight="600" fill="#1f2937">A zav of two sightings</text>
  <text x="40" y="312" font-size="12.5" fill="#374151">He owed no offering, so these</text>
  <text x="40" y="329" font-size="12.5" fill="#374151">discharges are a new impurity</text>
  <rect x="328" y="244" width="288" height="96" rx="10" fill="#ffffff" stroke="#e8b4b4"/>
  <text x="344" y="268" font-size="12.5" font-weight="700" fill="#4b5563">“He does not bring”</text>
  <text x="344" y="290" font-size="15" font-weight="600" fill="#1f2937">A zav of three sightings</text>
  <text x="344" y="312" font-size="12.5" fill="#374151">He owes an offering, and its time</text>
  <text x="344" y="329" font-size="12.5" fill="#374151">has not yet come on the eighth night</text>

  <text x="24" y="374" font-size="13.5" font-weight="700" fill="#1e3a5f">Rabbi Yoḥanan: three sightings split between night and day</text>
  <text x="250" y="400" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4b5563">Night of the 8th</text>
  <text x="380" y="400" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4b5563">Day 8</text>
  <text x="530" y="400" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4b5563">Additional offering?</text>

  <rect x="24" y="410" width="592" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="441" font-size="14" font-weight="600" fill="#1f2937">One, then two</text>
  <rect x="190" y="420" width="120" height="32" rx="8" fill="#e5e7f0"/>
  <circle cx="250" cy="436" r="7" fill="#1e3a5f"/>
  <rect x="320" y="420" width="120" height="32" rx="8" fill="#fff7e6"/>
  <circle cx="368" cy="436" r="7" fill="#1e3a5f"/><circle cx="392" cy="436" r="7" fill="#1e3a5f"/>
  <rect x="466" y="420" width="128" height="32" rx="8" fill="#eef6ee" stroke="#a9d3ad"/>
  <text x="530" y="441" text-anchor="middle" font-size="14" font-weight="700" fill="#2e6b3a">He brings</text>

  <rect x="24" y="472" width="592" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="503" font-size="14" font-weight="600" fill="#1f2937">Two, then one</text>
  <rect x="190" y="482" width="120" height="32" rx="8" fill="#e5e7f0"/>
  <circle cx="238" cy="498" r="7" fill="#1e3a5f"/><circle cx="262" cy="498" r="7" fill="#1e3a5f"/>
  <rect x="320" y="482" width="120" height="32" rx="8" fill="#fff7e6"/>
  <circle cx="380" cy="498" r="7" fill="#1e3a5f"/>
  <rect x="466" y="482" width="128" height="32" rx="8" fill="#fdecec" stroke="#e8b4b4"/>
  <text x="530" y="503" text-anchor="middle" font-size="14" font-weight="700" fill="#9b2c2c">He does not</text>

  <text x="24" y="554" font-size="12.5" fill="#374151">The Gemara: Rabbi Yoḥanan states the second case according to the one who says</text>
  <text x="24" y="573" font-size="12.5" fill="#374151">night is “lacking time”; the first case teaches that the night sighting combines.</text>
</svg>
