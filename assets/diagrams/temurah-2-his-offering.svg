<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 630" width="640" height="630" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="640" height="630" rx="18" fill="#f3f6fb"/>
  <text x="320" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Three times “his offering”</text>
  <text x="320" y="68" text-anchor="middle" font-size="14" fill="#4b5563">Placing hands on a peace offering (Leviticus 3:2, 8, 12)</text>
  <text x="290" y="106" text-anchor="middle" font-size="13.5" font-weight="700" fill="#374151">Rabbi Yehuda</text>
  <text x="426" y="98" text-anchor="middle" font-size="13.5" font-weight="700" fill="#374151">Rabbi Yehuda</text>
  <text x="426" y="116" text-anchor="middle" font-size="12" fill="#6b7280">“if you wish, say”</text>
  <text x="562" y="106" text-anchor="middle" font-size="13.5" font-weight="700" fill="#374151">Rabbi Meir</text>
  <rect x="24" y="130" width="196" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="36" y="155" font-size="13.5" font-weight="700" fill="#1f2937">Not the offering</text>
  <text x="36" y="173" font-size="13" fill="#374151">of a gentile</text>
  <rect x="228" y="130" width="124" height="58" rx="10" fill="#e1f3e5" stroke="#7cbf8a"/>
  <text x="290" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5e2c">1st mention</text>
  <rect x="364" y="130" width="124" height="58" rx="10" fill="#e1f3e5" stroke="#7cbf8a"/>
  <text x="426" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5e2c">1st mention</text>
  <rect x="500" y="130" width="124" height="58" rx="10" fill="#e1f3e5" stroke="#7cbf8a"/>
  <text x="562" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5e2c">1st mention</text>
  <rect x="24" y="196" width="196" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="36" y="221" font-size="13.5" font-weight="700" fill="#1f2937">Not the offering</text>
  <text x="36" y="239" font-size="13" fill="#374151">of another</text>
  <rect x="228" y="196" width="124" height="58" rx="10" fill="#e1f3e5" stroke="#7cbf8a"/>
  <text x="290" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5e2c">2nd mention</text>
  <rect x="364" y="196" width="124" height="58" rx="10" fill="#e1f3e5" stroke="#7cbf8a"/>
  <text x="426" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5e2c">1st mention</text>
  <text x="426" y="242" text-anchor="middle" font-size="11.5" fill="#1d5e2c">one verse for both</text>
  <rect x="500" y="196" width="124" height="58" rx="10" fill="#e1f3e5" stroke="#7cbf8a"/>
  <text x="562" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5e2c">2nd mention</text>
  <rect x="24" y="262" width="196" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="36" y="287" font-size="13.5" font-weight="700" fill="#1f2937">Not his father’s offering:</text>
  <text x="36" y="305" font-size="13" fill="#374151">an heir does not place hands</text>
  <rect x="228" y="262" width="124" height="58" rx="10" fill="#e1f3e5" stroke="#7cbf8a"/>
  <text x="290" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5e2c">3rd mention</text>
  <rect x="364" y="262" width="124" height="58" rx="10" fill="#e1f3e5" stroke="#7cbf8a"/>
  <text x="426" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5e2c">3rd mention</text>
  <rect x="500" y="262" width="124" height="58" rx="10" fill="#eef1f5" stroke="#d5dbe3"/>
  <text x="562" y="290" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3ae">—</text>
  <text x="562" y="308" text-anchor="middle" font-size="11.5" fill="#6b7280">heir places hands</text>
  <rect x="24" y="328" width="196" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="36" y="353" font-size="13.5" font-weight="700" fill="#1f2937">All joint owners</text>
  <text x="36" y="371" font-size="13" fill="#374151">place hands</text>
  <rect x="228" y="328" width="124" height="58" rx="10" fill="#eef1f5" stroke="#d5dbe3"/>
  <text x="290" y="356" text-anchor="middle" font-size="18" font-weight="700" fill="#9aa3ae">—</text>
  <text x="290" y="374" text-anchor="middle" font-size="11.5" fill="#6b7280">not accepted</text>
  <rect x="364" y="328" width="124" height="58" rx="10" fill="#e1f3e5" stroke="#7cbf8a"/>
  <text x="426" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5e2c">2nd mention</text>
  <rect x="500" y="328" width="124" height="58" rx="10" fill="#e1f3e5" stroke="#7cbf8a"/>
  <text x="562" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5e2c">3rd mention</text>
  <text x="320" y="416" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">The heir</text>
  <rect x="24" y="430" width="290" height="116" rx="10" fill="#fde2e2" stroke="#e08a8a"/>
  <text x="169" y="456" text-anchor="middle" font-size="14.5" font-weight="700" fill="#8b1c1c">Rabbi Yehuda</text>
  <text x="169" y="478" text-anchor="middle" font-size="13" fill="#1f2937">does not place hands,</text>
  <text x="169" y="496" text-anchor="middle" font-size="13" fill="#1f2937">does not substitute</text>
  <text x="169" y="518" text-anchor="middle" font-size="12" fill="#4b5563">learns the start of consecration</text>
  <text x="169" y="534" text-anchor="middle" font-size="12" fill="#4b5563">from its end</text>
  <rect x="326" y="430" width="290" height="116" rx="10" fill="#e1f3e5" stroke="#7cbf8a"/>
  <text x="471" y="456" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1d5e2c">Rabbi Meir</text>
  <text x="471" y="478" text-anchor="middle" font-size="13" fill="#1f2937">places hands,</text>
  <text x="471" y="496" text-anchor="middle" font-size="13" fill="#1f2937">substitutes: “hamer yamir”</text>
  <text x="471" y="518" text-anchor="middle" font-size="12" fill="#4b5563">learns the end of consecration</text>
  <text x="471" y="534" text-anchor="middle" font-size="12" fill="#4b5563">from its start</text>
  <rect x="24" y="558" width="592" height="58" rx="10" fill="#e8eef8"/>
  <text x="38" y="582" font-size="12.5" fill="#374151">Start of consecration: substitution. End: placing hands, just before slaughter.</text>
  <text x="38" y="602" font-size="12.5" fill="#374151">1st, 2nd, 3rd count the three mentions, not which verse is which.</text>
</svg>
