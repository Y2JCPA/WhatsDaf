<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>WhatsDaf</title>
  <meta name="description" content="WhatsDaf — the whole daf, as a group chat. Every line of the Gemara, with the Tannaim and Amoraim as the members of the group." />
  <meta name="theme-color" content="#008069" />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/logo-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=1" />
  <script>
    // Apply the saved theme before first paint.
    try { const t = JSON.parse(localStorage.getItem('whatsdaf:theme')); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" aria-label="Chats">
      <header class="side-head">
        <a class="brand" href="#/" aria-label="WhatsDaf home"><img src="assets/logo.svg" alt="" width="34" height="34" /><span>WhatsDaf</span></a>
        <div class="head-actions">
          <button class="icon-btn" id="themeToggle" title="Light / dark theme" aria-label="Toggle theme">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8A9.4 9.4 0 0 0 12 3Z"/></svg>
          </button>
          <button class="icon-btn" id="aboutBtn" title="About WhatsDaf" aria-label="About WhatsDaf">
            <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="5" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="19" r="2" fill="currentColor"/></svg>
          </button>
        </div>
      </header>
      <label class="search">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16a6.47 6.47 0 0 0 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5Zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14Z"/></svg>
        <input id="search" type="search" placeholder="Search masechtot, dapim or messages" autocomplete="off" />
      </label>
      <div class="chips" id="chips" role="tablist">
        <button data-filter="all" class="active">All</button>
        <button data-filter="unread">Unread</button>
        <button data-filter="starred">Starred</button>
        <button data-filter="today">Today</button>
      </div>
      <div class="list-head" id="listHead" hidden>
        <button class="icon-btn" id="listBack" aria-label="Back to masechtot">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 4l1.4 1.4L7.8 11H20v2H7.8l5.6 5.6L12 20l-8-8 8-8Z"/></svg>
        </button>
        <div><b id="listTitle"></b><small id="listSub"></small></div>
      </div>
      <ul class="chat-list" id="chatList"></ul>
    </aside>

    <main class="chat-pane">
      <section class="empty-state" id="emptyState">
        <img src="assets/logo.svg" alt="" width="96" height="96" />
        <h1>WhatsDaf</h1>
        <p>The whole daf, as a group chat. Pick a masechet, then a daf, and read it the way you’d catch up on a busy group.</p>
        <div class="empty-actions" id="emptyActions"></div>
        <p class="small">Text: Sefaria’s William Davidson Talmud. Bold is the daf’s own words; regular type is the explanation woven in.</p>
        <div id="jacobbros-badge"></div>
      </section>

      <section class="chat" id="chat" hidden>
        <header class="chat-head">
          <button class="icon-btn mobile-only" id="chatBack" aria-label="Back to chats">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 4l1.4 1.4L7.8 11H20v2H7.8l5.6 5.6L12 20l-8-8 8-8Z"/></svg>
          </button>
          <button class="chat-id" id="chatId" aria-label="Group info">
            <span class="av big" id="chatAvatar"></span>
            <span class="chat-id-text"><b id="chatTitle"></b><small id="chatMembers"></small></span>
          </button>
          <span class="where" id="progressLabel" title="Where you are in the daf"></span>
          <div class="head-actions">
            <button class="icon-btn" id="findBtn" title="Search in this daf" aria-label="Search in this daf">
              <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16a6.47 6.47 0 0 0 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5Zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14Z"/></svg>
            </button>
            <button class="icon-btn" id="infoBtn" title="Group info" aria-label="Group info">
              <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="5" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="19" r="2" fill="currentColor"/></svg>
            </button>
          </div>
        </header>
        <div class="find-bar" id="findBar" hidden>
          <input id="findInput" type="search" placeholder="Search this daf" autocomplete="off" />
          <span id="findCount"></span>
          <button class="icon-btn" id="findPrev" aria-label="Previous match">▲</button>
          <button class="icon-btn" id="findNext" aria-label="Next match">▼</button>
          <button class="icon-btn" id="findClose" aria-label="Close search">✕</button>
        </div>
        <div class="progress" id="progress" aria-hidden="true"><span></span></div>
        <div class="messages" id="messages" tabindex="0"></div>
        <button class="pill-btn resume" id="resume" hidden></button>
        <button class="round-btn to-bottom" id="toBottom" hidden aria-label="Scroll down">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6 1.4-1.4Z"/></svg>
        </button>
        <form class="composer" id="composer">
          <div class="reply-preview" id="replyPreview" hidden></div>
          <div class="composer-row">
            <input id="noteInput" placeholder="Write a private note…" autocomplete="off" aria-label="Write a private note" />
            <button class="send" aria-label="Save note">
              <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M1.1 21.8 23 12 1.1 2.2 1 9.8l15.7 2.2L1 14.2l.1 7.6Z"/></svg>
            </button>
          </div>
        </form>
      </section>
    </main>

    <aside class="drawer" id="drawer" hidden aria-label="Group info">
      <header class="drawer-head"><button class="icon-btn" id="drawerClose" aria-label="Close">✕</button><b id="drawerTitle">Group info</b></header>
      <div class="drawer-body" id="drawerBody"></div>
    </aside>
  </div>

  <div class="popover" id="popover" hidden role="dialog" aria-modal="false"></div>
  <div class="lightbox" id="lightbox" hidden><button class="icon-btn" aria-label="Close">✕</button><img alt="" /><p></p></div>
  <div class="toast" id="toast" hidden></div>

  <script src="js/masechtot.js?v=1"></script>
  <script src="js/app.js?v=1"></script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <!-- Jacob Bros: credit and a link back to more games, placed on the welcome screen -->
  <script src="https://y2jcpa.github.io/JacobBros/badge.js" data-game="whatsdaf" defer></script>
</body>
</html>
